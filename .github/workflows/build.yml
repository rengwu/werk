name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  latex-cache:
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:latex
      - uses: actions/upload-artifact@v7
        with:
          name: latex-cache
          path: resources/runtime/cache
          retention-days: 7
  build:
    timeout-minutes: 20
    needs: latex-cache
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v6
        if: runner.os == 'Windows'
        with:
          go-version: '1.24'
          cache-dependency-path: tools/texsandbox/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: latex-cache
          path: resources/runtime/cache
      - run: npm run setup:latex
      - name: Verify Windows AppContainer boundaries
        if: runner.os == 'Windows'
        working-directory: tools/texsandbox
        run: go test ./...
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          "WERK_EXE=$env:LOCALAPPDATA\Programs\werk\werk.exe" | Out-File -Append $env:GITHUB_ENV
      - name: Locate app on macOS
        if: runner.os == 'macOS'
        run: echo "WERK_EXE=$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk" >> "$GITHUB_ENV"
      - name: Verify offline compiler isolation
        run: node --experimental-strip-types tests/latex-sandbox.ts
      - run: npm run smoke
        timeout-minutes: 2
      - name: Verify packaged OAuth browser handoff and cancellation
        run: node --experimental-strip-types tests/auth-smoke.ts
      - name: Uninstall on Windows and preserve data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uninstaller = "$env:LOCALAPPDATA\Programs\werk\Uninstall werk.exe"
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $env:WERK_EXE) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (Test-Path $env:WERK_EXE) { throw 'Uninstall left the app installed' }
          if (!(Test-Path "$env:WERK_SMOKE_DATA\werk.db")) { throw 'Uninstall removed user data' }
          Remove-Item $env:WERK_SMOKE_DATA -Recurse -Force
      - name: Build isolated inference fixture package
        run: |
          npm run build -- --test
          npx electron-builder --dir --publish never
      - name: Locate fixture app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"WERK_EXE=$pwd\release\win-unpacked\werk.exe" | Out-File -Append $env:GITHUB_ENV'
      - name: Verify profile and assistant with fictional data
        run: node --experimental-strip-types tests/profile-smoke.ts
      - name: Verify pi tools, dropped files, steering and interruption
        run: node --experimental-strip-types tests/assistant-smoke.ts
      - name: Verify discovery and keyboard triage with recorded responses
        run: node --experimental-strip-types tests/discovery-smoke.ts
      - name: Verify letters and sandboxed CV workspace
        run: node --experimental-strip-types tests/documents-smoke.ts
      - name: Verify backup export and restore
        run: node --experimental-strip-types tests/backup-smoke.ts
      - name: Audit accessibility and keyboard navigation
        run: node --experimental-strip-types tests/accessibility-smoke.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: werk-${{ runner.os }}
          path: |
            release/*.dmg
            release/*-setup.exe
            smoke-output/
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: werk-*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "werk $GITHUB_REF_NAME" --notes "" dist/*/*.dmg dist/*/*-setup.exe
