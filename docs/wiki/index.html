rograms are denied. Time/output limits and cancellation terminate the process. Windows uses a kill-on-close job object, including broker death. Missing compiler files produce an actionable error.\n\n## Verification recipe\n\nUse [shared setup](../verification/setup.md) with fictional records. Prepare the compiler with `npm run setup:latex` (Windows requires Go 1.24 and the cache artifact produced on macOS). Run `npm run check` and `npm test` for document evidence, version conflicts and failure preservation.\n\nAfter building, `node --experimental-strip-types tests/latex-sandbox.ts` runs actual compilation and adversarial file/shell/cancellation cases. On Windows also run `go test ./...` in `tools/texsandbox` for file, network, child-process and broker-death boundaries.\n\nSet `WERK_EXE` to the fixture package after `npm run build -- --test` and `npx electron-builder --dir --publish never`. Run `node --experimental-strip-types tests/documents-smoke.ts` for save-to-letter, edit/restore/copy/manual Applied, CV generation, preview/download, dirty navigation, failed compilation and restore. Small live letter checks use a separate fictional database and the app-owned subscription credential store.\n\n[M4 verification](../verification/runs/2026-11-01-m4-documents.md) records actual results and platform coverage.\n","toc":[{"id":"saved-workspace","title":"Saved workspace","depth":2},{"id":"cv-workspace","title":"CV workspace","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2}],"titleAnchor":"saved-letters-and-master-cv","links":["verification/setup","verification/runs/2026-11-01-m4-documents"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-letters\u003c/strong> prepares private plain-text cover letters. \u003cstrong>FEAT-cv\u003c/strong> maintains one profile-based master CV. Neither feature submits applications or creates per-job CVs.\u003c/p>\n\u003ch2 id=\"saved-workspace\">Saved workspace\u003c/h2>\n\u003cp>Saving a job with a complete description queues one letter. Incomplete postings wait for the user to paste the full description. Generation shares the serialized ChatGPT queue with the assistant; authentication and allowance failures pause work with Retry and Stop controls. Profile changes and concurrent letter edits invalidate a pending generation rather than overwriting newer work.\u003c/p>\n\u003cp>Saved opens the posting snapshot, notes and letter editor. Save appends a version; the version selector shows history and Restore appends the selected text as a new version. Regenerate uses the current profile and posting. Copy text uses the native clipboard. The Saved/Applied selector is only a manual record. Open posting opens the employer URL for the user.\u003c/p>\n\u003cp>Generated paragraphs cite supported candidate facts internally. Unsupported numbers, invented AI experience and invalid evidence references are rejected. The target is 250–350 words, with a 600-word maximum and a visible review note when outside the target. Review notes, word count and the profile revision remain available beside the draft. Users can freely edit their own text. Dirty editors require confirmation before navigation.\u003c/p>\n\u003ch2 id=\"cv-workspace\">CV workspace\u003c/h2>\n\u003cp>Generate from profile creates LaTeX from confirmed profile records using the MIT-licensed starter in \u003ccode>resources/latex\u003c/code>. It preserves project attribution and escapes LaTeX syntax in candidate text. The source is editable in CodeMirror with line numbers, syntax highlighting and normal undo/redo. Save and Restore create new versions and compile them. Profile changes show a regeneration notice without replacing manual edits.\u003c/p>\n\u003cp>The right pane previews the compiled PDF. Download .tex and Download PDF use native save dialogs. Compile diagnostics stay visible; failure keeps the source and previous successful PDF. The PDF version is identified when it differs from the selected source. Recompile retries the selected saved source. The assistant can read, edit, generate and compile the master CV and read/rewrite saved letters through version-checked tools.\u003c/p>\n\u003cp>Tectonic 0.15.0 and a prepared cache ship with the app. Runtime compilation is offline and untrusted: \u003ccode>sandbox-exec\u003c/code> on macOS, the Go AppContainer helper on Windows. No shell escape or unsandboxed fallback exists. The compiler has access to its temporary work area and cache; private files, external writes, network and child programs are denied. Time/output limits and cancellation terminate the process. Windows uses a kill-on-close job object, including broker death. Missing compiler files produce an actionable error.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a> with fictional records. Prepare the compiler with \u003ccode>npm run setup:latex\u003c/code> (Windows requires Go 1.24 and the cache artifact produced on macOS). Run \u003ccode>npm run check\u003c/code> and \u003ccode>npm test\u003c/code> for document evidence, version conflicts and failure preservation.\u003c/p>\n\u003cp>After building, \u003ccode>node --experimental-strip-types tests/latex-sandbox.ts\u003c/code> runs actual compilation and adversarial file/shell/cancellation cases. On Windows also run \u003ccode>go test ./...\u003c/code> in \u003ccode>tools/texsandbox\u003c/code> for file, network, child-process and broker-death boundaries.\u003c/p>\n\u003cp>Set \u003ccode>WERK_EXE\u003c/code> to the fixture package after \u003ccode>npm run build -- --test\u003c/code> and \u003ccode>npx electron-builder --dir --publish never\u003c/code>. Run \u003ccode>node --experimental-strip-types tests/documents-smoke.ts\u003c/code> for save-to-letter, edit/restore/copy/manual Applied, CV generation, preview/download, dirty navigation, failed compilation and restore. Small live letter checks use a separate fictional database and the app-owned subscription credential store.\u003c/p>\n\u003cp>\u003ca href=\"#/verification/runs/2026-11-01-m4-documents\">M4 verification\u003c/a> records actual results and platform coverage.\u003c/p>\n","backlinks":["features/assistant","features/desktop","features/index","verification/runs/2026-11-01-m4-documents"]},{"id":"features/factory-reset","title":"Factory reset","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Factory reset\nsection: Features\nupdated: 2026-11-02\n---\n# Factory reset\n\n**FEAT-factory-reset** implements the user's request to clear the entire app's state from Settings. It is separate from [backup restore](backups.md), which preserves sign-in and settings.\n\n## Entry points and behavior\n\nSettings → General → Factory reset → Reset werk opens a native confirmation. Cancel is the default and Escape cancels. The dialog explains permanent deletion and suggests exporting a backup first. Reset is also available on the backend-failure screen, so a broken database does not prevent recovery.\n\nAfter confirmation, werk discards unsaved edits, stops background work, and closes its old window and backend before deleting data. It clears the profile and its revisions, all jobs and fingerprints, letters and CV versions/PDFs, conversations and copied attachments, pi sessions, ChatGPT credentials, source configuration, schedules, settings and logs. Chromium storage, cookies, cached data and unsent drafts are cleared separately. Original files and exports outside the app's data folder remain untouched; unknown files in a custom data folder are also preserved. This is a logical reset, not a secure disk erasure.\n\nwerk then opens first-run setup, signed out, with System appearance, manual scans and the current default 30 enabled API/feed sources and 20 disabled scraped boards. No scan or inference is started by reset. Queued or running work from the old state cannot resume in the fresh backend. These catalog counts were expanded in the [source update](../journal/2026-11-02-more-sources.md); earlier reset verification retains its original tested counts.\n\nIf cleanup fails, werk offers Retry reset or Quit werk and retains a pending-reset marker. The next launch finishes cleanup before opening a backend or showing old records. A cancelled confirmation writes no marker and changes no records.\n\n## Scope and ownership\n\nMain-process IPC validates the calling window and owns the native confirmation. There is no assistant reset tool. Backend shutdown aborts model, scan, compiler and authentication work and drains in-flight requests before closing SQLite. Reset removes only known app-owned paths; directory links are removed without following them. Electron's session API clears its browser data. Installed binaries, the bundled compiler/cache and another app's authentication are outside the reset.\n\n## Verification recipe\n\nUse the [shared setup](../verification/setup.md) with temporary fictional data. `node --experimental-strip-types --test tests/reset.test.ts` checks file ownership, linked-directory protection, retained exports and shutdown ordering.\n\nBuild the fixture package, set `WERK_EXE`, then run `node --experimental-strip-types tests/reset-smoke.ts`. It uses the real Settings button, stubs only native dialog responses, verifies Cancel and confirmation, inspects the fresh database and credentials, checks drafts/cookies/defaults, quits and reopens, injects a storage-clear failure, resumes a pending reset, recovers a corrupt database and aborts an actual pi shell command before a delayed file write. Windows CI runs the same driver against its packaged app. `tests/accessibility-smoke.ts` covers General in both themes.\n\nThe driver never uses the actual candidate folder. Results are build-specific; see [factory reset verification](../verification/runs/2026-11-02-factory-reset.md).\n","toc":[{"id":"entry-points-and-behavior","title":"Entry points and behavior","depth":2},{"id":"scope-and-ownership","title":"Scope and ownership","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2}],"titleAnchor":"factory-reset","links":["features/backups","journal/2026-11-02-more-sources","verification/setup","verification/runs/2026-11-02-factory-reset"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-factory-reset\u003c/strong> implements the user's request to clear the entire app's state from Settings. It is separate from \u003ca href=\"#/features/backups\">backup restore\u003c/a>, which preserves sign-in and settings.\u003c/p>\n\u003ch2 id=\"entry-points-and-behavior\">Entry points and behavior\u003c/h2>\n\u003cp>Settings → General → Factory reset → Reset werk opens a native confirmation. Cancel is the default and Escape cancels. The dialog explains permanent deletion and suggests exporting a backup first. Reset is also available on the backend-failure screen, so a broken database does not prevent recovery.\u003c/p>\n\u003cp>After confirmation, werk discards unsaved edits, stops background work, and closes its old window and backend before deleting data. It clears the profile and its revisions, all jobs and fingerprints, letters and CV versions/PDFs, conversations and copied attachments, pi sessions, ChatGPT credentials, source configuration, schedules, settings and logs. Chromium storage, cookies, cached data and unsent drafts are cleared separately. Original files and exports outside the app's data folder remain untouched; unknown files in a custom data folder are also preserved. This is a logical reset, not a secure disk erasure.\u003c/p>\n\u003cp>werk then opens first-run setup, signed out, with System appearance, manual scans and the current default 30 enabled API/feed sources and 20 disabled scraped boards. No scan or inference is started by reset. Queued or running work from the old state cannot resume in the fresh backend. These catalog counts were expanded in the \u003ca href=\"#/journal/2026-11-02-more-sources\">source update\u003c/a>; earlier reset verification retains its original tested counts.\u003c/p>\n\u003cp>If cleanup fails, werk offers Retry reset or Quit werk and retains a pending-reset marker. The next launch finishes cleanup before opening a backend or showing old records. A cancelled confirmation writes no marker and changes no records.\u003c/p>\n\u003ch2 id=\"scope-and-ownership\">Scope and ownership\u003c/h2>\n\u003cp>Main-process IPC validates the calling window and owns the native confirmation. There is no assistant reset tool. Backend shutdown aborts model, scan, compiler and authentication work and drains in-flight requests before closing SQLite. Reset removes only known app-owned paths; directory links are removed without following them. Electron's session API clears its browser data. Installed binaries, the bundled compiler/cache and another app's authentication are outside the reset.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use the \u003ca href=\"#/verification/setup\">shared setup\u003c/a> with temporary fictional data. \u003ccode>node --experimental-strip-types --test tests/reset.test.ts\u003c/code> checks file ownership, linked-directory protection, retained exports and shutdown ordering.\u003c/p>\n\u003cp>Build the fixture package, set \u003ccode>WERK_EXE\u003c/code>, then run \u003ccode>node --experimental-strip-types tests/reset-smoke.ts\u003c/code>. It uses the real Settings button, stubs only native dialog responses, verifies Cancel and confirmation, inspects the fresh database and credentials, checks drafts/cookies/defaults, quits and reopens, injects a storage-clear failure, resumes a pending reset, recovers a corrupt database and aborts an actual pi shell command before a delayed file write. Windows CI runs the same driver against its packaged app. \u003ccode>tests/accessibility-smoke.ts\u003c/code> covers General in both themes.\u003c/p>\n\u003cp>The driver never uses the actual candidate folder. Results are build-specific; see \u003ca href=\"#/verification/runs/2026-11-02-factory-reset\">factory reset verification\u003c/a>.\u003c/p>\n","backlinks":["features/backups","features/index","verification/runs/2026-11-02-factory-reset"]},{"id":"features/index","title":"Features","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Features\nsection: Features\nupdated: 2026-11-01\n---\n# Features\n\n- [Desktop shell and local backend](desktop.md) — FEAT-desktop\n- [Profile and search criteria](profile.md) — FEAT-profile\n- [Assistant and ChatGPT connection](assistant.md) — FEAT-assistant\n\n- [Discovery and Inbox](discovery.md) — FEAT-discovery, FEAT-inbox\n\n- [Saved letters and master CV](documents.md) — FEAT-letters, FEAT-cv\n\n- [ZIP backups](backups.md) — FEAT-backups\n\n- [Factory reset](factory-reset.md) — FEAT-factory-reset\n\nThe [handoff feature scope through M5](../journal/2026-11-01-werk-handoff.md#milestones) is implemented. The user confirmed the Windows build and setup work, then approved the `v0.1.0` tag. [Release delivery and publication](../discussions/open-questions.md) are tracked separately.\n","toc":[],"titleAnchor":"features","links":["features/desktop","features/profile","features/assistant","features/discovery","features/documents","features/backups","features/factory-reset","journal/2026-11-01-werk-handoff","discussions/open-questions"],"attachments":[],"html":"\u003cul>\n\u003cli>\u003cp>\u003ca href=\"#/features/desktop\">Desktop shell and local backend\u003c/a> — FEAT-desktop\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/features/profile\">Profile and search criteria\u003c/a> — FEAT-profile\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/features/assistant\">Assistant and ChatGPT connection\u003c/a> — FEAT-assistant\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/features/discovery\">Discovery and Inbox\u003c/a> — FEAT-discovery, FEAT-inbox\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/features/documents\">Saved letters and master CV\u003c/a> — FEAT-letters, FEAT-cv\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/features/backups\">ZIP backups\u003c/a> — FEAT-backups\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/features/factory-reset\">Factory reset\u003c/a> — FEAT-factory-reset\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cp>The \u003ca href=\"#/journal/2026-11-01-werk-handoff~milestones\">handoff feature scope through M5\u003c/a> is implemented. The user confirmed the Windows build and setup work, then approved the \u003ccode>v0.1.0\u003c/code> tag. \u003ca href=\"#/discussions/open-questions\">Release delivery and publication\u003c/a> are tracked separately.\u003c/p>\n","backlinks":["index"]},{"id":"features/profile","title":"Profile and search criteria","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Profile and search criteria\nsection: Features\nupdated: 2026-11-02\n---\n# Profile and search criteria\n\n**FEAT-profile** implements [REB-profile and REB-criteria](../decisions/index.md#product). The latest SQLite `profile_versions` document is canonical. New installations have no saved revision and no candidate facts. The initial working-hours preference uses the computer's timezone and 09:00–18:00 hours.\n\n## Entry points and outcomes\n\nProfile has inline Save/Cancel forms for basics, eligibility preferences, experience, projects, education, additional facts and missing questions. Facts retain Confirmed, Preference or Inferred status and source references. User edits add an attributed revision. Previous versions → Restore appends a new revision. Concurrent edits against an old revision are rejected. Unsaved forms guard navigation and quit.\n\nThe Profile scrolling area fills the main pane beneath its fixed header. Its toolbar, readiness notice and sections share one centered content column, up to 760 px wide, and shrink to fit the minimum 900 × 600 window without horizontal scrolling. The scrollbar stays at the pane's right edge. Opening the assistant leaves the page size unchanged.\n\nSearch criteria stores target roles, location choices, work arrangements, timezone, work hours, minimum overlap and hidden companies. Its overlap preview calls the same backend function used by discovery: compare the user's local work hours with each country's 09:00–18:00 day and keep its best-overlapping IANA zone. [Geography attribution](../journal/2026-11-01-geography-attribution.md).\n\nReadiness requires name, current location, target roles, useful background and work arrangements. Education or projects can supply background. Unknown citizenship and authorization answers do not block readiness. Setup links to profile/criteria and the [assistant](assistant.md); source selection and scanning arrive in M3.\n\n## Verification recipe\n\nUse [shared setup](../verification/setup.md). `npm test` exercises empty installation, evidence validation, revision conflict, restore, readiness and timezone overlap. Against a packaged test build, `WERK_EXE=\"\u003cexecutable>\" node --experimental-strip-types tests/profile-smoke.ts` builds a fictional profile through the assistant from an attached PDF, edits its name in the form, restores revision 1 as revision 3, opens the overlap preview and dismisses a dirty-navigation confirmation. Cleanup removes only the driver's temporary data.\n\n## Coverage and history\n\nTests cover unknown eligibility, revisions and dirty navigation; full keyboard/accessibility audit and unsaved quit are revisited in M5. Awards can be preserved and added by the assistant; a dedicated awards form is not part of the specified profile sections.\n\n- [Profile layout](../verification/runs/2026-11-02-profile-layout.md): empty, populated and editing states at wide and minimum window sizes.\n- [M2 run](../verification/runs/2026-11-01-m2-profile.md).\n","toc":[{"id":"entry-points-and-outcomes","title":"Entry points and outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-history","title":"Coverage and history","depth":2}],"titleAnchor":"profile-and-search-criteria","links":["decisions/index","journal/2026-11-01-geography-attribution","features/assistant","verification/setup","verification/runs/2026-11-02-profile-layout","verification/runs/2026-11-01-m2-profile"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-profile\u003c/strong> implements \u003ca href=\"#/decisions/index~product\">REB-profile and REB-criteria\u003c/a>. The latest SQLite \u003ccode>profile_versions\u003c/code> document is canonical. New installations have no saved revision and no candidate facts. The initial working-hours preference uses the computer's timezone and 09:00–18:00 hours.\u003c/p>\n\u003ch2 id=\"entry-points-and-outcomes\">Entry points and outcomes\u003c/h2>\n\u003cp>Profile has inline Save/Cancel forms for basics, eligibility preferences, experience, projects, education, additional facts and missing questions. Facts retain Confirmed, Preference or Inferred status and source references. User edits add an attributed revision. Previous versions → Restore appends a new revision. Concurrent edits against an old revision are rejected. Unsaved forms guard navigation and quit.\u003c/p>\n\u003cp>The Profile scrolling area fills the main pane beneath its fixed header. Its toolbar, readiness notice and sections share one centered content column, up to 760 px wide, and shrink to fit the minimum 900 × 600 window without horizontal scrolling. The scrollbar stays at the pane's right edge. Opening the assistant leaves the page size unchanged.\u003c/p>\n\u003cp>Search criteria stores target roles, location choices, work arrangements, timezone, work hours, minimum overlap and hidden companies. Its overlap preview calls the same backend function used by discovery: compare the user's local work hours with each country's 09:00–18:00 day and keep its best-overlapping IANA zone. \u003ca href=\"#/journal/2026-11-01-geography-attribution\">Geography attribution\u003c/a>.\u003c/p>\n\u003cp>Readiness requires name, current location, target roles, useful background and work arrangements. Education or projects can supply background. Unknown citizenship and authorization answers do not block readiness. Setup links to profile/criteria and the \u003ca href=\"#/features/assistant\">assistant\u003c/a>; source selection and scanning arrive in M3.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a>. \u003ccode>npm test\u003c/code> exercises empty installation, evidence validation, revision conflict, restore, readiness and timezone overlap. Against a packaged test build, \u003ccode>WERK_EXE=\"&lt;executable&gt;\" node --experimental-strip-types tests/profile-smoke.ts\u003c/code> builds a fictional profile through the assistant from an attached PDF, edits its name in the form, restores revision 1 as revision 3, opens the overlap preview and dismisses a dirty-navigation confirmation. Cleanup removes only the driver's temporary data.\u003c/p>\n\u003ch2 id=\"coverage-and-history\">Coverage and history\u003c/h2>\n\u003cp>Tests cover unknown eligibility, revisions and dirty navigation; full keyboard/accessibility audit and unsaved quit are revisited in M5. Awards can be preserved and added by the assistant; a dedicated awards form is not part of the specified profile sections.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-02-profile-layout\">Profile layout\u003c/a>: empty, populated and editing states at wide and minimum window sizes.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m2-profile\">M2 run\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["features/assistant","features/desktop","features/discovery","features/index","verification/runs/2026-11-01-m2-profile","verification/runs/2026-11-02-profile-layout"]},{"id":"journal/2026-11-01-geography-attribution","title":"Geography data attribution","section":"Journal","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Geography data attribution\nsection: Journal\nupdated: 2026-11-01\n---\n# Geography data attribution\n\n`geonames.json` is derived from [GeoNames](https://www.geonames.org/) and licensed under [Creative Commons Attribution 4.0](https://creativecommons.org/licenses/by/4.0/). The source data was downloaded on 17 September 2026. Data is supplied without warranties of accuracy, timeliness or completeness.\n\nThe retained offline dataset comes from the archived app. Country and place names resolve discovery locations without sending the profile to a geocoding service. `resources/geography/zone1970.tab` maps country codes to IANA timezones; `tzdb-LICENSE` and `tzdb-version.txt` retain its license and source version. Current daylight-saving offsets come from the runtime's Intl data. Unknown locations do not exclude a posting.\n","toc":[],"titleAnchor":"geography-data-attribution","links":[],"attachments":[],"html":"\u003cp>\u003ccode>geonames.json\u003c/code> is derived from \u003ca href=\"https://www.geonames.org/\" rel=\"noreferrer\">GeoNames\u003c/a> and licensed under \u003ca href=\"https://creativecommons.org/licenses/by/4.0/\" rel=\"noreferrer\">Creative Commons Attribution 4.0\u003c/a>. The source data was downloaded on 17 September 2026. Data is supplied without warranties of accuracy, timeliness or completeness.\u003c/p>\n\u003cp>The retained offline dataset comes from the archived app. Country and place names resolve discovery locations without sending the profile to a geocoding service. \u003ccode>resources/geography/zone1970.tab\u003c/code> maps country codes to IANA timezones; \u003ccode>tzdb-LICENSE\u003c/code> and \u003ccode>tzdb-version.txt\u003c/code> retain its license and source version. Current daylight-saving offsets come from the runtime's Intl data. Unknown locations do not exclude a posting.\u003c/p>\n","backlinks":["features/profile"]},{"id":"journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-11-01\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan in the [clean rebuild plan](2026-11-01-rebuild.md).\n\nSession: `2429f43a2dda41cdf1aaa20116f739b4`\n\nPreviews were HTML mockups with fictional data. Descriptions marked *local* contained usage figures from the private database (opened, saved and applied counts, saves per source); the complete round is retained outside the wiki.\n\n## Question 1\n\n```text\nRound: Rebuild from first principles\nQuestion: Does this diagnosis match your experience of the app?\nDescription: local\nSelection: single\nOptions: Matches / Partly — see notes / Does not match\nSelected: Matches\nNotes: \n```\n\n## Question 2\n\n```text\nRound: Rebuild from first principles\nQuestion: Who will install the app?\nDescription (Markdown source):\nThis decides how much signing, first-run setup and Windows support are worth. Your 18 October note says you want a downloadable Windows release on GitHub.\nRecommendation: A public GitHub release. That matches your stated goal and justifies signing and a setup checklist.\nSelection: single\nOptions: Only me / Me and a few people I give it to / Anyone, through a public GitHub release\nSelected: Anyone, through a public GitHub release\nNotes: \n```\n\n## Question 3\n\n```text\nRound: Rebuild from first principles\nQuestion: Which platforms should the rebuild support?\nDescription (Markdown source):\nUnraid has never been deployed; its Docker image, XML template and supervisord exist but are unverified. Dropping a target removes its packaging code; it can be added back later because the backend stays a plain Node module.\nRecommendation: macOS (Apple Silicon) and Windows 11 x64. Defer Unraid and Linux until you will actually run them.\nSelection: multiple\nOptions: macOS (Apple Silicon) / Windows 11 x64 / Unraid / Docker server / Linux desktop\nSelected: macOS (Apple Silicon) / Windows 11 x64\nNotes: \n```\n\n## Question 4\n\n```text\nRound: Rebuild from first principles\nQuestion: What makes the current Windows build unusable?\nDescription (Markdown source):\nPick everything you have seen. This checks whether the proposed runtime change addresses the real failures.\nSelection: multiple\nOptions: Installation fails or is confusing / Blank window or will not start / Slow or freezes / Crashes or stops in the background / ChatGPT sign-in fails / Scans fail / CV or letter PDFs fail / Layout or text looks wrong / Have not used it recently\nSelected: Installation fails or is confusing / Blank window or will not start / Slow or freezes / Crashes or stops in the background\nNotes: \n```\n\n## Question 5\n\n```text\nRound: Rebuild from first principles\nQuestion: Which desktop runtime should the rebuild use?\nDescription (Markdown source):\nCurrent architecture:\n\n```mermaid\nflowchart LR\n  shell[\"Go launcher: Cocoa or Win32\"] --> api[\"Node API\"]\n  shell --> worker[\"Node worker\"]\n  ui[\"Web UI\"] -->|\"polls every 8 s\"| api\n  api \u003c-->|\"leases, revision triggers\"| db[(\"SQLite 2.0 GB\")]\n  worker \u003c-->|\"leases, heartbeat\"| db\n  worker --> chromium[\"Headless Chromium: letter PDFs\"]\n  api --> tectonic[\"Tectonic: CV\"]\n```\n\n| | Electron | Tauri + Node sidecar | Keep Go shells, trimmed |\n| --- | --- | --- | --- |\n| Languages | TypeScript | TypeScript + Rust | TypeScript + Go + Objective-C + PowerShell |\n| Bundled runtimes | Electron (Node + Chromium), Tectonic | Node, Tectonic; system webview | Node, Tectonic; system webview |\n| Rendering | Chromium on both | WebKit on Mac, WebView2 on Windows | WebKit on Mac, WebView2 on Windows |\n| Installers, signing, auto-update | electron-builder + electron-updater | Tauri bundler + updater plugin | Hand-written |\n| Unpacked size (estimate) | ~300 MB | ~180 MB | ~170 MB |\n| Download (estimate) | ~120 MB | ~70 MB | ~70 MB |\n\nEstimates are unmeasured: typical runtime sizes plus Tectonic (48 MB) and its package cache (20 MB). All three drop headless Chromium and the shipped `node_modules`, which is most of today’s size. Risk to check early with Electron: whether its Node build includes `node:sqlite`; otherwise use `better-sqlite3`.\nRecommendation: Electron. It has the fewest moving parts: one language, no separate Node binary or Chromium download, and maintained installers and updates on both platforms. It removes the custom Windows host, process supervision and installer, where the Windows-only code lives. It costs roughly 120 MB more on disk than Tauri.\nSelection: single\nOptions: Electron / Tauri + Node sidecar / Keep Go shells, trimmed\nSelected: Electron\nNotes: \n```\n\n## Question 6\n\n```text\nRound: Rebuild from first principles\nQuestion: How should releases be signed and updated?\nDescription (Markdown source):\nWithout signing, macOS blocks the first open until you allow it in System Settings, and macOS auto-update requires a signed app. Windows shows a SmartScreen warning. Signing costs the Apple Developer Program (US$99/year) and a paid Windows certificate or signing service. Releases would be published as GitHub Releases in every option.\nRecommendation: Sign and notarize both, with automatic updates, if anyone besides you will install it. If it is only for you, choose unsigned with an update notice.\nSelection: single\nOptions: Sign both; automatic updates / Sign macOS only; Windows unsigned with an update notice / Unsigned on both; in-app notice links to the new release\nSelected: Unsigned on both; in-app notice links to the new release\nNotes: \n```\n\n## Question 7\n\n```text\nRound: Rebuild from first principles\nQuestion: How should the rebuild happen?\nDescription (Markdown source):\n**Port largely unchanged** (about 8,500 lines that already work): source adapters and parsers, matching, eligibility, deduplication, location and timezone data, pi-ai runtime and credentials, assistant actions and validation, LaTeX compilation, the ZIP backup format.\n\n**Rewrite:** desktop shell and packaging, process model, database schema and queries, API, UI.\n\n**Data moves through the existing ZIP export.** The new app imports a backup and applies the new storage rules from the question on stored jobs. The old app stays usable until the new one reaches parity.\nRecommendation: Rebuild alongside in this repo and port the proven modules. Rewriting the shell, storage and UI in place would leave both versions half-working for weeks.\nSelection: single\nOptions: Rebuild alongside; port proven modules; import via ZIP / Refactor the current app in place, one step at a time / Start clean; import only profile, CV and letters\nSelected: Start clean; import only profile, CV and letters\nNotes: dont import profile or CV. start completely clean. but keep a backup of my data, and put it on ~/Desktop/ununemploy-backup\n```\n\n## Question 8\n\n```text\nRound: Rebuild from first principles\nQuestion: Should the backend run as one process?\nDescription (Markdown source):\nProposed architecture:\n\n```mermaid\nflowchart LR\n  main[\"Electron main: window, menus, updates\"] --> backend[\"Backend process: API, scheduler, model queue\"]\n  ui[\"UI\"] \u003c-->|\"requests and push events\"| backend\n  backend --> db[(\"SQLite: typed columns, full-text search\")]\n  backend --> tectonic[\"Tectonic: CV and letters\"]\n  backend --> pi[\"pi-ai: ChatGPT subscription\"]\n```\n\nOne backend process owns the API, the scan scheduler and the serialized model queue. The UI receives push events when data changes. This removes worker leases, heartbeats, the `data_revisions` triggers, revision-hint headers, 8-second polling and the 15-second request timeout. Serialized model work is an in-process queue instead of a polled table; queued work still persists in SQLite so it survives restarts.\nRecommendation: One process. Most stale-state and timeout bugs come from two processes coordinating through the database.\nSelection: single\nOptions: One backend process with push updates / Keep separate API and worker processes\nSelected: One backend process with push updates\nNotes: \n```\n\n## Question 9\n\n```text\nRound: Rebuild from first principles\nQuestion: Which jobs should the app keep?\nDescription: local\nRecommendation: Keep Strong and Adjacent unless Incompatible (about 14,400 today), keep a fingerprint for the rest, and delete unsaved jobs 30 days after they close. Drop the HTTP body cache and description history for unsaved jobs. The database should fall from 2 GB to tens of MB.\nSelection: single\nOptions: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs / Keep every job; drop only the HTTP body cache and history / Keep everything (current)\nSelected: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs\nNotes: \n```\n\n## Question 10\n\n```text\nRound: Rebuild from first principles\nQuestion: How should cover-letter PDFs be produced?\nDescription (Markdown source):\nHeadless Chromium (198 MB macOS, 274 MB Windows) exists only for letter PDFs and legacy resume exports. `docx` and Handlebars serve only legacy resumes. A LaTeX letter template would use the same fields as today (company, role, greeting, plain-text paragraphs, signature), with text escaped for LaTeX. Existing legacy resumes would be exported once as files and kept in appdata.\nRecommendation: Render letters with the same Tectonic engine as the CV. One document engine, letters that match the CV’s typography, and no browser dependency.\nSelection: single\nOptions: LaTeX for CV and letters / Electron's built-in print-to-PDF with the current HTML layout / Keep headless Chromium\nSelected: Something else\nNotes: just generate CVs in plain text.\n```\n\n## Question 11\n\n```text\nRound: Rebuild from first principles\nQuestion: Do you accept these implementation choices?\nDescription (Markdown source):\n| Area | Current | Rebuild |\n| --- | --- | --- |\n| Packaging | `tsx` at runtime; full `node_modules` shipped | Backend bundled with esbuild into one file |\n| Database | JSON documents + in-memory snapshot index | Typed columns for filters and sort, SQL indexes, FTS5 search; JSON only for raw source evidence |\n| UI server state | Custom `useRemote`, ETag polling, revision hints | TanStack Query, invalidated by push events |\n| Routing | Hash routes inside a 1,448-line `App.tsx` | One module per page; the router keeps unsaved-edit guards |\n| Assistant UI | assistant-ui runtime (295 KB chunk) | Plain message list and composer |\n| LaTeX editor | react-codemirror wrapper (964 KB chunk + 273 KB CSS) | CodeMirror 6 with only the needed extensions |\n| PDF preview | pdf.js (1.1 MB worker) | Built-in Chromium PDF viewer |\n| Tests | 27 `verify-*` scripts + node tests | Ported unit tests + one Playwright suite against the packaged app on both platforms |\n| Diagnostics | Logs in appdata | Settings → Diagnostics: versions and recent errors, copyable, no personal data |\nRecommendation: Accept. Each change removes code or a dependency; TanStack Query is the only new library, and it replaces hand-written caching and polling.\nSelection: single\nOptions: Accept / Accept with changes in notes / Discuss alternatives first\nSelected: Accept\nNotes: \n```\n\n## Question 12\n\n```text\nRound: Rebuild from first principles\nQuestion: What should the opening screen be?\nDescription: local\nRecommendation: Triage inbox. It turns the collection into a short daily queue you can clear.\nSelection: single\nOptions: Triage inbox (proposed) / Current browse-all inbox\nSelected: Triage inbox (proposed)\nNotes: \n```\n\n## Question 13\n\n```text\nRound: Rebuild from first principles\nQuestion: Where should your job criteria live?\nDescription (Markdown source):\nToday, location, timezone, arrangement, eligibility and match level are inbox filters restored per browser tab, while the profile separately stores preferences used for matching. Two places describe what you want. In the proposal, Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily. See the Profile question for a preview.\nRecommendation: In Profile as search criteria. Set them once; they also stop irrelevant jobs from being stored.\nSelection: single\nOptions: Profile → Search criteria; filters narrow temporarily / Keep everything as inbox filters (current)\nSelected: Profile → Search criteria; filters narrow temporarily\nNotes: \n```\n\n## Question 14\n\n```text\nRound: Rebuild from first principles\nQuestion: How should timezone fit be expressed?\nDescription (Markdown source):\nThe current picker selects a UTC range on a map with a separate rotating offset; it took four iterations on 18 October to handle the date-line seam. An overlap rule asks the question directly and wraps around midnight without a seam. Example: US Pacific gives 1 h of overlap with Kuala Lumpur. Matching stays country-level as today, so the United States matches 3 h through Hawaii. Try the slider.\nRecommendation: Minimum working-hours overlap with your timezone, stored in search criteria.\nSelection: single\nOptions: Minimum overlap with my working hours / Current UTC range, map and offset / No timezone filtering\nSelected: Minimum overlap with my working hours\nNotes: \n```\n\n## Question 15\n\n```text\nRound: Rebuild from first principles\nQuestion: How should a job's fit be shown?\nDescription (Markdown source):\nToday: a six-field metadata grid (several reading “Not listed” or “Unconfirmed”), then Description, Match, Notes and Cover letter tabs. Match evidence sits in its own tab, away from the text it refers to. The proposal leads with a summary of the deciding facts, then highlights matched and missing requirements inside the description.\nRecommendation: Decision summary and highlighted description. You read the reasons where they appear.\nSelection: single\nOptions: Decision summary + highlighted description / Current grid and Match tab\nSelected: Decision summary + highlighted description\nNotes: \n```\n\n## Question 16\n\n```text\nRound: Rebuild from first principles\nQuestion: How should a saved job be worked on?\nDescription (Markdown source):\nToday the letter is a tab in the half-width detail pane, below the metadata grid, edited as separate form fields. In the proposal, a saved job opens a workspace: the posting and notes on the left, the letter as a document on the right, with review notes and status visible. Contact fields stay in the letter's settings.\nRecommendation: Posting and letter side by side. Checking the letter against the posting is the main task here.\nSelection: single\nOptions: Posting and letter side by side / Current letter tab\nSelected: Posting and letter side by side\nNotes: \n```\n\n## Question 17\n\n```text\nRound: Rebuild from first principles\nQuestion: What should the app record after you save a job?\nDescription: local\nRecommendation: Saved and Applied only, with the status selector in the job header and the date in the list. Add interview stages later if you find you need them.\nSelection: single\nOptions: Saved and Applied, shown in the header and list / Add stages: Applied, Interviewing, Offer, Closed, with dates / Saved only; remove Applied\nSelected: Saved and Applied, shown in the header and list\nNotes: \n```\n\n## Question 18\n\n```text\nRound: Rebuild from first principles\nQuestion: How should the profile be shown and edited?\nDescription (Markdown source):\nThe current view renders the stored JSON as Markdown, including internal fields such as Id and Year/Month/Display “Not provided”. The proposal is a fact sheet: search criteria, eligibility, experience, projects and missing facts, each with its status and source. Direct editing would revise the 8 October read-only decision; direct edits are recorded as yours with a date, and the assistant remains available for imports and bulk changes.\nRecommendation: Fact sheet with direct editing as well as the assistant. Changing a phone number through chat is the clunkiest path.\nSelection: single\nOptions: Fact sheet; edit directly or with the assistant / Fact sheet; assistant-only edits / Current Markdown view\nSelected: Fact sheet; edit directly or with the assistant\nNotes: \n```\n\n## Question 19\n\n```text\nRound: Rebuild from first principles\nQuestion: What should the main navigation contain?\nDescription (Markdown source):\nSources are set up once and checked occasionally, but today they take a top-level page. The proposal puts them in Settings with per-source job and save counts. A failing source puts a dot on Settings, and Saved counts letters ready to review. The counts shown are your current collection; the statuses are illustrative.\nRecommendation: Inbox, Saved, Profile and CV, with Sources inside Settings.\nSelection: single\nOptions: Inbox, Saved, Profile, CV; Sources in Settings / Keep Sources as a top-level page\nSelected: Inbox, Saved, Profile, CV; Sources in Settings\nNotes: \n```\n\n## Question 20\n\n```text\nRound: Rebuild from first principles\nQuestion: Which sources should the rebuilt app keep?\nDescription: local\nRecommendation: Keep the first three groups. Drop scraped boards without saves, X and the boards that never returned a job. Scraped boards break when sites change, and X needs paid credits and budget code. Hacker News is optional.\nSelection: multiple\nOptions: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves / Hacker News / X search / Boards that never returned a job\nSelected: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves\nNotes: \n```\n\n## Question 21\n\n```text\nRound: Rebuild from first principles\nQuestion: Which additions should the rebuild include?\nDescription (Markdown source):\n| Addition | What it does |\n| --- | --- |\n| Keyboard triage | J/K move, S save, X skip, O open posting, / search |\n| Setup checklist | First run: connect ChatGPT → build profile from your CV PDF → choose sources → first scan |\n| Hide company | One action on a job hides that employer's future postings |\n| Track company | From a job on Greenhouse, Ashby or Lever, add that employer's board as a source |\n| Status counts | Saved shows letters ready to review; Settings shows failing sources or a needed sign-in |\n| Record versions when applying | Marking Applied records which letter and CV versions were current |\n| Saved views | Named filter combinations in the sidebar |\nRecommendation: Everything except saved views. Search criteria cover the main need for saved views.\nSelection: multiple\nOptions: Keyboard triage / Setup checklist / Hide company / Track company / Status counts / Record versions when applying / Saved views\nSelected: Keyboard triage / Setup checklist / Hide company\nNotes: \n```\n\n## Question 22\n\n```text\nRound: Rebuild from first principles\nQuestion: Which removals should the rebuild make?\nDescription (Markdown source):\nSources, timezone, the Match tab and platforms are covered by earlier questions.\n\n| Removal | Why |\n| --- | --- |\n| Seen state and filter | Replaced by New/All and bold unopened titles; 73 opens recorded |\n| Duplicate grouping control | Always group; the detail lists other listings |\n| Legacy resume code (`docx`, Handlebars, export routes) | Export existing resumes once to files |\n| Retired Jev code, migration and archive compatibility | Export stored Jev data once to a file |\n| HTTP body cache | 979 MB; keep only ETag/Last-Modified validators |\n| Description history for unsaved jobs | 380 MB; saving still snapshots the description |\n| VueJobs detail enrichment | Special six-per-day lookup path for one feed |\n| Custom installer and checksum inventory | Replaced by the packaging tool |\nRecommendation: All of them. Each removes code or stored data with no current use.\nSelection: multiple\nOptions: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nSelected: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nNotes: \n```\n\n## Question 23\n\n```text\nRound: Rebuild from first principles\nQuestion: What else feels clunky or breaks in daily use?\nDescription (Markdown source):\nAnything not covered above: specific screens, waits, errors or steps you avoid. Paste screenshots if useful.\nSelected: (none)\nNotes: \n```\n","toc":[{"id":"question-1","title":"Question 1","depth":2},{"id":"question-2","title":"Question 2","depth":2},{"id":"question-3","title":"Question 3","depth":2},{"id":"question-4","title":"Question 4","depth":2},{"id":"question-5","title":"Question 5","depth":2},{"id":"question-7","title":"Question 7","depth":2},{"id":"question-8","title":"Question 8","depth":2},{"id":"question-10","title":"Question 10","depth":2},{"id":"question-11","title":"Question 11","depth":2},{"id":"question-12","title":"Question 12","depth":2},{"id":"question-13","title":"Question 13","depth":2},{"id":"question-14","title":"Question 14","depth":2},{"id":"question-15","title":"Question 15","depth":2},{"id":"question-16","title":"Question 16","depth":2},{"id":"question-17","title":"Question 17","depth":2},{"id":"question-18","title":"Question 18","depth":2},{"id":"question-19","title":"Question 19","depth":2},{"id":"question-20","title":"Question 20","depth":2},{"id":"question-21","title":"Question 21","depth":2},{"id":"question-22","title":"Question 22","depth":2},{"id":"question-23","title":"Question 23","depth":2}],"titleAnchor":"interview-answers","links":["journal/2026-11-01-rebuild"],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan in the \u003ca href=\"#/journal/2026-11-01-rebuild\">clean rebuild plan\u003c/a>.\u003c/p>\n\u003cp>Session: \u003ccode>2429f43a2dda41cdf1aaa20116f739b4\u003c/code>\u003c/p>\n\u003cp>Previews were HTML mockups with fictional data. Descriptions marked \u003cem>local\u003c/em> contained usage figures from the private database (opened, saved and applied counts, saves per source); the complete round is retained outside the wiki.\u003c/p>\n\u003ch2 id=\"question-1\">Question 1\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Does this diagnosis match your experience of the app?\nDescription: local\nSelection: single\nOptions: Matches / Partly — see notes / Does not match\nSelected: Matches\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-2\">Question 2\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Who will install the app?\nDescription (Markdown source):\nThis decides how much signing, first-run setup and Windows support are worth. Your 18 October note says you want a downloadable Windows release on GitHub.\nRecommendation: A public GitHub release. That matches your stated goal and justifies signing and a setup checklist.\nSelection: single\nOptions: Only me / Me and a few people I give it to / Anyone, through a public GitHub release\nSelected: Anyone, through a public GitHub release\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-3\">Question 3\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which platforms should the rebuild support?\nDescription (Markdown source):\nUnraid has never been deployed; its Docker image, XML template and supervisord exist but are unverified. Dropping a target removes its packaging code; it can be added back later because the backend stays a plain Node module.\nRecommendation: macOS (Apple Silicon) and Windows 11 x64. Defer Unraid and Linux until you will actually run them.\nSelection: multiple\nOptions: macOS (Apple Silicon) / Windows 11 x64 / Unraid / Docker server / Linux desktop\nSelected: macOS (Apple Silicon) / Windows 11 x64\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-4\">Question 4\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What makes the current Windows build unusable?\nDescription (Markdown source):\nPick everything you have seen. This checks whether the proposed runtime change addresses the real failures.\nSelection: multiple\nOptions: Installation fails or is confusing / Blank window or will not start / Slow or freezes / Crashes or stops in the background / ChatGPT sign-in fails / Scans fail / CV or letter PDFs fail / Layout or text looks wrong / Have not used it recently\nSelected: Installation fails or is confusing / Blank window or will not start / Slow or freezes / Crashes or stops in the background\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-5\">Question 5\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which desktop runtime should the rebuild use?\nDescription (Markdown source):\nCurrent architecture:\n\n```mermaid\nflowchart LR\n  shell[\"Go launcher: Cocoa or Win32\"] --&gt; api[\"Node API\"]\n  shell --&gt; worker[\"Node worker\"]\n  ui[\"Web UI\"] --&gt;|\"polls every 8 s\"| api\n  api &lt;--&gt;|\"leases, revision triggers\"| db[(\"SQLite 2.0 GB\")]\n  worker &lt;--&gt;|\"leases, heartbeat\"| db\n  worker --&gt; chromium[\"Headless Chromium: letter PDFs\"]\n  api --&gt; tectonic[\"Tectonic: CV\"]\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Electron\u003c/th>\n\u003cth>Tauri + Node sidecar\u003c/th>\n\u003cth>Keep Go shells, trimmed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Languages\u003c/td>\n\u003ctd>TypeScript\u003c/td>\n\u003ctd>TypeScript + Rust\u003c/td>\n\u003ctd>TypeScript + Go + Objective-C + PowerShell\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bundled runtimes\u003c/td>\n\u003ctd>Electron (Node + Chromium), Tectonic\u003c/td>\n\u003ctd>Node, Tectonic; system webview\u003c/td>\n\u003ctd>Node, Tectonic; system webview\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rendering\u003c/td>\n\u003ctd>Chromium on both\u003c/td>\n\u003ctd>WebKit on Mac, WebView2 on Windows\u003c/td>\n\u003ctd>WebKit on Mac, WebView2 on Windows\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Installers, signing, auto-update\u003c/td>\n\u003ctd>electron-builder + electron-updater\u003c/td>\n\u003ctd>Tauri bundler + updater plugin\u003c/td>\n\u003ctd>Hand-written\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unpacked size (estimate)\u003c/td>\n\u003ctd>~300 MB\u003c/td>\n\u003ctd>~180 MB\u003c/td>\n\u003ctd>~170 MB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Download (estimate)\u003c/td>\n\u003ctd>~120 MB\u003c/td>\n\u003ctd>~70 MB\u003c/td>\n\u003ctd>~70 MB\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Estimates are unmeasured: typical runtime sizes plus Tectonic (48 MB) and its package cache (20 MB). All three drop headless Chromium and the shipped \u003ccode>node_modules\u003c/code>, which is most of today’s size. Risk to check early with Electron: whether its Node build includes \u003ccode>node:sqlite\u003c/code>; otherwise use \u003ccode>better-sqlite3\u003c/code>.\nRecommendation: Electron. It has the fewest moving parts: one language, no separate Node binary or Chromium download, and maintained installers and updates on both platforms. It removes the custom Windows host, process supervision and installer, where the Windows-only code lives. It costs roughly 120 MB more on disk than Tauri.\nSelection: single\nOptions: Electron / Tauri + Node sidecar / Keep Go shells, trimmed\nSelected: Electron\nNotes: \u003c/p>\n\u003cpre>\u003ccode>\n## Question 6\n\n```text\nRound: Rebuild from first principles\nQuestion: How should releases be signed and updated?\nDescription (Markdown source):\nWithout signing, macOS blocks the first open until you allow it in System Settings, and macOS auto-update requires a signed app. Windows shows a SmartScreen warning. Signing costs the Apple Developer Program (US$99/year) and a paid Windows certificate or signing service. Releases would be published as GitHub Releases in every option.\nRecommendation: Sign and notarize both, with automatic updates, if anyone besides you will install it. If it is only for you, choose unsigned with an update notice.\nSelection: single\nOptions: Sign both; automatic updates / Sign macOS only; Windows unsigned with an update notice / Unsigned on both; in-app notice links to the new release\nSelected: Unsigned on both; in-app notice links to the new release\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-7\">Question 7\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should the rebuild happen?\nDescription (Markdown source):\n**Port largely unchanged** (about 8,500 lines that already work): source adapters and parsers, matching, eligibility, deduplication, location and timezone data, pi-ai runtime and credentials, assistant actions and validation, LaTeX compilation, the ZIP backup format.\n\n**Rewrite:** desktop shell and packaging, process model, database schema and queries, API, UI.\n\n**Data moves through the existing ZIP export.** The new app imports a backup and applies the new storage rules from the question on stored jobs. The old app stays usable until the new one reaches parity.\nRecommendation: Rebuild alongside in this repo and port the proven modules. Rewriting the shell, storage and UI in place would leave both versions half-working for weeks.\nSelection: single\nOptions: Rebuild alongside; port proven modules; import via ZIP / Refactor the current app in place, one step at a time / Start clean; import only profile, CV and letters\nSelected: Start clean; import only profile, CV and letters\nNotes: dont import profile or CV. start completely clean. but keep a backup of my data, and put it on ~/Desktop/ununemploy-backup\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-8\">Question 8\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Should the backend run as one process?\nDescription (Markdown source):\nProposed architecture:\n\n```mermaid\nflowchart LR\n  main[\"Electron main: window, menus, updates\"] --&gt; backend[\"Backend process: API, scheduler, model queue\"]\n  ui[\"UI\"] &lt;--&gt;|\"requests and push events\"| backend\n  backend --&gt; db[(\"SQLite: typed columns, full-text search\")]\n  backend --&gt; tectonic[\"Tectonic: CV and letters\"]\n  backend --&gt; pi[\"pi-ai: ChatGPT subscription\"]\n\u003c/code>\u003c/pre>\n\u003cp>One backend process owns the API, the scan scheduler and the serialized model queue. The UI receives push events when data changes. This removes worker leases, heartbeats, the \u003ccode>data_revisions\u003c/code> triggers, revision-hint headers, 8-second polling and the 15-second request timeout. Serialized model work is an in-process queue instead of a polled table; queued work still persists in SQLite so it survives restarts.\nRecommendation: One process. Most stale-state and timeout bugs come from two processes coordinating through the database.\nSelection: single\nOptions: One backend process with push updates / Keep separate API and worker processes\nSelected: One backend process with push updates\nNotes: \u003c/p>\n\u003cpre>\u003ccode>\n## Question 9\n\n```text\nRound: Rebuild from first principles\nQuestion: Which jobs should the app keep?\nDescription: local\nRecommendation: Keep Strong and Adjacent unless Incompatible (about 14,400 today), keep a fingerprint for the rest, and delete unsaved jobs 30 days after they close. Drop the HTTP body cache and description history for unsaved jobs. The database should fall from 2 GB to tens of MB.\nSelection: single\nOptions: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs / Keep every job; drop only the HTTP body cache and history / Keep everything (current)\nSelected: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-10\">Question 10\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should cover-letter PDFs be produced?\nDescription (Markdown source):\nHeadless Chromium (198 MB macOS, 274 MB Windows) exists only for letter PDFs and legacy resume exports. `docx` and Handlebars serve only legacy resumes. A LaTeX letter template would use the same fields as today (company, role, greeting, plain-text paragraphs, signature), with text escaped for LaTeX. Existing legacy resumes would be exported once as files and kept in appdata.\nRecommendation: Render letters with the same Tectonic engine as the CV. One document engine, letters that match the CV’s typography, and no browser dependency.\nSelection: single\nOptions: LaTeX for CV and letters / Electron's built-in print-to-PDF with the current HTML layout / Keep headless Chromium\nSelected: Something else\nNotes: just generate CVs in plain text.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-11\">Question 11\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Do you accept these implementation choices?\nDescription (Markdown source):\n| Area | Current | Rebuild |\n| --- | --- | --- |\n| Packaging | `tsx` at runtime; full `node_modules` shipped | Backend bundled with esbuild into one file |\n| Database | JSON documents + in-memory snapshot index | Typed columns for filters and sort, SQL indexes, FTS5 search; JSON only for raw source evidence |\n| UI server state | Custom `useRemote`, ETag polling, revision hints | TanStack Query, invalidated by push events |\n| Routing | Hash routes inside a 1,448-line `App.tsx` | One module per page; the router keeps unsaved-edit guards |\n| Assistant UI | assistant-ui runtime (295 KB chunk) | Plain message list and composer |\n| LaTeX editor | react-codemirror wrapper (964 KB chunk + 273 KB CSS) | CodeMirror 6 with only the needed extensions |\n| PDF preview | pdf.js (1.1 MB worker) | Built-in Chromium PDF viewer |\n| Tests | 27 `verify-*` scripts + node tests | Ported unit tests + one Playwright suite against the packaged app on both platforms |\n| Diagnostics | Logs in appdata | Settings → Diagnostics: versions and recent errors, copyable, no personal data |\nRecommendation: Accept. Each change removes code or a dependency; TanStack Query is the only new library, and it replaces hand-written caching and polling.\nSelection: single\nOptions: Accept / Accept with changes in notes / Discuss alternatives first\nSelected: Accept\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-12\">Question 12\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What should the opening screen be?\nDescription: local\nRecommendation: Triage inbox. It turns the collection into a short daily queue you can clear.\nSelection: single\nOptions: Triage inbox (proposed) / Current browse-all inbox\nSelected: Triage inbox (proposed)\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-13\">Question 13\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Where should your job criteria live?\nDescription (Markdown source):\nToday, location, timezone, arrangement, eligibility and match level are inbox filters restored per browser tab, while the profile separately stores preferences used for matching. Two places describe what you want. In the proposal, Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily. See the Profile question for a preview.\nRecommendation: In Profile as search criteria. Set them once; they also stop irrelevant jobs from being stored.\nSelection: single\nOptions: Profile → Search criteria; filters narrow temporarily / Keep everything as inbox filters (current)\nSelected: Profile → Search criteria; filters narrow temporarily\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-14\">Question 14\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should timezone fit be expressed?\nDescription (Markdown source):\nThe current picker selects a UTC range on a map with a separate rotating offset; it took four iterations on 18 October to handle the date-line seam. An overlap rule asks the question directly and wraps around midnight without a seam. Example: US Pacific gives 1 h of overlap with Kuala Lumpur. Matching stays country-level as today, so the United States matches 3 h through Hawaii. Try the slider.\nRecommendation: Minimum working-hours overlap with your timezone, stored in search criteria.\nSelection: single\nOptions: Minimum overlap with my working hours / Current UTC range, map and offset / No timezone filtering\nSelected: Minimum overlap with my working hours\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-15\">Question 15\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should a job's fit be shown?\nDescription (Markdown source):\nToday: a six-field metadata grid (several reading “Not listed” or “Unconfirmed”), then Description, Match, Notes and Cover letter tabs. Match evidence sits in its own tab, away from the text it refers to. The proposal leads with a summary of the deciding facts, then highlights matched and missing requirements inside the description.\nRecommendation: Decision summary and highlighted description. You read the reasons where they appear.\nSelection: single\nOptions: Decision summary + highlighted description / Current grid and Match tab\nSelected: Decision summary + highlighted description\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-16\">Question 16\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should a saved job be worked on?\nDescription (Markdown source):\nToday the letter is a tab in the half-width detail pane, below the metadata grid, edited as separate form fields. In the proposal, a saved job opens a workspace: the posting and notes on the left, the letter as a document on the right, with review notes and status visible. Contact fields stay in the letter's settings.\nRecommendation: Posting and letter side by side. Checking the letter against the posting is the main task here.\nSelection: single\nOptions: Posting and letter side by side / Current letter tab\nSelected: Posting and letter side by side\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-17\">Question 17\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What should the app record after you save a job?\nDescription: local\nRecommendation: Saved and Applied only, with the status selector in the job header and the date in the list. Add interview stages later if you find you need them.\nSelection: single\nOptions: Saved and Applied, shown in the header and list / Add stages: Applied, Interviewing, Offer, Closed, with dates / Saved only; remove Applied\nSelected: Saved and Applied, shown in the header and list\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-18\">Question 18\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should the profile be shown and edited?\nDescription (Markdown source):\nThe current view renders the stored JSON as Markdown, including internal fields such as Id and Year/Month/Display “Not provided”. The proposal is a fact sheet: search criteria, eligibility, experience, projects and missing facts, each with its status and source. Direct editing would revise the 8 October read-only decision; direct edits are recorded as yours with a date, and the assistant remains available for imports and bulk changes.\nRecommendation: Fact sheet with direct editing as well as the assistant. Changing a phone number through chat is the clunkiest path.\nSelection: single\nOptions: Fact sheet; edit directly or with the assistant / Fact sheet; assistant-only edits / Current Markdown view\nSelected: Fact sheet; edit directly or with the assistant\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-19\">Question 19\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What should the main navigation contain?\nDescription (Markdown source):\nSources are set up once and checked occasionally, but today they take a top-level page. The proposal puts them in Settings with per-source job and save counts. A failing source puts a dot on Settings, and Saved counts letters ready to review. The counts shown are your current collection; the statuses are illustrative.\nRecommendation: Inbox, Saved, Profile and CV, with Sources inside Settings.\nSelection: single\nOptions: Inbox, Saved, Profile, CV; Sources in Settings / Keep Sources as a top-level page\nSelected: Inbox, Saved, Profile, CV; Sources in Settings\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-20\">Question 20\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which sources should the rebuilt app keep?\nDescription: local\nRecommendation: Keep the first three groups. Drop scraped boards without saves, X and the boards that never returned a job. Scraped boards break when sites change, and X needs paid credits and budget code. Hacker News is optional.\nSelection: multiple\nOptions: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves / Hacker News / X search / Boards that never returned a job\nSelected: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-21\">Question 21\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which additions should the rebuild include?\nDescription (Markdown source):\n| Addition | What it does |\n| --- | --- |\n| Keyboard triage | J/K move, S save, X skip, O open posting, / search |\n| Setup checklist | First run: connect ChatGPT → build profile from your CV PDF → choose sources → first scan |\n| Hide company | One action on a job hides that employer's future postings |\n| Track company | From a job on Greenhouse, Ashby or Lever, add that employer's board as a source |\n| Status counts | Saved shows letters ready to review; Settings shows failing sources or a needed sign-in |\n| Record versions when applying | Marking Applied records which letter and CV versions were current |\n| Saved views | Named filter combinations in the sidebar |\nRecommendation: Everything except saved views. Search criteria cover the main need for saved views.\nSelection: multiple\nOptions: Keyboard triage / Setup checklist / Hide company / Track company / Status counts / Record versions when applying / Saved views\nSelected: Keyboard triage / Setup checklist / Hide company\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-22\">Question 22\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which removals should the rebuild make?\nDescription (Markdown source):\nSources, timezone, the Match tab and platforms are covered by earlier questions.\n\n| Removal | Why |\n| --- | --- |\n| Seen state and filter | Replaced by New/All and bold unopened titles; 73 opens recorded |\n| Duplicate grouping control | Always group; the detail lists other listings |\n| Legacy resume code (`docx`, Handlebars, export routes) | Export existing resumes once to files |\n| Retired Jev code, migration and archive compatibility | Export stored Jev data once to a file |\n| HTTP body cache | 979 MB; keep only ETag/Last-Modified validators |\n| Description history for unsaved jobs | 380 MB; saving still snapshots the description |\n| VueJobs detail enrichment | Special six-per-day lookup path for one feed |\n| Custom installer and checksum inventory | Replaced by the packaging tool |\nRecommendation: All of them. Each removes code or stored data with no current use.\nSelection: multiple\nOptions: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nSelected: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-23\">Question 23\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What else feels clunky or breaks in daily use?\nDescription (Markdown source):\nAnything not covered above: specific screens, waits, errors or steps you avoid. Paste screenshots if useful.\nSelected: (none)\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-11-01-rebuild"]},{"id":"journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","title":"Interview answers — round 3","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Interview answers — round 3\nsection: Journal\nupdated: 2026-11-01\nstatus: Submitted\n---\n# Interview answers — round 3\n\nSubmitted answers; interpretation and accepted decisions are recorded in the [clean rebuild plan](2026-11-01-rebuild.md) and the [implementation handoff](2026-11-01-werk-handoff.md).\n\nSession: `28a582f50b30795a161c06d0221e222e`\n\n## Question 30\n\n```text\nRound: Handoff readiness\nQuestion: Who should restructure the repository before the handoff?\nDescription (Markdown source):\nRestructuring means: create `legacy` at `e493246`, remove the old tracked code, start the new wiki (carrying the plan, transcripts, handoff and designs), write the werk `AGENTS.md`, `README.md` and `.gitignore`, apply this round's answers to the handoff, and commit. It changes only git and documentation; no werk code.\nRecommendation: I do it now in this session. The next agent then starts directly on milestone 1 code from a consistent, reviewed tree.\nSelection: single\nOptions: Restructure now in this session / Leave it as the next agent's first step\nSelected: Restructure now in this session\nNotes: \n```\n\n## Question 31\n\n```text\nRound: Handoff readiness\nQuestion: Which of these should I delete after you submit?\nDescription (Markdown source):\nSelecting an item is your confirmation; unselected items stay. Everything private is in the verified backup at `~/Desktop/ununemploy-backup`; build outputs can be rebuilt from the `legacy` branch. Before deleting `.local-data`, I move `.local-data/grill` (the private form records) into the backup folder. A Windows installation on your PC is not covered; remove it there through Settings → Apps.\nRecommendation: All of them. werk starts clean, and keeping old private files in the checkout only risks committing them.\nSelection: multiple\nOptions: ~/Applications/ununemploy.app (installed old app) / ~/Library/Application Support/ununemploy (old app data, 2.7 GB) / build/, dist/ and node_modules/ in the checkout (old build outputs) / .local-data/ in the checkout (old development data, 2.0 GB) / data/candidate-profile.json and docs/MASTER_CV.md (original evidence) / .env in the checkout\nSelected: ~/Applications/ununemploy.app (installed old app) / ~/Library/Application Support/ununemploy (old app data, 2.7 GB) / build/, dist/ and node_modules/ in the checkout (old build outputs) / .local-data/ in the checkout (old development data, 2.0 GB) / data/candidate-profile.json and docs/MASTER_CV.md (original evidence) / .env in the checkout\nNotes: \n```\n\n## Question 32\n\n```text\nRound: Handoff readiness\nQuestion: Where should werk development happen?\nDescription (Markdown source):\nThe old app is archived on `legacy` in both options. Merging into `main` stays with you either way.\nRecommendation: A `werk` branch with a pull request per milestone that you merge. Main always holds a reviewed state, and each milestone has one place to review.\nSelection: single\nOptions: A werk branch, with a pull request per milestone that you merge / Directly on main\nSelected: Directly on main\nNotes: \n```\n\n## Question 33\n\n```text\nRound: Handoff readiness\nQuestion: What may the next agent do on GitHub without asking each time?\nDescription (Markdown source):\nPushing the working branch is what runs CI, including the Windows install-and-launch test. Merging into `main` and publishing a release stay with you in every case.\nRecommendation: Push `legacy` and the working branch, and open or update pull requests. Keep version tags for your request, because a tag drafts a release.\nSelection: multiple\nOptions: Push the legacy branch / Push the working branch (runs CI) / Open and update pull requests / Push version tags (drafts a release)\nSelected: Push the legacy branch / Push the working branch (runs CI)\nNotes: \n```\n\n## Question 34\n\n```text\nRound: Handoff readiness\nQuestion: How far should the next agent go before checking in with you?\nDescription (Markdown source):\nEach milestone ends with a verification run in the wiki either way. Consequential decisions that are not already settled go to you through grill-form.\nRecommendation: Through all milestones, pausing only for consequential decisions and the actions you reserved. Per-milestone pull requests still give you a review point for each step.\nSelection: single\nOptions: Through all milestones / One milestone at a time; wait for my review after each / Milestone 1 only, then stop\nSelected: Through all milestones\nNotes: \n```\n\n## Question 35\n\n```text\nRound: Handoff readiness\nQuestion: Which live checks may the next agent run?\nDescription (Markdown source):\nTests use simulated inference and recorded source responses by default. Real inference uses your ChatGPT subscription allowance; you sign in once in the development build. Live checks use a fictional profile, never your real data. Live scans are ordinary read-only requests within each source's limits.\nRecommendation: Both, kept small: a few real generations per milestone and bounded scans.\nSelection: single\nOptions: Real inference and live scans / Live scans only / Real inference only / Neither; simulated and recorded data only\nSelected: Real inference and live scans\nNotes: \n```\n\n## Question 36\n\n```text\nRound: Handoff readiness\nQuestion: Will you test Windows builds on your PC?\nDescription (Markdown source):\nCI installs and launches the packaged app on a clean Windows runner, but cannot judge responsiveness or the real first-run experience. Each CI run keeps the installer as a downloadable artifact for 7 days.\nRecommendation: After each milestone. Windows was the failing platform, so a quick install-and-click on real hardware catches what CI cannot.\nSelection: single\nOptions: After each milestone / Only before releases / No; rely on CI\nSelected: Only before releases\nNotes: \n```\n\n## Question 37\n\n```text\nRound: Handoff readiness\nQuestion: What should closing the window do on Windows?\nDescription (Markdown source):\nOn macOS, closing the window keeps werk running in the Dock with scheduled scans until Quit (your earlier choice). Windows has no Dock: a running app without a window is invisible unless it has a tray icon, which matches the “stops in the background” confusion you reported.\nRecommendation: Keep running in the system tray, with Open and Quit in the tray menu. Scans keep their schedule on both platforms.\nSelection: single\nOptions: Keep running in the system tray / Quit; scans run only while werk is open\nSelected: Keep running in the system tray\nNotes: \n```\n\n## Question 38\n\n```text\nRound: Handoff readiness\nQuestion: How should CV compilation be isolated on Windows?\nDescription (Markdown source):\nLaTeX can read local files into the PDF. The assistant edits the CV source and job descriptions are untrusted, so a crafted posting could try to make your CV include a private file that you later send. macOS isolates Tectonic with the built-in `sandbox-exec` profile from the legacy app. The legacy Windows build ran Tectonic inside an AppContainer through a small Go helper, which passed Windows checks on 17 October.\nRecommendation: Reuse the Go AppContainer helper, built in CI. It is the one non-TypeScript component, but it is small and already verified; the alternative can be bypassed with LaTeX macros.\nSel
