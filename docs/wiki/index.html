op tools before deleting data; no delayed write or old task returns\u003c/td>\n\u003ctd>A real pi shell command was aborted before its delayed file write\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-factory-reset/macos.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 053bbf9b3702649a9429cf63f677f868e60ec5cb2330ff1d88bdc2eef0dee00d\">UI results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Restart and accessibility\u003c/td>\n\u003ctd>Normal startup, recovery, close/reopen and navigation remain functional\u003c/td>\n\u003ctd>Shell driver passed (593 ms startup); 20 light/dark axe audits and keyboard scenario passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-factory-reset/accessibility.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a460f05f5abfd6cee5472dbaa22520ce164fdc112db46e47b03453f5fb9f4092\">Accessibility results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cross-platform CI\u003c/td>\n\u003ctd>Same reset and regression scenarios work on macOS and Windows\u003c/td>\n\u003ctd>Both packaged apps passed all six reset scenarios, 39 domain tests, installer/launch checks, other feature drivers and accessibility\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-factory-reset/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: f021293180b16c4f52ba5d5119153cc48706f1219e69347079715302fec77766\">CI results\u003c/a>, \u003ca href=\"https://github.com/rengwu/werk/actions/runs/41328558430\" rel=\"noreferrer\">CI run\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"findings-and-limits\">Findings and limits\u003c/h2>\n\u003cp>The \u003ca href=\"https://github.com/rengwu/werk/actions/runs/41327821084\" rel=\"noreferrer\">initial CI run\u003c/a> at \u003ccode>780b1e2\u003c/code> passed typechecking, all 39 tests, packaging, installation/launch, compiler isolation, authentication handoff, assistant, discovery, document and backup checks on both platforms. Its reset driver failed with \u003ccode>unable to open database file\u003c/code> because the setup heading can render before backend initialization; see the \u003ca href=\"evidence/2026-11-02-factory-reset/ci-initial.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a415c84761e528e7db52ea733ab7585f9b19fbad92e277d0cf99c6b760792ea7\">initial CI results\u003c/a>. The corrected driver waits for the Diagnostics backend response before inspecting SQLite and passed on both platforms. This correction changed the test, not the application.\u003c/p>\n\u003cp>Reset uses Electron's \u003ca href=\"https://www.electronjs.org/docs/latest/api/session#sescleardataoptions\" rel=\"noreferrer\">session data cleanup\u003c/a> and removes explicitly owned app paths after the backend exits. It does not recursively erase an arbitrary custom data directory or follow directory links. A pending marker is removed only after cleanup completes. Existing original files and a test export survived both reset and recovery. This does not establish secure erasure from disk or deletion of external files created by unrestricted assistant commands.\u003c/p>\n\u003cp>The native confirmation was exercised with stubbed responses; physical mouse/keyboard interaction with the operating-system dialog is not an independent test here. No real ChatGPT credential, candidate record or live model request was used. The existing \u003ccode>v0.1.0\u003c/code> release and tag were not changed by this feature work.\u003c/p>\n","backlinks":["features/factory-reset","verification/index"]},{"id":"verification/runs/2026-11-02-profile-layout","title":"Profile layout","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Profile layout\nsection: Verification\nupdated: 2026-11-02\nresult: Passed\n---\n# Profile layout\n\nScope: [FEAT-profile](../../features/profile.md), the reported inset scrollbar and mismatched content widths. The CSS now separates the full-width scrolling area from its centered 760 px content column. No profile records, fields or model behavior changed.\n\n## Build and environment\n\nLocal baseline: `2b852ce`, macOS arm64 and Electron 44.9.1. The changed build differs only in `src/renderer/style.css`; its exact base and file hash are in the [manifest](../../evidence/2026-11-02-profile-layout/source-manifest.json). An isolated copy of the production development app was inspected with Playwright, first with an empty data folder, then with the fictional Alex Example profile. The renderer was rebuilt with Vite. These layout checks used only fictional data, with no live inference or job scan.\n\nThe fix was committed as `bcdb3edfffd365c711b9b1d786a56e49f6c6d97a`. A production build completed, and the existing development app's renderer was reloaded. Native visual inspection confirmed the aligned content and scrollbar at the right edge. No candidate records were changed, and only fictional screenshots were retained as verification evidence.\n\n[CI run 41418441801](https://github.com/rengwu/werk/actions/runs/41418441801) passed on macOS arm64 and Windows x64 at that exact revision. The [check results](../../evidence/2026-11-02-profile-layout/ci.json) include production packaging/launch, all 42 domain tests, and existing fixture-package UI drivers.\n\n## Recipe and observations\n\nOpen Profile with empty and fictional populated data. Resize the window's content to 1440 × 900 and 900 × 600. Inspect the toolbar, notice, sections and scrollbar; scroll to Missing, edit and cancel Basics, then open and close the assistant. Compare the page bounds before and after the overlay opens. [Measurements](../../evidence/2026-11-02-profile-layout/layout.json) record each state.\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Baseline | Reproduce the reported mismatch | At 1440 px the scrollbar ended 220 px before the pane edge, and toolbar/notice extended 161 px past the sections | Passed | [Before](../../evidence/2026-11-02-profile-layout/before-wide.png) |\n| Empty and populated layouts | One scrolling area at the pane edge; aligned content | At both sizes the page reached the main pane's right edge, toolbar/notice/section edges matched, and scroll width equaled client width | Passed | [Empty wide](../../evidence/2026-11-02-profile-layout/empty-wide.png), [Filled narrow](../../evidence/2026-11-02-profile-layout/filled-narrow.png) |\n| Scrolling and editing | Reach the last section; preserve fixed header; form fits | Missing was visible at the bottom; document scroll remained zero; the narrow Basics form fit and Cancel restored the fictional name | Passed | [Measurements](../../evidence/2026-11-02-profile-layout/layout.json), [Edit narrow](../../evidence/2026-11-02-profile-layout/edit-narrow.png) |\n| Assistant overlay | Retain the page bounds and 520 px overlay | Page stayed 680 × 556 at the minimum window size; overlay was 520 px wide | Passed | [Measurements](../../evidence/2026-11-02-profile-layout/layout.json) |\n| Typecheck | Styles leave TypeScript valid | Passed | Passed | `npm run check` |\n| Packaged regression checks | Existing profile and accessibility flows pass on macOS and Windows | Profile edit/restore, overlay behavior and accessibility checks passed on both platforms; full CI passed | Passed | [CI checks](../../evidence/2026-11-02-profile-layout/ci.json) |\n\n## Limits\n\nThe spacing and screenshot review was performed on macOS. CI's existing profile and accessibility drivers cover packaged behavior on both platforms; they do not measure these specific layout bounds. No new permanent test was added for this CSS-only change.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"recipe-and-observations","title":"Recipe and observations","depth":2},{"id":"limits","title":"Limits","depth":2}],"titleAnchor":"profile-layout","links":["features/profile"],"attachments":[{"path":"evidence/2026-11-02-profile-layout/source-manifest.json","sha256":"bd06f3970702a6adccdfa996a4ae4e8c987de06adbe9b8fac1262928fdd3b00e"},{"path":"evidence/2026-11-02-profile-layout/ci.json","sha256":"509731c2ba1fa351778ab510d658f22be6843bedbe364c8cf06dfc5caf7aa26f"},{"path":"evidence/2026-11-02-profile-layout/layout.json","sha256":"3651df6d5d4dae436c23071b18a63eff15a3aa8b58e5e338d51b8382dce939b7"},{"path":"evidence/2026-11-02-profile-layout/before-wide.png","sha256":"94aecb9f6df76382b5319804274086ea010308133495816bd5fc204b1e9b26dd"},{"path":"evidence/2026-11-02-profile-layout/empty-wide.png","sha256":"768751b032aa8171958ba86e920499ee06f7346325efc9c3579d44323f2a48bd"},{"path":"evidence/2026-11-02-profile-layout/filled-narrow.png","sha256":"6ea66c4973e659aca5a0537883d2be660a25d66fc86f899902abb0dbcf151cac"},{"path":"evidence/2026-11-02-profile-layout/edit-narrow.png","sha256":"e191814f43c0be82aba12b3ce5b18d66b959bc2c33788cbeba2d6cb5455dbeaf"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/profile\">FEAT-profile\u003c/a>, the reported inset scrollbar and mismatched content widths. The CSS now separates the full-width scrolling area from its centered 760 px content column. No profile records, fields or model behavior changed.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Local baseline: \u003ccode>2b852ce\u003c/code>, macOS arm64 and Electron 44.9.1. The changed build differs only in \u003ccode>src/renderer/style.css\u003c/code>; its exact base and file hash are in the \u003ca href=\"evidence/2026-11-02-profile-layout/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: bd06f3970702a6adccdfa996a4ae4e8c987de06adbe9b8fac1262928fdd3b00e\">manifest\u003c/a>. An isolated copy of the production development app was inspected with Playwright, first with an empty data folder, then with the fictional Alex Example profile. The renderer was rebuilt with Vite. These layout checks used only fictional data, with no live inference or job scan.\u003c/p>\n\u003cp>The fix was committed as \u003ccode>bcdb3edfffd365c711b9b1d786a56e49f6c6d97a\u003c/code>. A production build completed, and the existing development app's renderer was reloaded. Native visual inspection confirmed the aligned content and scrollbar at the right edge. No candidate records were changed, and only fictional screenshots were retained as verification evidence.\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/rengwu/werk/actions/runs/41418441801\" rel=\"noreferrer\">CI run 41418441801\u003c/a> passed on macOS arm64 and Windows x64 at that exact revision. The \u003ca href=\"evidence/2026-11-02-profile-layout/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 509731c2ba1fa351778ab510d658f22be6843bedbe364c8cf06dfc5caf7aa26f\">check results\u003c/a> include production packaging/launch, all 42 domain tests, and existing fixture-package UI drivers.\u003c/p>\n\u003ch2 id=\"recipe-and-observations\">Recipe and observations\u003c/h2>\n\u003cp>Open Profile with empty and fictional populated data. Resize the window's content to 1440 × 900 and 900 × 600. Inspect the toolbar, notice, sections and scrollbar; scroll to Missing, edit and cancel Basics, then open and close the assistant. Compare the page bounds before and after the overlay opens. \u003ca href=\"evidence/2026-11-02-profile-layout/layout.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3651df6d5d4dae436c23071b18a63eff15a3aa8b58e5e338d51b8382dce939b7\">Measurements\u003c/a> record each state.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Baseline\u003c/td>\n\u003ctd>Reproduce the reported mismatch\u003c/td>\n\u003ctd>At 1440 px the scrollbar ended 220 px before the pane edge, and toolbar/notice extended 161 px past the sections\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-profile-layout/before-wide.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 94aecb9f6df76382b5319804274086ea010308133495816bd5fc204b1e9b26dd\">Before\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Empty and populated layouts\u003c/td>\n\u003ctd>One scrolling area at the pane edge; aligned content\u003c/td>\n\u003ctd>At both sizes the page reached the main pane's right edge, toolbar/notice/section edges matched, and scroll width equaled client width\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-profile-layout/empty-wide.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 768751b032aa8171958ba86e920499ee06f7346325efc9c3579d44323f2a48bd\">Empty wide\u003c/a>, \u003ca href=\"evidence/2026-11-02-profile-layout/filled-narrow.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6ea66c4973e659aca5a0537883d2be660a25d66fc86f899902abb0dbcf151cac\">Filled narrow\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scrolling and editing\u003c/td>\n\u003ctd>Reach the last section; preserve fixed header; form fits\u003c/td>\n\u003ctd>Missing was visible at the bottom; document scroll remained zero; the narrow Basics form fit and Cancel restored the fictional name\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-profile-layout/layout.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3651df6d5d4dae436c23071b18a63eff15a3aa8b58e5e338d51b8382dce939b7\">Measurements\u003c/a>, \u003ca href=\"evidence/2026-11-02-profile-layout/edit-narrow.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e191814f43c0be82aba12b3ce5b18d66b959bc2c33788cbeba2d6cb5455dbeaf\">Edit narrow\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Assistant overlay\u003c/td>\n\u003ctd>Retain the page bounds and 520 px overlay\u003c/td>\n\u003ctd>Page stayed 680 × 556 at the minimum window size; overlay was 520 px wide\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-profile-layout/layout.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3651df6d5d4dae436c23071b18a63eff15a3aa8b58e5e338d51b8382dce939b7\">Measurements\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Typecheck\u003c/td>\n\u003ctd>Styles leave TypeScript valid\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ccode>npm run check\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Packaged regression checks\u003c/td>\n\u003ctd>Existing profile and accessibility flows pass on macOS and Windows\u003c/td>\n\u003ctd>Profile edit/restore, overlay behavior and accessibility checks passed on both platforms; full CI passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-profile-layout/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 509731c2ba1fa351778ab510d658f22be6843bedbe364c8cf06dfc5caf7aa26f\">CI checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits\">Limits\u003c/h2>\n\u003cp>The spacing and screenshot review was performed on macOS. CI's existing profile and accessibility drivers cover packaged behavior on both platforms; they do not measure these specific layout bounds. No new permanent test was added for this CSS-only change.\u003c/p>\n","backlinks":["features/profile","verification/index"]},{"id":"verification/runs/2026-11-02-source-expansion","title":"Source expansion verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Source expansion verification\nsection: Verification\nupdated: 2026-11-02\nresult: Passed\n---\n# Source expansion verification\n\nScope: [FEAT-discovery and FEAT-inbox](../../features/discovery.md), thirteen added feeds, catalog upgrades, feed parsing and Settings-to-Inbox behavior. [Research and source limits](../../journal/2026-11-02-more-sources.md) record the selection. Automated profile and UI checks used fictional records in disposable folders; the user's data was not used for scans or inference.\n\n## Build and environment\n\nLocal checks used a dirty tree based on `648df34d5a54164eac2b6aba4fba58319a6f18a3`, fingerprint `1e5ed42fcce8e7fde47b90b2e0d919f92bcfefb1f73f945c2fdef917505b3767`. The [source manifest](../../evidence/2026-11-02-source-expansion/source-manifest.json) records the files. macOS arm64, Node 22.19.0, Electron 44.9.1, SQLite schema 6. The isolated UI instance used the unchanged production main/renderer with the updated backend built for recorded HTTP responses and simulated inference. It did not share the live app's folder.\n\nThe implementation was committed as `710375b9d34a8b3cb49f2edb3a3ffca4877f6045`. A production macOS package built successfully with `npm run package`. The idle development app was restarted with that production build and its existing data folder; native UI inspection confirmed Settings → Sources changed from 17 of 37 enabled to 30 of 50, and its existing ChatGPT connection remained available. No scan or reset was run in that instance.\n\n[CI run 41405461609](https://github.com/rengwu/werk/actions/runs/41405461609) passed at that exact revision on macOS arm64 and Windows x64. It built production installers, exercised install/launch and compiler isolation, then used separate fixture packages for simulated inference and recorded discovery responses. The [CI evidence](../../evidence/2026-11-02-source-expansion/ci.json) records the individual checks. No release was created.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Typecheck and domain tests | Valid types, feed formats, metadata preservation and no regression | Typecheck and all 42 tests passed, including all 13 feed shapes | Passed | `tests/source-feeds.test.ts`, `tests/discovery.test.ts` |\n| Catalog upgrade | Add missing feeds once while preserving existing configuration | Old installation fixture gained 13 feeds; disabled sources, IDs, cooldowns, checkpoint and custom board survived repeated reopen | Passed | `tests/source-feeds.test.ts` |\n| Live feeds | Bounded reads produce usable job descriptions and preserve unknown metadata | 13 requests parsed 795 entries, with no empty descriptions; 663 were full descriptions and the rest excerpts | Passed | [Live results](../../evidence/2026-11-02-source-expansion/live.json) |\n| Settings and Inbox | New feeds visible; enable, scan, ingest and triage work through real controls | Expanded discovery driver passed seven scenarios, including an enabled MoAIJobs feed with nested CDATA | Passed | [UI results](../../evidence/2026-11-02-source-expansion/ui.json), [Sources](../../evidence/2026-11-02-source-expansion/sources.png) |\n| Packaged macOS and Windows | Same discovery behavior, defaults and reset counts in packaged apps | Both platforms passed the expanded discovery driver, factory reset, assistant, documents, backup, accessibility and production launch checks; Windows install/uninstall preserved data | Passed | [CI checks](../../evidence/2026-11-02-source-expansion/ci.json) |\n\n## Findings and limits\n\nMoAIJobs initially parsed with empty descriptions because its RSS contains literal nested CDATA. The parser now unwraps that text before sanitizing it; a fictional regression fixture and the 353-item live response both preserved descriptions. Python's comma-separated titles and Elixir's missing employer metadata remain unknown rather than guessed. Feed and publisher names do not establish worldwide work authorization.\n\nThe first local UI driver attempt used Playwright's immediate checkbox-state assertion for an asynchronous source update. Its screenshot showed the update had succeeded; the corrected driver waits for the checked state before scanning and passed. The application toggle behavior was unchanged.\n\nLive availability is a dated observation, not a promise of uptime or hiring status. Upstream category filters can be broad, feeds may contain overlapping or stale entries, and no full crawl was performed. The matching results belong to the fictional profile only. No employer contact, application action, live model generation or release publication occurred.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"findings-and-limits","title":"Findings and limits","depth":2}],"titleAnchor":"source-expansion-verification","links":["features/discovery","journal/2026-11-02-more-sources"],"attachments":[{"path":"evidence/2026-11-02-source-expansion/source-manifest.json","sha256":"3582562e44f14f7fc76048e83427391c90f1fcb4364db7e9dac953478fe8df2b"},{"path":"evidence/2026-11-02-source-expansion/ci.json","sha256":"d68b3437809aca9edfec6ee4e67dd24f724a203a798fc1c24eb3a0af3d238354"},{"path":"evidence/2026-11-02-source-expansion/live.json","sha256":"0ed4b55cc64ad56d68cfaa3f4f5dfc61153d099d9d040e36484b03089a65a05c"},{"path":"evidence/2026-11-02-source-expansion/ui.json","sha256":"eac02bca28f960969932077a07f9bafb599266bde4103327e06f55761928750d"},{"path":"evidence/2026-11-02-source-expansion/sources.png","sha256":"7faad99c28421cf7d7d0bd7e04370374795899065b9c20e6f0d59a0207b09e9b"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/discovery\">FEAT-discovery and FEAT-inbox\u003c/a>, thirteen added feeds, catalog upgrades, feed parsing and Settings-to-Inbox behavior. \u003ca href=\"#/journal/2026-11-02-more-sources\">Research and source limits\u003c/a> record the selection. Automated profile and UI checks used fictional records in disposable folders; the user's data was not used for scans or inference.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Local checks used a dirty tree based on \u003ccode>648df34d5a54164eac2b6aba4fba58319a6f18a3\u003c/code>, fingerprint \u003ccode>1e5ed42fcce8e7fde47b90b2e0d919f92bcfefb1f73f945c2fdef917505b3767\u003c/code>. The \u003ca href=\"evidence/2026-11-02-source-expansion/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3582562e44f14f7fc76048e83427391c90f1fcb4364db7e9dac953478fe8df2b\">source manifest\u003c/a> records the files. macOS arm64, Node 22.19.0, Electron 44.9.1, SQLite schema 6. The isolated UI instance used the unchanged production main/renderer with the updated backend built for recorded HTTP responses and simulated inference. It did not share the live app's folder.\u003c/p>\n\u003cp>The implementation was committed as \u003ccode>710375b9d34a8b3cb49f2edb3a3ffca4877f6045\u003c/code>. A production macOS package built successfully with \u003ccode>npm run package\u003c/code>. The idle development app was restarted with that production build and its existing data folder; native UI inspection confirmed Settings → Sources changed from 17 of 37 enabled to 30 of 50, and its existing ChatGPT connection remained available. No scan or reset was run in that instance.\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/rengwu/werk/actions/runs/41405461609\" rel=\"noreferrer\">CI run 41405461609\u003c/a> passed at that exact revision on macOS arm64 and Windows x64. It built production installers, exercised install/launch and compiler isolation, then used separate fixture packages for simulated inference and recorded discovery responses. The \u003ca href=\"evidence/2026-11-02-source-expansion/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d68b3437809aca9edfec6ee4e67dd24f724a203a798fc1c24eb3a0af3d238354\">CI evidence\u003c/a> records the individual checks. No release was created.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Typecheck and domain tests\u003c/td>\n\u003ctd>Valid types, feed formats, metadata preservation and no regression\u003c/td>\n\u003ctd>Typecheck and all 42 tests passed, including all 13 feed shapes\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ccode>tests/source-feeds.test.ts\u003c/code>, \u003ccode>tests/discovery.test.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Catalog upgrade\u003c/td>\n\u003ctd>Add missing feeds once while preserving existing configuration\u003c/td>\n\u003ctd>Old installation fixture gained 13 feeds; disabled sources, IDs, cooldowns, checkpoint and custom board survived repeated reopen\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ccode>tests/source-feeds.test.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Live feeds\u003c/td>\n\u003ctd>Bounded reads produce usable job descriptions and preserve unknown metadata\u003c/td>\n\u003ctd>13 requests parsed 795 entries, with no empty descriptions; 663 were full descriptions and the rest excerpts\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-source-expansion/live.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 0ed4b55cc64ad56d68cfaa3f4f5dfc61153d099d9d040e36484b03089a65a05c\">Live results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Settings and Inbox\u003c/td>\n\u003ctd>New feeds visible; enable, scan, ingest and triage work through real controls\u003c/td>\n\u003ctd>Expanded discovery driver passed seven scenarios, including an enabled MoAIJobs feed with nested CDATA\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-source-expansion/ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: eac02bca28f960969932077a07f9bafb599266bde4103327e06f55761928750d\">UI results\u003c/a>, \u003ca href=\"evidence/2026-11-02-source-expansion/sources.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7faad99c28421cf7d7d0bd7e04370374795899065b9c20e6f0d59a0207b09e9b\">Sources\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Packaged macOS and Windows\u003c/td>\n\u003ctd>Same discovery behavior, defaults and reset counts in packaged apps\u003c/td>\n\u003ctd>Both platforms passed the expanded discovery driver, factory reset, assistant, documents, backup, accessibility and production launch checks; Windows install/uninstall preserved data\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-source-expansion/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d68b3437809aca9edfec6ee4e67dd24f724a203a798fc1c24eb3a0af3d238354\">CI checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"findings-and-limits\">Findings and limits\u003c/h2>\n\u003cp>MoAIJobs initially parsed with empty descriptions because its RSS contains literal nested CDATA. The parser now unwraps that text before sanitizing it; a fictional regression fixture and the 353-item live response both preserved descriptions. Python's comma-separated titles and Elixir's missing employer metadata remain unknown rather than guessed. Feed and publisher names do not establish worldwide work authorization.\u003c/p>\n\u003cp>The first local UI driver attempt used Playwright's immediate checkbox-state assertion for an asynchronous source update. Its screenshot showed the update had succeeded; the corrected driver waits for the checked state before scanning and passed. The application toggle behavior was unchanged.\u003c/p>\n\u003cp>Live availability is a dated observation, not a promise of uptime or hiring status. Upstream category filters can be broad, feeds may contain overlapping or stale entries, and no full crawl was performed. The matching results belong to the fictional profile only. No employer contact, application action, live model generation or release publication occurred.\u003c/p>\n","backlinks":["features/discovery","journal/2026-11-02-more-sources","verification/index","verification/setup"]},{"id":"verification/runs/2026-11-02-source-order","title":"Stable source ordering","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Stable source ordering\nsection: Verification\nupdated: 2026-11-02\nresult: Passed\n---\n# Stable source ordering\n\nScope: [FEAT-discovery](../../features/discovery.md), the user's report that enabling a source resets scrolling. Sources now sort by name, case-insensitively, with ID as a stable tie-breaker. Enabled state does not affect order. No renderer scroll-restoration workaround was added.\n\n## Build and environment\n\nBaseline product revision: `386690a` with the updated discovery driver. The changed local build used the same base plus the two files recorded in the [dirty-tree manifest](../../evidence/2026-11-02-source-order/source-manifest.json). macOS arm64, Electron 44.9.1. Both runs used an isolated development fixture build, fictional profile and recorded HTTP responses; neither shared the user's app data. Commands follow the [discovery setup](../setup.md#discovery-fixtures), using `WERK_DEV_APP=1`.\n\nThe fix was committed as `9be504a4bfe10eaad2b21c31d81b070ba0c7aced`. A production build completed, and the idle development app was restarted with its existing data. Native UI inspection confirmed alphabetical order with enabled and disabled boards mixed together and the enabled count unchanged. No source selection was changed in that instance during verification.\n\n[CI run 41410942963](https://github.com/rengwu/werk/actions/runs/41410942963), attempt 2, passed at that exact revision. Windows passed in the first attempt; the macOS job passed on retry. [Individual checks](../../evidence/2026-11-02-source-order/ci.json) include typecheck, all 42 domain tests, production packaging and launch, and the fixture-package UI scenarios.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Reproduce baseline regression | Enabling a bottom row reveals the reported jump | Row 51 moved to row 2; scroll offset changed from 1509.5 to 0 | Passed | [Before](../../evidence/2026-11-02-source-order/before.json), expected failure |\n| Mouse enable and keyboard disable | Row order, scrolling and focus remain stable | Row 51 and scroll offset 1509.5 stayed unchanged in both directions; checkbox retained focus | Passed | [After](../../evidence/2026-11-02-source-order/after.json) |\n| Discovery workflow and types | Counters, toggles and matching still work | All eight discovery UI scenarios and typecheck passed | Passed | [After](../../evidence/2026-11-02-source-order/after.json) |\n| Packaged macOS and Windows | The same UI check passes in both packages | All eight discovery scenarios passed on both platforms, including stable scroll, order and focus; full CI passed after the macOS retry | Passed | [CI checks](../../evidence/2026-11-02-source-order/ci.json) |\n\n## Limits\n\nThe local check covers toggles on an existing list. Adding a new source may legitimately change alphabetical positions. No live scan, model inference or release publication was needed for this fix.\n\nThe first CI attempt passed on Windows. Its macOS app launched in 3437 ms, exceeding the existing 3000 ms smoke-test limit; later UI checks were consequently skipped. That [failed attempt](../../evidence/2026-11-02-source-order/ci-macos-attempt1.json) is retained. The macOS job passed when retried at the same revision with no code or timing-limit changes. The initial timing failure is not evidence of a source-order regression; it remains an observed startup-budget miss.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits","title":"Limits","depth":2}],"titleAnchor":"stable-source-ordering","links":["features/discovery","verification/setup"],"attachments":[{"path":"evidence/2026-11-02-source-order/source-manifest.json","sha256":"a90c7b36d3f973913c8c1d974a98c0cf2c92e5861a4b0fa13d0a311a36e5ba39"},{"path":"evidence/2026-11-02-source-order/ci.json","sha256":"02731e76dd798e8e87eb6ed08fa19520e5055033a4c2a5b78f2412a57c633f49"},{"path":"evidence/2026-11-02-source-order/before.json","sha256":"072d7719d3bcbb297a15f433a121e54f40fbb8ad1a557176a9aa38d3b22c64c2"},{"path":"evidence/2026-11-02-source-order/after.json","sha256":"5f6f1d400e323b804913f049de94892660be7f931c3db32f48f41db4ffcc76da"},{"path":"evidence/2026-11-02-source-order/ci-macos-attempt1.json","sha256":"3034a44a82b0e721a9e12cc8cb90ac28211592e59a55940325f121cb3333c7e5"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/discovery\">FEAT-discovery\u003c/a>, the user's report that enabling a source resets scrolling. Sources now sort by name, case-insensitively, with ID as a stable tie-breaker. Enabled state does not affect order. No renderer scroll-restoration workaround was added.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Baseline product revision: \u003ccode>386690a\u003c/code> with the updated discovery driver. The changed local build used the same base plus the two files recorded in the \u003ca href=\"evidence/2026-11-02-source-order/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a90c7b36d3f973913c8c1d974a98c0cf2c92e5861a4b0fa13d0a311a36e5ba39\">dirty-tree manifest\u003c/a>. macOS arm64, Electron 44.9.1. Both runs used an isolated development fixture build, fictional profile and recorded HTTP responses; neither shared the user's app data. Commands follow the \u003ca href=\"#/verification/setup~discovery-fixtures\">discovery setup\u003c/a>, using \u003ccode>WERK_DEV_APP=1\u003c/code>.\u003c/p>\n\u003cp>The fix was committed as \u003ccode>9be504a4bfe10eaad2b21c31d81b070ba0c7aced\u003c/code>. A production build completed, and the idle development app was restarted with its existing data. Native UI inspection confirmed alphabetical order with enabled and disabled boards mixed together and the enabled count unchanged. No source selection was changed in that instance during verification.\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/rengwu/werk/actions/runs/41410942963\" rel=\"noreferrer\">CI run 41410942963\u003c/a>, attempt 2, passed at that exact revision. Windows passed in the first attempt; the macOS job passed on retry. \u003ca href=\"evidence/2026-11-02-source-order/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 02731e76dd798e8e87eb6ed08fa19520e5055033a4c2a5b78f2412a57c633f49\">Individual checks\u003c/a> include typecheck, all 42 domain tests, production packaging and launch, and the fixture-package UI scenarios.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Reproduce baseline regression\u003c/td>\n\u003ctd>Enabling a bottom row reveals the reported jump\u003c/td>\n\u003ctd>Row 51 moved to row 2; scroll offset changed from 1509.5 to 0\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-source-order/before.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 072d7719d3bcbb297a15f433a121e54f40fbb8ad1a557176a9aa38d3b22c64c2\">Before\u003c/a>, expected failure\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Mouse enable and keyboard disable\u003c/td>\n\u003ctd>Row order, scrolling and focus remain stable\u003c/td>\n\u003ctd>Row 51 and scroll offset 1509.5 stayed unchanged in both directions; checkbox retained focus\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-source-order/after.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5f6f1d400e323b804913f049de94892660be7f931c3db32f48f41db4ffcc76da\">After\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discovery workflow and types\u003c/td>\n\u003ctd>Counters, toggles and matching still work\u003c/td>\n\u003ctd>All eight discovery UI scenarios and typecheck passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-source-order/after.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5f6f1d400e323b804913f049de94892660be7f931c3db32f48f41db4ffcc76da\">After\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Packaged macOS and Windows\u003c/td>\n\u003ctd>The same UI check passes in both packages\u003c/td>\n\u003ctd>All eight discovery scenarios passed on both platforms, including stable scroll, order and focus; full CI passed after the macOS retry\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-02-source-order/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 02731e76dd798e8e87eb6ed08fa19520e5055033a4c2a5b78f2412a57c633f49\">CI checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits\">Limits\u003c/h2>\n\u003cp>The local check covers toggles on an existing list. Adding a new source may legitimately change alphabetical positions. No live scan, model inference or release publication was needed for this fix.\u003c/p>\n\u003cp>The first CI attempt passed on Windows. Its macOS app launched in 3437 ms, exceeding the existing 3000 ms smoke-test limit; later UI checks were consequently skipped. That \u003ca href=\"evidence/2026-11-02-source-order/ci-macos-attempt1.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3034a44a82b0e721a9e12cc8cb90ac28211592e59a55940325f121cb3333c7e5\">failed attempt\u003c/a> is retained. The macOS job passed when retried at the same revision with no code or timing-limit changes. The initial timing failure is not evidence of a source-order regression; it remains an observed startup-budget miss.\u003c/p>\n","backlinks":["features/discovery","verification/index"]},{"id":"verification/setup","title":"Verification setup","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Verification setup\nsection: Verification\nupdated: 2026-11-02\n---\n# Verification setup\n\nRun from the repository root. Node 22.19+ is required locally; CI uses Node 24. Install with `npm ci`. `npm run dev` starts Vite and the Electron app with backend rebuild/restart. Development data is in the separate `werk-dev` folder. Never point tests at that folder or the user's installed werk data.\n\n## Build and checks\n\n```sh\nnpm run check\nnpm test\nnpm run setup:latex\nnpm run package\nWERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" npm run smoke\n```\n\nThe smoke driver requires a packaged executable. It creates a fresh OS temporary `werk-smoke-*` data folder, injects `WERK_DATA_DIR`, and removes its own folder after quitting. Screenshots and JSON results remain in ignored `smoke-output/`. On Windows CI, cleanup is deferred until the uninstall-preservation assertion.\n\nM2 adds `tests/auth-smoke.ts` for the real SDK browser handoff/cancellation and `tests/profile-smoke.ts` for fictional PDF-to-profile generation. Run them with `node --experimental-strip-types` and `WERK_EXE` set. Profile smoke needs the `--test` build; it sets the simulated-inference environment and reads `tests/fixtures/ai.json`. Ordinary builds cannot enable simulated inference. CI keeps the production installer, then builds a separate unpacked test app for the fictional profile journey.\n\nFor development-only fixture injection, `npm run package -- --test` compiles a test build and `WERK_SMOKE_TEST_BUILD=1` enables the matching smoke fixture. Production builds ignore the injected release URL. Test builds are never release artifacts. `npm run package` returns to a production build.\n\n## Identity and evidence\n\n`git rev-parse HEAD` records the base revision. For an uncommitted build, `node scripts/fingerprint.mjs` emits a content manifest and aggregate SHA-256 for source, scripts, tests, package lock, CI and resources. Copy only sanitized evidence into the run's wiki evidence directory. Build/runtime output, credentials and user records stay outside the wiki.\n\nDiagnostics reports Electron, Chromium, Node, SQLite, schema and backend state. The smoke driver waits for the visible Inbox, then verifies FTS5 and backend readiness through Settings. A passing wiki build or unit test does not substitute for a packaged launch.\n\n## Windows CI\n\nThe Build workflow runs checks and packaging on macOS and Windows. Windows installs the per-user NSIS executable using `/S`, runs the smoke test against `%LOCALAPPDATA%\\Programs\\werk\\werk.exe`, then uninstalls and asserts the data folder remains. Downloadable artifacts last seven days. CI runs on pushes to main; only explicitly approved version tags create draft releases.\n\n## Wiki checks\n\n```sh\nnode ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n```\n\n## Discovery fixtures\n\n`tests/discovery.test.ts` exercises the real SQLite pipeline and `tests/parsers.test.ts` preserves relevant archived parser regressions. The packaged driver `tests/discovery-smoke.ts` uses the same `WERK_EXE` command as the profile driver, with a test build. It seeds fictional profile/source prerequisites and records HTTP responses in its temporary directory. HTTP fixtures are unavailable in production builds.\n\n`node --experimental-strip-types scripts/check-live-discovery.ts` performs exactly one bounded Remotive scan against a fictional profile, reports counts/database size, and removes its temporary data. Use only when a live check is authorized.\n\n`node --experimental-strip-types scripts/check-live-feeds.ts 'NoDesk · Engineering' 'MoAIJobs'` similarly checks only the named catalog feeds with fictional data and no inference. Each feed has a one-request limit. It reports parsed/full/empty-description/unknown-employer/kept counts in `smoke-output/source-feeds/live.json`, fails on an unsuccessful or unexpectedly empty read, and removes its database. The [source-expansion run](runs/2026-11-02-source-expansion.md) checked all thirteen added feeds. `tests/source-feeds.test.ts` covers their recorded shapes and old-catalog upgrades without network access.\n\nThe discovery driver also accepts `WERK_DEV_APP=1` when `WERK_EXE` points to Electron and the working directory contains an isolated development app. CI continues to use packaged apps. Do not use the live development data folder for either mode.\n\n## Documents, backups and accessibility\n\n`npm run setup:latex` downloads the pinned compiler and prepares/verifies its offline package cache. On Windows, install Go 1.24 and download the `latex-cache` CI artifact into `resources/runtime/cache` first. The cache is built once on macOS and tested on both OSes. Packaged apps contain the compiler/cache; development setup is separate.\n\n`tests/latex-sandbox.ts` executes the actual compiler against fictional content and forbidden reads/writes, shell escape and cancellation. Windows additionally runs `go test ./...` under `tools/texsandbox` for AppContainer network/file/process isolation and broker-death cleanup.\n\nWith the fixture package selected in `WERK_EXE`, run `tests/documents-smoke.ts`, `tests/backup-smoke.ts` and `tests/accessibility-smoke.ts` using `node --experimental-strip-types`. Document inference is simulated; the PDF compiler and backup operations are real. The accessibility driver uses axe WCAG A/AA checks in light/dark themes and explicit keyboard/focus assertions. It cannot audit Chromium's internal PDF viewer. Screenshot/JSON outputs are under matching `smoke-output/` subfolders. Test cleanup dismisses native unsaved-edit prompts in its own instance; normal close/quit behavior remains covered by the shell driver.\n\nProduction installers are retained before the separate fixture package replaces unpacked build output. Never release a fixture build. `scripts/licenses.mjs` emits bundled dependency notices during a normal build.\n\n## Factory reset\n\n`node --experimental-strip-types --test tests/reset.test.ts` verifies owned-path deletion and graceful shutdown. With `WERK_EXE` pointing to the fixture package, run `node --experimental-strip-types tests/reset-smoke.ts`. It creates and removes its own temporary app folder; never replace that folder with live user data. Native confirmation responses are stubbed, while actual IPC, backend shutdown, filesystem deletion and Electron storage cleanup execute. Evidence is in `smoke-output/reset/`.\n","toc":[{"id":"build-and-checks","title":"Build and checks","depth":2},{"id":"identity-and-evidence","title":"Identity and evidence","depth":2},{"id":"windows-ci","title":"Windows CI","depth":2},{"id":"wiki-checks","title":"Wiki checks","depth":2},{"id":"discovery-fixtures","title":"Discovery fixtures","depth":2},{"id":"documents-backups-and-accessibility","title":"Documents, backups and accessibility","depth":2},{"id":"factory-reset","title":"Factory reset","depth":2}],"titleAnchor":"verification-setup","links":["verification/runs/2026-11-02-source-expansion"],"attachments":[],"html":"\u003cp>Run from the repository root. Node 22.19+ is required locally; CI uses Node 24. Install with \u003ccode>npm ci\u003c/code>. \u003ccode>npm run dev\u003c/code> starts Vite and the Electron app with backend rebuild/restart. Development data is in the separate \u003ccode>werk-dev\u003c/code> folder. Never point tests at that folder or the user's installed werk data.\u003c/p>\n\u003ch2 id=\"build-and-checks\">Build and checks\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">npm run check\ dentials and user records stay outside the wiki.\u003c/p>\n\u003cp>Diagnostics reports Electron, Chromium, Node, SQLite, schema and backend state. The smoke driver waits for the visible Inbox, then verifies FTS5 and backend readiness through Settings. A passing wiki build or unit test does not substitute for a packaged launch.\u003c/p>\n\u003ch2 id=\"windows-ci\">Windows CI\u003c/h2>\n\u003cp>The Build workflow runs checks and packaging on macOS and Windows. Windows installs the per-user NSIS executable using \u003ccode>/S\u003c/code>, runs the smoke test against \u003ccode>%LOCALAPPDATA%\\Programs\\werk\\werk.exe\u003c/code>, then uninstalls and asserts the data folder remains. Downloadable artifacts last seven days. CI runs on pushes to main; only explicitly approved version tags create draft releases.\u003c/p>\n\u003ch2 id=\"wiki-checks\">Wiki checks\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">node ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"discovery-fixtures\">Discovery fixtures\u003c/h2>\n\u003cp>\u003ccode>tests/discovery.test.ts\u003c/code> exercises the real SQLite pipeline and \u003ccode>tests/parsers.test.ts\u003c/code> preserves relevant archived parser regressions. The packaged driver \u003ccode>tests/discovery-smoke.ts\u003c/code> uses the same \u003ccode>WERK_EXE\u003c/code> command as the profile driver, with a test build. It seeds fictional profile/source prerequisites and records HTTP responses in its temporary directory. HTTP fixtures are unavailable in production builds.\u003c/p>\n\u003cp>\u003ccode>node --experimental-strip-types scripts/check-live-discovery.ts\u003c/code> performs exactly one bounded Remotive scan against a fictional profile, reports counts/database size, and removes its temporary data. Use only when a live check is authorized.\u003c/p>\n\u003cp>\u003ccode>node --experimental-strip-types scripts/check-live-feeds.ts 'NoDesk · Engineering' 'MoAIJobs'\u003c/code> similarly checks only the named catalog feeds with fictional data and no inference. Each feed has a one-request limit. It reports parsed/full/empty-description/unknown-employer/kept counts in \u003ccode>smoke-output/source-feeds/live.json\u003c/code>, fails on an unsuccessful or unexpectedly empty read, and removes its database. The \u003ca href=\"#/verification/runs/2026-11-02-source-expansion\">source-expansion run\u003c/a> checked all thirteen added feeds. \u003ccode>tests/source-feeds.test.ts\u003c/code> covers their recorded shapes and old-catalog upgrades without network access.\u003c/p>\n\u003cp>The discovery driver also accepts \u003ccode>WERK_DEV_APP=1\u003c/code> when \u003ccode>WERK_EXE\u003c/code> points to Electron and the working directory contains an isolated development app. CI continues to use packaged apps. Do not use the live development data folder for either mode.\u003c/p>\n\u003ch2 id=\"documents-backups-and-accessibility\">Documents, backups and accessibility\u003c/h2>\n\u003cp>\u003ccode>npm run setup:latex\u003c/code> downloads the pinned compiler and prepares/verifies its offline package cache. On Windows, install Go 1.24 and download the \u003ccode>latex-cache\u003c/code> CI artifact into \u003ccode>resources/runtime/cache\u003c/code> first. The cache is built once on macOS and tested on both OSes. Packaged apps contain the compiler/cache; development setup is separate.\u003c/p>\n\u003cp>\u003ccode>tests/latex-sandbox.ts\u003c/code> executes the actual compiler against fictional content and forbidden reads/writes, shell escape and cancellation. Windows additionally runs \u003ccode>go test ./...\u003c/code> under \u003ccode>tools/texsandbox\u003c/code> for AppContainer network/file/process isolation and broker-death cleanup.\u003c/p>\n\u003cp>With the fixture package selected in \u003ccode>WERK_EXE\u003c/code>, run \u003ccode>tests/documents-smoke.ts\u003c/code>, \u003ccode>tests/backup-smoke.ts\u003c/code> and \u003ccode>tests/accessibility-smoke.ts\u003c/code> using \u003ccode>node --experimental-strip-types\u003c/code>. Document inference is simulated; the PDF compiler and backup operations are real. The accessibility driver uses axe WCAG A/AA checks in light/dark themes and explicit keyboard/focus assertions. It cannot audit Chromium's internal PDF viewer. Screenshot/JSON outputs are under matching \u003ccode>smoke-output/\u003c/code> subfolders. Test cleanup dismisses native unsaved-edit prompts in its own instance; normal close/quit behavior remains covered by the shell driver.\u003c/p>\n\u003cp>Production installers are retained before the separate fixture package replaces unpacked build output. Never release a fixture build. \u003ccode>scripts/licenses.mjs\u003c/code> emits bundled dependency notices during a normal build.\u003c/p>\n\u003ch2 id=\"factory-reset\">Factory reset\u003c/h2>\n\u003cp>\u003ccode>node --experimental-strip-types --test tests/reset.test.ts\u003c/code> verifies owned-path deletion and graceful shutdown. With \u003ccode>WERK_EXE\u003c/code> pointing to the fixture package, run \u003ccode>node --experimental-strip-types tests/reset-smoke.ts\u003c/code>. It creates and removes its own temporary app folder; never replace that folder with live user data. Native confirmation responses are stubbed, while actual IPC, backend shutdown, filesystem deletion and Electron storage cleanup execute. Evidence is in \u003ccode>smoke-output/reset/\u003c/code>.\u003c/p>\n","backlinks":["features/assistant","features/backups","features/desktop","features/discovery","features/documents","features/factory-reset","features/profile","verification/index","verification/runs/2026-11-01-m1-shell","verification/runs/2026-11-01-m2-profile","verification/runs/2026-11-01-m5-delivery","verification/runs/2026-11-02-source-order"]}],"sections":["Overview","Decisions","Discussions","Features","Journal","Verification"]}</script>
<script>(() => {
  'use strict';
  const {title:wikiTitle,pages,sections} = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(pages.map(p=>[p.id,p]));
  const $ = id => document.getElementById(id);
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  const colorInputs = document.querySelectorAll('input[name="color"]');
  function setColor(preference) {
    if (!['automatic', 'light', 'dark'].includes(preference)) preference = 'automatic';
    document.documentElement.dataset.colorPreference = preference;
    document.documentElement.dataset.theme = preference === 'automatic' ? (colorScheme.matches ? 'dark' : 'light') : preference;
    colorInputs.forEach(input => { input.checked = input.value === preference; });
  }
  setColor(document.documentElement.dataset.colorPreference);
  colorInputs.forEach(input => input.addEventListener('change', () => {
    setColor(input.value);
    try { localStorage.setItem('planning-wiki-color', input.value); } catch {}
  }));
  colorScheme.addEventListener('change', () => setColor(document.documentElement.dataset.colorPreference));
  window.addEventListener('storage', event => {
    if (event.key === 'planning-wiki-color' || event.key === null) setColor(event.newValue);
  });
  document.addEventListener('click', event => {
    if (!$('appearance').contains(event.target)) $('appearance').open = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('appearance').open) {
      $('appearance').open = false;
      $('appearance').querySelector('summary').focus();
    }
  });
  let current = null;
  const link = (label,href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; return a; };
  const route = id => '#/'+id.split('/').map(s=>encodeURIComponent(s).replace(/~/g,'%7E')).join('/');
  for (const section of sections) {
    const group=document.createElement('div');group.className='nav-group';
    const label=document.createElement('div');label.className='nav-group-label';label.textContent=section;group.append(label);
    pages.filter(p=>p.section===section).forEach(p=>{const a=link(p.id==='index'?'Main page':p.title,route(p.id));a.dataset.page=p.id;group.append(a);});
    $('navigation').append(group);
  }
  if (matchMedia('(max-width: 700px)').matches) $('navigation-details').open=false;
  function mode(source) {
    $('article-view').hidden=source;
    $('source-view').hidden=!source;
    $('read-tab').classList.toggle('selected',!source);
    $('source-tab').classList.toggle('selected',source);
    $('read-tab').setAttribute('aria-pressed',String(!source));
    $('source-tab').setAttribute('aria-pressed',String(source));
    $('contents').hidden=source || !current?.toc.length;
  }
  function markText(text,query) {
    const fragment=document.createDocumentFragment();
    const lower=text.toLowerCase(), needle=query.toLowerCase();
    let start=0, at;
    while (needle && (at=lower.indexOf(needle,start))!==-1) {
      fragment.append(document.createTextNode(text.slice(start,at)));
      const mark=document.createElement('mark');mark.textContent=text.slice(at,at+query.length);fragment.append(mark);start=at+query.length;
    }
    fragment.append(document.createTextNode(text.slice(start)));return fragment;
  }
  function search(query) {
    current=null;
    $('search').value=query;
    $('page-title').textContent='Search results';
    $('page-meta').hidden=true;document.querySelector('.toolbar').hidden=true;
    $('article-view').hidden=true;$('source-view').hidden=true;$('search-results').hidden=false;$('toc').replaceChildren();
    $('contents').hidden=true;
    const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
    const matches=terms.length?pages.filter(p=>terms.every(t=>(p.title+' '+p.source).toLowerCase().includes(t))).sort((a,b)=>Number(b.title.toLowerCase().includes(query.toLowerCase()))-Number(a.title.toLowerCase().includes(query.toLowerCase()))):[];
    $('result-count').textContent=terms.length?`${matches.length} ${matches.length===1?'article':'articles'} matching “${query}”${matches.length?'':'. Try fewer words or a broader term.'}`:'Enter a word or phrase to search all articles.';
    $('results').replaceChildren();
    for (const p of matches) {
      const card=document.createElement('div');card.className='result';
      const small=document.createElement('small');small.textContent=p.section;
      const h=document.createElement('h2'),a=link('',route(p.id));a.append(markText(p.title,query));h.append(a);
      const excerpt=document.createElement('p');
      const plain=p.source.replace(/^---\n[\s\S]*?\n---\n/,'').replace(/[#*`|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ');
      const position=plain.toLowerCase().indexOf(terms[0]);const start=Math.max(0,position-65);
      excerpt.append(markText((start?'…':'')+plain.slice(start,start+240)+(plain.length>start+240?'…':''),query));
      card.append(small,h,excerpt);$('results').append(card);
    }
    document.title='Search — '+wikiTitle;
  }
  function render() {
    const rawHash=location.hash.slice(1);
    document.querySelectorAll('[aria-current=page]').forEach(a=>a.removeAttribute('aria-current'));
    if(rawHash.startsWith('/search?')) {search(new URLSearchParams(rawHash.slice(8)).get('q')||'');window.scrollTo(0,0);return;}
    let id='index',anchor='';
    try {
      const parts=(rawHash.startsWith('/')?rawHash.slice(1):'index').split('~');
      id=decodeURIComponent(parts[0]);anchor=decodeURIComponent(parts[1]||'');
    } catch {id='__invalid_route__';}

    const p=byId.get(id||'index');
    $('search-results').hidden=true;document.querySelector('.toolbar').hidden=!p;$('page-meta').hidden=!p;
    current=p||null;mode(false);
    if(!p){
      $('page-title').textContent='Page not found';
      $('article').replaceChildren(link('Return to the main page',route('index')));$('toc').replaceChildren();$('backlinks').hidden=true;document.title='Page not found — '+wikiTitle;return;
    }
    $('search').value='';$('page-title').textContent=p.title;
    $('page-meta').innerHTML=p.metadataHtml;
    $('page-meta').hidden=!p.metadataHtml;
    $('article').innerHTML=p.html;
    $('source-text').textContent=p.source;$('source-path').textContent=p.id+'.md';
    $('toc').replaceChildren();
    p.toc.forEach(h=>{const a=link(h.title,route(p.id)+'~'+h.id);if(h.depth>2)a.className='nested';$('toc').append(a);});
    $('backlink-list').replaceChildren();$('backlinks').hidden=!p.backlinks.length;
    p.backlinks.forEach(id=>$('backlink-list').append(link(byId.get(id).title,route(id))));
    document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===p.id)a.setAttribute('aria-current','page');});
    document.title=p.id==='index'?wikiTitle:p.title+' — '+wikiTitle;
    if(anchor)requestAnimationFrame(()=>{if(anchor===p.titleAnchor)$('page-title').scrollIntoView();else document.getElementById(anchor)?.scrollIntoView();});else window.scrollTo(0,0);
  }
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const hash='/search?q='+encodeURIComponent($('search').value.trim());if(location.hash==='#'+hash)render();else location.hash=hash;});
  $('read-tab').addEventListener('click',()=>mode(false));$('source-tab').addEventListener('click',()=>mode(true));
  $('print').addEventListener('click',()=>{mode(false);window.print();});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const target=$('search-results').hidden?$('article'):$('main');target.focus();target.scrollIntoView();});
  $('download').addEventListener('click',()=>{
    if(!current)return;const url=URL.createObjectURL(new Blob([current.source],{type:'text/markdown;charset=utf-8'}));
    const a=link('',url);a.download=current.id.split('/').pop()+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}});
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')&&matchMedia('(max-width: 700px)').matches)$('navigation-details').open=false;});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
