ision: update \u003ccode>last_seen_at\u003c/code> and stop.\u003c/li>\n\u003cli>\u003cstrong>Assess:\u003c/strong> hidden company → fingerprint \u003ccode>hidden\u003c/code>. Matching (\u003ccode>assessJob\u003c/code>) → Stretch/Other → fingerprint. Eligibility (\u003ccode>assessEligibility\u003c/code>) → Incompatible → fingerprint. Criteria → explicit conflict with arrangement, location or overlap → fingerprint \u003ccode>criteria\u003c/code>. \u003cstrong>Unknown data never excludes a job\u003c/strong>: unresolved location, missing arrangement and unknown overlap pass.\u003c/li>\n\u003cli>\u003cstrong>Insert\u003c/strong> as \u003ccode>status = 'new'\u003c/code>, then run duplicate detection against jobs with the same \u003ccode>company_key\u003c/code> (port \u003ccode>duplicateReason\u003c/code>); set \u003ccode>duplicate_of\u003c/code> on the newer copy. Saved jobs are always the representative.\u003c/li>\n\u003c/ol>\n\u003cp>On every profile revision: reassess all \u003ccode>new\u003c/code> and \u003ccode>skipped\u003c/code> jobs in one transaction. Jobs that no longer qualify become fingerprints and are deleted. Saved and applied jobs are reassessed but never deleted.\u003c/p>\n\u003cp>Daily retention: delete \u003ccode>new\u003c/code>/\u003ccode>skipped\u003c/code> jobs whose \u003ccode>closed_at\u003c/code> is more than 30 days ago, and turn them into \u003ccode>expired\u003c/code> fingerprints. Delete fingerprints not seen for 180 days (Proposed). Run \u003ccode>PRAGMA optimize\u003c/code> afterwards.\u003c/p>\n\u003cp>Closure: a complete company-board (ATS) snapshot marks missing listings closed. Truncated discovery feeds never close jobs. Port the age-based staleness rules from legacy \u003ccode>core/listing-visibility.ts\u003c/code> and \u003ccode>core/job-quality.ts\u003c/code>.\u003c/p>\n\u003ch3 id=\"profile-document-proposed\">Profile document (Proposed)\u003c/h3>\n\u003cp>Port the legacy zod schema from \u003ccode>core/types.ts\u003c/code> (\u003ccode>profileSchema\u003c/code>: basics, experience with sourced bullets, projects, education, awards, sources, openItems, facts with \u003ccode>confirmed | preference | inferred\u003c/code> status and source IDs). Remove \u003ccode>presentation\u003c/code>. Add:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">criteria: {\n  targetRoles: string[];                 // free text, matched by the role-family rules\n  locations: Array&lt;{ kind: \"remote-from\" | \"country\" | \"city\"; value: string; relocation?: boolean }&gt;;\n  arrangements: Array&lt;\"remote\" | \"hybrid\" | \"onsite\"&gt;;\n  timezone: string;                      // IANA, e.g. \"Asia/Kuala_Lumpur\"\n  workingHours: { start: \"09:00\"; end: \"18:00\" };\n  minOverlapHours: number;               // 0–9\n  hiddenCompanies: string[];             // display names; matched by company_key\n}\n\u003c/code>\u003c/pre>\n\u003cp>Readiness (port \u003ccode>profileReadiness\u003c/code>): name, current location, target roles, useful background, and arrangement preference. Unknown citizenship or visa answers do not block. Discovery (manual and scheduled) requires readiness.\u003c/p>\n\u003cp>Every save writes a new \u003ccode>profile_versions\u003c/code> row. Direct edits use \u003ccode>changed_by = 'user'\u003c/code> and the summary names the edited section. Restore writes a new revision.\u003c/p>\n\u003cp>Overlap: for each resolved country, take its IANA zones (legacy \u003ccode>data/geography/zone1970.tab\u003c/code>) and their current offsets; overlap is \u003ccode>max(0, 9 − d)\u003c/code> hours for a 09:00–18:00 day, where \u003ccode>d\u003c/code> is the circular distance between the two offsets (\u003ccode>min(|a − b|, 24 − |a − b|)\u003c/code>). Generalize this for custom working hours. A country uses its best-overlapping zone. Store \u003ccode>overlap_hours\u003c/code> per job; recompute when the user's timezone or hours change, and once a day for daylight saving.\u003c/p>\n\u003ch2 id=\"legacy-code-to-port\">Legacy code to port\u003c/h2>\n\u003cp>Fetch files with \u003ccode>git show legacy:&lt;path&gt;\u003c/code>. Port with their tests (legacy \u003ccode>tests/\u003c/code>), keep behavior, adapt types to the new schema, and remove anything listed under Drop.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Legacy path\u003c/th>\n\u003cth>werk destination\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>core/matching.ts\u003c/code>, \u003ccode>core/eligibility.ts\u003c/code>, \u003ccode>core/job-quality.ts\u003c/code>, \u003ccode>core/listing-visibility.ts\u003c/code>, \u003ccode>core/deduplication.ts\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/matching/\u003c/code>\u003c/td>\n\u003ctd>Deterministic rules; keep \u003ccode>MATCH_VERSION\u003c/code>. Extend the matcher output with highlight spans (character ranges of matched and missing requirement clauses in the description) for the job detail.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/locations.ts\u003c/code>, \u003ccode>core/location-index.ts\u003c/code>, \u003ccode>core/location-regions.ts\u003c/code>, \u003ccode>core/timezones.ts\u003c/code>, \u003ccode>data/geography/*\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/geo/\u003c/code>, \u003ccode>resources/geography/\u003c/code>\u003c/td>\n\u003ctd>Country resolution and timezone data. Drop \u003ccode>core/timezone-range.ts\u003c/code> and the map. Keep the GeoNames and tzdb licenses.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/discovery.ts\u003c/code>, \u003ccode>core/connectors.ts\u003c/code>, \u003ccode>core/http.ts\u003c/code>, \u003ccode>core/source-catalog.ts\u003c/code>, \u003ccode>core/scan.ts\u003c/code>, \u003ccode>core/boards/*\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/sources/\u003c/code>\u003c/td>\n\u003ctd>Adapters, public-board parsers, detail queue, scheduler and limits. Drop the HTTP body cache (keep ETag/Last-Modified), X, HN, Web3.career and the VueJobs enrichment path.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/ai/pi.ts\u003c/code>, \u003ccode>core/ai/pi-sdk.ts\u003c/code>, \u003ccode>core/ai/pi-credentials.ts\u003c/code>, \u003ccode>server/ai-auth.ts\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/ai/\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>@earendil-works/pi-ai\u003c/code> 1.3.0: \u003ccode>models.login(\"openai\", \"oauth\", …)\u003c/code> with the \u003ccode>auth.openai.com\u003c/code> URL check and manual-code fallback; credentials under \u003ccode>&lt;data&gt;/pi-auth\u003c/code> with the auth lock; exact model \u003ccode>gpt-5.6-sol\u003c/code>, high reasoning. Keep the selective provider import so esbuild bundles only OpenAI.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/ai/generate.ts\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/letters/\u003c/code>\u003c/td>\n\u003ctd>Prompt, schema and validation (evidence IDs, numeric claims, 250–350 word target, 600-word ceiling). Change output to plain text: the greeting from the posting or \"Dear hiring team,\", 3–5 paragraphs, sign-off with the profile name.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/assistant/*\u003c/code> (actions, prompt, references, attachments, \u003ccode>extract-pdf.worker.mjs\u003c/code>)\u003c/td>\n\u003ctd>\u003ccode>src/backend/assistant/\u003c/code>\u003c/td>\n\u003ctd>Bounded actions only: search jobs, read supplied public URLs/README files, edit profile, edit the CV LaTeX, rewrite saved letters. Stage, validate and commit atomically with version checks; report actual saves and compile results. \u003ccode>pdfjs-dist\u003c/code> stays in the backend for PDF attachment text only.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/profile/facts.ts\u003c/code>, \u003ccode>core/profile/chat.ts\u003c/code> (readiness and welcome only), \u003ccode>core/profile/skills/build-user-profile/SKILL.md\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/profile/\u003c/code>\u003c/td>\n\u003ctd>The skill is the runtime prompt for profile conversations.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/latex/*\u003c/code> (compile, runtime, setup, store, \u003ccode>starter.tex\u003c/code>, \u003ccode>LICENSE-sb2nov.txt\u003c/code>), \u003ccode>scripts/setup-latex.ts\u003c/code>, \u003ccode>desktop/cmd/texsandbox\u003c/code>, \u003ccode>desktop/internal/texsandbox\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/cv/\u003c/code>, \u003ccode>scripts/setup-latex.mjs\u003c/code>\u003c/td>\n\u003ctd>Tectonic binary and offline package cache shipped as \u003ccode>extraResources\u003c/code>. Write a new TypeScript template that renders the profile into \u003ccode>starter.tex\u003c/code> macros with LaTeX escaping (generate from profile).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/backup/*\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/backup/\u003c/code> (M5)\u003c/td>\n\u003ctd>Rework for the new schema; keep scope and overwrite rules from the legacy \u003ccode>docs/wiki/features/backups.md\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>src/ui.css\u003c/code> tokens; behaviors of \u003ccode>src/AssistantPane.tsx\u003c/code>, \u003ccode>src/LatexCvPage.tsx\u003c/code>, \u003ccode>src/LocationFilter.tsx\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/renderer/\u003c/code>\u003c/td>\n\u003ctd>Reuse tokens (below) and interaction contracts; rewrite components.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Drop\u003c/strong>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>\u003ccode>core/x.ts\u003c/code>, \u003ccode>core/x-auth.ts\u003c/code>, \u003ccode>core/web3*.ts\u003c/code>, \u003ccode>core/vuejobs.ts\u003c/code>, Jev, \u003ccode>core/cv/*\u003c/code> (Handlebars/docx/Playwright exports), \u003ccode>core/cover-letter/template.ts\u003c/code> layout, \u003ccode>core/timezone-range.ts\u003c/code>, \u003ccode>server/\u003c/code>, \u003ccode>worker/\u003c/code>, \u003ccode>desktop/\u003c/code> (except texsandbox), \u003ccode>deploy/\u003c/code>, the Seen feature, all \u003ccode>scripts/verify-*\u003c/code> drivers.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"screens\">Screens\u003c/h2>\n\u003cp>Mockups use fictional data and the current tokens. Sources: \u003ccode>design/werk/*.html\u003c/code> (open in a browser; dark mode follows the OS). PNGs: \u003ccode>docs/wiki/attachments/werk-design/\u003c/code>. Copy rules (Decided, \u003ccode>rule-plain-ui\u003c/code>): no ornamental labels, captions or subtitles. Every string identifies content, explains a necessary state or supports an action. Use literal action labels.\u003c/p>\n\u003ch3 id=\"shell\">Shell\u003c/h3>\n\u003cp>220 px sidebar: macOS traffic lights inset (the window uses \u003ccode>titleBarStyle: \"hiddenInset\"\u003c/code>, lights at about x 14, y 15), then \u003cstrong>werk\u003c/strong>, then Inbox (new count), Saved (count), Profile, CV. At the bottom: the update notice when present, then Settings (with a dot when a source fails or ChatGPT needs sign-in). 44 px headers are drag regions; controls inside are \u003ccode>no-drag\u003c/code>. Windows uses the standard frame with \u003ccode>autoHideMenuBar: true\u003c/code>. Right side of every header: \u003cstrong>Open assistant\u003c/strong>.\u003c/p>\n\u003ch3 id=\"inbox-opening-screen\">Inbox (opening screen)\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/inbox.png\" alt=\"Inbox\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/werk-design/inbox-dark.png\" alt=\"Inbox, dark\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>New\u003c/strong>: \u003ccode>status = 'new'\u003c/code>, open, not a duplicate, best match first (\u003ccode>match_score\u003c/code>, then newest). \u003cstrong>All matches\u003c/strong>: every stored job except duplicates, searchable, any status.\u003c/li>\n\u003cli>Row: title (bold until opened), company · location summary, match level, age. Opening a row sets \u003ccode>opened_at\u003c/code>.\u003c/li>\n\u003cli>Detail: company, title, chips (match, remote eligibility, overlap, posted age, salary or \"Salary not listed\"), actions \u003cstrong>Save\u003c/strong> (S), \u003cstrong>Skip\u003c/strong> (X), \u003cstrong>Open posting ↗\u003c/strong> (O), \u003cstrong>Hide company\u003c/strong>. Then the decision summary (role, level, eligibility clause, gaps), \u003cstrong>Description\u003c/strong> / \u003cstrong>Notes\u003c/strong> tabs, highlight legend and highlighted description, then provenance (source, checked time, other listings).\u003c/li>\n\u003cli>Save: status \u003ccode>saved\u003c/code>, snapshot description, queue a cover letter (idempotent), select the next New job. Skip: status \u003ccode>skipped\u003c/code>, select the next job. Both are undoable from the job (\u003cstrong>Move back to New\u003c/strong>).\u003c/li>\n\u003cli>Hide company: add to \u003ccode>criteria.hiddenCompanies\u003c/code> (new profile revision); its New jobs become fingerprints; saved jobs stay.\u003c/li>\n\u003cli>Search (\u003ccode>/\u003c/code>): FTS5 over title, company, location and description, within the current tab. \u003cstrong>Filters\u003c/strong> (temporary, not persisted beyond the session): match level, arrangement, country, posted within.\u003c/li>\n\u003cli>Keyboard: J/K move, S save, X skip, O open posting, / search, Esc clears search or closes the assistant. Shortcuts are inactive while typing in a field.\u003c/li>\n\u003cli>Empty New: \"No new jobs.\" with the last scan time and \u003cstrong>Scan now\u003c/strong>. When a schedule is on (off by default, REB-schedule), show the next scan time instead.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"attachments/werk-design/inbox-empty.png\" alt=\"Inbox empty\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003ch3 id=\"setup-checklist\">Setup checklist\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/setup.png\" alt=\"Setup\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Shown in place of the Inbox until the first scan has completed. Steps: Connect ChatGPT → Build your profile (opens the assistant; attachments accepted) → Set search criteria → Choose sources (17 of 37 on by default, REB-default-sources) → Run the first scan (enabled when the profile is ready). Completed steps show their state.\u003c/p>\n\u003ch3 id=\"job-detail\">Job detail\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/job-detail.png\" alt=\"Job detail\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Highlights come from the matcher's spans; unmatched text has no highlight. If spans are unavailable (excerpt-only descriptions), show the summary and plain description, with \u003cstrong>Add full description\u003c/strong> (manual paste) for incomplete postings.\u003c/p>\n\u003ch3 id=\"saved-workspace\">Saved workspace\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/saved.png\" alt=\"Saved\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cul>\n\u003cli>List rows show the letter or task state: Writing letter…, Letter ready, Needs full description, Paused: reason (sign-in, allowance, error), Applied date.\u003c/li>\n\u003cli>Header: company, title, status selector (Saved / Applied; Applied records \u003ccode>applied_at\u003c/code>), \u003cstrong>Open posting ↗\u003c/strong>.\u003c/li>\n\u003cli>Left: posting (the saved snapshot) and Notes (autosave after typing pauses, with a \"Saved\" state).\u003c/li>\n\u003cli>Right: letter toolbar (version selector, \u003cstrong>Regenerate\u003c/strong>, \u003cstrong>Copy text\u003c/strong>, \u003cstrong>Save\u003c/strong>), a plain-text editor, word count and generation provenance, and review notes. Saving appends a version; restoring appends a restored version. No PDF.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"profile\">Profile\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/profile.png\" alt=\"Profile\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/werk-design/profile-criteria-edit.png\" alt=\"Editing search criteria\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Sections: Search criteria, Basics, Eligibility, Experience, Projects, Education, Skills, Missing. Each section has \u003cstrong>Edit\u003c/strong> (inline form, Save/Cancel) and shows status chips (Confirmed / Preference / Inferred) and source names. \u003cstrong>Previous versions\u003c/strong> lists revisions with summaries and \u003cstrong>Restore\u003c/strong>. \u003cstrong>Missing\u003c/strong> lists \u003ccode>openItems\u003c/code> with \u003cstrong>Ask assistant\u003c/strong>. The criteria editor includes the timezone overlap control and shows which countries match, using the same function the backend uses.\u003c/p>\n\u003ch3 id=\"cv\">CV\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/cv.png\" alt=\"CV\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Toolbar: version selector, \u003cstrong>Generate from profile\u003c/strong> (new version, never overwrites unsaved edits; warn when the profile is newer than the version's \u003ccode>profile_revision\u003c/code>), \u003cstrong>Recompile\u003c/strong>, \u003cstrong>Save\u003c/strong>. Left: CodeMirror 6 with a minimal LaTeX mode, \u003cstrong>Download .tex\u003c/strong>. Bottom: compile status and parsed diagnostics (port \u003ccode>parseLatexDiagnostics\u003c/code>). Right: built-in PDF viewer, \u003cstrong>Download PDF\u003c/strong>. Dirty-edit guard on navigation and quit.\u003c/p>\n\u003ch3 id=\"assistant-overlay\">Assistant overlay\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/assistant.png\" alt=\"Assistant\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Unchanged contract: 520 px panel fixed to the right, over the page without resizing it; opened from the header; Escape or the close button hides it and returns focus; conversation, scroll position and unsent text survive navigation; \u003cstrong>New chat\u003c/strong> clears the chat and its attachments. The line under the header names the context the assistant receives (current page, selected job or document). Messages show save receipts (record, version, compile result). Composer: Enter sends, Shift+Enter adds a newline, \u003cstrong>Stop\u003c/strong> while running, \u003cstrong>Attach files\u003c/strong> and pasted screenshots.\u003c/p>\n\u003ch3 id=\"settings\">Settings\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/settings-sources.png\" alt=\"Sources\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/werk-design/settings-ai.png\" alt=\"AI\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/werk-design/settings-diagnostics.png\" alt=\"Diagnostics with update notice\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Sections: General (appearance System/Light/Dark; scan schedule: Manual (default), Every 4 hours, Every 12 hours), Sources (table with jobs kept, saved, last scan, next scan, on/off, failure with \u003cstrong>Retry\u003c/strong>; \u003cstrong>Add source\u003c/strong> accepts a Greenhouse, Ashby or Lever board URL, an RSS/Atom URL, or a catalog entry), AI (connection, model, allowance state, queue; sign-in flow with browser and manual-code fallback; \u003cstrong>Sign out\u003c/strong>), Backup (export/import ZIP), Diagnostics.\u003c/p>\n\u003ch3 id=\"design-tokens\">Design tokens\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Token\u003c/th>\n\u003cth>Light\u003c/th>\n\u003cth>Dark\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>--bg\u003c/code> canvas\u003c/td>\n\u003ctd>\u003ccode>#fcfcfc\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#181818\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--panel\u003c/code> sidebar, secondary\u003c/td>\n\u003ctd>\u003ccode>#f3f3f3\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#222222\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--field\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#ffffff\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#181818\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--raised\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#ffffff\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#232323\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#242424\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#e7e7e7\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--muted\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#636363\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#a0a0a0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--line\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#14141412\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#ffffff0f\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--line-strong\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#14141425\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#ffffff20\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--focus\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#506f80\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#adbec8\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--selected\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#14141418\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#ffffff14\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--ok\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#36734c\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#94bda2\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--warn\u003c/code> (new)\u003c/td>\n\u003ctd>\u003ccode>#8a5a00\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#e0b25c\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--bad\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#a33632\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>#f49c92\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Typography: system font; 13 px base, 12 px controls and navigation, 11 px metadata, 14 px chat with 1.65 line height, 20 px document titles. Radii: 5 px controls, 6 px menus, dialogs and panels. Heights: 44 px headers, 36 px tabs, 28 px navigation rows, 26 px buttons. Shadows only on menus, dialogs and the assistant overlay. Visible focus rings. Respect reduced motion. System theme by default: CSS uses \u003ccode>prefers-color-scheme\u003c/code> plus \u003ccode>data-mode\u003c/code> for explicit choices; main sets \u003ccode>nativeTheme.themeSource\u003c/code> to match so native chrome follows.\u003c/p>\n\u003ch2 id=\"milestones\">Milestones\u003c/h2>\n\u003cp>Each milestone ends with a verification run in the new wiki (\u003ccode>docs/wiki/verification/runs/&lt;run-id&gt;.md\u003c/code>, checked with \u003ccode>node ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki\u003c/code>).\u003c/p>\n\u003ch3 id=\"m1-shell-backend-packaging-ci\">M1 — shell, backend, packaging, CI\u003c/h3>\n\u003cp>Scope: Electron app named werk; main, preload, backend utility process and RPC; migrations with \u003ccode>settings\u003c/code> and \u003ccode>events\u003c/code>; renderer shell with the four pages (empty states only: \"No jobs yet.\", \"No saved jobs.\", \"No profile yet.\", \"No CV yet.\") and Settings → General (appearance) and Diagnostics; update notice; unsigned installers; CI.\u003c/p>\n\u003cp>Acceptance:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>npm run check\u003c/code>, \u003ccode>npm test\u003c/code>, \u003ccode>npm run package\u003c/code> pass on macOS and Windows runners.\u003c/li>\n\u003cli>The packaged app starts on both platforms with a fresh \u003ccode>WERK_DATA_DIR\u003c/code>, shows the shell within 3 s, and Diagnostics reports SQLite with FTS5, schema 1 and a running backend (Playwright \u003ccode>_electron\u003c/code> smoke test).\u003c/li>\n\u003cli>Windows: the NSIS installer installs silently per user (\u003ccode>/S\u003c/code>), the installed \u003ccode>werk.exe\u003c/code> passes the same smoke test, and uninstall removes the app but not the data folder.\u003c/li>\n\u003cli>Killing the backend process restarts it and the UI reconnects; Diagnostics shows the restart count.\u003c/li>\n\u003cli>Second launch focuses the existing window; Quit exits all processes.\u003c/li>\n\u003cli>Closing the window leaves werk running (Dock on macOS, tray on Windows); reopening shows the same window and backend; \u003cstrong>Quit werk\u003c/strong> from the tray exits all processes.\u003c/li>\n\u003cli>The release check finds a newer fake release when pointed at a test URL (inject the URL with \u003ccode>WERK_RELEASES_URL\u003c/code> in tests only).\u003c/li>\n\u003cli>Installer sizes recorded in the verification run. Expected roughly 100–130 MB download (estimate, unmeasured).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"m2-ai-profile-assistant-setup\">M2 — AI, profile, assistant, setup\u003c/h3>\n\u003cp>ChatGPT sign-in and status; profile versions, fact sheet with inline editing, readiness, restore; criteria editor with overlap; assistant overlay with attachments and bounded profile actions; setup checklist (steps 1–3 functional, 4–5 shown disabled until M3). Accept: profile built entirely through the assistant from an attached CV PDF (with simulated inference in tests), direct edits versioned, restore works, sign-in errors and allowance limits shown without losing queued work.\u003c/p>\n\u003ch3 id=\"m3-sources-collection-inbox\">M3 — sources, collection, inbox\u003c/h3>\n\u003cp>Default catalog (17 on, 20 scraped boards off), Add source, scheduler (manual by default; optional 4 or 12 hour schedule) with limits and backoff, pipeline with gating and fingerprints, reassessment on profile change, retention job, inbox triage with keyboard, job detail with highlights, Hide company, search and filters, Settings → Sources with failure states. Accept: fixture-based adapter tests; a scan with fixture HTTP responses stores only qualifying jobs; profile change moves jobs between stored and fingerprinted; New triage by keyboard only; database stays small (record its size after a live bounded scan with a fictional profile).\u003c/p>\n\u003ch3 id=\"m4-saved-workspace-letters-cv\">M4 — saved workspace, letters, CV\u003c/h3>\n\u003cp>Save queues a letter; serialized generation with pause/retry; plain-text editor with versions, review notes, Copy text; Applied status; CV generation from the profile, LaTeX editor, sandboxed Tectonic compilation, PDF preview and downloads; assistant actions for letters and the CV. Accept: simulated generation end to end; a few real generations with a fictional profile; compile failure keeps the previous PDF and shows diagnostics; every attempt in \u003ca href=\"#/journal/2026-11-01-werk-handoff~tectonic-file-access\">Tectonic file access\u003c/a> fails inside the isolation on both platforms (an automated test per platform).\u003c/p>\n\u003ch3 id=\"m5-backups-polish-first-release\">M5 — backups, polish, first release\u003c/h3>\n\u003cp>ZIP export/import for werk data; Diagnostics complete; keyboard and focus audit; accessibility pass; app icon (\u003ca href=\"#/journal/2026-11-01-werk-handoff~app-icon\">below\u003c/a>); README install instructions (\u003ca href=\"#/journal/2026-11-01-werk-handoff~install-instructions-for-the-readme\">below\u003c/a>). Then, in order, each with the user's go-ahead: rename the repository (\u003ccode>gh repo rename werk\u003c/code>, then \u003ccode>git remote set-url origin https://github.com/rengwu/werk.git\u003c/code>); the user tests the Windows installer from CI on their PC; push the first tag. CI drafts the release and the user publishes it.\u003c/p>\n\u003ch2 id=\"build-packaging-and-release\">Build, packaging and release\u003c/h2>\n\u003ch3 id=\"versions-verified-available-pinned-at-least-two-weeks-old-on-1-november-2026\">Versions (Verified available; pinned at least two weeks old on 1 November 2026)\u003c/h3>\n\u003cp>\u003ccode>electron\u003c/code> 44.9.0, \u003ccode>electron-builder\u003c/code> 26.17.0, \u003ccode>vite\u003c/code> 8.3.4, \u003ccode>@vitejs/plugin-react\u003c/code> 6.1.2, \u003ccode>react\u003c/code>/\u003ccode>react-dom\u003c/code> 19.3.1, \u003ccode>@tanstack/react-query\u003c/code> 5.104.4, \u003ccode>typescript\u003c/code> 5.9.3 (avoid the 7.x native compiler for now), \u003ccode>esbuild\u003c/code> 0.28.2, \u003ccode>playwright-core\u003c/code> 1.64.1, \u003ccode>@types/node\u003c/code> 24.x (Electron 44 runs Node 24), \u003ccode>@types/react\u003c/code>/\u003ccode>@types/react-dom\u003c/code> 19.3.0, \u003ccode>@earendil-works/pi-ai\u003c/code> 1.3.0, \u003ccode>zod\u003c/code> 4.x, \u003ccode>pdfjs-dist\u003c/code> (backend PDF text), CodeMirror 6 packages, \u003ccode>@base-ui/react\u003c/code> 1.8.0 and \u003ccode>@phosphor-icons/react\u003c/code> 2.1.10 if needed. GitHub Actions: \u003ccode>actions/checkout@v7\u003c/code>, \u003ccode>actions/setup-node@v7\u003c/code>, \u003ccode>actions/upload-artifact@v7\u003c/code>, \u003ccode>actions/download-artifact@v8\u003c/code>, \u003ccode>actions/setup-go@v7\u003c/code> (v7.0.0, July 2026). Go 1.24 for the helper, as in legacy \u003ccode>desktop/go.mod\u003c/code>.\u003c/p>\n\u003cp>Local Node 22.19 runs \u003ccode>.ts\u003c/code> tests directly (type stripping, Verified) with SQLite 3.50.4 and FTS5. Use only erasable TypeScript syntax (\u003ccode>erasableSyntaxOnly\u003c/code>), \u003ccode>.ts\u003c/code> import extensions and \u003ccode>verbatimModuleSyntax\u003c/code>.\u003c/p>\n\u003cp>Put \u003cstrong>every\u003c/strong> package in \u003ccode>devDependencies\u003c/code>: main, preload, backend and renderer are all bundled, so electron-builder ships no \u003ccode>node_modules\u003c/code>.\u003c/p>\n\u003ch3 id=\"layout\">Layout\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">package.json            tsconfig.json          vite.config.ts (root: src/renderer, base: \"./\", outDir: ../../out/renderer)\nscripts/build.mjs       esbuild main/preload/backend → out/*.cjs (format cjs, platform node, target node24, external electron), then vite build\nscripts/dev.mjs         vite dev server + esbuild watch + Electron restart; sets WERK_RENDERER_URL\nscripts/setup-latex.mjs downloads Tectonic for the target platform and prepares the offline cache into resources/\ntools/texsandbox/       Windows sandbox helper: one Go `package main` (go.mod with golang.org/x/sys), built to resources/runtime/win/\nsrc/main/  src/preload/  src/backend/  src/renderer/  src/shared/\ntests/*.test.ts         node --test\ntests/smoke.ts          Playwright _electron against a packaged executable (WERK_EXE)\nresources/              icons, geography data, Tectonic and cache (extraResources)\ndesign/werk/            HTML mockups\n.github/workflows/build.yml\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"package-json-sketch-unverified\">package.json (sketch, Unverified)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"name\": \"werk\",\n  \"productName\": \"werk\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"description\": \"Local job discovery, fit assessment, cover letters and CV management.\",\n  \"author\": \"John Goh\",\n  \"license\": \"MIT\",\n  \"type\": \"module\",\n  \"main\": \"out/main.cjs\",\n  \"scripts\": {\n    \"dev\": \"node scripts/dev.mjs\",\n    \"build\": \"node scripts/build.mjs\",\n    \"check\": \"tsc --noEmit\",\n    \"test\": \"node --test tests/*.test.ts\",\n    \"package\": \"npm run build &amp;&amp; electron-builder --publish never\",\n    \"smoke\": \"node tests/smoke.ts\"\n  },\n  \"build\": {\n    \"appId\": \"io.github.rengwu.werk\",\n    \"productName\": \"werk\",\n    \"directories\": { \"output\": \"release\", \"buildResources\": \"resources\" },\n    \"files\": [\"out/**/*\"],\n    \"extraResources\": [{ \"from\": \"resources/runtime/${os}\", \"to\": \"runtime\" }, { \"from\": \"resources/geography\", \"to\": \"geography\" }],\n    \"mac\": { \"target\": [{ \"target\": \"dmg\", \"arch\": [\"arm64\"] }], \"category\": \"public.app-category.productivity\", \"identity\": \"-\" },\n    \"win\": { \"target\": [{ \"target\": \"nsis\", \"arch\": [\"x64\"] }] },\n    \"nsis\": { \"oneClick\": true, \"perMachine\": false, \"artifactName\": \"werk-${version}-setup.${ext}\" },\n    \"dmg\": { \"artifactName\": \"werk-${version}-arm64.${ext}\" }\n  }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>identity: \"-\"\u003c/code> asks for ad-hoc signing, which Apple Silicon requires to run at all; check with \u003ccode>codesign -dv\u003c/code> after packaging. Do not set \u003ccode>CSC_LINK\u003c/code>.\u003c/p>\n\u003ch3 id=\"app-icon\">App icon\u003c/h3>\n\u003cp>Decided (REB-icon): the light monogram with a green match dot. Reference: \u003ccode>design/werk/icon.svg\u003c/code> and the \u003ca href=\"attachments/werk-design/icon.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72fc4de3816f5e817ec9fc9af4e7e5d44a4321413e97d6e527843678de4d57ec\">preview\u003c/a>.\u003c/p>\n\u003cp>\u003cimg src=\"attachments/werk-design/icon.png\" alt=\"Icon at Dock, 32 px and 16 px sizes\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Until M5 the default Electron icon is fine. For M5:\u003c/p>\n\u003cul>\n\u003cli>Redraw the \"w\" as outlines from an OFL font such as Inter SemiBold, or draw it by hand. Do not rasterize the system font: SF Pro's license does not allow use in an app icon, and Segoe UI may not be redistributed.\u003c/li>\n\u003cli>Save the final vector as \u003ccode>resources/icon.svg\u003c/code> and export \u003ccode>resources/icon.png\u003c/code> at 1024 × 1024. electron-builder generates the \u003ccode>.icns\u003c/code> and \u003ccode>.ico\u003c/code> from it. Check the 16 px Windows rendering.\u003c/li>\n\u003cli>Windows tray: \u003ccode>resources/tray.png\u003c/code> and \u003ccode>tray@2x.png\u003c/code> (16 and 32 px) from the same drawing, shipped with an \u003ccode>extraResources\u003c/code> entry.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ci-workflow-sketch-unverified\">CI workflow (sketch, Unverified)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-yaml\">name: Build\non:\n  push:\n    branches: [main]\n    tags: [\"v*\"]\npermissions:\n  contents: read\njobs:\n  build:\n    strategy:\n      fail-fast: false\n      matrix:\n        os: [macos-latest, windows-latest]\n    runs-on: ${{ matrix.os }}\n    env:\n      CSC_IDENTITY_AUTO_DISCOVERY: \"false\"\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-node@v7\n        with: { node-version: 24, cache: npm }\n      - run: npm ci\n      - run: npm run check\n      - run: npm test\n      - uses: actions/setup-go@v7\n        if: runner.os == 'Windows'\n        with: { go-version-file: tools/texsandbox/go.mod, cache-dependency-path: tools/texsandbox/go.sum }\n      - name: Build and test the LaTeX sandbox helper\n        if: runner.os == 'Windows'\n        working-directory: tools/texsandbox\n        run: |\n          go test ./...\n          go build -trimpath -o ../../resources/runtime/win/texsandbox.exe .\n      - run: node scripts/setup-latex.mjs\n      - run: npm run package\n      - name: Install on Windows\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          $setup = Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1\n          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait\n          \"WERK_EXE=$env:LOCALAPPDATA\\Programs\\werk\\werk.exe\" | Out-File -Append $env:GITHUB_ENV\n      - name: Locate app on macOS\n        if: runner.os == 'macOS'\n        run: echo \"WERK_EXE=$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" &gt;&gt; \"$GITHUB_ENV\"\n      - run: npm run smoke\n      - uses: actions/upload-artifact@v7\n        if: always()\n        with:\n          name: werk-${{ runner.os }}\n          path: |\n            release/*.dmg\n            release/*-setup.exe\n            smoke-output/\n          retention-days: 7\n  release:\n    if: startsWith(github.ref, 'refs/tags/v')\n    needs: build\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/download-artifact@v8\n        with: { path: dist }\n      - env: { GH_TOKEN: \"${{ github.token }}\" }\n        run: |\n          gh release create \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\" --draft --title \"werk $GITHUB_REF_NAME\" --notes \"\" dist/*/*.dmg dist/*/*-setup.exe\n\u003c/code>\u003c/pre>\n\u003cp>Release process: bump \u003ccode>version\u003c/code> in \u003ccode>package.json\u003c/code>, commit, tag \u003ccode>vX.Y.Z\u003c/code>, push the tag (only when the user asks). CI drafts the release; the user reviews and publishes it, which makes the in-app notice appear for older versions.\u003c/p>\n\u003ch3 id=\"install-instructions-for-the-readme\">Install instructions for the README\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>macOS:\u003c/strong> open the \u003ccode>.dmg\u003c/code>, drag werk to Applications. The first open is blocked because the app is unsigned: open System Settings → Privacy &amp; Security and click \u003cstrong>Open Anyway\u003c/strong> for werk. If macOS says the app is damaged, run \u003ccode>xattr -dr com.apple.quarantine /Applications/werk.app\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Windows:\u003c/strong> run \u003ccode>werk-X.Y.Z-setup.exe\u003c/code>. If SmartScreen shows \"Windows protected your PC\", click \u003cstrong>More info → Run anyway\u003c/strong>. werk installs for the current user and opens.\u003c/li>\n\u003cli>\u003cstrong>Updates:\u003c/strong> werk shows a notice when a newer release exists; download and install it the same way. Your data stays in the data folder.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"code-sketches-unverified\">Code sketches (Unverified)\u003c/h3>\n\u003cp>Main process essentials:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">import { app, BrowserWindow, Menu, MessageChannelMain, Tray, ipcMain, nativeTheme, shell, utilityProcess, type UtilityProcess } from \"electron\";\nimport { join } from \"node:path\";\n\nif (process.env.WERK_DATA_DIR) app.setPath(\"userData\", process.env.WERK_DATA_DIR);\nelse if (!app.isPackaged) app.setPath(\"userData\", join(app.getPath(\"appData\"), \"werk-dev\"));\nif (!app.requestSingleInstanceLock()) app.exit(0);\n\nlet backend: UtilityProcess | null = null;\nlet win: BrowserWindow | null = null;\nlet quitting = false;\nconst restarts: number[] = [];\n\nfunction startBackend(previousExit?: string) {\n  const child = utilityProcess.fork(join(__dirname, \"backend.cjs\"), [], { serviceName: \"werk-backend\" });\n  child.once(\"spawn\", () =&gt; {\n    child.postMessage({ type: \"init\", dataDir: app.getPath(\"userData\"), version: app.getVersion(),\n      system: `${process.platform} ${process.getSystemVersion()} ${process.arch}`, previousExit });\n    if (win) connect();\n  });\n  child.once(\"exit\", (code) =&gt; {\n    backend = null;\n    if (quitting) return app.quit();\n    const now = Date.now();\n    restarts.push(now);\n    if (restarts.filter((t) =&gt; now - t &lt; 60_000).length &gt; 3) return win?.webContents.send(\"werk:backend-failed\");\n    setTimeout(() =&gt; startBackend(`Backend exited with code ${code}`), 1000);\n  });\n  backend = child;\n}\n\nfunction connect() {\n  if (!backend || !win) return;\n  const { port1, port2 } = new MessageChannelMain();\n  backend.postMessage({ type: \"connect\" }, [port1]);\n  win.webContents.postMessage(\"werk:backend-port\", null, [port2]);\n}\n\nfunction openExternal(url: string) {\n  if (/^https?:\\/\\//i.test(url)) void shell.openExternal(url);\n}\n\nfunction createWindow() {\n  win = new BrowserWindow({\n    width: 1280, height: 820, minWidth: 900, minHeight: 600, show: false, title: \"werk\",\n    backgroundColor: nativeTheme.shouldUseDarkColors ? \"#181818\" : \"#fcfcfc\",\n    titleBarStyle: process.platform === \"darwin\" ? \"hiddenInset\" : \"default\",\n    trafficLightPosition: { x: 14, y: 15 }, autoHideMenuBar: true,\n    webPreferences: { preload: join(__dirname, \"preload.cjs\"), sandbox: true, contextIsolation: true, plugins: true },\n  });\n  win.once(\"ready-to-show\", () =&gt; win?.show());\n  win.webContents.setWindowOpenHandler(({ url }) =&gt; (openExternal(url), { action: \"deny\" }));\n  win.webContents.on(\"will-navigate\", (event, url) =&gt; { event.preventDefault(); openExternal(url); });\n  win.on(\"closed\", () =&gt; (win = null));\n  const dev = process.env.WERK_RENDERER_URL;\n  void (dev ? win.loadURL(dev) : win.loadFile(join(__dirname, \"renderer/index.html\")));\n}\n\nipcMain.on(\"werk:connect\", connect);\nipcMain.on(\"werk:theme\", (_e, mode: \"system\" | \"light\" | \"dark\") =&gt; (nativeTheme.themeSource = mode));\napp.on(\"second-instance\", () =&gt; { if (win) { if (win.isMinimized()) win.restore(); win.focus(); } else createWindow(); });\napp.on(\"activate\", () =&gt; { if (!win) createWindow(); });\napp.on(\"window-all-closed\", () =&gt; {});    // keep running until Quit (REB-tray)\nlet tray: Tray | null = null;\nfunction createTray() {                    // Windows only\n  tray = new Tray(join(process.resourcesPath, \"tray.png\"));\n  tray.setToolTip(\"werk\");\n  tray.on(\"click\", () =&gt; (win ? win.show() : createWindow()));\n  tray.setContextMenu(Menu.buildFromTemplate([\n    { label: \"Open werk\", click: () =&gt; (win ? win.show() : createWindow()) },\n    { label: \"Quit werk\", click: () =&gt; app.quit() },\n  ]));\n}\napp.on(\"before-quit\", (event) =&gt; {\n  if (!backend || quitting) return;\n  quitting = true;\n  event.preventDefault();\n  backend.postMessage({ type: \"shutdown\" });\n  setTimeout(() =&gt; backend?.kill(), 3000);\n});\nvoid app.whenReady().then(() =&gt; { startBackend(); createWindow(); if (process.platform === \"win32\") createTray(); });\n\u003c/code>\u003c/pre>\n\u003cp>Note: in \u003ccode>will-navigate\u003c/code>, allow the dev server's hot reload if it navigates; otherwise all navigation is blocked.\u003c/p>\n\u003cp>Preload:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">import { contextBridge, ipcRenderer } from \"electron\";\nipcRenderer.on(\"werk:backend-port\", (event) =&gt; window.postMessage(\"werk:backend-port\", \"*\", event.ports));\ncontextBridge.exposeInMainWorld(\"werk\", {\n  platform: process.platform,\n  connect: () =&gt; ipcRenderer.send(\"werk:connect\"),\n  setTheme: (mode: string) =&gt; ipcRenderer.send(\"werk:theme\", mode),\n});\n\u003c/code>\u003c/pre>\n\u003cp>Backend entry:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">import type { MessagePortMain } from \"electron\";\nlet ports = new Set&lt;MessagePortMain&gt;();\nprocess.parentPort.on(\"message\", ({ data, ports: transferred }) =&gt; {\n  if (data.type === \"init\") init(data);                 // open DB, migrate, log previousExit, start scheduler\n  else if (data.type === \"connect\") attach(transferred[0]);\n  else if (data.type === \"shutdown\") { db.close(); process.exit(0); }\n});\nfunction attach(port: MessagePortMain) {\n  ports.add(port);\n  port.on(\"message\", async ({ data: { id, method, params } }) =&gt; {\n    try { port.postMessage({ id, result: await handlers[method](params) }); }\n    catch (error) { log(\"error\", \"rpc\", `${method}: ${String(error)}`); port.postMessage({ id, error: { message: \"Request failed.\" } }); }\n  });\n  port.on(\"close\", () =&gt; ports.delete(port));\n  port.start();\n}\nexport const emit = (event: string, data?: unknown) =&gt; { for (const port of ports) port.postMessage({ event, data }); };\n\u003c/code>\u003c/pre>\n\u003cp>Renderer client: keep one \u003ccode>MessagePort\u003c/code>; queue calls until connected; on a new port, reject pending calls and invalidate all queries; \u003ccode>call()\u003c/code> returns a promise keyed by \u003ccode>id\u003c/code>; \u003ccode>on(event, fn)\u003c/code> subscribes to pushes.\u003c/p>\n\u003ch2 id=\"verification\">Verification\u003c/h2>\n\u003cul>\n\u003cli>Unit tests (\u003ccode>node --test\u003c/code>): migrations on a temp database; FTS5 sync triggers; pipeline gating, fingerprints and reassessment with fixtures; matching, eligibility, deduplication, locations and overlap (port legacy tests); update version comparison; diagnostics redaction; letter validation.\u003c/li>\n\u003cli>Smoke test (\u003ccode>tests/smoke.ts\u003c/code>): launch \u003ccode>WERK_EXE\u003c/code> with a temp \u003ccode>WERK_DATA_DIR\u003c/code>; wait for the shell; open Settings → Diagnostics; assert FTS5, schema version and backend running; screenshot to \u003ccode>smoke-output/\u003c/code>; quit; relaunch to check persistence. Later milestones extend it with simulated inference (\u003ccode>WERK_FAKE_AI=1\u003c/code>, test builds only).\u003c/li>\n\u003cli>Never use the user's real data folder or profile in tests. Live checks are allowed (REB-live-checks) and kept small: a few real generations per milestone in the development build, and bounded read-only scans within each source's limits. Use a fictional profile. Record each live check in the verification run. Real inference needs a ChatGPT sign-in in the development data folder, which only the user can complete: start the sign-in in M2 and ask the user to finish it in the browser.\u003c/li>\n\u003cli>Evidence in the wiki uses fictional data only.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"wiki-structure\">Wiki structure\u003c/h2>\n\u003cp>The wiki restarted on 1 November with the home page, decision register, open questions, journal and design attachments. Add the rest when a milestone needs it:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">docs/wiki/\n  _build.mjs                     copied from ../jstack/skills/wiki/assets\n  index.md                       werk wiki home (exists)\n  decisions/index.md             decision register (exists)\n  discussions/open-questions.md  (exists)\n  journal/2026-11-01-*.md        rebuild plan, transcripts, this handoff (exist)\n  attachments/werk-design/       design PNGs (exist)\n  features/index.md, features/&lt;feature&gt;.md   FEAT-* records per milestone (feature-map skill)\n  verification/setup.md, verification/index.md, verification/runs/&lt;run-id&gt;.md\n  evidence/&lt;run-id&gt;/             fictional screenshots and result JSON\n\u003c/code>\u003c/pre>\n\u003cp>As features are built, move their specification from this handoff into feature pages and link back; this page then stays as the dated record.\u003c/p>\n\u003cp>Build and check after every documentation change: \u003ccode>node docs/wiki/_build.mjs &amp;&amp; node docs/wiki/_build.mjs --check\u003c/code>. Never edit the generated \u003ccode>index.html\u003c/code>.\u003c/p>\n\u003ch2 id=\"questions-resolved-before-handoff\">Questions resolved before handoff\u003c/h2>\n\u003cp>The nine open questions from the first draft of this page were answered in \u003ca href=\"#/journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e\">round 3\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f\">round 4\u003c/a> and \u003ca href=\"#/journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7\">round 5\u003c/a>. Later questions are in \u003ca href=\"#/discussions/open-questions\">Open questions\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Question\u003c/th>\n\u003cth>Answer\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Old app removal\u003c/td>\n\u003ctd>Deleted on 1 November (REB-retire).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pushing\u003c/td>\n\u003ctd>Push \u003ccode>main\u003c/code> and \u003ccode>legacy\u003c/code> without asking (REB-github). Work directly on \u003ccode>main\u003c/code> (REB-branch).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows close behavior\u003c/td>\n\u003ctd>System tray (REB-tray).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LaTeX isolation on Windows\u003c/td>\n\u003ctd>OS sandbox on both platforms; the legacy Go AppContainer helper on Windows (REB-latex-isolation).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Repository name\u003c/td>\n\u003ctd>Rename to \u003ccode>werk\u003c/code> at the first release (REB-rename).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>App icon\u003c/td>\n\u003ctd>Light monogram with match dot (REB-icon).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Default sources\u003c/td>\n\u003ctd>17 APIs and feeds on; 20 scraped boards off (REB-default-sources).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scan schedule default\u003c/td>\n\u003ctd>Manual (REB-schedule).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Slopchan discussion\u003c/td>\n\u003ctd>Dropped; the wiki holds all documentation (REB-docs).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The draft \u003ccode>AGENTS.md\u003c/code> that was Appendix A is now the repository's \u003ccode>AGENTS.md\u003c/code>.\u003c/p>\n\u003ch2 id=\"default-source-catalog\">Default source catalog\u003c/h2>\n\u003cp>Decided groups: keep sources that produced saves, company boards, structured feeds/APIs and scraped public boards; drop Hacker News, X and boards that never returned a job. Decided defaults for new users (REB-default-sources): the 8 aggregator APIs and 9 RSS feeds on; the 20 public boards available but off; company boards added by the user (the old catalog's company entries were the previous user's choices).\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Group\u003c/th>\n\u003cth>Sources (legacy adapter)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aggregator APIs (on)\u003c/td>\n\u003ctd>Himalayas (\u003ccode>himalayas\u003c/code>), Remote OK (\u003ccode>remoteok\u003c/code>), Remotive (\u003ccode>remotive\u003c/code>), 4 Day Week (\u003ccode>fourdayweek\u003c/code>), Arbeitnow Germany and UK (\u003ccode>arbeitnow\u003c/code>), Jobicy (\u003ccode>jobicy\u003c/code>), Working Nomads (\u003ccode>workingnomads\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RSS feeds (on)\u003c/td>\n\u003ctd>VueJobs, RemoteJobs.com, We Work Remotely Programming/Design/Product, GolangProjects, LaraJobs, ClojureJobboard, WordPress Jobs (\u003ccode>rss\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Public boards (off; \u003ccode>core/boards/catalog.ts\u003c/code> parsers)\u003c/td>\n\u003ctd>Japan Dev, TokyoDev, TryRemote, Dynamite Jobs, Hiredly, LinkedIn public jobs, Wellfound, Built In, Y Combinator jobs, Cake, Arc, Get on Board, Remote.com Jobs, No Fluff Jobs, Remote Game Jobs, Jobspresso, Wantedly, Relocate.me, JobStreet / SEEK, Glints\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Company boards (user-added)\u003c/td>\n\u003ctd>Greenhouse, Ashby and Lever boards by URL or slug. The previous catalog included Anthropic, Cognition, LangChain, Supabase, Figma, Notion, Cursor, Replit, Vercel, Linear and Sourcegraph; offer them as suggestions only if the user wants.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dropped\u003c/td>\n\u003ctd>Hacker News Who's Hiring, Hacker News YC jobs, X search, Indeed, Careerjet, Jooble, Adzuna, Tech in Asia, Welcome to the Jungle / Otta, NodeFlair, Tech Jobs for Good, Foorilla, Web3.career\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Keep the legacy per-source limits: at most six scans per source per day, per-scan request caps, conditional requests, rate-limit backoff, resumable pagination, provider cooldowns (Himalayas daily, Remotive four per day). Scraped boards break when sites change: a parser failure marks the source failed with the HTTP status or parse error and never deletes jobs.\u003c/p>\n","backlinks":["index","decisions/index","features/assistant","features/desktop","features/index","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7","journal/2026-11-01-rebuild"]},{"id":"verification/index","title":"Verification","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Verification\nsection: Verification\nupdated: 2026-11-01\n---\n# Verification\n\n- [Setup and commands](setup.md)\n- [M1 desktop shell](runs/2026-11-01-m1-shell.md)\n- [M2 profile and assistant](runs/2026-11-01-m2-profile.md)\n","toc":[],"titleAnchor":"verification","links":["verification/setup","verification/runs/2026-11-01-m1-shell","verification/runs/2026-11-01-m2-profile"],"attachments":[],"html":"\u003cul>\n\u003cli>\u003ca href=\"#/verification/setup\">Setup and commands\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m1-shell\">M1 desktop shell\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m2-profile\">M2 profile and assistant\u003c/a>\u003c/li>\n\u003c/ul>\n","backlinks":["index"]},{"id":"verification/runs/2026-11-01-m1-shell","title":"M1 desktop shell verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: M1 desktop shell verification\nsection: Verification\nupdated: 2026-11-01\nresult: Passed\n---\n# M1 desktop shell verification\n\nScope: [FEAT-desktop](../../features/desktop.md), the first rebuild milestone. Selected scenarios cover the process boundary, persistence, recovery, theme, packaging and installation. No candidate data or credentials were used.\n\n## Build and environment\n\n- Base revision: `c7cf09f4ea0cbd70edca1a91a0ffd8a904716959`, dirty implementation tree.\n- Content fingerprint: `22a2b716fe27006b1ae7e3058719e503b6cc626d1ce6c0ee5b9e70e5ddc28685`; [source manifest](../../evidence/2026-11-01-m1-shell/source-manifest.json).\n- macOS 27.0.0 arm64, Electron 44.9.1, Chromium 152.0.7977.167, Node 24.22.0, SQLite 3.53.4. Test runner Node 22.19.0.\n- Fresh temporary `WERK_DATA_DIR` per run. Test package built with `npm run package -- --test`; loopback fake release response enabled only in that build. No external inference or discovery calls.\n- Ad-hoc signature verified with `codesign -dv`. DMG: 129,303,591 bytes (123.31 MiB). A normal production rebuild passed the same smoke paths (636 ms startup). Windows NSIS installer: 120,699,737 bytes (115.11 MiB).\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Type checks and backend tests | Valid API, input rejection, migrations, persistence, safe release URL | `npm run check` and two tests passed | Passed | [Driver and setup](../setup.md) |\n| Packaged launch | Shell within 3 s | 639 ms on the final patched Electron build | Passed | [Results](../../evidence/2026-11-01-m1-shell/results.json) |\n| Utility-process SQLite | Schema 1, FTS5, running backend; no renderer Node access | All assertions passed | Passed | [Diagnostics](../../evidence/2026-11-01-m1-shell/diagnostics-dark.png) |\n| Recovery | Reconnect once; stop after fourth rapid crash; manual recovery | Kill/reconnect, bounded retries and Restart passed | Passed | [Results](../../evidence/2026-11-01-m1-shell/results.json) |\n| Theme | Light/dark work and persist across quit | Native selection and renderer state persisted | Passed | [Light](../../evidence/2026-11-01-m1-shell/settings-light.png), [dark](../../evidence/2026-11-01-m1-shell/diagnostics-dark.png) |\n| Window lifecycle | Close hides; second launch reopens existing window | One window retained; second process exited | Passed | [Results](../../evidence/2026-11-01-m1-shell/results.json) |\n| Update notice | New stable release produces trusted Download URL | Local fixture v9.0.0 produced the expected GitHub link | Passed | [Results](../../evidence/2026-11-01-m1-shell/results.json) |\n| Windows install, launch and uninstall | NSIS install, same smoke checks, data retained on uninstall | Installed Windows 11 x64 app launched in 614 ms; smoke and data-preserving uninstall passed | Passed | [Windows results](../../evidence/2026-11-01-m1-shell/windows-results.json), [CI record](../../evidence/2026-11-01-m1-shell/ci.json) |\n\n## Limits and follow-up\n\nPassed for the selected scope. CI tested committed revision `0d0d9714d46d94f4c6a303cd2c6541be3fbabda8`; both platform jobs succeeded in [run 41275835811](https://github.com/rengwu/ununemploy/actions/runs/41275835811). Native Dock/tray clicks are outside this automated run; close/reopen uses native Electron APIs and a second OS process. M5 includes the accessibility/focus review and the user checks Windows before release.\n\nThe handoff's Electron 44.9.0 and initial Zod 4.6.5 pins had published high-severity fixes. Implementation uses the minimal patched versions 44.9.1 and 4.6.6: [Electron advisory](https://github.com/advisories/GHSA-jr5w-w6x2-84p9), [Zod advisory](https://github.com/advisories/GHSA-mrhx-c7xc-m3w5). Fifteen moderate audit entries remain in the build-only electron-builder dependency tree; the package contains no node_modules. Reassess build tooling before release without downgrading to npm audit's suggested obsolete major version.\n\nThe remote had legacy commits newer than the local archive point. Merge `c7cf09f` preserved that public history as an ancestor while retaining the explicitly approved clean werk tree. The archive remains at `e493246`. No force push was used.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"m1-desktop-shell-verification","links":["features/desktop","verification/setup"],"attachments":[{"path":"evidence/2026-11-01-m1-shell/source-manifest.json","sha256":"16f019fcb1dfe61eb626dfc68caae703d91c593993dc8826e67721f41651c976"},{"path":"evidence/2026-1 \u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Theme\u003c/td>\n\u003ctd>Light/dark work and persist across quit\u003c/td>\n\u003ctd>Native selection and renderer state persisted\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m1-shell/settings-light.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: bc7edeeea397e580dedb2bebe28d901a55d09ea8bd6951fd1eb02d7ac5264062\">Light\u003c/a>, \u003ca href=\"evidence/2026-11-01-m1-shell/diagnostics-dark.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ea7b94845bc17d590ab8fe01a54dcc0f1d0208fc003be72e972d62330bc1c5f7\">dark\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Window lifecycle\u003c/td>\n\u003ctd>Close hides; second launch reopens existing window\u003c/td>\n\u003ctd>One window retained; second process exited\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m1-shell/results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 70e04cc3202d38464fc01170853bb55c50642c3ae40fc1dd4e3bba209e3903c2\">Results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Update notice\u003c/td>\n\u003ctd>New stable release produces trusted Download URL\u003c/td>\n\u003ctd>Local fixture v9.0.0 produced the expected GitHub link\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m1-shell/results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 70e04cc3202d38464fc01170853bb55c50642c3ae40fc1dd4e3bba209e3903c2\">Results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows install, launch and uninstall\u003c/td>\n\u003ctd>NSIS install, same smoke checks, data retained on uninstall\u003c/td>\n\u003ctd>Installed Windows 11 x64 app launched in 614 ms; smoke and data-preserving uninstall passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m1-shell/windows-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 94e8d2a338a70b1985ab370070f85f10ee83dc2980731eda334978f02c2242d9\">Windows results\u003c/a>, \u003ca href=\"evidence/2026-11-01-m1-shell/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a32f1dda2f0b68a6f7c33af69ada5f3ca70292d5e6a9ff1778511e1e3dc990cd\">CI record\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>Passed for the selected scope. CI tested committed revision \u003ccode>0d0d9714d46d94f4c6a303cd2c6541be3fbabda8\u003c/code>; both platform jobs succeeded in \u003ca href=\"https://github.com/rengwu/ununemploy/actions/runs/41275835811\" rel=\"noreferrer\">run 41275835811\u003c/a>. Native Dock/tray clicks are outside this automated run; close/reopen uses native Electron APIs and a second OS process. M5 includes the accessibility/focus review and the user checks Windows before release.\u003c/p>\n\u003cp>The handoff's Electron 44.9.0 and initial Zod 4.6.5 pins had published high-severity fixes. Implementation uses the minimal patched versions 44.9.1 and 4.6.6: \u003ca href=\"https://github.com/advisories/GHSA-jr5w-w6x2-84p9\" rel=\"noreferrer\">Electron advisory\u003c/a>, \u003ca href=\"https://github.com/advisories/GHSA-mrhx-c7xc-m3w5\" rel=\"noreferrer\">Zod advisory\u003c/a>. Fifteen moderate audit entries remain in the build-only electron-builder dependency tree; the package contains no node_modules. Reassess build tooling before release without downgrading to npm audit's suggested obsolete major version.\u003c/p>\n\u003cp>The remote had legacy commits newer than the local archive point. Merge \u003ccode>c7cf09f\u003c/code> preserved that public history as an ancestor while retaining the explicitly approved clean werk tree. The archive remains at \u003ccode>e493246\u003c/code>. No force push was used.\u003c/p>\n","backlinks":["features/desktop","verification/index"]},{"id":"verification/runs/2026-11-01-m2-profile","title":"M2 profile and assistant verification","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: M2 profile and assistant verification\nsection: Verification\nupdated: 2026-11-01\nresult: Untested\n---\n# M2 profile and assistant verification\n\nScope: [FEAT-profile](../../features/profile.md) and [FEAT-assistant](../../features/assistant.md), plus desktop recovery regression. Tests use Alex Example and temporary isolated app data. No candidate data or old credentials were imported.\n\n## Build and environment\n\n- Base `c17b515d559711e1db3882b4cd2414fe2d36378c`, dirty implementation tree; fingerprint `3cd44c11920b27a36960399c1d059401109d30e766df482258cf7db20749f339` ([manifest](../../evidence/2026-11-01-m2-profile/source-manifest.json)).\n- macOS arm64, Electron 44.9.1 / Node 24.22.0 / SQLite 3.53.4, schema 2. Unit tests run in Node 22.19.\n- `npm run check`; nine `npm test` cases; `npm run build -- --test`; `electron-builder --dir --publish never`; packaged profile, OAuth and shell drivers. Earlier installer build also completed; CI rebuilds the final installer.\n- Simulated inference is compiled only into test builds, then selected by `WERK_FAKE_AI=1`. PDF extraction, UI, RPC, profile validation, SQLite and queue are real. Test fixtures are local; no external job scan occurred.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Type and domain checks | Evidence and version validation; private credentials; serialized queue | Type check and nine tests passed | Passed | [Recipes](../setup.md) |\n| PDF-to-profile journey | Read attached PDF, save supported facts, reach readiness | Actual PDF text was extracted; model fixture edits produced revision 1 and a save receipt | Passed | [Results](../../evidence/2026-11-01-m2-profile/results.json), [profile](../../evidence/2026-11-01-m2-profile/profile.png) |\n| Direct edit and restore | Append versions without overwriting history | Name form saved revision 2; restoring revision 1 created revision 3 | Passed | [Results](../../evidence/2026-11-01-m2-profile/results.json) |\n| Overlay and dirty state | 520 px, no page resize, persistent draft, Escape/focus, cancel navigation | Geometry and focus assertions passed; draft survived navigation; dirty navigation was cancelled | Passed | [Results](../../evidence/2026-11-01-m2-profile/results.json) |\n| Allowance pause | Preserve conversation and facts with retry/stop controls | Simulated allowance error paused the task; earlier facts and conversation remained | Passed | [Paused assistant](../../evidence/2026-11-01-m2-profile/assistant-paused.png) |\n| Packaged real OAuth handoff | SDK produces verified OpenAI URL and cancels cleanly | Destination, state and PKCE assertions passed; no credentials entered | Passed | [OAuth result](../../evidence/2026-11-01-m2-profile/oauth.json) |\n| Desktop regression | Fresh launch, schema 2, FTS5, theme, reconnect and bounded retries | Packaged shell driver passed; 711 ms startup | Passed | [Shared driver](../setup.md) |\n| Windows M2 packaged journey | Install/launch plus profile and OAuth checks | Awaiting this milestone's CI push | Untested | [Workflow](../setup.md#windows-ci) |\n| Real subscription inference | One fictional profile generation through development build | Browser sign-in started; waiting for the user to complete authentication | Untested | Local-only auth state, no credentials copied |\n\n## Findings and limits\n\nAn assistant message CSS class initially collided with the overlay's class and covered the composer. The overlay now has its own class; the complete journey passed after the fix. Two driver selectors were corrected to target controls/status rather than exact text that included child buttons.\n\nThe real OAuth handoff exposed pi-ai's bundler-opaque Node loader. `scripts/openai-oauth.mjs` ports the legacy package-time fix and bundles only the SDK's selected OpenAI OAuth module. Authentication and refresh logic remain upstream. This is now exercised independently of simulated inference.\n\nOverall Untested while Windows and the user-completed live check remain outstanding. No real profile facts, credentials or auth URLs are in this report. Full accessibility and native quit guards are audited in M5.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"findings-and-limits","title":"Findings and limits","depth":2}],"titleAnchor":"m2-profile-and-assistant-verification","links":["features/profile","features/assistant","verification/setup","verification/setup","verification/setup"],"attachments":[{"path":"evidence/2026-11-01-m2-profile/source-manifest.json","sha256":"234b672a76390d99b768c02c6815e99ef230301832211ab06e82fae5bfb9dea9"},{"path":"evidence/2026-11-01-m2-profile/results.json","sha256":"9d63aca23a8a961a45d3c70649ac1f22f73b0cd242c0fa2a09c935be3e5539c9"},{"path":"evidence/2026-11-01-m2-profile/profile.png","sha256":"8c2f65a9d344f868c1df1f20c864541a9a4083d435274bdcb8af50b038cf6548"},{"path":"evidence/2026-11-01-m2-profile/assistant-paused.png","sha256":"f69aaf84ade63be8baf4c7e7d1ca2cf021a7b3ba23bbd178bd3f20bac0832508"},{"path":"evidence/2026-11-01-m2-profile/oauth.json","sha256":"6c8751bcd72eaf0d809ca02c090bc2b141d568085533f431c9f6c25c5cf3a13d"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/profile\">FEAT-profile\u003c/a> and \u003ca href=\"#/features/assistant\">FEAT-assistant\u003c/a>, plus desktop recovery regression. Tests use Alex Example and temporary isolated app data. No candidate data or old credentials were imported.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cul>\n\u003cli>Base \u003ccode>c17b515d559711e1db3882b4cd2414fe2d36378c\u003c/code>, dirty implementation tree; fingerprint \u003ccode>3cd44c11920b27a36960399c1d059401109d30e766df482258cf7db20749f339\ /2026-11-01-m2-profile/oauth.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6c8751bcd72eaf0d809ca02c090bc2b141d568085533f431c9f6c25c5cf3a13d\">OAuth result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Desktop regression\u003c/td>\n\u003ctd>Fresh launch, schema 2, FTS5, theme, reconnect and bounded retries\u003c/td>\n\u003ctd>Packaged shell driver passed; 711 ms startup\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/setup\">Shared driver\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows M2 packaged journey\u003c/td>\n\u003ctd>Install/launch plus profile and OAuth checks\u003c/td>\n\u003ctd>Awaiting this milestone's CI push\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/setup~windows-ci\">Workflow\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Real subscription inference\u003c/td>\n\u003ctd>One fictional profile generation through development build\u003c/td>\n\u003ctd>Browser sign-in started; waiting for the user to complete authentication\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>Local-only auth state, no credentials copied\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"findings-and-limits\">Findings and limits\u003c/h2>\n\u003cp>An assistant message CSS class initially collided with the overlay's class and covered the composer. The overlay now has its own class; the complete journey passed after the fix. Two driver selectors were corrected to target controls/status rather than exact text that included child buttons.\u003c/p>\n\u003cp>The real OAuth handoff exposed pi-ai's bundler-opaque Node loader. \u003ccode>scripts/openai-oauth.mjs\u003c/code> ports the legacy package-time fix and bundles only the SDK's selected OpenAI OAuth module. Authentication and refresh logic remain upstream. This is now exercised independently of simulated inference.\u003c/p>\n\u003cp>Overall Untested while Windows and the user-completed live check remain outstanding. No real profile facts, credentials or auth URLs are in this report. Full accessibility and native quit guards are audited in M5.\u003c/p>\n","backlinks":["features/assistant","features/profile","verification/index"]},{"id":"verification/setup","title":"Verification setup","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Verification setup\nsection: Verification\nupdated: 2026-11-01\n---\n# Verification setup\n\nRun from the repository root. Node 22.19+ is required locally; CI uses Node 24. Install with `npm ci`. `npm run dev` starts Vite and the Electron app with backend rebuild/restart. Development data is in the separate `werk-dev` folder. Never point tests at that folder or the user's installed werk data.\n\n## Build and checks\n\n```sh\nnpm run check\nnpm test\nnpm run package\nWERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" npm run smoke\n```\n\nThe smoke driver requires a packaged executable. It creates a fresh OS temporary `werk-smoke-*` data folder, injects `WERK_DATA_DIR`, and removes its own folder after quitting. Screenshots and JSON results remain in ignored `smoke-output/`. On Windows CI, cleanup is deferred until the uninstall-preservation assertion.\n\nM2 adds `tests/auth-smoke.ts` for the real SDK browser handoff/cancellation and `tests/profile-smoke.ts` for fictional PDF-to-profile generation. Run them with `node --experimental-strip-types` and `WERK_EXE` set. Profile smoke needs the `--test` build; it sets the simulated-inference environment and reads `tests/fixtures/ai.json`. Ordinary builds cannot enable simulated inference. CI keeps the production installer, then builds a separate unpacked test app for the fictional profile journey.\n\nFor development-only fixture injection, `npm run package -- --test` compiles a test build and `WERK_SMOKE_TEST_BUILD=1` enables the matching smoke fixture. Production builds ignore the injected release URL. Test builds are never release artifacts. `npm run package` returns to a production build.\n\n## Identity and evidence\n\n`git rev-parse HEAD` records the base revision. For an uncommitted build, `node scripts/fingerprint.mjs` emits a content manifest and aggregate SHA-256 for source, scripts, tests, package lock, CI and resources. Copy only sanitized evidence into the run's wiki evidence directory. Build/runtime output, credentials and user records stay outside the wiki.\n\nDiagnostics reports Electron, Chromium, Node, SQLite, schema and backend state. The smoke driver waits for the visible Inbox, then verifies FTS5 and backend readiness through Settings. A passing wiki build or unit test does not substitute for a packaged launch.\n\n## Windows CI\n\nThe Build workflow runs checks and packaging on macOS and Windows. Windows installs the per-user NSIS executable using `/S`, runs the smoke test against `%LOCALAPPDATA%\\Programs\\werk\\werk.exe`, then uninstalls and asserts the data folder remains. Downloadable artifacts last seven days. CI runs on pushes to main; only explicitly approved version tags create draft releases.\n\n## Wiki checks\n\n```sh\nnode ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n```\n","toc":[{"id":"build-and-checks","title":"Build and checks","depth":2},{"id":"identity-and-evidence","title":"Identity and evidence","depth":2},{"id":"windows-ci","title":"Windows CI","depth":2},{"id":"wiki-checks","title":"Wiki checks","depth":2}],"titleAnchor":"verification-setup","links":[],"attachments":[],"html":"\u003cp>Run from the repository root. Node 22.19+ is required locally; CI uses Node 24. Install with \u003ccode>npm ci\u003c/code>. \u003ccode>npm run dev\u003c/code> starts Vite and the Electron app with backend rebuild/restart. Development data is in the separate \u003ccode>werk-dev\u003c/code> folder. Never point tests at that folder o
