" rel=\"noreferrer\" title=\"SHA-256: 461a8dd194a6b33bb024eca09db7739349171ef9b6231244e18abb3d4ef5ff9f\">Compiler results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Live letter\u003c/td>\n\u003ctd>Fixed model/high reasoning generates a supported fictional letter\u003c/td>\n\u003ctd>One generation succeeded in 20.5 s; 230 words produced the expected soft length review note\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m4-documents/live.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 06f452a38c3dcb507842502082a92592df6f6b60a5da84726be539db5b2fe537\">Live result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows AppContainer and installed workspace\u003c/td>\n\u003ctd>Actual file/network/process boundaries and same UI journey\u003c/td>\n\u003ctd>Passed in the final build at \u003ccode>5c258cd75290c5ed1d0fda101c745e4e28a58108\u003c/code>, including AppContainer boundary tests and the corrected editor synchronization\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/rengwu/ununemploy/actions/runs/41283633752\" rel=\"noreferrer\">CI run\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"findings-and-limits\">Findings and limits\u003c/h2>\n\u003cp>UI verification found that Chromium clipboard permissions blocked Copy text. The action now uses a validated native clipboard IPC handler. The driver captures its output in the isolated app process without replacing the user's clipboard. The macOS packaging step tried to sign a TeX font-metric cache file as executable code; excluding only the data cache from individual code signing fixed packaging while the compiler binary and app bundle remain signed ad hoc.\u003c/p>\n\u003cp>The restore driver initially observed the previous successful compile before the new restore completed. It now waits for the new version before asserting compilation. Cache preparation was expanded to include the actual starter's font/macro combinations. No private candidate data or credentials are included. Windows compilation passed in the first M4 run; its UI artifact exposed a saved-source/editor synchronization error. The final build fixes it and the complete Windows journey now passes. See the \u003ca href=\"#/verification/runs/2026-11-01-m5-delivery\">M5 report\u003c/a> for the final source identity and CI evidence.\u003c/p>\n","backlinks":["features/documents","verification/index"]},{"id":"verification/runs/2026-11-01-m5-delivery","title":"M5 backups and delivery verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: M5 backups and delivery verification\nsection: Verification\nupdated: 2026-11-01\nresult: Passed\n---\n# M5 backups and delivery verification\n\nScope: [FEAT-backups](../../features/backups.md), [desktop polish](../../features/desktop.md#final-rebuild-polish), final packaged regression checks and release preparation. Repository rename, the user's Windows-PC trial, tagging and publication are separately gated by the working agreement.\n\n## Build and environment\n\nFinal tested revision `5c258cd75290c5ed1d0fda101c745e4e28a58108`, confirmed by the [CI run](https://github.com/rengwu/werk/actions/runs/41283633752) and [sanitized job results](../../evidence/2026-11-01-m5-delivery/ci.json). The [source manifest](../../evidence/2026-11-01-m5-delivery/source-manifest.json) records the same source before that commit. macOS arm64, Electron 44.9.1, SQLite schema 6. Every automated check uses temporary fictional data. The actual development profile, conversation and credentials are preserved.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Types and domain tests | Backup/reference validation and existing functionality | Typecheck and all 37 tests passed | Passed | [Setup](../setup.md) |\n| Backup round trip and rollback | Latest records only; settings/auth preserved; failures make no partial replacement | Validated archives, Unicode, mismatched PDF exclusion, stale editors, injected rollback, reopen and live-source refresh passed | Passed | `tests/backup.test.ts` |\n| Backup UI | Native export; invalid ZIP recovery; replacement and reload confirmation | Packaged journeys passed on macOS and Windows | Passed | [UI result](../../evidence/2026-11-01-m5-delivery/backup.json), [screenshot](../../evidence/2026-11-01-m5-delivery/backup.png) |\n| Accessibility and keyboard | No automated WCAG A/AA violations in both themes; tabs and overlay focus work | 20 state audits returned zero violations; keyboard assertions passed | Passed | [Audit](../../evidence/2026-11-01-m5-delivery/accessibility.json), [dark UI](../../evidence/2026-11-01-m5-delivery/settings-dark.png) |\n| Icon | Original vector and recognizable small rendering | 1024 px application and 16/32 px tray exports visually inspected | Passed | [App icon](../../evidence/2026-11-01-m5-delivery/icon.png), [16 px tray](../../evidence/2026-11-01-m5-delivery/tray.png) |\n| Final macOS package | Production install, restart/quit and document/backup workflows | Production package, startup, backend crash recovery, close/reopen, theme persistence, OAuth cancellation and all fixture journeys passed | Passed | [Setup](../setup.md) |\n| Final Windows package | Install/uninstall, compiler isolation and same workflows | Installed production app, uninstall/data preservation, AppContainer probes, pi tools, discovery, documents, backup and accessibility passed | Passed | [CI results](../../evidence/2026-11-01-m5-delivery/ci.json) |\n\n## Findings and limits\n\nThe backup UI initially restored records successfully but could not reload because all renderer navigation was blocked. Main now permits a same-URL reload while keeping external navigation in the system browser. The accessibility audit found count/name mismatches, invalid list/tab children and insufficient CodeMirror syntax contrast; these were corrected. Tabs now implement arrow/Home/End navigation. Axe leaves some covered/ambiguous elements for manual review; it does not audit Chromium PDF viewer internals or certify screen-reader compatibility.\n\nThe macOS compiler read policy now denies file data by default and allows only its isolated work/cache, compiler binary and required system runtime/fonts. A startup probe identified a required read of the root directory itself; only that literal directory was added, not its children. Runtime isolation checks include a read outside the home/temp trees. Compilation never falls back outside the OS sandbox.\n\nThe earlier M4 Windows artifact exposed a CV editor synchronization race: a stale query could reset the editor after Save and leave it dirty while the saved version compiled. Version synchronization now ignores older responses and programmatic CodeMirror updates do not feed back as user edits. The document driver asserts the failed source remains visible. Fixture cleanup had waited on a native unsaved-edit prompt; cleanup now handles that prompt, and the shell driver has an explicit timeout so failures produce evidence. The corrected build passed the complete CI suite on both platforms. The local production DMG is 177,370,340 bytes (169.2 MiB); its SHA-256 and local observations are in [local results](../../evidence/2026-11-01-m5-delivery/local-results.json). At the time of that suite, manual Windows-PC release testing, repository rename, version tags and publication had not happened.\n\n## Repository rename follow-up\n\nOn 1 November, the user approved “Rename to werk” in form `4c80f066d56e10b85177046aafd941cd`. At source revision `c4e282ee1aaa6f758d72287ddcf03b52d1c30d81`, the repository was renamed to `rengwu/werk` and the local origin updated to `git@github.com:rengwu/werk.git`. GitHub returned the same repository ID before and after, the existing `main` and `legacy` heads, and the retained `v0.2.0-beta.7` prerelease. The unchanged release-check function was run against the new repository: `/releases/latest` returned 404 because no stable release exists, and werk reported `current`. These checks passed; [sanitized observations](../../evidence/2026-11-01-m5-delivery/repository-rename.json) also identify the downloaded Windows installer. The user subsequently confirmed the Windows build and setup work, then approved the first tag; see the [Windows trial and release preflight](2026-11-01-release-preflight.md) and [v0.1.0 delivery](2026-11-01-v0.1.0-draft.md). Publication belongs to the user.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"findings-and-limits","title":"Findings and limits","depth":2},{"id":"repository-rename-follow-up","title":"Repository rename follow-up","depth":2}],"titleAnchor":"m5-backups-and-delivery-verification","links":["features/backups","features/desktop","verification/setup","verification/setup","verification/runs/2026-11-01-release-preflight","verification/runs/2026-11-01-v0.1.0-draft"],"attachments":[{"path":"evidence/2026-11-01-m5-delivery/ci.json","sha256":"e035a148c4a0c5d42d0ab7d6cbe9168187448646f5c9941685392da8b748d007"},{"path":"evidence/2026-11-01-m5-delivery/source-manifest.json","sha256":"1d79a8d66f2df3ab8f67316576be0b41ef84779e356bc178fe017c1c59f39fba"},{"path":"evidence/2026-11-01-m5-delivery/backup.json","sha256":"d115b3d96095678e523ac1cd0d1c0349ea7b705a7ef44b0216ddc456ab74372c"},{"path":"evidence/2026-11-01-m5-delivery/backup.png","sha256":"9dc14278f607027494d9eb6b7f9e83aba4fc9ed8b6c88ca1b3eebfd2d7eb5c49"},{"path":"evidence/2026-11-01-m5-delivery/accessibility.json","sha256":"a460f05f5abfd6cee5472dbaa22520ce164fdc112db46e47b03453f5fb9f4092"},{"path":"evidence/2026-11-01-m5-delivery/settings-dark.png","sha256":"e1db83376a72238d6ef55d1925529b4e5d242d9584b6bbdc918de940680d225b"},{"path":"evidence/2026-11-01-m5-delivery/icon.png","sha256":"ca54c17646a81fd716a69524828adaa74b4c5b8c9ddc091fc333dcf5bb696fe7"},{"path":"evidence/2026-11-01-m5-delivery/tray.png","sha256":"8555d281c218c3a4981c34b4403b704834cfb4d7b4a705b55d8a89e818865c11"},{"path":"evidence/2026-11-01-m5-delivery/local-results.json","sha256":"21ec9b8faed91698fd318d73e19dc9fd2fbd7ec98a6d238e66a85ad8471f3bac"},{"path":"evidence/2026-11-01-m5-delivery/repository-rename.json","sha256":"2ff3c10756a4856c5d22a2683b8b818805ebafd89a6dbc2e34cc91cd447648f2"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/backups\">FEAT-backups\u003c/a>, \u003ca href=\"#/features/desktop~final-rebuild-polish\">desktop polish\u003c/a>, final packaged regression checks and release preparation. Repository rename, the user's Windows-PC trial, tagging and publication are separately gated by the working agreement.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Final tested revision \u003ccode>5c258cd75290c5ed1d0fda101c745e4e28a58108\u003c/code>, confirmed by the \u003ca href=\"https://github.com/rengwu/werk/actions/runs/41283633752\" rel=\"noreferrer\">CI run\u003c/a> and \u003ca href=\"evidence/2026-11-01-m5-delivery/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e035a148c4a0c5d42d0ab7d6cbe9168187448646f5c9941685392da8b748d007\">sanitized job results\u003c/a>. The \u003ca href=\"evidence/2026-11-01-m5-delivery/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1d79a8d66f2df3ab8f67316576be0b41ef84779e356bc178fe017c1c59f39fba\">source manifest\u003c/a> records the same source before that commit. macOS arm64, Electron 44.9.1, SQLite schema 6. Every automated check uses temporary fictional data. The actual development profile, conversation and credentials are preserved.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Types and domain tests\u003c/td>\n\u003ctd>Backup/reference validation and existing functionality\u003c/td>\n\u003ctd>Typecheck and all 37 tests passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/setup\">Setup\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Backup round trip and rollback\u003c/td>\n\u003ctd>Latest records only; settings/auth preserved; failures make no partial replacement\u003c/td>\n\u003ctd>Validated archives, Unicode, mismatched PDF exclusion, stale editors, injected rollback, reopen and live-source refresh passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ccode>tests/backup.test.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Backup UI\u003c/td>\n\u003ctd>Native export; invalid ZIP recovery; replacement and reload confirmation\u003c/td>\n\u003ctd>Packaged journeys passed on macOS and Windows\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m5-delivery/backup.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d115b3d96095678e523ac1cd0d1c0349ea7b705a7ef44b0216ddc456ab74372c\">UI result\u003c/a>, \u003ca href=\"evidence/2026-11-01-m5-delivery/backup.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9dc14278f607027494d9eb6b7f9e83aba4fc9ed8b6c88ca1b3eebfd2d7eb5c49\">screenshot\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Accessibility and keyboard\u003c/td>\n\u003ctd>No automated WCAG A/AA violations in both themes; tabs and overlay focus work\u003c/td>\n\u003ctd>20 state audits returned zero violations; keyboard assertions passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m5-delivery/accessibility.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a460f05f5abfd6cee5472dbaa22520ce164fdc112db46e47b03453f5fb9f4092\">Audit\u003c/a>, \u003ca href=\"evidence/2026-11-01-m5-delivery/settings-dark.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e1db83376a72238d6ef55d1925529b4e5d242d9584b6bbdc918de940680d225b\">dark UI\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Icon\u003c/td>\n\u003ctd>Original vector and recognizable small rendering\u003c/td>\n\u003ctd>1024 px application and 16/32 px tray exports visually inspected\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m5-delivery/icon.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ca54c17646a81fd716a69524828adaa74b4c5b8c9ddc091fc333dcf5bb696fe7\">App icon\u003c/a>, \u003ca href=\"evidence/2026-11-01-m5-delivery/tray.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8555d281c218c3a4981c34b4403b704834cfb4d7b4a705b55d8a89e818865c11\">16 px tray\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Final macOS package\u003c/td>\n\u003ctd>Production install, restart/quit and document/backup workflows\u003c/td>\n\u003ctd>Production package, startup, backend crash recovery, close/reopen, theme persistence, OAuth cancellation and all fixture journeys passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/setup\">Setup\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Final Windows package\u003c/td>\n\u003ctd>Install/uninstall, compiler isolation and same workflows\u003c/td>\n\u003ctd>Installed production app, uninstall/data preservation, AppContainer probes, pi tools, discovery, documents, backup and accessibility passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-m5-delivery/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e035a148c4a0c5d42d0ab7d6cbe9168187448646f5c9941685392da8b748d007\">CI results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"findings-and-limits\">Findings and limits\u003c/h2>\n\u003cp>The backup UI initially restored records successfully but could not reload because all renderer navigation was blocked. Main now permits a same-URL reload while keeping external navigation in the system browser. The accessibility audit found count/name mismatches, invalid list/tab children and insufficient CodeMirror syntax contrast; these were corrected. Tabs now implement arrow/Home/End navigation. Axe leaves some covered/ambiguous elements for manual review; it does not audit Chromium PDF viewer internals or certify screen-reader compatibility.\u003c/p>\n\u003cp>The macOS compiler read policy now denies file data by default and allows only its isolated work/cache, compiler binary and required system runtime/fonts. A startup probe identified a required read of the root directory itself; only that literal directory was added, not its children. Runtime isolation checks include a read outside the home/temp trees. Compilation never falls back outside the OS sandbox.\u003c/p>\n\u003cp>The earlier M4 Windows artifact exposed a CV editor synchronization race: a stale query could reset the editor after Save and leave it dirty while the saved version compiled. Version synchronization now ignores older responses and programmatic CodeMirror updates do not feed back as user edits. The document driver asserts the failed source remains visible. Fixture cleanup had waited on a native unsaved-edit prompt; cleanup now handles that prompt, and the shell driver has an explicit timeout so failures produce evidence. The corrected build passed the complete CI suite on both platforms. The local production DMG is 177,370,340 bytes (169.2 MiB); its SHA-256 and local observations are in \u003ca href=\"evidence/2026-11-01-m5-delivery/local-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 21ec9b8faed91698fd318d73e19dc9fd2fbd7ec98a6d238e66a85ad8471f3bac\">local results\u003c/a>. At the time of that suite, manual Windows-PC release testing, repository rename, version tags and publication had not happened.\u003c/p>\n\u003ch2 id=\"repository-rename-follow-up\">Repository rename follow-up\u003c/h2>\n\u003cp>On 1 November, the user approved “Rename to werk” in form \u003ccode>4c80f066d56e10b85177046aafd941cd\u003c/code>. At source revision \u003ccode>c4e282ee1aaa6f758d72287ddcf03b52d1c30d81\u003c/code>, the repository was renamed to \u003ccode>rengwu/werk\u003c/code> and the local origin updated to \u003ccode>git@github.com:rengwu/werk.git\u003c/code>. GitHub returned the same repository ID before and after, the existing \u003ccode>main\u003c/code> and \u003ccode>legacy\u003c/code> heads, and the retained \u003ccode>v0.2.0-beta.7\u003c/code> prerelease. The unchanged release-check function was run against the new repository: \u003ccode>/releases/latest\u003c/code> returned 404 because no stable release exists, and werk reported \u003ccode>current\u003c/code>. These checks passed; \u003ca href=\"evidence/2026-11-01-m5-delivery/repository-rename.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 2ff3c10756a4856c5d22a2683b8b818805ebafd89a6dbc2e34cc91cd447648f2\">sanitized observations\u003c/a> also identify the downloaded Windows installer. The user subsequently confirmed the Windows build and setup work, then approved the first tag; see the \u003ca href=\"#/verification/runs/2026-11-01-release-preflight\">Windows trial and release preflight\u003c/a> and \u003ca href=\"#/verification/runs/2026-11-01-v0.1.0-draft\">v0.1.0 delivery\u003c/a>. Publication belongs to the user.\u003c/p>\n","backlinks":["features/backups","features/desktop","verification/index","verification/runs/2026-11-01-m4-documents","verification/runs/2026-11-01-release-preflight"]},{"id":"verification/runs/2026-11-01-pi-session","title":"Embedded pi session verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Embedded pi session verification\nsection: Verification\nupdated: 2026-11-01\nresult: Passed\n---\n# Embedded pi session verification\n\nScope: [FEAT-assistant](../../features/assistant.md) after [REB-pi-session](../../decisions/index.md#assistant-revision-after-implementation-feedback). This replaces the bounded loop after the user's reported interruption, file access and quote-validation problems.\n\n## Build and environment\n\nBase `54aa41fa56830d706e88e95d4600ce9b6fc13743`, dirty tree fingerprint `df4381a8b35d1825fa8612b11ec10afcc46b37ceb0926c56c7ce97d1fe75066e` ([manifest](../../evidence/2026-11-01-pi-session/source-manifest.json)). macOS arm64, Electron 44.9.1, pi-coding-agent/pi-ai 1.3.0, schema 5. Tests use temporary folders and fictional facts. The live SDK check uses an isolated fictional database and the existing app-owned OAuth credential store; it does not read or change the user's profile.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Type and domain checks | Existing behavior plus actual pi lifecycle | Typecheck and all 32 tests passed | Passed | [Recipe](../../features/assistant.md#verification-recipe) |\n| Local/network tools | Read/write files and HTTP through actual tools | Real file read/write and localhost request succeeded | Passed | [Results](../../evidence/2026-11-01-pi-session/results.json) |\n| Quote rejection recovery | Failed edit returns to model; valid repair saves once | Unsupported quote rejected, next tool call saved revision 1 | Passed | `tests/assistant.test.ts` |\n| Interactive controls | Dropped arbitrary file, attachment-only send, visible tools, steering and interruption | UI assertions passed; shell command stopped before replacement reply | Passed | [UI](../../evidence/2026-11-01-pi-session/assistant.png), [results](../../evidence/2026-11-01-pi-session/results.json) |\n| Persistence and allowance | Restore pi context, tool history and composer; pause without data loss | Restart/reload and simulated allowance checks passed | Passed | [Recipe](../../features/assistant.md#verification-recipe) |\n| Packaged PDF/profile regression | Same overlay, attachment, save and focus behavior | Packaged macOS driver passed | Passed | `tests/profile-smoke.ts` |\n| Real ChatGPT inference | Fixed model/high reasoning executes real read/profile tools | read, read_profile and edit_profile succeeded; fictional revision 1 ready | Passed | [Live result](../../evidence/2026-11-01-pi-session/live.json) |\n| Windows packaged pi | Same tools, PowerShell interruption and UI journey | Both packaged platforms passed, including PowerShell interruption and installer lifecycle; revision `4057deee560e75c948696e251caff808072fe868` | Passed | [CI run](https://github.com/rengwu/ununemploy/actions/runs/41281175516) |\n\n## Findings and limits\n\nThe initial CI attempt found a test-only dependency on the unbuilt out directory. Reading the source skill file removed that dependency; the rerun passed on both platforms. An initial integration test found SQLite null evidence URLs were passed into a schema expecting an optional string. Normalizing those fields fixed the issue. The quote-error regression verifies recovery rather than weakening evidence validation. Allowance classification was extended to recognize the explicit subscription allowance message.\n\nThe first local UI-driver attempt accidentally launched Electron's default app; that driver was stopped, its explicit timeout added, and the correct werk builds were used. Full access is intentional: no-engagement and versioned-record rules are assistant instructions, not technical restrictions on arbitrary shell programs. Public search may be blocked by service challenges. CV/letter workspaces and backup remain separate M4/M5 work; this report does not claim they are finished. No candidate evidence, credentials or private logs are included.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"findings-and-limits","title":"Findings and limits","depth":2}],"titleAnchor":"embedded-pi-session-verification","links":["features/assistant","decisions/index","features/assistant","features/assistant"],"attachments":[{"path":"evidence/2026-11-01-pi-session/source-manifest.json","sha256":"68899a4f2adc35ec1c5e7fc0c64b8d17b0aff2a51b17137726890022883e6bd3"},{"path":"evidence/2026-11-01-pi-session/results.json","sha256":"52014ffbe098a53478e3fe5c68b62d738b28b15c10c73d42d2544b15b6262af6"},{"path":"evidence/2026-11-01-pi-session/assistant.png","sha256":"f1d08506c5bcb77895b4634522e21cdfbd62e8573bfd625768a0a4fdee47e659"},{"path":"evidence/2026-11-01-pi-session/live.json","sha256":"0bd6758f57ac55e60b9313fdd2462892ed3c67ff3250c6e8e916e10e02c4a1db"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/assistant\">FEAT-assistant\u003c/a> after \u003ca href=\"#/decisions/index~assistant-revision-after-implementation-feedback\">REB-pi-session\u003c/a>. This replaces the bounded loop after the user's reported interruption, file access and quote-validation problems.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Base \u003ccode>54aa41fa56830d706e88e95d4600ce9b6fc13743\u003c/code>, dirty tree fingerprint \u003ccode>df4381a8b35d1825fa8612b11ec10afcc46b37ceb0926c56c7ce97d1fe75066e\u003c/code> (\u003ca href=\"evidence/2026-11-01-pi-session/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 68899a4f2adc35ec1c5e7fc0c64b8d17b0aff2a51b17137726890022883e6bd3\">manifest\u003c/a>). macOS arm64, Electron 44.9.1, pi-coding-agent/pi-ai 1.3.0, schema 5. Tests use temporary folders and fictional facts. The live SDK check uses an isolated fictional database and the existing app-owned OAuth credential store; it does not read or change the user's profile.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Type and domain checks\u003c/td>\n\u003ctd>Existing behavior plus actual pi lifecycle\u003c/td>\n\u003ctd>Typecheck and all 32 tests passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"#/features/assistant~verification-recipe\">Recipe\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Local/network tools\u003c/td>\n\u003ctd>Read/write files and HTTP through actual tools\u003c/td>\n\u003ctd>Real file read/write and localhost request succeeded\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-pi-session/results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 52014ffbe098a53478e3fe5c68b62d738b28b15c10c73d42d2544b15b6262af6\">Results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quote rejection recovery\u003c/td>\n\u003ctd>Failed edit returns to model; valid repair saves once\u003c/td>\n\u003ctd>Unsupported quote rejected, next tool call saved revision 1\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ccode>tests/assistant.test.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Interactive controls\u003c/td>\n\u003ctd>Dropped arbitrary file, attachment-only send, visible tools, steering and interruption\u003c/td>\n\u003ctd>UI assertions passed; shell command stopped before replacement reply\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-pi-session/assistant.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: f1d08506c5bcb77895b4634522e21cdfbd62e8573bfd625768a0a4fdee47e659\">UI\u003c/a>, \u003ca href=\"evidence/2026-11-01-pi-session/results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 52014ffbe098a53478e3fe5c68b62d738b28b15c10c73d42d2544b15b6262af6\">results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Persistence and allowance\u003c/td>\n\u003ctd>Restore pi context, tool history and composer; pause without data loss\u003c/td>\n\u003ctd>Restart/reload and simulated allowance checks passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"#/features/assistant~verification-recipe\">Recipe\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Packaged PDF/profile regression\u003c/td>\n\u003ctd>Same overlay, attachment, save and focus behavior\u003c/td>\n\u003ctd>Packaged macOS driver passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ccode>tests/profile-smoke.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Real ChatGPT inference\u003c/td>\n\u003ctd>Fixed model/high reasoning executes real read/profile tools\u003c/td>\n\u003ctd>read, read_profile and edit_profile succeeded; fictional revision 1 ready\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-01-pi-session/live.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 0bd6758f57ac55e60b9313fdd2462892ed3c67ff3250c6e8e916e10e02c4a1db\">Live result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows packaged pi\u003c/td>\n\u003ctd>Same tools, PowerShell interruption and UI journey\u003c/td>\n\u003ctd>Both packaged platforms passed, including PowerShell interruption and installer lifecycle; revision \u003ccode>4057deee560e75c948696e251caff808072fe868\u003c/code>\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/rengwu/ununemploy/actions/runs/41281175516\" rel=\"noreferrer\">CI run\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"findings-and-limits\">Findings and limits\u003c/h2>\n\u003cp>The initial CI attempt found a test-only dependency on the unbuilt out directory. Reading the source skill file removed that dependency; the rerun passed on both platforms. An initial integration test found SQLite null evidence URLs were passed into a schema expecting an optional string. Normalizing those fields fixed the issue. The quote-error regression verifies recovery rather than weakening evidence validation. Allowance classification was extended to recognize the explicit subscription allowance message.\u003c/p>\n\u003cp>The first local UI-driver attempt accidentally launched Electron's default app; that driver was stopped, its explicit timeout added, and the correct werk builds were used. Full access is intentional: no-engagement and versioned-record rules are assistant instructions, not technical restrictions on arbitrary shell programs. Public search may be blocked by service challenges. CV/letter workspaces and backup remain separate M4/M5 work; this report does not claim they are finished. No candidate evidence, credentials or private logs are included.\u003c/p>\n","backlinks":["features/assistant","verification/index"]},{"id":"verification/runs/2026-11-01-release-preflight","title":"Windows setup and release asset preflight","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Windows setup and release asset preflight\nsection: Verification\nupdated: 2026-11-01\nresult: Passed\n---\n# Windows setup and release asset preflight\n\nScope: the user's Windows-PC setup trial and installer selection for the [desktop release workflow](../../features/desktop.md). Tag creation, GitHub release creation and publication were outside this preflight and awaited approval at the time. The later approval and delivery are recorded in [v0.1.0 verification](2026-11-01-v0.1.0-draft.md).\n\n## Build and environment\n\nThe user tested the supplied `werk-0.1.0-setup.exe` from revision `5c258cd75290c5ed1d0fda101c745e4e28a58108`, [CI run 41283633752](https://github.com/rengwu/werk/actions/runs/41283633752). The subsequent [CI run 41295845898](https://github.com/rengwu/werk/actions/runs/41295845898) also passed at `269d7e50c2d8b547238342a7016064e2fa5c1759`; intervening changes were documentation only.\n\nThe release-command check used a dirty tree based on `269d7e50c2d8b547238342a7016064e2fa5c1759`. The SHA-256 of `.github/workflows/build.yml` was `e44f5dd29795311f85fe70c39b635f78a7da79109ed93b876b287615471a6a74`. macOS Bash ran the workflow's exact command with `gh` replaced by an argument/file validator. Downloaded macOS and Windows artifact trees were linked under a temporary `dist/` directory; the temporary directory was removed after the observations were saved. The macOS artifact was used only to verify directory layout, not to revalidate its older binary.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Windows-PC setup trial | User confirms the supplied build installs and works | User reported “windows build works fine. setup tested to be working.” | Passed | [Attributed report](../../evidence/2026-11-01-release-preflight/results.json) |\n| Reproduce original release asset selection | Locate the cause of missing installer paths | Original globs matched no files because artifact downloads retain the `release/` directory | Passed | [Baseline observation](../../evidence/2026-11-01-release-preflight/results.json) |\n| Corrected draft-release command | Select one DMG and one setup EXE, retain the repository, version and draft arguments | Both real installer files resolved; draft/title/repository arguments matched; smoke evidence was excluded | Passed | [Corrected observation](../../evidence/2026-11-01-release-preflight/results.json) |\n\n## Findings and limits\n\nThe release step now selects `dist/*/release/*.dmg` and `dist/*/release/*-setup.exe`. Runtime code and the tested installers are unchanged. To repeat the bounded check, arrange downloaded `werk-macOS` and `werk-Windows` artifacts below `dist/`, then substitute an argument/file validator for `gh` when running the exact release command. Require two existing installer files and the `--draft` argument; do not execute the GitHub write before approval.\n\nThe Windows-PC outcome is user-reported, not an independently observed test. Individual assistant, sign-in, CV and tray interactions were not separately reported; their packaged automated coverage is recorded in [M5 verification](2026-11-01-m5-delivery.md). No version tag, draft release or publication was performed during this preflight. See the [subsequent delivery run](2026-11-01-v0.1.0-draft.md) for the approved tag's results.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"findings-and-limits","title":"Findings and limits","depth":2}],"titleAnchor":"windows-setup-and-release-asset-preflight","links":["features/desktop","verification/runs/2026-11-01-v0.1.0-draft","verification/runs/2026-11-01-m5-delivery","verification/runs/2026-11-01-v0.1.0-draft"],"attachments":[{"path":"evidence/2026-11-01-release-preflight/results.json","sha256":"3e81145e7d3ade6285c60e3fe072c59d2064fce1d7b985a58c6d5c5b5fc72de6"}],"html":"\u003cp>Scope: the user's Windows-PC setup trial and installer selection for the \u003ca href=\"#/features/desktop\">desktop release workflow\u003c/a>. Tag creation, GitHub release creation and publication were outside this preflight and awaited approval at the time. The later approval and delivery are recorded in \u003ca href=\"#/verification/runs/2026-11-01-v0.1.0-draft\">v0.1.0 verification\u003c/a>.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>The user tested the supplied \u003ccode>werk-0.1.0-setup.exe\u003c/code> from revision \u003ccode>5c258cd75290c5ed1d0fda101c745e4e28a58108\u003c/code>, \u003ca href=\"https://github.com/rengwu/werk/actions/runs/41283633752\" rel=\"noreferrer\">CI run 41283633752\u003c/a>. The subsequent \u003ca href=\"https://github.com/rengwu/werk/actions/runs/41295845898\" rel=\"noreferrer\">CI run 41295845898\u003c/a> also passed at \u003ccode>269d7e50c2d8b547238342a7016064e2fa5c1759\u003c/code>; intervening changes were documentation o ched to the release.\u003c/p>\n\u003ch2 id=\"limits\">Limits\u003c/h2>\n\u003cp>The first macOS attempt exceeded the 3-second startup assertion at 6,168 ms. The same revision started in 1,303 ms in the separate main-branch run, then 1,352 ms in the successful tag retry. This records timing variability on hosted runners without attributing a specific cause. No test threshold, app code or tag target was changed to obtain the passing result.\u003c/p>\n\u003cp>Publication is not authorized by the first-tag approval. No public release publication was performed by this verification. These observations apply to the draft before the user publishes it.\u003c/p>\n","backlinks":["decisions/index","discussions/open-questions","features/desktop","verification/index","verification/runs/2026-11-01-m5-delivery","verification/runs/2026-11-01-release-preflight","verification/runs/2026-11-01-v0.1.0-attempt1"]},{"id":"verification/runs/2026-11-02-factory-reset","title":"Factory reset verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Factory reset verification\nsection: Verification\nupdated: 2026-11-02\nresult: Passed\n---\n# Factory reset verification\n\nScope: [FEAT-factory-reset](../../features/factory-reset.md), backend shutdown ordering, and affected desktop/accessibility behavior. All exercised data, credentials and files are fictional and isolated in temporary folders. The user's installation was not reset.\n\n## Build and environment\n\nLocal checks used a dirty tree based on `2b78e78`, fingerprint `4ccabc5c9e98cc1f61c20c6c344359c8d7e1e3494d3439a8ffafdd6041635f23`; the [source manifest](../../evidence/2026-11-02-factory-reset/source-manifest.json) identifies every tested source file. This source was committed as `780b1e21118df2f452018344432018606c43ea34`. macOS arm64, Electron 44.9.1, SQLite schema 6. The packaged fixture build uses the actual reset implementation; only the final shell-cancellation scenario uses simulated inference. Native dialog responses are stubbed and their cancellation/default options asserted.\n\nThe corrected driver at `6039b02f2e846df3955da055c99632522c8f1f06` also passed all six scenarios in an isolated local Electron app with the unchanged production renderer/main and a fixture backend: [correction results](../../evidence/2026-11-02-factory-reset/macos-driver-correction.json). [CI at the same revision](https://github.com/rengwu/werk/actions/runs/41328558430) then passed packaged macOS arm64 and Windows x64 checks, including all six reset scenarios and accessibility: [CI results](../../evidence/2026-11-02-factory-reset/ci.json).\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Typecheck and domain tests | No regression; deletion stays within owned paths; shutdown drains work | Typecheck and all 39 tests passed, including linked-directory protection and delayed-write ordering | Passed | `tests/reset.test.ts` and shared setup |\n| Cancel and reset | Cancel preserves data; confirmed reset removes records, credentials, files and browser state | Packaged UI scenarios passed; default sources, System appearance and manual schedule returned | Passed | [UI results](../../evidence/2026-11-02-factory-reset/macos.json), [Settings](../../evidence/2026-11-02-factory-reset/settings.png), [fresh setup](../../evidence/2026-11-02-factory-reset/fresh.png) |\n| Interrupted reset and corrupt data | Resume pending deletion before old state loads; recover without a working database | Injected Chromium cleanup failure and a corrupt SQLite database both recovered through the actual reset flow | Passed | [UI results](../../evidence/2026-11-02-factory-reset/macos.json) |\n| Active command | Stop tools before deleting data; no delayed write or old task returns | A real pi shell command was aborted before its delayed file write | Passed | [UI results](../../evidence/2026-11-02-factory-reset/macos.json) |\n| Restart and accessibility | Normal startup, recovery, close/reopen and navigation remain functional | Shell driver passed (593 ms startup); 20 light/dark axe audits and keyboard scenario passed | Passed | [Accessibility results](../../evidence/2026-11-02-factory-reset/accessibility.json) |\n| Cross-platform CI | Same reset and regression scenarios work on macOS and Windows | Both packaged apps passed all six reset scenarios, 39 domain tests, installer/launch checks, other feature drivers and accessibility | Passed | [CI results](../../evidence/2026-11-02-factory-reset/ci.json), [CI run](https://github.com/rengwu/werk/actions/runs/41328558430) |\n\n## Findings and limits\n\nThe [initial CI run](https://github.com/rengwu/werk/actions/runs/41327821084) at `780b1e2` passed typechecking, all 39 tests, packaging, installation/launch, compiler isolation, authentication handoff, assistant, discovery, document and backup checks on both platforms. Its reset driver failed with `unable to open database file` because the setup heading can render before backend initialization; see the [initial CI results](../../evidence/2026-11-02-factory-reset/ci-initial.json). The corrected driver waits for the Diagnostics backend response before inspecting SQLite and passed on both platforms. This correction changed the test, not the application.\n\nReset uses Electron's [session data cleanup](https://www.electronjs.org/docs/latest/api/session#sescleardataoptions) and removes explicitly owned app paths after the backend exits. It does not recursively erase an arbitrary custom data directory or follow directory links. A pending marker is removed only after cleanup completes. Existing original files and a test export survived both reset and recovery. This does not establish secure erasure from disk or deletion of external files created by unrestricted assistant commands.\n\nThe native confirmation was exercised with stubbed responses; physical mouse/keyboard interaction with the operating-system dialog is not an independent test here. No real ChatGPT credential, candidate record or live model request was used. The existing `v0.1.0` release and tag were not changed by this feature work.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"findings-and-limits","title":"Findings and limits","depth":2}],"titleAnchor":"factory-reset-verification","links":["features/factory-reset"],"attachments":[{"path":"evidence/2026-11-02-factory-reset/source-manifest.json","sha256":"9ca658abf1f042c109b1d55528e73ae422611460d14d652d25e095f194ac043e"},{"path":"evidence/2026-11-02-factory-reset/macos-driver-correction.json","sha256":"3014352ce779ba74d917360b3d0293b3ca7f5e23500759b989d5ba64675afb3c"},{"path":"evidence/2026-11-02-factory-reset/ci.json","sha256":"f021293180b16c4f52ba5d5119153cc48706f1219e69347079715302fec77766"},{"path":"evidence/2026-11-02-factory-reset/macos.json","sha256":"053bbf9b3702649a9429cf63f677f868e60ec5cb2330ff1d88bdc2eef0dee00d"},{"path":"evidence/2026-11-02-factory-reset/settings.png","sha256":"5474213d98452d1a4a4c4eb4970c5e57762139d62266403e0e02ba69c418e9ba"},{"path":"evidence/2026-11-02-factory-reset/fresh.png","sha256":"80f10ebf4859752346c76b4f796b31252b0463a690229a895ce71f5a688bbcc6"},{"path":"evidence/2026-11-02-factory-reset/accessibility.json","sha256":"a460f05f5abfd6cee5472dbaa22520ce164fdc112db46e47b03453f5fb9f4092"},{"path":"evidence/2026-11-02-factory-reset/ci-initial.json","sha256":"a415c84761e528e7db52ea733ab7585f9b19fbad92e277d0cf99c6b760792ea7"}],"html":"\u003cp>Scope: \u003ca href=\"#/features/factory-reset\">FEAT-factory-reset\u003c/a>, backend shutdown ordering, and affected desktop/accessibility behavior. All exercised data, credentials and files are fictional and isolated in temporary folders. The user's installation was not reset.\u003c/p>
