&lt;--&gt;|\"leases, heartbeat\"| db\n  worker --&gt; chromium[\"Headless Chromium: letter PDFs\"]\n  api --&gt; tectonic[\"Tectonic: CV\"]\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Electron\u003c/th>\n\u003cth>Tauri + Node sidecar\u003c/th>\n\u003cth>Keep Go shells, trimmed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Languages\u003c/td>\n\u003ctd>TypeScript\u003c/td>\n\u003ctd>TypeScript + Rust\u003c/td>\n\u003ctd>TypeScript + Go + Objective-C + PowerShell\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bundled runtimes\u003c/td>\n\u003ctd>Electron (Node + Chromium), Tectonic\u003c/td>\n\u003ctd>Node, Tectonic; system webview\u003c/td>\n\u003ctd>Node, Tectonic; system webview\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rendering\u003c/td>\n\u003ctd>Chromium on both\u003c/td>\n\u003ctd>WebKit on Mac, WebView2 on Windows\u003c/td>\n\u003ctd>WebKit on Mac, WebView2 on Windows\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Installers, signing, auto-update\u003c/td>\n\u003ctd>electron-builder + electron-updater\u003c/td>\n\u003ctd>Tauri bundler + updater plugin\u003c/td>\n\u003ctd>Hand-written\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unpacked size (estimate)\u003c/td>\n\u003ctd>~300 MB\u003c/td>\n\u003ctd>~180 MB\u003c/td>\n\u003ctd>~170 MB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Download (estimate)\u003c/td>\n\u003ctd>~120 MB\u003c/td>\n\u003ctd>~70 MB\u003c/td>\n\u003ctd>~70 MB\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Estimates are unmeasured: typical runtime sizes plus Tectonic (48 MB) and its package cache (20 MB). All three drop headless Chromium and the shipped \u003ccode>node_modules\u003c/code>, which is most of today’s size. Risk to check early with Electron: whether its Node build includes \u003ccode>node:sqlite\u003c/code>; otherwise use \u003ccode>better-sqlite3\u003c/code>.\nRecommendation: Electron. It has the fewest moving parts: one language, no separate Node binary or Chromium download, and maintained installers and updates on both platforms. It removes the custom Windows host, process supervision and installer, where the Windows-only code lives. It costs roughly 120 MB more on disk than Tauri.\nSelection: single\nOptions: Electron / Tauri + Node sidecar / Keep Go shells, trimmed\nSelected: Electron\nNotes: \u003c/p>\n\u003cpre>\u003ccode>\n## Question 6\n\n```text\nRound: Rebuild from first principles\nQuestion: How should releases be signed and updated?\nDescription (Markdown source):\nWithout signing, macOS blocks the first open until you allow it in System Settings, and macOS auto-update requires a signed app. Windows shows a SmartScreen warning. Signing costs the Apple Developer Program (US$99/year) and a paid Windows certificate or signing service. Releases would be published as GitHub Releases in every option.\nRecommendation: Sign and notarize both, with automatic updates, if anyone besides you will install it. If it is only for you, choose unsigned with an update notice.\nSelection: single\nOptions: Sign both; automatic updates / Sign macOS only; Windows unsigned with an update notice / Unsigned on both; in-app notice links to the new release\nSelected: Unsigned on both; in-app notice links to the new release\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-7\">Question 7\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should the rebuild happen?\nDescription (Markdown source):\n**Port largely unchanged** (about 8,500 lines that already work): source adapters and parsers, matching, eligibility, deduplication, location and timezone data, pi-ai runtime and credentials, assistant actions and validation, LaTeX compilation, the ZIP backup format.\n\n**Rewrite:** desktop shell and packaging, process model, database schema and queries, API, UI.\n\n**Data moves through the existing ZIP export.** The new app imports a backup and applies the new storage rules from the question on stored jobs. The old app stays usable until the new one reaches parity.\nRecommendation: Rebuild alongside in this repo and port the proven modules. Rewriting the shell, storage and UI in place would leave both versions half-working for weeks.\nSelection: single\nOptions: Rebuild alongside; port proven modules; import via ZIP / Refactor the current app in place, one step at a time / Start clean; import only profile, CV and letters\nSelected: Start clean; import only profile, CV and letters\nNotes: dont import profile or CV. start completely clean. but keep a backup of my data, and put it on ~/Desktop/ununemploy-backup\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-8\">Question 8\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Should the backend run as one process?\nDescription (Markdown source):\nProposed architecture:\n\n```mermaid\nflowchart LR\n  main[\"Electron main: window, menus, updates\"] --&gt; backend[\"Backend process: API, scheduler, model queue\"]\n  ui[\"UI\"] &lt;--&gt;|\"requests and push events\"| backend\n  backend --&gt; db[(\"SQLite: typed columns, full-text search\")]\n  backend --&gt; tectonic[\"Tectonic: CV and letters\"]\n  backend --&gt; pi[\"pi-ai: ChatGPT subscription\"]\n\u003c/code>\u003c/pre>\n\u003cp>One backend process owns the API, the scan scheduler and the serialized model queue. The UI receives push events when data changes. This removes worker leases, heartbeats, the \u003ccode>data_revisions\u003c/code> triggers, revision-hint headers, 8-second polling and the 15-second request timeout. Serialized model work is an in-process queue instead of a polled table; queued work still persists in SQLite so it survives restarts.\nRecommendation: One process. Most stale-state and timeout bugs come from two processes coordinating through the database.\nSelection: single\nOptions: One backend process with push updates / Keep separate API and worker processes\nSelected: One backend process with push updates\nNotes: \u003c/p>\n\u003cpre>\u003ccode>\n## Question 9\n\n```text\nRound: Rebuild from first principles\nQuestion: Which jobs should the app keep?\nDescription: local\nRecommendation: Keep Strong and Adjacent unless Incompatible (about 14,400 today), keep a fingerprint for the rest, and delete unsaved jobs 30 days after they close. Drop the HTTP body cache and description history for unsaved jobs. The database should fall from 2 GB to tens of MB.\nSelection: single\nOptions: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs / Keep every job; drop only the HTTP body cache and history / Keep everything (current)\nSelected: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-10\">Question 10\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should cover-letter PDFs be produced?\nDescription (Markdown source):\nHeadless Chromium (198 MB macOS, 274 MB Windows) exists only for letter PDFs and legacy resume exports. `docx` and Handlebars serve only legacy resumes. A LaTeX letter template would use the same fields as today (company, role, greeting, plain-text paragraphs, signature), with text escaped for LaTeX. Existing legacy resumes would be exported once as files and kept in appdata.\nRecommendation: Render letters with the same Tectonic engine as the CV. One document engine, letters that match the CV’s typography, and no browser dependency.\nSelection: single\nOptions: LaTeX for CV and letters / Electron's built-in print-to-PDF with the current HTML layout / Keep headless Chromium\nSelected: Something else\nNotes: just generate CVs in plain text.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-11\">Question 11\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Do you accept these implementation choices?\nDescription (Markdown source):\n| Area | Current | Rebuild |\n| --- | --- | --- |\n| Packaging | `tsx` at runtime; full `node_modules` shipped | Backend bundled with esbuild into one file |\n| Database | JSON documents + in-memory snapshot index | Typed columns for filters and sort, SQL indexes, FTS5 search; JSON only for raw source evidence |\n| UI server state | Custom `useRemote`, ETag polling, revision hints | TanStack Query, invalidated by push events |\n| Routing | Hash routes inside a 1,448-line `App.tsx` | One module per page; the router keeps unsaved-edit guards |\n| Assistant UI | assistant-ui runtime (295 KB chunk) | Plain message list and composer |\n| LaTeX editor | react-codemirror wrapper (964 KB chunk + 273 KB CSS) | CodeMirror 6 with only the needed extensions |\n| PDF preview | pdf.js (1.1 MB worker) | Built-in Chromium PDF viewer |\n| Tests | 27 `verify-*` scripts + node tests | Ported unit tests + one Playwright suite against the packaged app on both platforms |\n| Diagnostics | Logs in appdata | Settings → Diagnostics: versions and recent errors, copyable, no personal data |\nRecommendation: Accept. Each change removes code or a dependency; TanStack Query is the only new library, and it replaces hand-written caching and polling.\nSelection: single\nOptions: Accept / Accept with changes in notes / Discuss alternatives first\nSelected: Accept\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-12\">Question 12\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What should the opening screen be?\nDescription: local\nRecommendation: Triage inbox. It turns the collection into a short daily queue you can clear.\nSelection: single\nOptions: Triage inbox (proposed) / Current browse-all inbox\nSelected: Triage inbox (proposed)\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-13\">Question 13\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Where should your job criteria live?\nDescription (Markdown source):\nToday, location, timezone, arrangement, eligibility and match level are inbox filters restored per browser tab, while the profile separately stores preferences used for matching. Two places describe what you want. In the proposal, Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily. See the Profile question for a preview.\nRecommendation: In Profile as search criteria. Set them once; they also stop irrelevant jobs from being stored.\nSelection: single\nOptions: Profile → Search criteria; filters narrow temporarily / Keep everything as inbox filters (current)\nSelected: Profile → Search criteria; filters narrow temporarily\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-14\">Question 14\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should timezone fit be expressed?\nDescription (Markdown source):\nThe current picker selects a UTC range on a map with a separate rotating offset; it took four iterations on 18 October to handle the date-line seam. An overlap rule asks the question directly and wraps around midnight without a seam. Example: US Pacific gives 1 h of overlap with Kuala Lumpur. Matching stays country-level as today, so the United States matches 3 h through Hawaii. Try the slider.\nRecommendation: Minimum working-hours overlap with your timezone, stored in search criteria.\nSelection: single\nOptions: Minimum overlap with my working hours / Current UTC range, map and offset / No timezone filtering\nSelected: Minimum overlap with my working hours\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-15\">Question 15\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should a job's fit be shown?\nDescription (Markdown source):\nToday: a six-field metadata grid (several reading “Not listed” or “Unconfirmed”), then Description, Match, Notes and Cover letter tabs. Match evidence sits in its own tab, away from the text it refers to. The proposal leads with a summary of the deciding facts, then highlights matched and missing requirements inside the description.\nRecommendation: Decision summary and highlighted description. You read the reasons where they appear.\nSelection: single\nOptions: Decision summary + highlighted description / Current grid and Match tab\nSelected: Decision summary + highlighted description\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-16\">Question 16\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should a saved job be worked on?\nDescription (Markdown source):\nToday the letter is a tab in the half-width detail pane, below the metadata grid, edited as separate form fields. In the proposal, a saved job opens a workspace: the posting and notes on the left, the letter as a document on the right, with review notes and status visible. Contact fields stay in the letter's settings.\nRecommendation: Posting and letter side by side. Checking the letter against the posting is the main task here.\nSelection: single\nOptions: Posting and letter side by side / Current letter tab\nSelected: Posting and letter side by side\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-17\">Question 17\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What should the app record after you save a job?\nDescription: local\nRecommendation: Saved and Applied only, with the status selector in the job header and the date in the list. Add interview stages later if you find you need them.\nSelection: single\nOptions: Saved and Applied, shown in the header and list / Add stages: Applied, Interviewing, Offer, Closed, with dates / Saved only; remove Applied\nSelected: Saved and Applied, shown in the header and list\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-18\">Question 18\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: How should the profile be shown and edited?\nDescription (Markdown source):\nThe current view renders the stored JSON as Markdown, including internal fields such as Id and Year/Month/Display “Not provided”. The proposal is a fact sheet: search criteria, eligibility, experience, projects and missing facts, each with its status and source. Direct editing would revise the 8 October read-only decision; direct edits are recorded as yours with a date, and the assistant remains available for imports and bulk changes.\nRecommendation: Fact sheet with direct editing as well as the assistant. Changing a phone number through chat is the clunkiest path.\nSelection: single\nOptions: Fact sheet; edit directly or with the assistant / Fact sheet; assistant-only edits / Current Markdown view\nSelected: Fact sheet; edit directly or with the assistant\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-19\">Question 19\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What should the main navigation contain?\nDescription (Markdown source):\nSources are set up once and checked occasionally, but today they take a top-level page. The proposal puts them in Settings with per-source job and save counts. A failing source puts a dot on Settings, and Saved counts letters ready to review. The counts shown are your current collection; the statuses are illustrative.\nRecommendation: Inbox, Saved, Profile and CV, with Sources inside Settings.\nSelection: single\nOptions: Inbox, Saved, Profile, CV; Sources in Settings / Keep Sources as a top-level page\nSelected: Inbox, Saved, Profile, CV; Sources in Settings\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-20\">Question 20\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which sources should the rebuilt app keep?\nDescription: local\nRecommendation: Keep the first three groups. Drop scraped boards without saves, X and the boards that never returned a job. Scraped boards break when sites change, and X needs paid credits and budget code. Hacker News is optional.\nSelection: multiple\nOptions: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves / Hacker News / X search / Boards that never returned a job\nSelected: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-21\">Question 21\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which additions should the rebuild include?\nDescription (Markdown source):\n| Addition | What it does |\n| --- | --- |\n| Keyboard triage | J/K move, S save, X skip, O open posting, / search |\n| Setup checklist | First run: connect ChatGPT → build profile from your CV PDF → choose sources → first scan |\n| Hide company | One action on a job hides that employer's future postings |\n| Track company | From a job on Greenhouse, Ashby or Lever, add that employer's board as a source |\n| Status counts | Saved shows letters ready to review; Settings shows failing sources or a needed sign-in |\n| Record versions when applying | Marking Applied records which letter and CV versions were current |\n| Saved views | Named filter combinations in the sidebar |\nRecommendation: Everything except saved views. Search criteria cover the main need for saved views.\nSelection: multiple\nOptions: Keyboard triage / Setup checklist / Hide company / Track company / Status counts / Record versions when applying / Saved views\nSelected: Keyboard triage / Setup checklist / Hide company\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-22\">Question 22\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: Which removals should the rebuild make?\nDescription (Markdown source):\nSources, timezone, the Match tab and platforms are covered by earlier questions.\n\n| Removal | Why |\n| --- | --- |\n| Seen state and filter | Replaced by New/All and bold unopened titles; 73 opens recorded |\n| Duplicate grouping control | Always group; the detail lists other listings |\n| Legacy resume code (`docx`, Handlebars, export routes) | Export existing resumes once to files |\n| Retired Jev code, migration and archive compatibility | Export stored Jev data once to a file |\n| HTTP body cache | 979 MB; keep only ETag/Last-Modified validators |\n| Description history for unsaved jobs | 380 MB; saving still snapshots the description |\n| VueJobs detail enrichment | Special six-per-day lookup path for one feed |\n| Custom installer and checksum inventory | Replaced by the packaging tool |\nRecommendation: All of them. Each removes code or stored data with no current use.\nSelection: multiple\nOptions: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nSelected: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-23\">Question 23\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild from first principles\nQuestion: What else feels clunky or breaks in daily use?\nDescription (Markdown source):\nAnything not covered above: specific screens, waits, errors or steps you avoid. Paste screenshots if useful.\nSelected: (none)\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-11-01-rebuild"]},{"id":"journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","title":"Interview answers — round 3","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Interview answers — round 3\nsection: Journal\nupdated: 2026-11-01\nstatus: Submitted\n---\n# Interview answers — round 3\n\nSubmitted answers; interpretation and accepted decisions are recorded in the [clean rebuild plan](2026-11-01-rebuild.md) and the [implementation handoff](2026-11-01-werk-handoff.md).\n\nSession: `28a582f50b30795a161c06d0221e222e`\n\n## Question 30\n\n```text\nRound: Handoff readiness\nQuestion: Who should restructure the repository before the handoff?\nDescription (Markdown source):\nRestructuring means: create `legacy` at `e493246`, remove the old tracked code, start the new wiki (carrying the plan, transcripts, handoff and designs), write the werk `AGENTS.md`, `README.md` and `.gitignore`, apply this round's answers to the handoff, and commit. It changes only git and documentation; no werk code.\nRecommendation: I do it now in this session. The next agent then starts directly on milestone 1 code from a consistent, reviewed tree.\nSelection: single\nOptions: Restructure now in this session / Leave it as the next agent's first step\nSelected: Restructure now in this session\nNotes: \n```\n\n## Question 31\n\n```text\nRound: Handoff readiness\nQuestion: Which of these should I delete after you submit?\nDescription (Markdown source):\nSelecting an item is your confirmation; unselected items stay. Everything private is in the verified backup at `~/Desktop/ununemploy-backup`; build outputs can be rebuilt from the `legacy` branch. Before deleting `.local-data`, I move `.local-data/grill` (the private form records) into the backup folder. A Windows installation on your PC is not covered; remove it there through Settings → Apps.\nRecommendation: All of them. werk starts clean, and keeping old private files in the checkout only risks committing them.\nSelection: multiple\nOptions: ~/Applications/ununemploy.app (installed old app) / ~/Library/Application Support/ununemploy (old app data, 2.7 GB) / build/, dist/ and node_modules/ in the checkout (old build outputs) / .local-data/ in the checkout (old development data, 2.0 GB) / data/candidate-profile.json and docs/MASTER_CV.md (original evidence) / .env in the checkout\nSelected: ~/Applications/ununemploy.app (installed old app) / ~/Library/Application Support/ununemploy (old app data, 2.7 GB) / build/, dist/ and node_modules/ in the checkout (old build outputs) / .local-data/ in the checkout (old development data, 2.0 GB) / data/candidate-profile.json and docs/MASTER_CV.md (original evidence) / .env in the checkout\nNotes: \n```\n\n## Question 32\n\n```text\nRound: Handoff readiness\nQuestion: Where should werk development happen?\nDescription (Markdown source):\nThe old app is archived on `legacy` in both options. Merging into `main` stays with you either way.\nRecommendation: A `werk` branch with a pull request per milestone that you merge. Main always holds a reviewed state, and each milestone has one place to review.\nSelection: single\nOptions: A werk branch, with a pull request per milestone that you merge / Directly on main\nSelected: Directly on main\nNotes: \n```\n\n## Question 33\n\n```text\nRound: Handoff readiness\nQuestion: What may the next agent do on GitHub without asking each time?\nDescription (Markdown source):\nPushing the working branch is what runs CI, including the Windows install-and-launch test. Merging into `main` and publishing a release stay with you in every case.\nRecommendation: Push `legacy` and the working branch, and open or update pull requests. Keep version tags for your request, because a tag drafts a release.\nSelection: multiple\nOptions: Push the legacy branch / Push the working branch (runs CI) / Open and update pull requests / Push version tags (drafts a release)\nSelected: Push the legacy branch / Push the working branch (runs CI)\nNotes: \n```\n\n## Question 34\n\n```text\nRound: Handoff readiness\nQuestion: How far should the next agent go before checking in with you?\nDescription (Markdown source):\nEach milestone ends with a verification run in the wiki either way. Consequential decisions that are not already settled go to you through grill-form.\nRecommendation: Through all milestones, pausing only for consequential decisions and the actions you reserved. Per-milestone pull requests still give you a review point for each step.\nSelection: single\nOptions: Through all milestones / One milestone at a time; wait for my review after each / Milestone 1 only, then stop\nSelected: Through all milestones\nNotes: \n```\n\n## Question 35\n\n```text\nRound: Handoff readiness\nQuestion: Which live checks may the next agent run?\nDescription (Markdown source):\nTests use simulated inference and recorded source responses by default. Real inference uses your ChatGPT subscription allowance; you sign in once in the development build. Live checks use a fictional profile, never your real data. Live scans are ordinary read-only requests within each source's limits.\nRecommendation: Both, kept small: a few real generations per milestone and bounded scans.\nSelection: single\nOptions: Real inference and live scans / Live scans only / Real inference only / Neither; simulated and recorded data only\nSelected: Real inference and live scans\nNotes: \n```\n\n## Question 36\n\n```text\nRound: Handoff readiness\nQuestion: Will you test Windows builds on your PC?\nDescription (Markdown source):\nCI installs and launches the packaged app on a clean Windows runner, but cannot judge responsiveness or the real first-run experience. Each CI run keeps the installer as a downloadable artifact for 7 days.\nRecommendation: After each milestone. Windows was the failing platform, so a quick install-and-click on real hardware catches what CI cannot.\nSelection: single\nOptions: After each milestone / Only before releases / No; rely on CI\nSelected: Only before releases\nNotes: \n```\n\n## Question 37\n\n```text\nRound: Handoff readiness\nQuestion: What should closing the window do on Windows?\nDescription (Markdown source):\nOn macOS, closing the window keeps werk running in the Dock with scheduled scans until Quit (your earlier choice). Windows has no Dock: a running app without a window is invisible unless it has a tray icon, which matches the “stops in the background” confusion you reported.\nRecommendation: Keep running in the system tray, with Open and Quit in the tray menu. Scans keep their schedule on both platforms.\nSelection: single\nOptions: Keep running in the system tray / Quit; scans run only while werk is open\nSelected: Keep running in the system tray\nNotes: \n```\n\n## Question 38\n\n```text\nRound: Handoff readiness\nQuestion: How should CV compilation be isolated on Windows?\nDescription (Markdown source):\nLaTeX can read local files into the PDF. The assistant edits the CV source and job descriptions are untrusted, so a crafted posting could try to make your CV include a private file that you later send. macOS isolates Tectonic with the built-in `sandbox-exec` profile from the legacy app. The legacy Windows build ran Tectonic inside an AppContainer through a small Go helper, which passed Windows checks on 17 October.\nRecommendation: Reuse the Go AppContainer helper, built in CI. It is the one non-TypeScript component, but it is small and already verified; the alternative can be bypassed with LaTeX macros.\nSelection: single\nOptions: Reuse the Go AppContainer helper / No OS isolation; reject file-reading commands in the source\nSelected: Something else\nNotes: what are better solutions thatn to go appcontainer helper if we're gonna do it from scratch?\n```\n\n## Question 39\n\n```text\nRound: Handoff readiness\nQuestion: Should the GitHub repository be renamed to werk?\nDescription (Markdown source):\n`rengwu/werk` is available. GitHub redirects old URLs, API calls and git remotes after a rename. Releases and the update check would use the new name. I would rename it with `gh` and update the local remote.\nRecommendation: Rename now, before any werk commits or releases, so the new docs, builds and update check use the final name.\nSelection: single\nOptions: Rename to werk now / Rename at the first release / Keep ununemploy\nSelected: Rename at the first release\nNotes: \n```\n\n## Question 40\n\n```text\nRound: Handoff readiness\nQuestion: Which app icon should werk use?\nDescription (Markdown source):\nShown at Dock size and at the 32 px and 16 px sizes used by the Windows taskbar and title bar, on light and dark backgrounds. The chosen design would be redrawn as paths and exported to `.icns` and `.ico`.\nRecommendation: The dark monogram. It stays legible at 16 px and fits the neutral visual language.\nSelection: single\nOptions: Dark monogram / Light monogram with match dot / Inbox tray with check / Default Electron icon until I provide one\nSelected: Light monogram with match dot\nNotes: \n```\n\n## Question 41\n\n```text\nRound: Handoff readiness\nQuestion: Which license should werk's source code use?\nDescription (Markdown source):\nThe repository is public with no license: others can read the code but have no right to reuse it. Releases bundle third-party components with their own licenses (Electron, Tectonic, GeoNames CC BY 4.0, tzdb, the sb2nov CV template); werk includes their notices whichever you choose.\nRecommendation: MIT if you want others to reuse the code freely. Choose no license if you want to keep all rights while still publishing the app.\nSelection: single\nOptions: MIT / Apache-2.0 / GPL-3.0 / No license (all rights reserved)\nSelected: MIT\nNotes: \n```\n\n## Question 42\n\n```text\nRound: Handoff readiness\nQuestion: Which sources should >\n\u003ch2 id=\"question-45\">Question 45\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Handoff readiness\nQuestion: Anything else the next agent should know before starting?\nDescription (Markdown source):\nPreferences, constraints, things to avoid, or anything in the handoff that reads differently from your intent.\nRecommendation: \nSelection: single\nOptions: (free text)\nSelected: (unanswered)\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"]},{"id":"journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","title":"Interview answers — round 4","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Interview answers — round 4\nsection: Journal\nupdated: 2026-11-01\nstatus: Submitted\n---\n# Interview answers — round 4\n\nSubmitted answers; interpretation and accepted decisions are recorded in the [clean rebuild plan](2026-11-01-rebuild.md) and the [implementation handoff](2026-11-01-werk-handoff.md).\n\nSession: `79bc64157692f581ef75d39f3c59308f`\n\n## Question 46\n\n```text\nRound: CV compiler isolation\nQuestion: How should werk isolate CV compilation?\nDescription (Markdown source):\nYou asked what would be better than the Go helper if we started from scratch. I tested Tectonic 0.15.0 (the compiler werk will use) without a sandbox, with all of its security options on (`--untrusted`, cached packages only). A crafted CV source could still:\n\n- **read any file you can**, by absolute path or `../`, including through obfuscated macros, images and embedded PDFs;\n- **write any file you can** the same way. That is enough to plant a script that runs at login.\n\nTectonic records each file it reads and writes, but only after the write has happened, so checking afterwards is not safe. Last round's fallback, rejecting file commands in the source, would not stop this either. A boundary in the operating system or in the engine is required.\n\n| Approach | Status |\n| --- | --- |\n| OS sandbox: the built-in `sandbox-exec` on macOS, an AppContainer helper on Windows | Verified for the legacy app on both platforms (Windows checks passed on 17 October). The helper is about 230 lines of Go, built in CI. |\n| TeX compiled to WebAssembly with an in-memory file system | No file access at all, by construction. Identical on both platforms, with no helper. But every candidate is unsuitable today: busytex (MIT) is TeX Live 2023, browser-only and has no published releases; its TeX Live 2026 fork, TeXlyre BusyTeX, and SwiftLaTeX (last updated 2024) are AGPL-3.0, which conflicts with MIT. |\n| A werk build of Tectonic that refuses paths outside its work folder | The same compiler on both platforms without an OS sandbox, but werk would build and maintain its own Tectonic: a large Rust and C build in CI. |\n| Calling AppContainer from TypeScript through a native FFI library | Removes Go, but adds a native module and rewrites code that is already verified. |\nRecommendation: The OS sandbox, reusing the verified helper. It is the only option that is both proven and maintainable today. WebAssembly is the better design once a maintained, permissively licensed TeX build exists; the handoff notes that as a later replacement.\nSelection: single\nOptions: OS sandbox: sandbox-exec on macOS, the Go AppContainer helper on Windows / Try busytex WebAssembly in milestone 4; fall back to the OS sandbox if it fails / A werk build of Tectonic that refuses outside paths\nSelected: OS sandbox: sandbox-exec on macOS, the Go AppContainer helper on Windows\nNotes: why do we need an isolated sandbox for cv compilation?\n```\n","toc":[{"id":"question-46","title":"Question 46","depth":2}],"titleAnchor":"interview-answers-round-4","links":["journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded in the \u003ca href=\"#/journal/2026-11-01-rebuild\">clean rebuild plan\u003c/a> and the \u003ca href=\"#/journal/2026-11-01-werk-handoff\">implementation handoff\u003c/a>.\u003c/p>\n\u003cp>Session: \u003ccode>79bc64157692f581ef75d39f3c59308f\u003c/code>\u003c/p>\n\u003ch2 id=\"question-46\">Question 46\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: CV compiler isolation\nQuestion: How should werk isolate CV compilation?\nDescription (Markdown source):\nYou asked what would be better than the Go helper if we started from scratch. I tested Tectonic 0.15.0 (the compiler werk will use) without a sandbox, with all of its security options on (`--untrusted`, cached packages only). A crafted CV source could still:\n\n- **read any file you can**, by absolute path or `../`, including through obfuscated macros, images and embedded PDFs;\n- **write any file you can** the same way. That is enough to plant a script that runs at login.\n\nTectonic records each file it reads and writes, but only after the write has happened, so checking afterwards is not safe. Last round's fallback, rejecting file commands in the source, would not stop this either. A boundary in the operating system or in the engine is required.\n\n| Approach | Status |\n| --- | --- |\n| OS sandbox: the built-in `sandbox-exec` on macOS, an AppContainer helper on Windows | Verified for the legacy app on both platforms (Windows checks passed on 17 October). The helper is about 230 lines of Go, built in CI. |\n| TeX compiled to WebAssembly with an in-memory file system | No file access at all, by construction. Identical on both platforms, with no helper. But every candidate is unsuitable today: busytex (MIT) is TeX Live 2023, browser-only and has no published releases; its TeX Live 2026 fork, TeXlyre BusyTeX, and SwiftLaTeX (last updated 2024) are AGPL-3.0, which conflicts with MIT. |\n| A werk build of Tectonic that refuses paths outside its work folder | The same compiler on both platforms without an OS sandbox, but werk would build and maintain its own Tectonic: a large Rust and C build in CI. |\n| Calling AppContainer from TypeScript through a native FFI library | Removes Go, but adds a native module and rewrites code that is already verified. |\nRecommendation: The OS sandbox, reusing the verified helper. It is the only option that is both proven and maintainable today. WebAssembly is the better design once a maintained, permissively licensed TeX build exists; the handoff notes that as a later replacement.\nSelection: single\nOptions: OS sandbox: sandbox-exec on macOS, the Go AppContainer helper on Windows / Try busytex WebAssembly in milestone 4; fall back to the OS sandbox if it fails / A werk build of Tectonic that refuses outside paths\nSelected: OS sandbox: sandbox-exec on macOS, the Go AppContainer helper on Windows\nNotes: why do we need an isolated sandbox for cv compilation?\n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"]},{"id":"journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","title":"Interview answers — round 2","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Interview answers — round 2\nsection: Journal\nupdated: 2026-11-01\nstatus: Submitted\n---\n# Interview answers — round 2\n\nSubmitted answers; interpretation and accepted decisions are recorded in the [clean rebuild plan](2026-11-01-rebuild.md) and the [implementation handoff](2026-11-01-werk-handoff.md).\n\nSession: `8310ced881c9d8f1fe6b9c2f5277b081`\n\n## Question 24\n\n```text\nRound: Rebuild: remaining decisions\nQuestion: What should the app produce as documents?\nDescription (Markdown source):\nOn the cover-letter PDF question you answered “just generate CVs in plain text.” Today the CV is LaTeX source compiled to PDF, and letters are plain-text paragraphs printed to PDF. Dropping LaTeX removes Tectonic (48 MB), its package cache (20 MB), the compiler sandbox, the LaTeX editor and the PDF preview. Plain text can still be pasted into an application form, a word processor or your own template.\nRecommendation: Plain text for both, with no PDF. It is the literal reading of your answer and removes the most code and size. A fixed-layout PDF can be added later if you find you need to attach files.\nSelection: single\nOptions: Plain text for the CV and letters; no LaTeX and no PDF / Plain text for both, plus a simple PDF from a fixed layout / Plain-text letters only; keep the LaTeX CV and its PDF\nSelected: Plain-text letters only; keep the LaTeX CV and its PDF\nNotes: oh sorry, i misunderstood. i want CVs in latex PDF, like today. plain text only for letters.\n```\n\n## Question 25\n\n```text\nRound: Rebuild: remaining decisions\nQuestion: How should the master CV be written?\nDescription (Markdown source):\nThe profile is the structured record of your career facts. Today the CV is a separate document that can drift from it. This applies to whichever format you chose above. Per-job CVs stay excluded either way. Generating creates a new CV version; manual and assistant edits are kept as versions and are never overwritten without your action.\nRecommendation: Generated from the profile on request, then editable. With a clean start, the setup checklist builds your profile first, so the CV follows from it instead of repeating the same facts by hand.\nSelection: single\nOptions: Generated from the profile on request, then edited by me or the assistant / Written by me or the assistant, independent of the profile (current approach)\nSelected: Generated from the profile on request, then edited by me or the assistant\nNotes: \n```\n\n## Question 26\n\n```text\nRound: Rebuild: remaining decisions\nQuestion: Where should the new code live?\nDescription (Markdown source):\nThe repository is public at github.com/rengwu/ununemploy and would host the releases. “Start clean” applies to your data; the code can still begin from an empty tree in this repository. Tagging keeps the current app's source available for reference and for porting proven logic such as source parsers and matching.\nRecommendation: This repository: tag the current app, start the new code on a branch, and keep the git history and wiki. The decisions and source research in the wiki still apply.\nSelection: single\nOptions: This repository: tag the current app, new code on a branch, keep history and wiki / A new repository; archive this one / This repository, and restart the wiki too\nSelected: This repository, and restart the wiki too\nNotes: keep the old version archived on a legacy branch\n```\n\n## Question 27\n\n```text\nRound: Rebuild: remaining decisions\nQuestion: What happens to the current app during the rebuild?\nDescription (Markdown source):\nBoth apps are named ununemploy, so the released Electron app would use the same data folder, ~/Library/Application Support/ununemploy. Development builds use a separate folder either way. Your data is already backed up on the Desktop. I would confirm with you again before removing the app or its data folder.\nRecommendation: Keep using it until the new release, then remove it and move its data folder aside. You keep a working app in the meantime.\nSelection: single\nOptions: Keep using it until the new release; then remove it and move its data folder aside / Stop using it now; remove it and its data folder\nSelected: Stop using it now; remove it and its data folder\nNotes: rename the new app \"werk\"\n```\n\n## Question 28\n\n```text\nRound: Rebuild: remaining decisions\nQuestion: Where should release builds be made?\nDescription (Markdown source):\nGitHub Actions has macOS and Windows runners and is free for public repositories. A version tag would build unsigned installers (.dmg for macOS, .exe for Windows) and draft a GitHub Release. Building locally needs both a Mac and a Windows PC for every release. I would push tags or publish releases only when you ask.\nRecommendation: GitHub Actions on version tags. Every Windows build comes from a clean machine, which catches the installation and startup failures you reported before users see them.\nSelection: single\nOptions: GitHub Actions on version tags / Local builds on my machines, uploaded by hand\nSelected: GitHub Actions on version tags\nNotes: \n```\n\n## Question 29\n\n```text\nRound: Rebuild: remaining decisions\nQuestion: When should implementation start?\nDescription (Markdown source):\nProposed milestones; each ends with a verification run in the wiki.\n\n| Milestone | Outcome |\n| --- | --- |\n| 1 | Electron shell, backend process, database schema, unsigned installers for both platforms, update notice. Proves Windows installation and startup first. |\n| 2 | Setup checklist, ChatGPT sign-in, profile fact sheet with search criteria, assistant overlay. |\n| 3 | Sources in Settings, collection, matching, triage inbox and job detail. |\n| 4 | Saved workspace, cover letters and the master CV. |\n| 5 | Diagnostics, backups, keyboard triage, Hide company, first public release. |\nRecommendation: Start now with milestone 1. It addresses Windows installation and delivery, the failures you reported, before any features are rebuilt.\nSelection: single\nOptions: Start now with milestone 1 / Write the milestone plan in the wiki first for my approval / Not yet\nSelected: Start now with milestone 1\nNotes: \n```\n","toc":[{"id":"question-24","title":"Question 24","depth":2},{"id":"question-25","title":"Question 25","depth":2},{"id":"question-26","title":"Question 26","depth":2},{"id":"question-27","title":"Question 27","depth":2},{"id":"question-28","title":"Question 28","depth":2},{"id":"question-29","title":"Question 29","depth":2}],"titleAnchor" rkdown source):\nBoth apps are named ununemploy, so the released Electron app would use the same data folder, ~/Library/Application Support/ununemploy. Development builds use a separate folder either way. Your data is already backed up on the Desktop. I would confirm with you again before removing the app or its data folder.\nRecommendation: Keep using it until the new release, then remove it and move its data folder aside. You keep a working app in the meantime.\nSelection: single\nOptions: Keep using it until the new release; then remove it and move its data folder aside / Stop using it now; remove it and its data folder\nSelected: Stop using it now; remove it and its data folder\nNotes: rename the new app \"werk\"\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-28\">Question 28\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild: remaining decisions\nQuestion: Where should release builds be made?\nDescription (Markdown source):\nGitHub Actions has macOS and Windows runners and is free for public repositories. A version tag would build unsigned installers (.dmg for macOS, .exe for Windows) and draft a GitHub Release. Building locally needs both a Mac and a Windows PC for every release. I would push tags or publish releases only when you ask.\nRecommendation: GitHub Actions on version tags. Every Windows build comes from a clean machine, which catches the installation and startup failures you reported before users see them.\nSelection: single\nOptions: GitHub Actions on version tags / Local builds on my machines, uploaded by hand\nSelected: GitHub Actions on version tags\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-29\">Question 29\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Rebuild: remaining decisions\nQuestion: When should implementation start?\nDescription (Markdown source):\nProposed milestones; each ends with a verification run in the wiki.\n\n| Milestone | Outcome |\n| --- | --- |\n| 1 | Electron shell, backend process, database schema, unsigned installers for both platforms, update notice. Proves Windows installation and startup first. |\n| 2 | Setup checklist, ChatGPT sign-in, profile fact sheet with search criteria, assistant overlay. |\n| 3 | Sources in Settings, collection, matching, triage inbox and job detail. |\n| 4 | Saved workspace, cover letters and the master CV. |\n| 5 | Diagnostics, backups, keyboard triage, Hide company, first public release. |\nRecommendation: Start now with milestone 1. It addresses Windows installation and delivery, the failures you reported, before any features are rebuilt.\nSelection: single\nOptions: Start now with milestone 1 / Write the milestone plan in the wiki first for my approval / Not yet\nSelected: Start now with milestone 1\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-11-01-rebuild"]},{"id":"journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7","title":"Interview answers — round 5","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Interview answers — round 5\nsection: Journal\nupdated: 2026-11-01\nstatus: Submitted\n---\n# Interview answers — round 5\n\nSubmitted answers; interpretation and accepted decisions are recorded in the [clean rebuild plan](2026-11-01-rebuild.md) and the [implementation handoff](2026-11-01-werk-handoff.md).\n\nSession: `9472293cf4bb700313881eac8d7833b7`\n\n## Question 47\n\n```text\nRound: CV compiler isolation, rule-lean\nQuestion: Should werk remove the need for a CV sandbox instead of building one?\nDescription (Markdown source):\n**Why a sandbox at all.** LaTeX is a programming language that can read and write files. In the current plan, the assistant edits your CV's LaTeX, and it also reads job postings, which anyone can write. A posting with hidden instructions could get the assistant to add a line that copies a private file, such as your ChatGPT sign-in token, into your CV PDF. You would then send that PDF to the employer who wrote the posting. My test showed that Tectonic does this even with its safety options on, and can also write files anywhere, such as a script that runs at login. The sandbox blocks both.\n\n**The rule-lean alternative removes the cause.** Untrusted text never becomes LaTeX. The model writes CV content as plain fields, and werk's template escapes them into LaTeX, so they can only ever print as text. Only you type LaTeX. To change the CV, the assistant edits facts in your profile or regenerates the CV with your instructions (for example “one page, lead with backend work”). Each regeneration is a new version, and your manual edits stay in earlier versions.\n\n| | Keep the sandbox | Untrusted text never becomes LaTeX |\n| --- | --- | --- |\n| Assistant and the CV | Edits the LaTeX directly | Regenerates with your instructions; edits profile facts |\n| Code to build and keep working | macOS sandbox profile; 230-line Go helper for Windows; Go in CI; AppContainer setup (private copies of the compiler and packages, redirected folders, a font configuration) | One escaping function with tests |\n| Windows risk | The most platform-specific part of werk | Nothing added |\n| LaTeX you paste from elsewhere | Compiled inside the sandbox | Runs with your permissions, as in any local TeX setup |\nRecommendation: Remove the cause. It closes the same hole with far less code, drops werk's only non-TypeScript component and its most Windows-specific setup, and keeps the assistant useful for the CV through regeneration.\nSelection: single\nOptions: No sandbox: untrusted text never becomes LaTeX; the assistant regenerates instead of editing LaTeX / Keep the OS sandbox; the assistant edits LaTeX directly\nSelected: Keep the OS sandbox; the assistant edits LaTeX directly\nNotes: \n```\n","toc":[{"id":"question-47","title":"Question 47","depth":2}],"titleAnchor":"interview-answers-round-5","links":["journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded in the \u003ca href=\"#/journal/2026-11-01-rebuild\">clean rebuild plan\u003c/a> and the \u003ca href=\"#/journal/2026-11-01-werk-handoff\">implementation handoff\u003c/a>.\u003c/p>\n\u003cp>Session: \u003ccode>9472293cf4bb700313881eac8d7833b7\u003c/code>\u003c/p>\n\u003ch2 id=\"question-47\">Question 47\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: CV compiler isolation, rule-lean\nQuestion: Should werk remove the need for a CV sandbox instead of building one?\nDescription (Markdown source):\n**Why a sandbox at all.** LaTeX is a programming language that can read and write files. In the current plan, the assistant edits your CV's LaTeX, and it also reads job postings, which anyone can write. A posting with hidden instructions could get the assistant to add a line that copies a private file, such as your ChatGPT sign-in token, into your CV PDF. You would then send that PDF to the employer who wrote the posting. My test showed that Tectonic does this even with its safety options on, and can also write files anywhere, such as a script that runs at login. The sandbox blocks both.\n\n**The rule-lean alternative removes the cause.** Untrusted text never becomes LaTeX. The model writes CV content as plain fields, and werk's template escapes them into LaTeX, so they can only ever print as text. Only you type LaTeX. To change the CV, the assistant edits facts in your profile or regenerates the CV with your instructions (for example “one page, lead with backend work”). Each regeneration is a new version, and your manual edits stay in earlier versions.\n\n| | Keep the sandbox | Untrusted text never becomes LaTeX |\n| --- | --- | --- |\n| Assistant and the CV | Edits the LaTeX directly | Regenerates with your instructions; edits profile facts |\n| Code to build and keep working | macOS sandbox profile; 230-line Go helper for Windows; Go in CI; AppContainer setup (private copies of the compiler and packages, redirected folders, a font configuration) | One escaping function with tests |\n| Windows risk | The most platform-specific part of werk | Nothing added |\n| LaTeX you paste from elsewhere | Compiled inside the sandbox | Runs with your permissions, as in any local TeX setup |\nRecommendation: Remove the cause. It closes the same hole with far less code, drops werk's only non-TypeScript component and its most Windows-specific setup, and keeps the assistant useful for the CV through regeneration.\nSelection: single\nOptions: No sandbox: untrusted text never becomes LaTeX; the assistant regenerates instead of editing LaTeX / Keep the OS sandbox; the assistant edits LaTeX directly\nSelected: Keep the OS sandbox; the assistant edits LaTeX directly\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"]},{"id":"journal/2026-11-01-rebuild","title":"Clean rebuild plan — 1 November 2026","section":"Journal","order":0,"metadata":{"status":"Ready for implementation"},"metadataHtml":"\u003cspan>Status: Ready for implementation\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Clean rebuild plan — 1 November 2026\nsection: Journal\nupdated: 2026-11-01\nstatus: Ready for implementation\n---\n# Clean rebuild plan — 1 November 2026\n\n## Request and status\n\nOn 1 November 2026 the user asked for a redesign from first principles, covering architecture and implementation as well as UI/UX: “if you were to rebuild the same thing from scratch, how would you do it?” Feature additions and removals were in scope, following jstack `rule-lean`. The stated reason: “it is clunky, feels unoptimized, large bundle size, and buggy. macos feel stable but the windows build is unusable, and app delivery is bad.”\n\nThe proposals were presented in two grill-form rounds: [round 1](2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4.md) and [round 2](2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081.md). In round 2 the user authorized starting milestone 1, then asked for a handoff to another agent instead of continuing in the same session. The [implementation handoff](2026-11-01-werk-handoff.md) consolidates these decisions into a specification. The user then asked to resolve its open questions before handing over; [round 3](2026-11-01-grill-28a582f50b30795a161c06d0221e222e.md) and [round 4](2026-11-01-grill-79bc64157692f581ef75d39f3c59308f.md) and [round 5](2026-11-01-grill-9472293cf4bb700313881eac8d7833b7.md) did that. The same session deleted the old app, archived it on `legacy`, and restructured the repository and wiki for werk. The [decision register](../decisions/index.md) is the current list of decisions; the table below is the record of rounds 1 and 2.\n\n## Findings\n\nMeasured on 1 November 2026 with read-only queries and file listings.\n\n| Area | Observation |\n| --- | --- |\n| Package | Installed macOS bundle 698 MB: application with full `node_modules` 310 MB, headless Chromium 198 MB (letter PDFs and legacy resume exports only), Node + Tectonic + sandbox helper 155 MB, TeX cache 20 MB. The Windows package measured 1.0 GB on 18 October, before the Pi change (legacy wiki: Pi runtime handoff). |\n| Database | Canonical SQLite database 2.0 GB plus a 188 MB WAL. HTTP response bodies 979 MB, source item versions 380 MB, jobs 352 MB, source items 282 MB. |\n| Collection | 45,351 jobs. About half are classified Other and about a sixth Stretch. Opened, saved and applied counts and per-source yield were measured locally and are retained outside the wiki as application records; all saved jobs were Strong or Adjacent. |\n| Process model | API and worker run as separate processes coordinated through SQLite leases, a heartbeat and revision triggers. The UI polls every 8 seconds, and filtering rebuilds an in-memory snapshot of every job. |\n| Frontend | 3.5 MB built: LaTeX editor chunk 964 KB plus 273 KB CSS, pdf.js worker 1.1 MB, assistant chunk 295 KB, main chunk 548 KB. |\n| Windows | User-reported: installation fails or is confusing; blank window or will not start; slow or freezes; crashes or stops in the background. |\n\n## Accepted direction\n\nThese decisions apply to the rebuilt app. Unless a row says otherwise, the user accepted the recommendation presented in the form.\n\n| ID | Decision |\n| --- | --- |\n| REB-audience | Public GitHub release for anyone. Platforms: macOS Apple Silicon and Windows 11 x64. Unraid/Docker and Linux desktop are dropped from the rebuild. |\n| REB-runtime | Electron, TypeScript only. The packaging tool replaces the Go/Cocoa/Win32 hosts, PowerShell installer and checksum inventory. Electron 44.9.0 includes `node:sqlite` with FTS5 (verified), so no native module is needed. |\n| REB-delivery | Unsigned builds on both platforms; an in-app notice links to a newer GitHub release (a read-only check). This differs from the recommendation to sign. Consequence: Gatekeeper and SmartScreen prompts on first open and no automatic updates, so install instructions must explain both. |\n| REB-clean | Start completely clean. Import no profile, CV, jobs or letters. User note: “dont import profile or CV. start completely clean. but keep a backup of my data, and put it on ~/Desktop/ununemploy-backup”. This differs from the recommended ZIP import. |\n| REB-process | One backend process owns the API, scheduler and serialized model queue. It pushes changes to the UI and persists queued work in SQLite. |\n| REB-retention | Keep Strong and Adjacent jobs unless they are Incompatible. Keep a fingerprint (URL, content hash, profile revision) for everything else, and re-check it on the next sighting after a profile change. Delete unsaved jobs 30 days after they close. No HTTP body cache, and no description history for unsaved jobs; saving still snapshots the description. |\n| REB-documents | The CV stays LaTeX with a compiled PDF, as today. Cover letters are plain text only: no PDF, no LaTeX letter template and no Chromium. User correction in round 2: “i want CVs in latex PDF, like today. plain text only for letters.” |\n| REB-cv-source | The master CV is generated from the profile on request, then edited by the user or the assistant. Each generation is a new version; manual edits are never overwritten without the user's action. Per-job CVs remain excluded. |\n| REB-name | The new app is named **werk**, styled in lowercase. |\n| REB-repo | Same repository. The current app is archived on a `legacy` branch, and the wiki restarts for werk. |\n| REB-retire | Stop using the current app now; remove it and its data folder. The user confirmed the exact paths in round 3, and they were deleted on 1 November. |\n| REB-builds | Release builds run on GitHub Actions when a version tag is pushed, producing unsigned installers in a draft GitHub Release. |\n| REB-start | Start implementation with milestone 1: shell, backend process, database foundation, unsigned installers for both platforms and the update notice, proving Windows installation and startup first. |\n| REB-stack | Backend bundled with esbuild. Typed columns, SQL indexes and FTS5 search, with JSON only for raw source evidence. TanStack Query invalidated by push events. One module per page. A plain chat UI instead of assistant-ui. Minimal CodeMirror for the LaTeX editor and the built-in Chromium PDF viewer for the CV preview. Ported unit tests plus one Playwright suite against the packaged app on both platforms. Settings → Diagnostics. |\n| REB-inbox | The opening screen is a triage inbox. **New** lists unreviewed jobs that pass the search criteria, best match first. Save or Skip removes a job from New, and **All matches** keeps it searchable. Unopened titles are bold. |\n| REB-criteria | Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily. |\n| REB-timezone | Minimum working-hours overlap with the user's timezone, at country level, replacing the UTC range map and rotating offset. |\n| REB-detail | A decision summary followed by the description with matched and missing requirements highlighted. No Match tab or metadata grid. |\n| REB-saved | A saved job opens a workspace: posting and notes beside the letter, with review notes and status visible. |\n| REB-lifecycle | Saved and Applied only, as manual records shown in the job header and list. |\n| REB-profile | A fact sheet with status and source for each fact, editable directly or through the assistant. This revises the 8 October read-only viewer; direct edits are attributed to the user with a date. |\n| REB-navigation | Inbox, Saved, Profile and CV; Sources moves inside Settings. |\n| REB-sources | Keep sources that produced saves, Greenhouse/Ashby/Lever company boards, structured feeds and APIs, and scraped public boards. Drop Hacker News (Who's Hiring and YC jobs), X search, and the configured boards that never returned a job: Indeed, Careerjet, Jooble, Adzuna, Tech in Asia, Welcome to the Jungle, NodeFlair, Tech Jobs for Good, Foorilla and Web3.career. Keeping scraped boards differs from the recommendation. |\n| REB-additions | Keyboard triage, a first-run setup checklist, and Hide company. Not selected: Track company, status counts, recording versions when applying, saved views. |\n| REB-removals | Seen state and filter, the duplicate grouping control, legacy resume code, retired Jev code, the HTTP body cache, description history for unsaved jobs, VueJobs detail enrichment, and the custom installer and checksum inventory. |\n\nUnchanged: no application submission, uploads, form filling, outreach or engagement; pi-ai with the ChatGPT subscription, `gpt-5.6-sol` and high reasoning; a cover letter generated on save; the right-hand assistant overlay; local data with no login; deterministic matching and eligibility evidence rules; the Cursor/Clarity visual language. ZIP backups remain an existing requirement for the new app's own data unless changed.\n\n## Effect on current requirements\n\n`AGENTS.md` was replaced with the werk version, the wiki restarted, and the previous app was archived on the `legacy` branch. Superseded: the Unraid target, the Go/WKWebView hosts, the read-only profile viewer, the browse-everything inbox, Seen, cover-letter PDFs and the ununemploy name. Unchanged boundaries carry over verbatim.\n\n## Data backup\n\nOn 1 November the user's data was copied to `~/Desktop/ununemploy-backup`, which is local only and contains credentials. It holds the installed app's appdata, the checkout's ignored evidence files and `.env`, and the older `.local-data`. Both databases were copied with SQLite's backup API; `PRAGMA quick_check` returned ok and selected table row counts matched the originals. A README in the folder lists the contents. Before `.local-data` was deleted, the private grill-form records were moved into the backup's `grill/` folder.\n\n## Questions\n\nResolved in rounds 3 to 5; see the handoff's [resolved questions](2026-11-01-werk-handoff.md#questions-resolved-before-handoff). Later items are in [Open questions](../discussions/open-questions.md).\n","toc":[{"id":"request-and-status","title":"Request and status","depth":2},{"id":"findings","title":"Findings","depth":2},{"id":"accepted-direction","title":"Accepted direction","depth":2},{"id":"effect-on-current-requirements","title":"Effect on current requirements","depth":2},{"id":"data-backup","title":"Data backup","depth":2},{"id":"questions","title":"Questions","depth":2}],"titleAnchor":"clean-rebuild-plan-1-november-2026","links":["journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","journal/2026-11-01-werk-handoff","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e2  to \u003ccode>~/Desktop/ununemploy-backup\u003c/code>, which is local only and contains credentials. It holds the installed app's appdata, the checkout's ignored evidence files and \u003ccode>.env\u003c/code>, and the older \u003ccode>.local-data\u003c/code>. Both databases were copied with SQLite's backup API; \u003ccode>PRAGMA quick_check\u003c/code> returned ok and selected table row counts matched the originals. A README in the folder lists the contents. Before \u003ccode>.local-data\u003c/code> was deleted, the private grill-form records were moved into the backup's \u003ccode>grill/\u003c/code> folder.\u003c/p>\n\u003ch2 id=\"questions\">Questions\u003c/h2>\n\u003cp>Resolved in rounds 3 to 5; see the handoff's \u003ca href=\"#/journal/2026-11-01-werk-handoff~questions-resolved-before-handoff\">resolved questions\u003c/a>. Later items are in \u003ca href=\"#/discussions/open-questions\">Open questions\u003c/a>.\u003c/p>\n","backlinks":["index","decisions/index","journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7","journal/2026-11-01-werk-handoff"]},{"id":"journal/2026-11-01-werk-handoff","title":"werk implementation handoff — 1 November 2026","section":"Journal","order":0,"metadata":{"status":"Ready for implementation"},"metadataHtml":"\u003cspan>Status: Ready for implementation\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: werk implementation handoff — 1 November 2026\nsection: Journal\nupdated: 2026-11-01\nstatus: Ready for implementation\n---\n# werk implementation handoff — 1 November 2026\n\nThis is the specification for the next implementing agent. **werk** is a clean rebuild of ununemploy. The user's decisions are in the [decision register](../decisions/index.md), which links the four answer transcripts; the [rebuild plan](2026-11-01-rebuild.md) has the findings behind them. This page turns them into an implementation plan. The user answered every question that blocked implementation before this handoff, so it is ready to work from.\n\nLabels used below:\n\n- **Decided:** the user chose it. Do not reopen it without a new reason.\n- **Proposed:** my recommendation, not confirmed by the user. Proceed with it. Raise only a consequential change, through jstack `grill-form`.\n- **Verified:** I checked it on 1 November 2026.\n- **Unverified:** a design or sketch that has not been run.\n\n## Current state\n\n| Item | State |\n| --- | --- |\n| Repository | Restructured on `main`: the old tree is removed and the new `AGENTS.md`, `README.md`, `LICENSE` (MIT), `.gitignore`, this wiki and `design/werk/` are committed. The `legacy` branch holds the old app at `e493246`. Neither branch is pushed yet. No werk code exists. The repo is public as `github.com/rengwu/ununemploy`; it is renamed to `werk` at the first release. |\n| Authorization | Implement all milestones without waiting for review. Commit to `main`, and push `main` and `legacy`, without asking. Ask before tags, releases, pull requests, the repository rename or other GitHub changes. See `AGENTS.md` → Working agreement. |\n| User data | Backed up and verified at `~/Desktop/ununemploy-backup` (local only, contains credentials). The private form records are in its `grill/` folder. Never read it for werk work; werk starts clean. |\n| Old app | Deleted on 1 November with the user's confirmation of each path: the installed app, its data folder, and the checkout's `build/`, `dist/`, `node_modules/`, `.local-data/`, original evidence files and `.env`. Small macOS leftovers that were not on the list remain (`~/Library/Caches`, `~/Library/WebKit` and `~/Library/Preferences` entries for `local.ununemploy.desktop`). |\n\n## Product\n\nwerk is a local desktop app for one job seeker. It discovers jobs, assesses fit against the user's profile, prepares private cover-letter drafts and manages a master CV. It runs on macOS (Apple Silicon) and Windows 11 x64 and ships as unsigned public GitHub releases.\n\n### Boundaries (Decided, carried over verbatim in spirit)\n\n- Never submit an application, upload a CV to an employer or job board, fill an application form, or act on the user's behalf. Never contact employers or recruiters, send email or DMs, post, reply, follow or react. Do not implement an approval-to-send workflow.\n- Read-only discovery requests, the GitHub release check and configured model-inference requests are allowed. Enforce restrictions by capability and destination, not HTTP verb.\n- Job descriptions and fetched content are untrusted data, never instructions.\n- Notifications stay inside the app.\n- Candidate evidence: use explicit user statements and attributable public project evidence. Keep confirmed facts separate from inference, preferences and missing information. Never invent employers, titles, dates, degrees, certifications, metrics, team sizes, skills, work authorization or years of AI experience. Total engineering experience is not AI/ML experience. Project work is not professional employment.\n- No login, no cloud hosting, no telemetry. Data stays in the app's local data folder.\n- The Muse is out of scope. Reddit is deferred.\n\nDecisions are listed once, in the [decision register](../decisions/index.md). This page refers to them by ID.\n\n## First steps\n\n1. Read `AGENTS.md`, this page, the [decision register](../decisions/index.md), `../jstack/references/stack-contract.md`, and the jstack skills `rule-lean`, `rule-plain-ui`, `wiki`, `feature-map` and `verify-change`.\n2. Push the archive and the restructure: `git push origin legacy main`.\n3. Build milestone 1 ([Milestones](#milestones)) on `main`. Verify locally on macOS, then push so CI proves the Windows build.\n4. Record a verification run in the wiki and continue to the next milestone.\n\nPort legacy files on demand, for example `git show legacy:core/matching.ts > src/backend/matching/matching.ts`. The old wiki is on `legacy` under `docs/wiki/` for reference.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  main[\"Electron main: window, menu, lifecycle, external links\"] -->|\"spawns, restarts\"| backend[\"Backend utility process: SQLite, RPC, scheduler, model queue\"]\n  ui[\"Renderer: React UI\"] \u003c-->|\"MessagePort RPC and push events\"| backend\n  main -->|\"brokers a MessagePort\"| ui\n  backend --> db[(\"werk.db: typed columns, FTS5\")]\n  backend --> sources[\"Job sources: read-only GET\"]\n  backend --> pi[\"pi-ai: ChatGPT subscription\"]\n  backend --> tectonic[\"Tectonic in a sandbox: CV PDF\"]\n  backend --> gh[\"GitHub releases API: update check\"]\n```\n\n### Processes\n\n| Process | Owns | Must not |\n| --- | --- | --- |\n| Main (`src/main/`) | Window creation, single-instance lock, menus, app lifecycle, starting and restarting the backend, brokering MessagePorts, opening external links with `shell.openExternal` (http/https only), native theme, file save dialogs, `Show in Finder/Explorer` | Touch the database or do slow work; it must stay responsive |\n| Backend (`src/backend/`, Electron `utilityProcess`) | SQLite, all domain logic, RPC handlers, push events, scan scheduler, serialized model queue, LaTeX compilation, update check, diagnostics | Import `electron` APIs other than `process.parentPort` |\n| Renderer (`src/renderer/`) | React UI, TanStack Query cache, keyboard handling | Use Node APIs (sandboxed, `contextIsolation: true`, `nodeIntegration: false`) |\n| Preload (`src/preload/`) | Exposes `window.werk` with `connect()`, `platform`, `setTheme(mode)`, `saveFile()` and forwards the backend port to the page | Anything else |\n\nVerified: Electron 44.9.0 runs Node 24.22.0 with SQLite 3.53.4, and `node:sqlite` with FTS5 works there (`ELECTRON_RUN_AS_NODE=1`). No native modules are needed. Unverified: the same inside `utilityProcess` and in a packaged app on Windows; the M1 smoke test must check both.\n\n### RPC protocol (Proposed)\n\nThe renderer talks to the backend over a MessagePort; there is no HTTP server and no open port.\n\n- **Handshake.** On load, the page calls `window.werk.connect()`. The preload sends IPC `werk:connect`. Main creates a `MessageChannelMain`, posts `port1` to the backend (`{type: \"connect\"}`) and `port2` to the page via `webContents.postMessage(\"werk:backend-port\", null, [port2])`. The preload forwards it to the page with `window.postMessage(\"werk:backend-port\", \"*\", ports)`; the page accepts only messages whose `source === window`.\n- **Request:** `{id: number, method: string, params: unknown}`. **Response:** `{id, result}` or `{id, error: {message, code}}`. **Push event:** `{event: string, data: unknown}`.\n- **Types:** `src/shared/api.ts` declares `interface Api { method(params): Result }` and `interface Events`. The renderer's `call\u003cK extends keyof Api>()` and the backend's handler map both use it. Validate params in the backend with zod (handlers are a trust boundary for content, even though the renderer is local).\n- **Restart.** If the backend exits unexpectedly, main records the exit code, restarts it after 1 s, sends `{type: \"init\", previousExit}` and brokers a new port. More than three restarts in 60 s stops restarting and shows a blocking error with **Copy diagnostics** and **Restart**. The renderer rejects in-flight calls with \"The backend restarted. Try again.\" and invalidates all queries on reconnect.\n- **Push invalidation.** The backend emits coarse events after commits: `jobs`, `saved`, `profile`, `sources`, `tasks`, `cv`, `assistant`, `ai`, `update`. The renderer maps each to TanStack Query keys and invalidates them. No polling.\n\n### Data folder\n\n| Build | Folder |\n| --- | --- |\n| Packaged | Electron `userData`: `~/Library/Application Support/werk`, `%APPDATA%\\werk` |\n| Development (`!app.isPackaged`) | `werk-dev` beside it |\n| Tests | `WERK_DATA_DIR` environment variable (set before `app.ready`, before the single-instance lock) |\n\nContents: `werk.db` (+ WAL), `pi-auth/` (pi-ai credentials, app-owned), `cv/\u003cversion>.pdf`, `attachments/` (assistant attachments for the current chat), `logs/main.log` (main-process crashes only; rotate at 1 MB).\n\n### Lifecycle\n\n- Single instance per data folder (`app.requestSingleInstanceLock()`); a second launch focuses the window.\n- Closing the window keeps werk running so queued letters and any scan schedule continue (Decided, REB-tray). **Quit** stops everything.\n  - macOS: werk stays in the Dock; clicking the Dock icon reopens the window.\n  - Windows: werk stays in the system tray (`Tray` with the app icon, tooltip \"werk\"). Clicking the icon opens the window; the menu has **Open werk** and **Quit werk**. Create the tray once at startup and keep it, as other background apps on Windows do.\n- Quit: main asks the backend to shut down (`{type: \"shutdown\"}`), waits up to 3 s for it to close SQLite, then exits. Unsaved edits in the renderer prompt before quit (`beforeunload` guard plus a `before-quit` check via IPC).\n\n### Security (Proposed)\n\n- `sandbox: true`, `contextIsolation: true`, `nodeIntegration: false`, `webSecurity: true`. CSP in `index.html`: `default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'self' blob:; frame-src blob:` (PDF preview uses a blob URL; verify the built-in viewer with `plugins: true`).\n- Deny `window.open` and in-page navigation; route http(s) URLs to `shell.openExternal`, ignore all other schemes.\n- Render job descriptions as sanitized text or Markdown without raw HTML or remote images.\n- Outbound requests only from the backend: configured sources (GET), `api.github.com` release check, pi-ai inference/auth, public URLs the user explicitly gives the assistant. Keep the legacy SSRF guard in `core/http.ts` (it uses `ipaddr.js` to block private addresses) for assistant URL reads.\n- LaTeX: treat CV source as untrusted. The assistant edits it and reads untrusted job descriptions, so a crafted posting could steer it. Compile only inside the isolation in [Tectonic file access](#tectonic-file-access).\n\n### Tectonic file access\n\nVerified on 1 November 2026 with Tectonic 0.15.0 on macOS, using the legacy app's flags (`--untrusted --only-cached`, `TECTONIC_UNTRUSTED_MODE=1`) and no OS sandbox. The source was read from stdin in an empty working directory.\n\n| Attempt in the CV source | Result |\n| --- | --- |\n| `\\input{/absolute/path}`, `\\input{../file}`, `\\openin` with `\\read` | The file is read and typeset into the PDF. |\n| The same through `\\csname @@input\\endcsname` with `\\string`-built paths | Read. Source-level filtering cannot stop it. |\n| `\\XeTeXpicfile` (an image) and `\\XeTeXpdffile` (a page of a PDF), absolute path | Embedded in the PDF. |\n| `\\immediate\\openout` to an absolute path and to `../` | **The file is written outside the output folder.** A crafted source could plant a script that runs at login. |\n| `\\font\\x=\"[/absolute/path]\"` | Opened; fails because the file is not a font. |\n\nTectonic's `--untrusted` only disables shell escape and extra search paths. Its main file I/O is created with absolute paths allowed (`FilesystemIo::new(root, false, true, …)` in `src/driver.rs`), and its comments say `../` is not restricted. `--makefile-rules` lists every file read or written, but only after the run, when a write has already happened. So werk needs a boundary below the TeX engine.\n\nDecided (REB-latex-isolation, rounds [4](2026-11-01-grill-79bc64157692f581ef75d39f3c59308f.md) and [5](2026-11-01-grill-9472293cf4bb700313881eac8d7833b7.md)): an OS sandbox on both platforms, and the assistant keeps editing LaTeX directly. Port both from `legacy` unchanged in behavior:\n\n- **macOS:** `/usr/bin/sandbox-exec` with the profile built by `macSandbox()` in legacy `core/latex/compile.ts`: no network, no process execution except Tectonic, reads denied in the home folder, data folder and temporary folders except the work directory and package cache, writes only in the work directory.\n- **Windows:** the Go helper `texsandbox.exe \u003cwork> \u003ccache> \u003ccompiler> \u003cargs…>` from legacy `desktop/cmd/texsandbox` and `desktop/internal/texsandbox`. It runs Tectonic in an AppContainer without network capabilities, on private copies of the compiler and cache, inside a one-process Job Object. Keep its known-folder redirection and minimal Fontconfig file; both were needed on 17 October (legacy `docs/wiki/journal/2026-10-17-windows-port.md`). This is werk's only non-TypeScript component.\n- Both: `--untrusted --only-cached`, `TECTONIC_UNTRUSTED_MODE=1`, source in a fresh temporary work directory, the legacy 30-second timeout and output limits. If the sandbox cannot start, fail the compile and keep the saved source; never fall back to running Tectonic unsandboxed.\n\n### Update notice\n\nThe backend checks `GET https://api.github.com/repos/rengwu/werk/releases/latest` (headers `Accept: application/vnd.github+json`, `User-Agent: werk/\u003cversion>`) 30 s after start and every 12 h. Compare the `tag_name` (`vX.Y.Z`) to the app version numerically; ignore prereleases and drafts, which that endpoint already excludes. A 404 means no releases. When newer, emit `update` and show the sidebar notice (design below) whose **Download** opens `html_url`. Record the last check time and result for Diagnostics. Keep the repo slug in one constant. It already uses the final name: the repository is renamed to `werk` just before the first release (REB-rename), so until then the check gets 404, which correctly means no releases.\n\n### Diagnostics\n\nSettings → Diagnostics shows and copies: werk version and update state; Electron, Chromium and Node versions; SQLite version, FTS5 availability, schema version and database size; OS and architecture
