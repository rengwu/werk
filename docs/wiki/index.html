<script type="application/json" id="wiki-data">{"title":"werk wiki","pages":[{"id":"index","title":"werk wiki","section":"Overview","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: werk wiki\nupdated: 2026-11-02\n---\n# werk wiki\n\nwerk is a local desktop app that finds matching jobs, explains the fit, drafts private cover letters and keeps a LaTeX CV. Project requirements are in `AGENTS.md`.\n\n## Start here\n\n- [Implementation handoff](journal/2026-11-01-werk-handoff.md): architecture, data model, screens, milestones, build and release.\n- [Decisions](decisions/index.md)\n- [Open questions](discussions/open-questions.md)\n- [Features](features/index.md)\n- [Verification](verification/index.md)\n\n## Journal\n\n- [werk v0.1.1](journal/2026-11-02-v0.1.1.md): release notes.\n- [More job sources](journal/2026-11-02-more-sources.md): added feeds, live observations and deferred candidates.\n- [Clean rebuild plan](journal/2026-11-01-rebuild.md): findings from the previous app and the accepted direction.\n- Interview answers: [round 1](journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4.md), [round 2](journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081.md), [round 3](journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e.md), [round 4](journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f.md), [round 5](journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7.md).\n","toc":[{"id":"start-here","title":"Start here","depth":2},{"id":"journal","title":"Journal","depth":2}],"titleAnchor":"werk-wiki","links":["journal/2026-11-01-werk-handoff","decisions/index","discussions/open-questions","features/index","verification/index","journal/2026-11-02-v0.1.1","journal/2026-11-02-more-sources","journal/2026-11-01-rebuild","journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7"],"attachments":[],"html":"\u003cp>werk is a local desktop app that finds matching jobs, explains the fit, drafts private cover letters and keeps a LaTeX CV. Project requirements are in \u003ccode>AGENTS.md\u003c/code>.\u003c/p>\n\u003ch2 id=\"start-here\">Start here\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/journal/2026-11-01-werk-handoff\">Implementation handoff\u003c/a>: architecture, data model, screens, milestones, build and release.\u003c/li>\n\u003cli>\u003ca href=\"#/decisions/index\">Decisions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/discussions/open-questions\">Open questions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/features/index\">Features\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/index\">Verification\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"journal\">Journal\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/journal/2026-11-02-v0.1.1\">werk v0.1.1\u003c/a>: release notes.\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-11-02-more-sources\">More job sources\u003c/a>: added feeds, live observations and deferred candidates.\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-11-01-rebuild\">Clean rebuild plan\u003c/a>: findings from the previous app and the accepted direction.\u003c/li>\n\u003cli>Interview answers: \u003ca href=\"#/journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4\">round 1\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081\">round 2\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e\">round 3\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f\">round 4\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7\">round 5\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":[]},{"id":"decisions/index","title":"Decisions","section":"Decisions","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Decisions\nsection: Decisions\nupdated: 2026-11-01\n---\n# Decisions\n\nCurrent decisions for werk. The initial decisions came from grill-form rounds; later direct instructions are recorded below. the transcripts hold the exact wording and the options offered: [round 1](../journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4.md), [round 2](../journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081.md), [round 3](../journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e.md), [round 4](../journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f.md), [round 5](../journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7.md). The [rebuild plan](../journal/2026-11-01-rebuild.md) records the findings behind them, and the [handoff](../journal/2026-11-01-werk-handoff.md) turns them into an implementation plan. The user's boundaries are in `AGENTS.md`.\n\n“Differs” marks a choice other than the recommendation offered.\n\n## Assistant revision after implementation feedback\n\n**REB-pi-session (2026-11-01):** The user requested interruption, dropped files, local-file access and visible network/tool capabilities, then clarified: “it is essentially just another pi session running on the user's computer with full permissions”. This supersedes the earlier bounded-action and supplied-URL restrictions. Embed pi's actual session runtime with unrestricted local read/write/edit/shell and network tools, persistent context, streamed replies, visible tool results, steering, interrupt-and-send and queued follow-ups. Keep the same app-owned ChatGPT subscription, model and reasoning level. Keep attributed, versioned app tools so profile, letter and CV changes remain reviewable. Validation errors return to pi for correction within the run.\n\nThe no-application/no-engagement product rules remain assistant instructions. With full shell and network access they are **not a capability-enforced security boundary**. Automated discovery retains its destination restrictions. werk's CV compilation tool still uses the OS sandbox. See [assistant behavior and verification](../features/assistant.md).\n\n## Product\n\n**REB-source-order (2026-11-02):** The user reported that enabling a source reset scrolling and requested that checkbox state no longer control sorting. Keep Sources alphabetical regardless of enabled state, preserving the row, scroll position and checkbox focus when toggled. See [discovery](../features/discovery.md).\n\n**REB-factory-reset (2026-11-02):** The user requested a Settings button to clear the entire app's state. Add a confirmed factory reset that removes personal records, conversations, copied attachments, app-owned ChatGPT credentials, schedules, source configuration and preferences, and returns to first-run setup. Cancel leaves data intact. Preserve originals and exports outside app-owned storage. Tests use fictional data; implementing the button does not authorize resetting the user's installation.\n\n| ID | Decision | Round |\n| --- | --- | --- |\n| REB-name | The app is **werk**, always lowercase. | 2 |\n| REB-audience | Public GitHub releases for anyone. macOS Apple Silicon and Windows 11 x64. No Unraid/Docker and no Linux desktop. | 1 |\n| REB-clean | Start completely clean: import no profile, CV, jobs or letters. The old data is backed up locally, outside the repository. Differs. | 1 |\n| REB-inbox | The opening screen is a triage inbox. **New** lists unreviewed jobs that pass the search criteria, best match first. Save or Skip removes a job from New; **All matches** keeps it searchable. Unopened titles are bold. | 1 |\n| REB-criteria | Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily. | 1 |\n| REB-timezone | Minimum working-hours overlap with the user's timezone, at country level. | 1 |\n| REB-detail | A decision summary, then the description with matched and missing requirements highlighted. | 1 |\n| REB-saved | A saved job opens a workspace: posting and notes beside the letter, with review notes and status. | 1 |\n| REB-lifecycle | Saved and Applied only, as manual records. | 1 |\n| REB-profile | A fact sheet with status and source for each fact, editable directly or through the assistant. | 1 |\n| REB-navigation | Inbox, Saved, Profile and CV; Sources, AI, Backup and Diagnostics inside Settings. | 1 |\n| REB-documents | The CV is LaTeX compiled to PDF. Cover letters are plain text only. | 2 |\n| REB-cv-source | The master CV is generated from the profile on request, then edited by the user or the assistant. Each generation is a new version. No per-job CVs. | 2 |\n| REB-additions | Keyboard triage, a first-run setup checklist, Hide company. | 1 |\n| REB-removals | Seen state, duplicate grouping control, legacy resume code, Jev, the HTTP body cache, description history for unsaved jobs, VueJobs detail enrichment, the custom installer and checksum inventory. | 1 |\n| REB-sources | Keep sources that produced saves, Greenhouse/Ashby/Lever company boards, structured feeds and APIs, and scraped public boards. Drop Hacker News, X and the boards that never returned a job. Keeping scraped boards differs. | 1 |\n| REB-default-sources | Initially 17 APIs/RSS feeds; expanded to 30 on 2 November after the user requested more job boards. The 20 scraped boards remain available but off. Missing catalog entries are added on startup without changing existing preferences or custom boards. Company boards are added by the user. See [research](../journal/2026-11-02-more-sources.md). | 3; user source-expansion request |\n| REB-schedule | Scans are manual by default. Settings can turn on a schedule. Differs (every 4 hours was recommended). | 3 |\n| REB-retention | Keep Strong and Adjacent jobs that are not Incompatible and pass the criteria; fingerprint everything else; delete unsaved jobs 30 days after they close. No HTTP body cache. | 1 |\n| Unchanged | No application submission, uploads, form filling, outreach or engagement; pi-ai with the ChatGPT subscription, `gpt-5.6-sol` and high reasoning; a cover letter generated on save; the right-hand assistant overlay; local data with no login; deterministic matching and eligibility rules; the Cursor/Clarity visual language; ZIP backup of personal data. | 1 |\n\n## Platform and delivery\n\n| ID | Decision | Round |\n| --- | --- | --- |\n| REB-runtime | Electron with TypeScript. `node:sqlite` with FTS5 works in Electron 44.9.0, so no native modules. The one exception is the Windows LaTeX sandbox helper in Go (REB-latex-isolation). | 1 |\n| REB-process | One backend process owns the API, scheduler and serialized model queue, and pushes changes to the UI. | 1 |\n| REB-stack | esbuild-bundled backend; typed columns, indexes and FTS5; TanStack Query invalidated by push events; plain chat UI; minimal CodeMirror; built-in PDF viewer; Playwright smoke tests against packaged apps; Settings → Diagnostics. | 1 |\n| REB-tray | Closing the window keeps werk running: in the Dock on macOS, in the system tray on Windows. | 3 |\n| REB-latex-isolation | CV LaTeX compiles only inside an OS sandbox: `sandbox-exec` on macOS, the legacy Go AppContainer helper on Windows. The assistant keeps editing LaTeX directly. Tectonic alone can read and write any of the user's files ([evidence](../journal/2026-11-01-werk-handoff.md#tectonic-file-access)). Round 5 offered the rule-lean alternative, in which untrusted text never becomes LaTeX and no sandbox is needed; it was recommended and declined. | 4, 5 |\n| REB-delivery | Unsigned builds; an in-app notice links to a newer GitHub release; no automatic updates. Differs (signing was recommended). | 1 |\n| REB-builds | GitHub Actions builds unsigned installers on version tags into a draft release. | 2 |\n| REB-release-0.1.1 | On 2 November the user requested “do a release”, authorizing the next version tag and draft release. Prepare `v0.1.1` with factory reset, expanded feeds and source/Profile layout fixes, using the existing installer workflow. The user publishes the draft; a new Windows-PC trial has not been reported for this version. | User release request |\n| REB-first-tag | On 1 November, after the Windows-PC setup trial, the user selected “Push v0.1.0” in form `316b089663e8da00f4b6fe36f1128cc7`, approving commit `3711bdf4635d07b34bae577200d5f922af9f6f87` and its tag-triggered draft release. The tag was pushed at that exact revision, and CI created the draft with both installers; see [verification](../verification/runs/2026-11-01-v0.1.0-draft.md). The user publishes the draft. | Release approval |\n| REB-icon | Light monogram with a green match dot: [reference](../attachments/werk-design/icon.png), source `design/werk/icon.svg`. Differs (the dark monogram was recommended). | 3 |\n| REB-license | MIT. | 3 |\n\n## Repository and working agreement\n\n| ID | Decision | Round |\n| --- | --- | --- |\n| REB-repo | Same repository. The old app is archived on the `legacy` branch at `e493246`, and the wiki restarted for werk. | 2 |\n| REB-rename | Originally planned for the first release. On 1 November, after the completed rebuild and passing packaged CI, the user selected “Rename to werk” in release-next-step form `4c80f066d56e10b85177046aafd941cd`. Renamed to `rengwu/werk` and updated the local remote; the legacy branch and existing prerelease remain. First-tag approval is separate. | 3; release approval |\n| REB-retire | The old app, its data folder and the checkout's old outputs and private files were deleted on 1 November after the user confirmed each path. | 2, 3 |\n| REB-restructure | Restructured in the planning session, before handoff. | 3 |\n| REB-branch | Work directly on `main`. Differs (a `werk` branch with pull requests was recommended). | 3 |\n| REB-github | The agent may push `main` and `legacy` without asking. Tags, releases, pull requests and other GitHub actions need the user. | 3 |\n| REB-autonomy | Continue through all milestones; stop only for consequential unsettled decisions. | 3 |\n| REB-live-checks | Small live checks are allowed: real inference and bounded read-only scans, with a fictional profile. | 3 |\n| REB-windows-testing | The user tests Windows builds on their PC only before releases. Differs (after each milestone was recommended). For `v0.1.0`, the user reported “windows build works fine. setup tested to be working.” This completed the Windows-PC setup trial before first-tag approval. | 3; user confirmation |\n| REB-docs | No Slopchan. The jstack wiki holds all project documentation. | 3 |\n| REB-start | Implementation starts with milestone 1, proving Windows installation and startup first. | 2 |\n","toc":[{"id":"assistant-revision-after-implementation-feedback","title":"Assistant revision after implementation feedback","depth":2},{"id":"product","title":"Product","depth":2},{"id":"platform-and-delivery","title":"Platform and delivery","depth":2},{"id":"repository-and-working-agreement","title":"Repository and working agreement","depth":2}],"titleAnchor":"decisions","links":["journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff","features/assistant","features/discovery","journal/2026-11-02-more-sources","journal/2026-11-01-werk-handoff","verification/runs/2026-11-01-v0.1.0-draft"],"attachments":[{"path":"attachments/werk-design/icon.png","sha256":"72fc4de3816f5e817ec9fc9af4e7e5d44a4321413e97d6e527843678de4d57ec"}],"html":"\u003cp>Current decisions for werk. The initial decisions came from grill-form rounds; later direct instructions are recorded below. the transcripts hold the exact wording and the options offered: \u003ca href=\"#/journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4\">round 1\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081\">round 2\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e\">round 3\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f\">round 4\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7\">round 5\u003c/a>. The \u003ca href=\"#/journal/2026-11-01-rebuild\">rebuild plan\u003c/a> records the findings behind them, and the \u003ca href=\"#/journal/2026-11-01-werk-handoff\">handoff\u003c/a> turns them into an implementation plan. The user's boundaries are in \u003ccode>AGENTS.md\u003c/code>.\u003c/p>\n\u003cp>“Differs” marks a choice other than the recommendation offered.\u003c/p>\n\u003ch2 id=\"assistant-revision-after-implementation-feedback\">Assistant revision after implementation feedback\u003c/h2>\n\u003cp>\u003cstrong>REB-pi-session (2026-11-01):\u003c/strong> The user requested interruption, dropped files, local-file access and visible network/tool capabilities, then clarified: “it is essentially just another pi session running on the user's computer with full permissions”. This supersedes the earlier bounded-action and supplied-URL restrictions. Embed pi's actual session runtime with unrestricted local read/write/edit/shell and network tools, persistent context, streamed replies, visible tool results, steering, interrupt-and-send and queued follow-ups. Keep the same app-owned ChatGPT subscription, model and reasoning level. Keep attributed, versioned app tools so profile, letter and CV changes remain reviewable. Validation errors return to pi for correction within the run.\u003c/p>\n\u003cp>The no-application/no-engagement product rules remain assistant instructions. With full shell and network access they are \u003cstrong>not a capability-enforced security boundary\u003c/strong>. Automated discovery retains its destination restrictions. werk's CV compilation tool still uses the OS sandbox. See \u003ca href=\"#/features/assistant\">assistant behavior and verification\u003c/a>.\u003c/p>\n\u003ch2 id=\"product\">Product\u003c/h2>\n\u003cp>\u003cstrong>REB-source-order (2026-11-02):\u003c/strong> The user reported that enabling a source reset scrolling and requested that checkbox state no longer control sorting. Keep Sources alphabetical regardless of enabled state, preserving the row, scroll position and checkbox focus when toggled. See \u003ca href=\"#/features/discovery\">discovery\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>REB-factory-reset (2026-11-02):\u003c/strong> The user requested a Settings button to clear the entire app's state. Add a confirmed factory reset that removes personal records, conversations, copied attachments, app-owned ChatGPT credentials, schedules, source configuration and preferences, and returns to first-run setup. Cancel leaves data intact. Preserve originals and exports outside app-owned storage. Tests use fictional data; implementing the button does not authorize resetting the user's installation.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Round\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>REB-name\u003c/td>\n\u003ctd>The app is \u003cstrong>werk\u003c/strong>, always lowercase.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-audience\u003c/td>\n\u003ctd>Public GitHub releases for anyone. macOS Apple Silicon and Windows 11 x64. No Unraid/Docker and no Linux desktop.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-clean\u003c/td>\n\u003ctd>Start completely clean: import no profile, CV, jobs or letters. The old data is backed up locally, outside the repository. Differs.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-inbox\u003c/td>\n\u003ctd>The opening screen is a triage inbox. \u003cstrong>New\u003c/strong> lists unreviewed jobs that pass the search criteria, best match first. Save or Skip removes a job from New; \u003cstrong>All matches\u003c/strong> keeps it searchable. Unopened titles are bold.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-criteria\u003c/td>\n\u003ctd>Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-timezone\u003c/td>\n\u003ctd>Minimum working-hours overlap with the user's timezone, at country level.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-detail\u003c/td>\n\u003ctd>A decision summary, then the description with matched and missing requirements highlighted.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-saved\u003c/td>\n\u003ctd>A saved job opens a workspace: posting and notes beside the letter, with review notes and status.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-lifecycle\u003c/td>\n\u003ctd>Saved and Applied only, as manual records.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-profile\u003c/td>\n\u003ctd>A fact sheet with status and source for each fact, editable directly or through the assistant.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-navigation\u003c/td>\n\u003ctd>Inbox, Saved, Profile and CV; Sources, AI, Backup and Diagnostics inside Settings.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-documents\u003c/td>\n\u003ctd>The CV is LaTeX compiled to PDF. Cover letters are plain text only.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-cv-source\u003c/td>\n\u003ctd>The master CV is generated from the profile on request, then edited by the user or the assistant. Each generation is a new version. No per-job CVs.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-additions\u003c/td>\n\u003ctd>Keyboard triage, a first-run setup checklist, Hide company.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-removals\u003c/td>\n\u003ctd>Seen state, duplicate grouping control, legacy resume code, Jev, the HTTP body cache, description history for unsaved jobs, VueJobs detail enrichment, the custom installer and checksum inventory.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-sources\u003c/td>\n\u003ctd>Keep sources that produced saves, Greenhouse/Ashby/Lever company boards, structured feeds and APIs, and scraped public boards. Drop Hacker News, X and the boards that never returned a job. Keeping scraped boards differs.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-default-sources\u003c/td>\n\u003ctd>Initially 17 APIs/RSS feeds; expanded to 30 on 2 November after the user requested more job boards. The 20 scraped boards remain available but off. Missing catalog entries are added on startup without changing existing preferences or custom boards. Company boards are added by the user. See \u003ca href=\"#/journal/2026-11-02-more-sources\">research\u003c/a>.\u003c/td>\n\u003ctd>3; user source-expansion request\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-schedule\u003c/td>\n\u003ctd>Scans are manual by default. Settings can turn on a schedule. Differs (every 4 hours was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-retention\u003c/td>\n\u003ctd>Keep Strong and Adjacent jobs that are not Incompatible and pass the criteria; fingerprint everything else; delete unsaved jobs 30 days after they close. No HTTP body cache.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unchanged\u003c/td>\n\u003ctd>No application submission, uploads, form filling, outreach or engagement; pi-ai with the ChatGPT subscription, \u003ccode>gpt-5.6-sol\u003c/code> and high reasoning; a cover letter generated on save; the right-hand assistant overlay; local data with no login; deterministic matching and eligibility rules; the Cursor/Clarity visual language; ZIP backup of personal data.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"platform-and-delivery\">Platform and delivery\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Round\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>REB-runtime\u003c/td>\n\u003ctd>Electron with TypeScript. \u003ccode>node:sqlite\u003c/code> with FTS5 works in Electron 44.9.0, so no native modules. The one exception is the Windows LaTeX sandbox helper in Go (REB-latex-isolation).\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-process\u003c/td>\n\u003ctd>One backend process owns the API, scheduler and serialized model queue, and pushes changes to the UI.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-stack\u003c/td>\n\u003ctd>esbuild-bundled backend; typed columns, indexes and FTS5; TanStack Query invalidated by push events; plain chat UI; minimal CodeMirror; built-in PDF viewer; Playwright smoke tests against packaged apps; Settings → Diagnostics.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-tray\u003c/td>\n\u003ctd>Closing the window keeps werk running: in the Dock on macOS, in the system tray on Windows.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-latex-isolation\u003c/td>\n\u003ctd>CV LaTeX compiles only inside an OS sandbox: \u003ccode>sandbox-exec\u003c/code> on macOS, the legacy Go AppContainer helper on Windows. The assistant keeps editing LaTeX directly. Tectonic alone can read and write any of the user's files (\u003ca href=\"#/journal/2026-11-01-werk-handoff~tectonic-file-access\">evidence\u003c/a>). Round 5 offered the rule-lean alternative, in which untrusted text never becomes LaTeX and no sandbox is needed; it was recommended and declined.\u003c/td>\n\u003ctd>4, 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-delivery\u003c/td>\n\u003ctd>Unsigned builds; an in-app notice links to a newer GitHub release; no automatic updates. Differs (signing was recommended).\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-builds\u003c/td>\n\u003ctd>GitHub Actions builds unsigned installers on version tags into a draft release.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-release-0.1.1\u003c/td>\n\u003ctd>On 2 November the user requested “do a release”, authorizing the next version tag and draft release. Prepare \u003ccode>v0.1.1\u003c/code> with factory reset, expanded feeds and source/Profile layout fixes, using the existing installer workflow. The user publishes the draft; a new Windows-PC trial has not been reported for this version.\u003c/td>\n\u003ctd>User release request\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-first-tag\u003c/td>\n\u003ctd>On 1 November, after the Windows-PC setup trial, the user selected “Push v0.1.0” in form \u003ccode>316b089663e8da00f4b6fe36f1128cc7\u003c/code>, approving commit \u003ccode>3711bdf4635d07b34bae577200d5f922af9f6f87\u003c/code> and its tag-triggered draft release. The tag was pushed at that exact revision, and CI created the draft with both installers; see \u003ca href=\"#/verification/runs/2026-11-01-v0.1.0-draft\">verification\u003c/a>. The user publishes the draft.\u003c/td>\n\u003ctd>Release approval\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-icon\u003c/td>\n\u003ctd>Light monogram with a green match dot: \u003ca href=\"attachments/werk-design/icon.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72fc4de3816f5e817ec9fc9af4e7e5d44a4321413e97d6e527843678de4d57ec\">reference\u003c/a>, source \u003ccode>design/werk/icon.svg\u003c/code>. Differs (the dark monogram was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-license\u003c/td>\n\u003ctd>MIT.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"repository-and-working-agreement\">Repository and working agreement\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Round\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>REB-repo\u003c/td>\n\u003ctd>Same repository. The old app is archived on the \u003ccode>legacy\u003c/code> branch at \u003ccode>e493246\u003c/code>, and the wiki restarted for werk.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-rename\u003c/td>\n\u003ctd>Originally planned for the first release. On 1 November, after the completed rebuild and passing packaged CI, the user selected “Rename to werk” in release-next-step form \u003ccode>4c80f066d56e10b85177046aafd941cd\u003c/code>. Renamed to \u003ccode>rengwu/werk\u003c/code> and updated the local remote; the legacy branch and existing prerelease remain. First-tag approval is separate.\u003c/td>\n\u003ctd>3; release approval\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-retire\u003c/td>\n\u003ctd>The old app, its data folder and the checkout's old outputs and private files were deleted on 1 November after the user confirmed each path.\u003c/td>\n\u003ctd>2, 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-restructure\u003c/td>\n\u003ctd>Restructured in the planning session, before handoff.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-branch\u003c/td>\n\u003ctd>Work directly on \u003ccode>main\u003c/code>. Differs (a \u003ccode>werk\u003c/code> branch with pull requests was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-github\u003c/td>\n\u003ctd>The agent may push \u003ccode>main\u003c/code> and \u003ccode>legacy\u003c/code> without asking. Tags, releases, pull requests and other GitHub actions need the user.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-autonomy\u003c/td>\n\u003ctd>Continue through all milestones; stop only for consequential unsettled decisions.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-live-checks\u003c/td>\n\u003ctd>Small live checks are allowed: real inference and bounded read-only scans, with a fictional profile.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-windows-testing\u003c/td>\n\u003ctd>The user tests Windows builds on their PC only before releases. Differs (after each milestone was recommended). For \u003ccode>v0.1.0\u003c/code>, the user reported “windows build works fine. setup tested to be working.” This completed the Windows-PC setup trial before first-tag approval.\u003c/td>\n\u003ctd>3; user confirmation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-docs\u003c/td>\n\u003ctd>No Slopchan. The jstack wiki holds all project documentation.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-start\u003c/td>\n\u003ctd>Implementation starts with milestone 1, proving Windows installation and startup first.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","backlinks":["index","features/assistant","features/desktop","features/discovery","features/profile","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff","verification/runs/2026-11-01-pi-session"]},{"id":"discussions/open-questions","title":"Open questions","section":"Discussions","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Open questions\nsection: Discussions\nupdated: 2026-11-01\n---\n# Open questions\n\nImplementation and packaged CI verification are complete through M5. The user approved the repository rename, confirmed “windows build works fine. setup tested to be working.” and approved the `v0.1.0` tag at `3711bdf`. The tag is pushed, and CI created the [draft release](https://github.com/rengwu/werk/releases/tag/untagged-2b77a1c6bc131b95f560) with both installers. See [delivery verification](../verification/runs/2026-11-01-v0.1.0-draft.md), including the first macOS startup timing failure and successful retry. Publication belongs to the user.\n\n| Item | When | State |\n| --- | --- | --- |\n| Publish `v0.1.0` | When the user is ready | The user reviews and publishes the [draft](https://github.com/rengwu/werk/releases/tag/untagged-2b77a1c6bc131b95f560). The tag approval authorized draft creation; it did not authorize the agent to publish. |\n| Old ununemploy install on the user's Windows PC | Any time | The user removes it through Settings → Apps. |\n","toc":[],"titleAnchor":"open-questions","links":["verification/runs/2026-11-01-v0.1.0-draft"],"attachments":[],"html":"\u003cp>Implementation and packaged CI verification are complete through M5. The user approved the repository rename, confirmed “windows build works fine. setup tested to be working.” and approved the \u003ccode>v0.1.0\u003c/code> tag at \u003ccode>3711bdf\u003c/code>. The tag is pushed, and CI created the \u003ca href=\"https://github.com/rengwu/werk/releases/tag/untagged-2b77a1c6bc131b95f560\" rel=\"noreferrer\">draft release\u003c/a> with both installers. See \u003ca href=\"#/verification/runs/2026-11-01-v0.1.0-draft\">delivery verification\u003c/a>, including the first macOS startup timing failure and successful retry. Publication belongs to the user.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth>When\u003c/th>\n\u003cth>State\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Publish \u003ccode>v0.1.0\u003c/code>\u003c/td>\n\u003ctd>When the user is ready\u003c/td>\n\u003ctd>The user reviews and publishes the \u003ca href=\"https://github.com/rengwu/werk/releases/tag/untagged-2b77a1c6bc131b95f560\" rel=\"noreferrer\">draft\u003c/a>. The tag approval authorized draft creation; it did not authorize the agent to publish.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Old ununemploy install on the user's Windows PC\u003c/td>\n\u003ctd>Any time\u003c/td>\n\u003ctd>The user removes it through Settings → Apps.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","backlinks":["index","features/index","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"]},{"id":"features/assistant","title":"Assistant and ChatGPT connection","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Assistant and ChatGPT connection\nsection: Features\nupdated: 2026-11-01\n---\n# Assistant and ChatGPT connection\n\n**FEAT-assistant** embeds pi's AgentSession with full local file, shell and network permissions, following [REB-pi-session](../decisions/index.md#assistant-revision-after-implementation-feedback). It uses the canonical [profile](profile.md) and versioned werk record tools. Application submission and engagement remain prohibited by assistant instructions; full shell access means these are not capability-enforced guarantees.\n\n## Entry points and outcomes\n\nOpen assistant in any page header opens a fixed 520 px overlay. Navigation keeps the conversation, scroll and composer. Escape and Close assistant return focus. Enter sends, Shift+Enter inserts a newline, and Alt+Enter interrupts before sending. While working, the composer stays usable: Steer injects the message after the current model/tool turn, Interrupt aborts the current run and sends the replacement, and Queue runs the follow-up after the current request. Stop stays visible above the page edge and aborts model/tool work. New chat clears the conversation, its pi session and attachments.\n\nReplies stream as Markdown. Tool rows show the tool, target, running/completed/failed status, inputs, output and duration. Validation failures return to pi as tool results so it can correct them in the same run; successful app edits show actual version receipts. There is no six-round cap. Pi handles context compaction and stores its session under the data folder's `pi/sessions`. SQLite stores the UI transcript, tool activity, evidence and durable task state. Interrupted work pauses after a backend restart. Unsent text and pending attachments survive renderer reloads.\n\nFull access lists the current tools and working directory. The session starts in the user's home directory and can read absolute and `~` paths, write/edit files, run Bash on macOS or PowerShell on Windows, grep/find/list files, read HTTP(S) URLs and search the web. There is no supplied-URL or local-network allowlist for the assistant. Discovery retains its independent public-destination guard. Search is a public service and may return challenges or errors; these are visible tool failures rather than claims of successful research.\n\nDrop files anywhere on the panel, use Attach files, or paste files/images. Attachments can be sent without message text. Files up to 32 MB each, ten files and 128 MB per message are copied into app-owned storage. Larger files remain accessible by local path. Text and PDF extraction feed evidence; images go to the model. PDF extraction uses a worker with resource/time limits. Other file formats remain available for local processing through tools.\n\nProfile, job, CV and letter tools read current records and validate versioned changes. Profile edits need source quotes and schema-valid field edits; errors identify the rejected field. App record edits do not bypass history by writing SQLite directly. CV tools use the OS-sandboxed compiler. Full filesystem/shell tools are not an OS sandbox; record and compilation rules are also in the assistant instructions.\n\nSettings → AI uses SDK-owned ChatGPT OAuth and refresh. Credentials stay under `pi-auth` with private Unix permissions or Windows ACLs. Only `gpt-5.6-sol` and high reasoning are selected, with no ambient API-key or billing fallback. No telemetry exporter is configured. Assistant work and queued letter generations share one model queue. Authentication, model access or allowance errors pause work without losing messages, documents or queued tasks.\n\n## Verification recipe\n\nUse [shared setup](../verification/setup.md). `npm test` executes a real pi session against a simulated stream, including real local file reads/writes and localhost HTTP, rejected-then-repaired profile quotes, steering, interruption, session reopening and allowance pause. It also covers credentials and version validation.\n\nAfter `npm run build -- --test` and `npx electron-builder --dir --publish never`, set `WERK_EXE` to the fixture app. Run `tests/assistant-smoke.ts` for drag/drop, attachment-only send, visible tools, streaming controls, shell interruption and draft/transcript reload; `tests/profile-smoke.ts` for PDF-to-profile, overlay geometry, Escape/focus return and allowance errors. CI runs both on macOS and Windows. `tests/auth-smoke.ts` checks the packaged OAuth handoff and cancellation without authenticating.\n\nSmall live checks use only fictional data and the app-owned ChatGPT sign-in. Credentials, real candidate facts and auth URLs never enter wiki evidence.\n\n## Coverage and history\n\n- [M2 run](../verification/runs/2026-11-01-m2-profile.md): original bounded implementation, retained as historical evidence.\n- [Pi session run](../verification/runs/2026-11-01-pi-session.md): full-permission replacement.\n- [Saved letters and master CV](documents.md): the session uses the same versioned storage and sandboxed compiler as the workspaces.\n","toc":[{"id":"entry-points-and-outcomes","title":"Entry points and outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-history","title":"Coverage and history","depth":2}],"titleAnchor":"assistant-and-chatgpt-connection","links":["decisions/index","features/profile","verification/setup","verification/runs/2026-11-01-m2-profile","verification/runs/2026-11-01-pi-session","features/documents"],"attachments":[],"html":"\u003 edit files, run Bash on macOS or PowerShell on Windows, grep/find/list files, read HTTP(S) URLs and search the web. There is no supplied-URL or local-network allowlist for the assistant. Discovery retains its independent public-destination guard. Search is a public service and may return challenges or errors; these are visible tool failures rather than claims of successful research.\u003c/p>\n\u003cp>Drop files anywhere on the panel, use Attach files, or paste files/images. Attachments can be sent without message text. Files up to 32 MB each, ten files and 128 MB per message are copied into app-owned storage. Larger files remain accessible by local path. Text and PDF extraction feed evidence; images go to the model. PDF extraction uses a worker with resource/time limits. Other file formats remain available for local processing through tools.\u003c/p>\n\u003cp>Profile, job, CV and letter tools read current records and validate versioned changes. Profile edits need source quotes and schema-valid field edits; errors identify the rejected field. App record edits do not bypass history by writing SQLite directly. CV tools use the OS-sandboxed compiler. Full filesystem/shell tools are not an OS sandbox; record and compilation rules are also in the assistant instructions.\u003c/p>\n\u003cp>Settings → AI uses SDK-owned ChatGPT OAuth and refresh. Credentials stay under \u003ccode>pi-auth\u003c/code> with private Unix permissions or Windows ACLs. Only \u003ccode>gpt-5.6-sol\u003c/code> and high reasoning are selected, with no ambient API-key or billing fallback. No telemetry exporter is configured. Assistant work and queued letter generations share one model queue. Authentication, model access or allowance errors pause work without losing messages, documents or queued tasks.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a>. \u003ccode>npm test\u003c/code> executes a real pi session against a simulated stream, including real local file reads/writes and localhost HTTP, rejected-then-repaired profile quotes, steering, interruption, session reopening and allowance pause. It also covers credentials and version validation.\u003c/p>\n\u003cp>After \u003ccode>npm run build -- --test\u003c/code> and \u003ccode>npx electron-builder --dir --publish never\u003c/code>, set \u003ccode>WERK_EXE\u003c/code> to the fixture app. Run \u003ccode>tests/assistant-smoke.ts\u003c/code> for drag/drop, attachment-only send, visible tools, streaming controls, shell interruption and draft/transcript reload; \u003ccode>tests/profile-smoke.ts\u003c/code> for PDF-to-profile, overlay geometry, Escape/focus return and allowance errors. CI runs both on macOS and Windows. \u003ccode>tests/auth-smoke.ts\u003c/code> checks the packaged OAuth handoff and cancellation without authenticating.\u003c/p>\n\u003cp>Small live checks use only fictional data and the app-owned ChatGPT sign-in. Credentials, real candidate facts and auth URLs never enter wiki evidence.\u003c/p>\n\u003ch2 id=\"coverage-and-history\">Coverage and history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m2-profile\">M2 run\u003c/a>: original bounded implementation, retained as historical evidence.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-pi-session\">Pi session run\u003c/a>: full-permission replacement.\u003c/li>\n\u003cli>\u003ca href=\"#/features/documents\">Saved letters and master CV\u003c/a>: the session uses the same versioned storage and sandboxed compiler as the workspaces.\u003c/li>\n\u003c/ul>\n","backlinks":["decisions/index","features/desktop","features/index","features/profile","journal/2026-11-01-werk-handoff","verification/runs/2026-11-01-m2-profile","verification/runs/2026-11-01-pi-session"]},{"id":"features/backups","title":"ZIP backups","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: ZIP backups\nsection: Features\nupdated: 2026-11-01\n---\n# ZIP backups\n\n**FEAT-backups** exports current personal content and restores it into werk. It follows the accepted overwrite/latest-records behavior in the [handoff](../journal/2026-11-01-werk-handoff.md), without importing legacy app formats.\n\n## Entry points and behavior\n\nSettings → Backup has Export backup and Restore backup. Export opens a native save dialog. Restore opens a ZIP picker and replaces records after validation; cancellation changes nothing. The page describes replacement before the action. There is no automatic recovery archive or merge step. Export first to retain current records.\n\nTo clear all app records, sign-in and settings, use [Factory reset](factory-reset.md) in Settings → General.\n\nA backup contains the canonical profile and evidence references, jobs and their assessments, saved descriptions, notes and manual status, current source observations, the latest letter per job, and the current CV source with its matching PDF when available. A failed current CV never exports an older PDF as though it matched the source.\n\nOlder versions, chats, attachments, queued tasks, fingerprints, scan history, source configuration, schedules, app settings and credentials are excluded. Evidence-file references remain references; the original files are not copied. The archive is an ordinary unencrypted ZIP.\n\nRestore rejects active model, scan, compiler or editing operations. It validates the entire archive before one SQLite transaction replaces personal records, document history, conversation and pending tasks. Profile/CV versions advance and job IDs change so stale editors cannot overwrite imported content. A database failure rolls back and removes only the new staged PDF. Destination source settings, scan checkpoints, appearance, scheduling and authentication stay intact. Restore itself starts no scan, inference or compile.\n\nImported observations remain attached independently of configured sources. When a matching live source returns, its current observation replaces the imported copy. Restore clears obsolete app-owned conversation and PDF files after committing, reloads the UI and displays Backup restored.\n\n## Archive contract\n\nFormat `werk-personal-backup`, version 1: `manifest.json`, `data.json`, optional `cv.tex` and its optional `cv.pdf`. The manifest records creation time, byte sizes and SHA-256 hashes. Unexpected/duplicate entries, unsafe paths, links, encrypted archives, unsupported versions, damaged files and broken record references are rejected. Nothing is extracted to a filesystem path from the ZIP. Directory and local-header checks precede bounded native decompression.\n\nLimits: 128 MiB ZIP, 512 MiB unpacked, 100,000 jobs, 2 MiB source, 8 MiB PDF. Export/import use memory proportional to the records; they are personal-content backups, not full credential/appdata recovery images.\n\n## Verification recipe\n\nUse [shared setup](../verification/setup.md), always with temporary fictional data. `node --experimental-strip-types --test tests/backup.test.ts` checks round trips, exclusions, Unicode, current/mismatched PDFs, configuration preservation, reopen/live refresh, stale editors, invalid archives, active-work rejection and injected transaction rollback.\n\nSet `WERK_EXE` to a packaged app and run `node --experimental-strip-types tests/backup-smoke.ts`. It uses the real Settings controls for native export, invalid-import recovery, overwrite restore, reload confirmation and the restored saved letter. No live candidate folder is used.\n\n[M5 verification](../verification/runs/2026-11-01-m5-delivery.md) records build-specific outcomes.\n","toc":[{"id":"entry-points-and-behavior","title":"Entry points and behavior","depth":2},{"id":"archive-contract","title":"Archive contract","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2}],"titleAnchor":"zip-backups","links":["journal/2026-11-01-werk-handoff","features/factory-reset","verification/setup","verification/runs/2026-11-01-m5-delivery"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-backups\u003c/strong> exports current personal content and restores it into werk. It follows the accepted overwrite/latest-records behavior in the \u003ca href=\"#/journal/2026-11-01-werk-handoff\">handoff\u003c/a>, without importing legacy app formats.\u003c/p>\n\u003ch2 id=\"entry-points-and-behavior\">Entry points and behavior\u003c/h2>\n\u003cp>Settings → Backup has Export backup and Restore backup. Export opens a native save dialog. Restore opens a ZIP picker and replaces records after validation; cancellation changes nothing. The page describes replacement before the action. There is no automatic recovery archive or merge step. Export first to retain current records.\u003c/p>\n\u003cp>To clear all app records, sign-in and settings, use \u003ca href=\"#/features/factory-reset\">Factory reset\u003c/a> in Settings → General.\u003c/p>\n\u003cp>A backup contains the canonical profile and evidence references, jobs and their assessments, saved descriptions, notes and manual status, current source observations, the latest letter per job, and the current CV source with its matching PDF when available. A failed current CV never exports an older PDF as though it matched the source.\u003c/p>\n\u003cp>Older versions, chats, attachments, queued tasks, fingerprints, scan history, source configuration, schedules, app settings and credentials are excluded. Evidence-file references remain references; the original files are not copied. The archive is an ordinary unencrypted ZIP.\u003c/p>\n\u003cp>Restore rejects active model, scan, compiler or editing operations. It validates the entire archive before one SQLite transaction replaces personal records, document history, conversation and pending tasks. Profile/CV versions advance and job IDs change so stale editors cannot overwrite imported content. A database failure rolls back and removes only the new staged PDF. Destination source settings, scan checkpoints, appearance, scheduling and authentication stay intact. Restore itself starts no scan, inference or compile.\u003c/p>\n\u003cp>Imported observations remain attached independently of configured sources. When a matching live source returns, its current observation replaces the imported copy. Restore clears obsolete app-owned conversation and PDF files after committing, reloads the UI and displays Backup restored.\u003c/p>\n\u003ch2 id=\"archive-contract\">Archive contract\u003c/h2>\n\u003cp>Format \u003ccode>werk-personal-backup\u003c/code>, version 1: \u003ccode>manifest.json\u003c/code>, \u003ccode>data.json\u003c/code>, optional \u003ccode>cv.tex\u003c/code> and its optional \u003ccode>cv.pdf\u003c/code>. The manifest records creation time, byte sizes and SHA-256 hashes. Unexpected/duplicate entries, unsafe paths, links, encrypted archives, unsupported versions, damaged files and broken record references are rejected. Nothing is extracted to a filesystem path from the ZIP. Directory and local-header checks precede bounded native decompression.\u003c/p>\n\u003cp>Limits: 128 MiB ZIP, 512 MiB unpacked, 100,000 jobs, 2 MiB source, 8 MiB PDF. Export/import use memory proportional to the records; they are personal-content backups, not full credential/appdata recovery images.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a>, always with temporary fictional data. \u003ccode>node --experimental-strip-types --test tests/backup.test.ts\u003c/code> checks round trips, exclusions, Unicode, current/mismatched PDFs, configuration preservation, reopen/live refresh, stale editors, invalid archives, active-work rejection and injected transaction rollback.\u003c/p>\n\u003cp>Set \u003ccode>WERK_EXE\u003c/code> to a packaged app and run \u003ccode>node --experimental-strip-types tests/backup-smoke.ts\u003c/code>. It uses the real Settings controls for native export, invalid-import recovery, overwrite restore, reload confirmation and the restored saved letter. No live candidate folder is used.\u003c/p>\n\u003cp>\u003ca href=\"#/verification/runs/2026-11-01-m5-delivery\">M5 verification\u003c/a> records build-specific outcomes.\u003c/p>\n","backlinks":["features/factory-reset","features/index","verification/runs/2026-11-01-m5-delivery"]},{"id":"features/desktop","title":"Desktop shell and local backend","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Desktop shell and local backend\nsection: Features\nupdated: 2026-11-01\n---\n# Desktop shell and local backend\n\n**FEAT-desktop** implements the [M1 shell](../journal/2026-11-01-werk-handoff.md#milestones), [runtime, process and tray decisions](../decisions/index.md#platform-and-delivery). Inbox shows the setup checklist; [Profile](profile.md), the [assistant](assistant.md), [Saved and CV](documents.md) are functional. Settings contains General, Sources, AI, Backup and Diagnostics.\n\n## Entry points and expected outcomes\n\nLaunch werk from its installed application. A fresh data folder creates schema 6 in SQLite with WAL and FTS5. Only the utility process owns the database. The sandboxed React renderer uses a typed, validated MessagePort API; it has no Node access or HTTP API server.\n\nAppearance defaults to System. Settings → General → Appearance offers System, Light and Dark; the selection persists and controls native chrome. Settings → Diagnostics shows runtime versions, SQLite and FTS5, database size, backend start/restart state, update status and the last 20 sanitized warnings/errors. Copy diagnostics excludes candidate facts, jobs and credentials.\n\nClosing the window hides it while the backend continues. Opening werk again focuses that window. macOS keeps its Dock presence; Windows has an Open werk / Quit werk tray menu. Quit shuts down the backend and exits. A second instance cannot own the same data folder.\n\nAn unexpected backend exit rejects pending calls, restarts after one second and reconnects the renderer. More than three crashes in one minute stops automatic recovery and shows Copy diagnostics / Restart. Restart explicitly retries. Persisted data survives.\n\nA release check runs after 30 seconds and every 12 hours. Only newer stable releases at `rengwu/werk` produce a Download link. There is no auto-update. A 404 from the latest-release endpoint means no stable releases. A fake endpoint is compiled in only when building with `--test`.\n\nAn approved version tag runs the same packaged checks, then creates a draft release with the macOS DMG and Windows setup executable. Downloaded workflow artifacts retain their `release/` directory; only those installers are attached, excluding smoke evidence. The user publishes the draft.\n\n## Verification recipe\n\nUse the [shared setup](../verification/setup.md). `npm run check`, `npm test`, `npm run package`, then `WERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" npm run smoke` exercises launch, diagnostics, themes, crash recovery, crash-loop stopping, window close/reopen, single instance and persistence. The driver uses native Electron and accessible controls; fixtures are empty, isolated user-data directories.\n\nFor the fake release notice: `npm run package -- --test`, then the same smoke command with `WERK_SMOKE_TEST_BUILD=1`. Rebuild normally before distributing. Windows CI installs the NSIS installer silently, launches the installed executable with the same driver, and verifies uninstall preserves the isolated database.\n\n## Coverage and limits\n\nThe smoke driver verifies close/reopen through Electron and a second OS process. Native Dock click and Windows tray menu click require a separate desktop check; the driver does not claim those clicks. M5 replaced the temporary tray artwork. The user confirmed the Windows build and setup work, then approved `v0.1.0`; publication belongs to the user.\n\n## Verification history\n\n- [M1 verification](../verification/runs/2026-11-01-m1-shell.md).\n- [Windows-PC trial and release asset preflight](../verification/runs/2026-11-01-release-preflight.md).\n- [v0.1.0 draft release](../verification/runs/2026-11-01-v0.1.0-draft.md).\n\n## Final rebuild polish\n\nThe application and Windows tray use the chosen light monogram and green match dot. `resources/icon.svg` contains an original hand-drawn path, with no font glyphs. PNG exports are committed; electron-builder creates platform icons. Diagnostics includes model/reasoning, current model work, compiler availability and scan times as well as database/runtime/backend details. Copy diagnostics uses native clipboard IPC.\n\nSettings, Inbox and posting tabs support Arrow Left/Right, Home/End and one tab stop for the selected tab. Job rows retain native button semantics inside a list. Sidebar names include their visible counts. LaTeX syntax colors follow the active theme. The assistant retains its fixed overlay, Escape and focus-return behavior.\n\n`tests/accessibility-smoke.ts` audits Settings, Inbox, Saved, Profile, CV and the assistant in light/dark mode with axe WCAG A/AA rules, then checks keyboard tab selection and focus return. Electron blocks extra browser windows, so the driver uses axe's existing-page mode; built-in PDF viewer internals are outside that DOM audit. Automated checks do not establish complete assistive-technology coverage. See [M5 verification](../verification/runs/2026-11-01-m5-delivery.md).\n","toc":[{"id":"entry-points-and-expected-outcomes","title":"Entry points and expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limits","title":"Coverage and limits","depth":2},{"id":"verification-history","title":"Verification history","depth":2},{"id":"final-rebuild-polish","title":"Final rebuild polish","depth":2}],"titleAnchor":"desktop-shell-and-local-backend","links":["journal/2026-11-01-werk-handoff","decisions/index","features/profile","features/assistant","features/documents","verification/setup","verification/runs/2026-11-01-m1-shell","verification/runs/2026-11-01-release-preflight","verification/runs/2026-11-01-v0.1.0-draft","verification/runs/2026-11-01-m5-delivery"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-desktop\u003c/strong> implements the \u003ca href=\"#/journal/2026-11-01-werk-handoff~milestones\">M1 shell\u003c/a>, \u003ca href=\"#/decisions/index~platform-and-delivery\">runtime, process and tray decisions\u003c/a>. Inbox shows the setup checklist; \u003ca href=\"#/features/profile\">Profile\u003c/a>, the \u003ca href=\"#/features/assistant\">assistant\u003c/a>, \u003ca href=\"#/features/documents\">Saved and CV\u003c/a> are functional. Settings contains General, Sources, AI, Backup and Diagnostics.\u003c/p>\n\u003ch2 id=\"entry-points-and-expected-outcomes\">Entry points and expected outcomes\u003c/h2>\n\u003cp>Launch werk from its installed application. A fresh data folder creates schema 6 in SQLite with WAL and FTS5. Only the utility process owns the database. The sandboxed React renderer uses a typed, validated MessagePort API; it has no Node access or HTTP API server.\u003c/p>\n\u003cp>Appearance defaults to System. Settings → General → Appearance offers System, Light and Dark; the selection persists and controls native chrome. Settings → Diagnostics shows runtime versions, SQLite and FTS5, database size, backend start/restart state, update status and the last 20 sanitized warnings/errors. Copy diagnostics excludes candidate facts, jobs and credentials.\u003c/p>\n\u003cp>Closing the window hides it while the backend continues. Opening werk again focuses that window. macOS keeps its Dock presence; Windows has an Open werk / Quit werk tray menu. Quit shuts down the backend and exits. A second instance cannot own the same data folder.\u003c/p>\n\u003cp>An unexpected backend exit rejects pending calls, restarts after one second and reconnects the renderer. More than three crashes in one minute stops automatic recovery and shows Copy diagnostics / Restart. Restart explicitly retries. Persisted data survives.\u003c/p>\n\u003cp>A release check runs after 30 seconds and every 12 hours. Only newer stable releases at \u003ccode>rengwu/werk\u003c/code> produce a Download link. There is no auto-update. A 404 from the latest-release endpoint means no stable releases. A fake endpoint is compiled in only when building with \u003ccode>--test\u003c/code>.\u003c/p>\n\u003cp>An approved version tag runs the same packaged checks, then creates a draft release with the macOS DMG and Windows setup executable. Downloaded workflow artifacts retain their \u003ccode>release/\u003c/code> directory; only those installers are attached, excluding smoke evidence. The user publishes the draft.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use the \u003ca href=\"#/verification/setup\">shared setup\u003c/a>. \u003ccode>npm run check\u003c/code>, \u003ccode>npm test\u003c/code>, \u003ccode>npm run package\u003c/code>, then \u003ccode>WERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" npm run smoke\u003c/code> exercises launch, diagnostics, themes, crash recovery, crash-loop stopping, window close/reopen, single instance and persistence. The driver uses native Electron and accessible controls; fixtures are empty, isolated user-data directories.\u003c/p>\n\u003cp>For the fake release notice: \u003ccode>npm run package -- --test\u003c/code>, then the same smoke command with \u003ccode>WERK_SMOKE_TEST_BUILD=1\u003c/code>. Rebuild normally before distributing. Windows CI installs the NSIS installer silently, launches the installed executable with the same driver, and verifies uninstall preserves the isolated database.\u003c/p>\n\u003ch2 id=\"coverage-and-limits\">Coverage and limits\u003c/h2>\n\u003cp>The smoke driver verifies close/reopen through Electron and a second OS process. Native Dock click and Windows tray menu click require a separate desktop check; the driver does not claim those clicks. M5 replaced the temporary tray artwork. The user confirmed the Windows build and setup work, then approved \u003ccode>v0.1.0\u003c/code>; publication belongs to the user.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m1-shell\">M1 verification\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-release-preflight\">Windows-PC trial and release asset preflight\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-v0.1.0-draft\">v0.1.0 draft release\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"final-rebuild-polish\">Final rebuild polish\u003c/h2>\n\u003cp>The application and Windows tray use the chosen light monogram and green match dot. \u003ccode>resources/icon.svg\u003c/code> contains an original hand-drawn path, with no font glyphs. PNG exports are committed; electron-builder creates platform icons. Diagnostics includes model/reasoning, current model work, compiler availability and scan times as well as database/runtime/backend details. Copy diagnostics uses native clipboard IPC.\u003c/p>\n\u003cp>Settings, Inbox and posting tabs support Arrow Left/Right, Home/End and one tab stop for the selected tab. Job rows retain native button semantics inside a list. Sidebar names include their visible counts. LaTeX syntax colors follow the active theme. The assistant retains its fixed overlay, Escape and focus-return behavior.\u003c/p>\n\u003cp>\u003ccode>tests/accessibility-smoke.ts\u003c/code> audits Settings, Inbox, Saved, Profile, CV and the assistant in light/dark mode with axe WCAG A/AA rules, then checks keyboard tab selection and focus return. Electron blocks extra browser windows, so the driver uses axe's existing-page mode; built-in PDF viewer internals are outside that DOM audit. Automated checks do not establish complete assistive-technology coverage. See \u003ca href=\"#/verification/runs/2026-11-01-m5-delivery\">M5 verification\u003c/a>.\u003c/p>\n","backlinks":["features/index","verification/runs/2026-11-01-m1-shell","verification/runs/2026-11-01-m5-delivery","verification/runs/2026-11-01-release-preflight","verification/runs/2026-11-01-v0.1.0-attempt1","verification/runs/2026-11-01-v0.1.0-draft"]},{"id":"features/discovery","title":"Discovery and Inbox","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-02\u003c/span>","updated":"2026-11-02","summary":"","source":"---\ntitle: Discovery and Inbox\nsection: Features\nupdated: 2026-11-02\n---\n# Discovery and Inbox\n\nFeature IDs: `FEAT-discovery`, `FEAT-inbox`.\n\n## Intent and basis\n\nDiscover and triage jobs against the canonical profile, following [REB-inbox, REB-criteria, REB-retention and source decisions](../decisions/index.md) and the [collection specification](../journal/2026-11-01-werk-handoff.md#collection-pipeline-proposed). There are no submission, form-filling, contact or external-write actions.\n\n## Entry points and prerequisites\n\nA ready [profile](profile.md) enables **Scan now** in setup or Inbox. Sources are inside Settings: 30 API/RSS sources on, 20 scraped boards off. Company ATS boards and RSS/Atom URLs can be added. Settings → General chooses Manual (default), Every 4 hours or Every 12 hours; each source still respects its own cooldown and daily/request limits. [The source expansion](../journal/2026-11-02-more-sources.md) lists the thirteen additional feeds, verified coverage and limitations.\n\n## Expected outcomes\n\n- Settings → Sources stays alphabetical regardless of enabled state. Mouse and keyboard toggles preserve the row's position, scroll offset and checkbox focus, following [REB-source-order](../decisions/index.md).\n- Startup inserts missing catalog sources without replacing existing IDs, enabled choices, settings, cooldowns or custom boards. Restarting does not re-enable a source the user disabled. New feed entries follow the API/feed enabled default; scanning remains manual unless a schedule was already configured.\n- Feed parsing preserves explicit employer, job location and employment metadata. Posting accounts are not employers. Python's ambiguous comma-separated employer/title stays intact with employer unknown; Berlin titles use their explicit employer suffix. Literal CDATA wrappers are sanitized into readable text. NoDesk, Dev Remotely, Startup Jobs, Berlin and Elixir remain excerpts; missing country/work-authorization information is not inferred from a board's remote branding.\n\n- Keep only Strong/Adjacent, non-Incompatible postings that satisfy explicit criteria. Unknown locations, arrangements, work authorization and overlap do not exclude a posting. Rejected postings retain a URL/hash/revision/reason fingerprint, never a body.\n- Match scoring uses the user's target role families and evidence, with separate professional/project attribution. Unsupported senior scope, credentials and AI/ML tenure limit the score. `MATCH_VERSION=6` records the adaptation from the archived candidate-specific role defaults to arbitrary profiles.\n- A source refresh cannot downgrade a full description to an excerpt or overwrite a manual description. Every kept source copy retains its latest normalized evidence; a save freezes a description snapshot.\n- Every profile revision atomically reassesses stored jobs. Nonqualifying New/Skipped records become fingerprints; Saved/Applied remain. HTTP validators are cleared so the next permitted scan can reconsider unchanged fingerprinted postings under the new criteria.\n- Duplicates are hidden automatically and saved jobs are representatives. No duplicate control or Seen state is exposed.\n- Only complete employer-board snapshots close missing jobs. Feeds, parser failures, conditional 304 responses and interrupted pagination never close missing jobs. New shows open, nonduplicate records by score/newness; All matches includes other stored states.\n- Daily maintenance expires unsaved jobs 30 days after closure and fingerprints after 180 days, refreshes overlap for current daylight saving and optimizes SQLite.\n- J/K select, S saves, X skips, O opens the ordinary posting link, / focuses FTS search, Escape clears it. Typing and the assistant overlay disable shortcuts. Save/Skip advance New selection and have Move back to New. Hide company appends a profile revision and preserves saved records.\n- Filters are temporary; criteria control collection. Description highlights show exact evidence/requirement clauses. Notes autosave. Incomplete postings accept a manually pasted full description.\n\n## Verification recipe\n\nUse [setup](../verification/setup.md) and fictional data:\n\n```sh\nnpm run check\nnpm test\nnpm run build -- --test\nnpx electron-builder --dir --publish never\nWERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" node --experimental-strip-types tests/discovery-smoke.ts\n```\n\nThe driver seeds only the profile/source prerequisites, then uses setup Scan now, real adapter parsing, SQLite and keyboard/UI actions. It checks FTS, filters, highlights, notes, hiding, source counters and schedule. It enables a source at the bottom of Settings with a mouse click, disables it with Space, and checks that row order, scrolling and focus stay stable. It then enables MoAIJobs and verifies a matching job reaches Inbox through a recorded feed. Temporary data is removed; sanitized evidence remains in `smoke-output/discovery/`. For an authorized single public read: `node --experimental-strip-types scripts/check-live-discovery.ts` uses Remotive and an isolated fictional profile. `scripts/check-live-feeds.ts` accepts exact RSS source names and uses one bounded scan per named source; see [setup](../verification/setup.md#discovery-fixtures).\n\n## Coverage and limitations\n\nSource tests port the relevant archived JSON, RSS, structured HTML and location regressions, plus pipeline/FTS/closure/retention/criteria tests. The source catalog contains board-specific public discovery seeds; a board that changes or blocks public reads reports failure and keeps existing jobs. The live check is deliberately bounded; it does not certify all providers. Letter generation and the saved editing workspace arrive with M4.\n\n## Verification history\n\n- [Stable source ordering](../verification/runs/2026-11-02-source-order.md).\n- [Source expansion](../verification/runs/2026-11-02-source-expansion.md).\n- [M3 discovery and triage](../verification/runs/2026-11-01-m3-discovery.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"discovery-and-inbox","links":["decisions/index","journal/2026-11-01-werk-handoff","features/profile","journal/2026-11-02-more-sources","decisions/index","verification/setup","verification/setup","verification/runs/2026-11-02-source-order","verification/runs/2026-11-02-source-expansion","verification/runs/2026-11-01-m3-discovery"],"attachments":[],"html":"\u003cp>Feature IDs: \u003ccode>FEAT-discovery\u003c/code>, \u003ccode>FEAT-inbox\u003c/code>.\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>Discover and triage jobs against the canonical profile, following \u003ca href=\"#/decisions/index\">REB-inbox, REB-criteria, REB-retention and source decisions\u003c/a> and the \u003ca href ard's remote branding.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Keep only Strong/Adjacent, non-Incompatible postings that satisfy explicit criteria. Unknown locations, arrangements, work authorization and overlap do not exclude a posting. Rejected postings retain a URL/hash/revision/reason fingerprint, never a body.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Match scoring uses the user's target role families and evidence, with separate professional/project attribution. Unsupported senior scope, credentials and AI/ML tenure limit the score. \u003ccode>MATCH_VERSION=6\u003c/code> records the adaptation from the archived candidate-specific role defaults to arbitrary profiles.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>A source refresh cannot downgrade a full description to an excerpt or overwrite a manual description. Every kept source copy retains its latest normalized evidence; a save freezes a description snapshot.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Every profile revision atomically reassesses stored jobs. Nonqualifying New/Skipped records become fingerprints; Saved/Applied remain. HTTP validators are cleared so the next permitted scan can reconsider unchanged fingerprinted postings under the new criteria.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Duplicates are hidden automatically and saved jobs are representatives. No duplicate control or Seen state is exposed.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Only complete employer-board snapshots close missing jobs. Feeds, parser failures, conditional 304 responses and interrupted pagination never close missing jobs. New shows open, nonduplicate records by score/newness; All matches includes other stored states.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Daily maintenance expires unsaved jobs 30 days after closure and fingerprints after 180 days, refreshes overlap for current daylight saving and optimizes SQLite.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>J/K select, S saves, X skips, O opens the ordinary posting link, / focuses FTS search, Escape clears it. Typing and the assistant overlay disable shortcuts. Save/Skip advance New selection and have Move back to New. Hide company appends a profile revision and preserves saved records.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Filters are temporary; criteria control collection. Description highlights show exact evidence/requirement clauses. Notes autosave. Incomplete postings accept a manually pasted full description.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">setup\u003c/a> and fictional data:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">npm run check\nnpm test\nnpm run build -- --test\nnpx electron-builder --dir --publish never\nWERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" node --experimental-strip-types tests/discovery-smoke.ts\n\u003c/code>\u003c/pre>\n\u003cp>The driver seeds only the profile/source prerequisites, then uses setup Scan now, real adapter parsing, SQLite and keyboard/UI actions. It checks FTS, filters, highlights, notes, hiding, source counters and schedule. It enables a source at the bottom of Settings with a mouse click, disables it with Space, and checks that row order, scrolling and focus stay stable. It then enables MoAIJobs and verifies a matching job reaches Inbox through a recorded feed. Temporary data is removed; sanitized evidence remains in \u003ccode>smoke-output/discovery/\u003c/code>. For an authorized single public read: \u003ccode>node --experimental-strip-types scripts/check-live-discovery.ts\u003c/code> uses Remotive and an isolated fictional profile. \u003ccode>scripts/check-live-feeds.ts\u003c/code> accepts exact RSS source names and uses one bounded scan per named source; see \u003ca href=\"#/verification/setup~discovery-fixtures\">setup\u003c/a>.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>Source tests port the relevant archived JSON, RSS, structured HTML and location regressions, plus pipeline/FTS/closure/retention/criteria tests. The source catalog contains board-specific public discovery seeds; a board that changes or blocks public reads reports failure and keeps existing jobs. The live check is deliberately bounded; it does not certify all providers. Letter generation and the saved editing workspace arrive with M4.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-02-source-order\">Stable source ordering\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-02-source-expansion\">Source expansion\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m3-discovery\">M3 discovery and triage\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["decisions/index","features/index","journal/2026-11-02-more-sources","verification/runs/2026-11-01-m3-discovery","verification/runs/2026-11-02-source-expansion","verification/runs/2026-11-02-source-order"]},{"id":"features/documents","title":"Saved letters and master CV","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Saved letters and master CV\nsection: Features\nupdated: 2026-11-01\n---\n# Saved letters and master CV\n\n**FEAT-letters** prepares private plain-text cover letters. **FEAT-cv** maintains one profile-based master CV. Neither feature submits applications or creates per-job CVs.\n\n## Saved workspace\n\nSaving a job with a complete description queues one letter. Incomplete postings wait for the user to paste the full description. Generation shares the serialized ChatGPT queue with the assistant; authentication and allowance failures pause work with Retry and Stop controls. Profile changes and concurrent letter edits invalidate a pending generation rather than overwriting newer work.\n\nSaved opens the posting snapshot, notes and letter editor. Save appends a version; the version selector shows history and Restore appends the selected text as a new version. Regenerate uses the current profile and posting. Copy text uses the native clipboard. The Saved/Applied selector is only a manual record. Open posting opens the employer URL for the user.\n\nGenerated paragraphs cite supported candidate facts internally. Unsupported numbers, invented AI experience and invalid evidence references are rejected. The target is 250–350 words, with a 600-word maximum and a visible review note when outside the target. Review notes, word count and the profile revision remain available beside the draft. Users can freely edit their own text. Dirty editors require confirmation before navigation.\n\n## CV workspace\n\nGenerate from profile creates LaTeX from confirmed profile records using the MIT-licensed starter in `resources/latex`. It preserves project attribution and escapes LaTeX syntax in candidate text. The source is editable in CodeMirror with line numbers, syntax highlighting and normal undo/redo. Save and Restore create new versions and compile them. Profile changes show a regeneration notice without replacing manual edits.\n\nThe right pane previews the compiled PDF. Download .tex and Download PDF use native save dialogs. Compile diagnostics stay visible; failure keeps the source and previous successful PDF. The PDF version is identified when it differs from the selected source. Recompile retries the selected saved source. The assistant can read, edit, generate and compile the master CV and read/rewrite saved letters through version-checked tools.\n\nTectonic 0.15.0 and a prepared cache ship with the app. Runtime compilation is offline and untrusted: `sandbox-exec` on macOS, the Go AppContainer helper on Windows. No shell escape or unsandboxed fallback exists. The compiler has access to its temporary work area and cache; private files, external writes, network and child p
