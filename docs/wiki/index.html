<script type="application/json" id="wiki-data">{"title":"werk wiki","pages":[{"id":"index","title":"werk wiki","section":"Overview","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: werk wiki\nupdated: 2026-11-01\n---\n# werk wiki\n\nwerk is a local desktop app that finds matching jobs, explains the fit, drafts private cover letters and keeps a LaTeX CV. Project requirements are in `AGENTS.md`.\n\n## Start here\n\n- [Implementation handoff](journal/2026-11-01-werk-handoff.md): architecture, data model, screens, milestones, build and release.\n- [Decisions](decisions/index.md)\n- [Open questions](discussions/open-questions.md)\n- [Features](features/index.md)\n- [Verification](verification/index.md)\n\n## Journal\n\n- [Clean rebuild plan](journal/2026-11-01-rebuild.md): findings from the previous app and the accepted direction.\n- Interview answers: [round 1](journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4.md), [round 2](journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081.md), [round 3](journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e.md), [round 4](journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f.md), [round 5](journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7.md).\n","toc":[{"id":"start-here","title":"Start here","depth":2},{"id":"journal","title":"Journal","depth":2}],"titleAnchor":"werk-wiki","links":["journal/2026-11-01-werk-handoff","decisions/index","discussions/open-questions","features/index","verification/index","journal/2026-11-01-rebuild","journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7"],"attachments":[],"html":"\u003cp>werk is a local desktop app that finds matching jobs, explains the fit, drafts private cover letters and keeps a LaTeX CV. Project requirements are in \u003ccode>AGENTS.md\u003c/code>.\u003c/p>\n\u003ch2 id=\"start-here\">Start here\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/journal/2026-11-01-werk-handoff\">Implementation handoff\u003c/a>: architecture, data model, screens, milestones, build and release.\u003c/li>\n\u003cli>\u003ca href=\"#/decisions/index\">Decisions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/discussions/open-questions\">Open questions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/features/index\">Features\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/index\">Verification\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"journal\">Journal\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/journal/2026-11-01-rebuild\">Clean rebuild plan\u003c/a>: findings from the previous app and the accepted direction.\u003c/li>\n\u003cli>Interview answers: \u003ca href=\"#/journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4\">round 1\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081\">round 2\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e\">round 3\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f\">round 4\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7\">round 5\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":[]},{"id":"decisions/index","title":"Decisions","section":"Decisions","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Decisions\nsection: Decisions\nupdated: 2026-11-01\n---\n# Decisions\n\nCurrent decisions for werk. The user made each one in a grill-form round; the transcripts hold the exact wording and the options offered: [round 1](../journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4.md), [round 2](../journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081.md), [round 3](../journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e.md), [round 4](../journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f.md), [round 5](../journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7.md). The [rebuild plan](../journal/2026-11-01-rebuild.md) records the findings behind them, and the [handoff](../journal/2026-11-01-werk-handoff.md) turns them into an implementation plan. The user's boundaries are in `AGENTS.md`.\n\n“Differs” marks a choice other than the recommendation offered.\n\n## Product\n\n| ID | Decision | Round |\n| --- | --- | --- |\n| REB-name | The app is **werk**, always lowercase. | 2 |\n| REB-audience | Public GitHub releases for anyone. macOS Apple Silicon and Windows 11 x64. No Unraid/Docker and no Linux desktop. | 1 |\n| REB-clean | Start completely clean: import no profile, CV, jobs or letters. The old data is backed up locally, outside the repository. Differs. | 1 |\n| REB-inbox | The opening screen is a triage inbox. **New** lists unreviewed jobs that pass the search criteria, best match first. Save or Skip removes a job from New; **All matches** keeps it searchable. Unopened titles are bold. | 1 |\n| REB-criteria | Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily. | 1 |\n| REB-timezone | Minimum working-hours overlap with the user's timezone, at country level. | 1 |\n| REB-detail | A decision summary, then the description with matched and missing requirements highlighted. | 1 |\n| REB-saved | A saved job opens a workspace: posting and notes beside the letter, with review notes and status. | 1 |\n| REB-lifecycle | Saved and Applied only, as manual records. | 1 |\n| REB-profile | A fact sheet with status and source for each fact, editable directly or through the assistant. | 1 |\n| REB-navigation | Inbox, Saved, Profile and CV; Sources, AI, Backup and Diagnostics inside Settings. | 1 |\n| REB-documents | The CV is LaTeX compiled to PDF. Cover letters are plain text only. | 2 |\n| REB-cv-source | The master CV is generated from the profile on request, then edited by the user or the assistant. Each generation is a new version. No per-job CVs. | 2 |\n| REB-additions | Keyboard triage, a first-run setup checklist, Hide company. | 1 |\n| REB-removals | Seen state, duplicate grouping control, legacy resume code, Jev, the HTTP body cache, description history for unsaved jobs, VueJobs detail enrichment, the custom installer and checksum inventory. | 1 |\n| REB-sources | Keep sources that produced saves, Greenhouse/Ashby/Lever company boards, structured feeds and APIs, and scraped public boards. Drop Hacker News, X and the boards that never returned a job. Keeping scraped boards differs. | 1 |\n| REB-default-sources | New installations enable the 17 APIs and RSS feeds. The 20 scraped boards are available but off. Company boards are added by the user. | 3 |\n| REB-schedule | Scans are manual by default. Settings can turn on a schedule. Differs (every 4 hours was recommended). | 3 |\n| REB-retention | Keep Strong and Adjacent jobs that are not Incompatible and pass the criteria; fingerprint everything else; delete unsaved jobs 30 days after they close. No HTTP body cache. | 1 |\n| Unchanged | No application submission, uploads, form filling, outreach or engagement; pi-ai with the ChatGPT subscription, `gpt-5.6-sol` and high reasoning; a cover letter generated on save; the right-hand assistant overlay; local data with no login; deterministic matching and eligibility rules; the Cursor/Clarity visual language; ZIP backup of personal data. | 1 |\n\n## Platform and delivery\n\n| ID | Decision | Round |\n| --- | --- | --- |\n| REB-runtime | Electron with TypeScript. `node:sqlite` with FTS5 works in Electron 44.9.0, so no native modules. The one exception is the Windows LaTeX sandbox helper in Go (REB-latex-isolation). | 1 |\n| REB-process | One backend process owns the API, scheduler and serialized model queue, and pushes changes to the UI. | 1 |\n| REB-stack | esbuild-bundled backend; typed columns, indexes and FTS5; TanStack Query invalidated by push events; plain chat UI; minimal CodeMirror; built-in PDF viewer; Playwright smoke tests against packaged apps; Settings → Diagnostics. | 1 |\n| REB-tray | Closing the window keeps werk running: in the Dock on macOS, in the system tray on Windows. | 3 |\n| REB-latex-isolation | CV LaTeX compiles only inside an OS sandbox: `sandbox-exec` on macOS, the legacy Go AppContainer helper on Windows. The assistant keeps editing LaTeX directly. Tectonic alone can read and write any of the user's files ([evidence](../journal/2026-11-01-werk-handoff.md#tectonic-file-access)). Round 5 offered the rule-lean alternative, in which untrusted text never becomes LaTeX and no sandbox is needed; it was recommended and declined. | 4, 5 |\n| REB-delivery | Unsigned builds; an in-app notice links to a newer GitHub release; no automatic updates. Differs (signing was recommended). | 1 |\n| REB-builds | GitHub Actions builds unsigned installers on version tags into a draft release. | 2 |\n| REB-icon | Light monogram with a green match dot: [reference](../attachments/werk-design/icon.png), source `design/werk/icon.svg`. Differs (the dark monogram was recommended). | 3 |\n| REB-license | MIT. | 3 |\n\n## Repository and working agreement\n\n| ID | Decision | Round |\n| --- | --- | --- |\n| REB-repo | Same repository. The old app is archived on the `legacy` branch at `e493246`, and the wiki restarted for werk. | 2 |\n| REB-rename | Rename the GitHub repository to `werk` at the first release. Differs (renaming now was recommended). | 3 |\n| REB-retire | The old app, its data folder and the checkout's old outputs and private files were deleted on 1 November after the user confirmed each path. | 2, 3 |\n| REB-restructure | Restructured in the planning session, before handoff. | 3 |\n| REB-branch | Work directly on `main`. Differs (a `werk` branch with pull requests was recommended). | 3 |\n| REB-github | The agent may push `main` and `legacy` without asking. Tags, releases, pull requests and other GitHub actions need the user. | 3 |\n| REB-autonomy | Continue through all milestones; stop only for consequential unsettled decisions. | 3 |\n| REB-live-checks | Small live checks are allowed: real inference and bounded read-only scans, with a fictional profile. | 3 |\n| REB-windows-testing | The user tests Windows builds on their PC only before releases. Differs (after each milestone was recommended). | 3 |\n| REB-docs | No Slopchan. The jstack wiki holds all project documentation. | 3 |\n| REB-start | Implementation starts with milestone 1, proving Windows installation and startup first. | 2 |\n","toc":[{"id":"product","title":"Product","depth":2},{"id":"platform-and-delivery","title":"Platform and delivery","depth":2},{"id":"repository-and-working-agreement","title":"Repository and working agreement","depth":2}],"titleAnchor":"decisions","links":["journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff","journal/2026-11-01-werk-handoff"],"attachments":[{"path":"attachments/werk-design/icon.png","sha256":"72fc4de3816f5e817ec9fc9af4e7e5d44a4321413e97d6e527843678de4d57ec"}],"html":"\u003cp>Current decisions for werk. The user made each one in a grill-form round; the transcripts hold the exact wording and the options offered: \u003ca href=\"#/journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4\">round 1\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-8310ced881c9d8f1fe6b9c2f5277b081\">round 2\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e\">round 3\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f\">round 4\u003c/a>, \u003ca href=\"#/journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7\">round 5\u003c/a>. The \u003ca href=\"#/journal/2026-11-01-rebuild\">rebuild plan\u003c/a> records the findings behind them, and the \u003ca href=\"#/journal/2026-11-01-werk-handoff\">handoff\u003c/a> turns them into an implementation plan. The user's boundaries are in \u003ccode>AGENTS.md\u003c/code>.\u003c/p>\n\u003cp>“Differs” marks a choice other than the recommendation offered.\u003c/p>\n\u003ch2 id=\"product\">Product\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Round\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>REB-name\u003c/td>\n\u003ctd>The app is \u003cstrong>werk\u003c/strong>, always lowercase.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-audience\u003c/td>\n\u003ctd>Public GitHub releases for anyone. macOS Apple Silicon and Windows 11 x64. No Unraid/Docker and no Linux desktop.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-clean\u003c/td>\n\u003ctd>Start completely clean: import no profile, CV, jobs or letters. The old data is backed up locally, outside the repository. Differs.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-inbox\u003c/td>\n\u003ctd>The opening screen is a triage inbox. \u003cstrong>New\u003c/strong> lists unreviewed jobs that pass the search criteria, best match first. Save or Skip removes a job from New; \u003cstrong>All matches\u003c/strong> keeps it searchable. Unopened titles are bold.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-criteria\u003c/td>\n\u003ctd>Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-timezone\u003c/td>\n\u003ctd>Minimum working-hours overlap with the user's timezone, at country level.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-detail\u003c/td>\n\u003ctd>A decision summary, then the description with matched and missing requirements highlighted.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-saved\u003c/td>\n\u003ctd>A saved job opens a workspace: posting and notes beside the letter, with review notes and status.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-lifecycle\u003c/td>\n\u003ctd>Saved and Applied only, as manual records.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-profile\u003c/td>\n\u003ctd>A fact sheet with status and source for each fact, editable directly or through the assistant.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-navigation\u003c/td>\n\u003ctd>Inbox, Saved, Profile and CV; Sources, AI, Backup and Diagnostics inside Settings.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-documents\u003c/td>\n\u003ctd>The CV is LaTeX compiled to PDF. Cover letters are plain text only.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-cv-source\u003c/td>\n\u003ctd>The master CV is generated from the profile on request, then edited by the user or the assistant. Each generation is a new version. No per-job CVs.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-additions\u003c/td>\n\u003ctd>Keyboard triage, a first-run setup checklist, Hide company.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-removals\u003c/td>\n\u003ctd>Seen state, duplicate grouping control, legacy resume code, Jev, the HTTP body cache, description history for unsaved jobs, VueJobs detail enrichment, the custom installer and checksum inventory.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-sources\u003c/td>\n\u003ctd>Keep sources that produced saves, Greenhouse/Ashby/Lever company boards, structured feeds and APIs, and scraped public boards. Drop Hacker News, X and the boards that never returned a job. Keeping scraped boards differs.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-default-sources\u003c/td>\n\u003ctd>New installations enable the 17 APIs and RSS feeds. The 20 scraped boards are available but off. Company boards are added by the user.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-schedule\u003c/td>\n\u003ctd>Scans are manual by default. Settings can turn on a schedule. Differs (every 4 hours was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-retention\u003c/td>\n\u003ctd>Keep Strong and Adjacent jobs that are not Incompatible and pass the criteria; fingerprint everything else; delete unsaved jobs 30 days after they close. No HTTP body cache.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unchanged\u003c/td>\n\u003ctd>No application submission, uploads, form filling, outreach or engagement; pi-ai with the ChatGPT subscription, \u003ccode>gpt-5.6-sol\u003c/code> and high reasoning; a cover letter generated on save; the right-hand assistant overlay; local data with no login; deterministic matching and eligibility rules; the Cursor/Clarity visual language; ZIP backup of personal data.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"platform-and-delivery\">Platform and delivery\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Round\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>REB-runtime\u003c/td>\n\u003ctd>Electron with TypeScript. \u003ccode>node:sqlite\u003c/code> with FTS5 works in Electron 44.9.0, so no native modules. The one exception is the Windows LaTeX sandbox helper in Go (REB-latex-isolation).\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-process\u003c/td>\n\u003ctd>One backend process owns the API, scheduler and serialized model queue, and pushes changes to the UI.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-stack\u003c/td>\n\u003ctd>esbuild-bundled backend; typed columns, indexes and FTS5; TanStack Query invalidated by push events; plain chat UI; minimal CodeMirror; built-in PDF viewer; Playwright smoke tests against packaged apps; Settings → Diagnostics.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-tray\u003c/td>\n\u003ctd>Closing the window keeps werk running: in the Dock on macOS, in the system tray on Windows.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-latex-isolation\u003c/td>\n\u003ctd>CV LaTeX compiles only inside an OS sandbox: \u003ccode>sandbox-exec\u003c/code> on macOS, the legacy Go AppContainer helper on Windows. The assistant keeps editing LaTeX directly. Tectonic alone can read and write any of the user's files (\u003ca href=\"#/journal/2026-11-01-werk-handoff~tectonic-file-access\">evidence\u003c/a>). Round 5 offered the rule-lean alternative, in which untrusted text never becomes LaTeX and no sandbox is needed; it was recommended and declined.\u003c/td>\n\u003ctd>4, 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-delivery\u003c/td>\n\u003ctd>Unsigned builds; an in-app notice links to a newer GitHub release; no automatic updates. Differs (signing was recommended).\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-builds\u003c/td>\n\u003ctd>GitHub Actions builds unsigned installers on version tags into a draft release.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-icon\u003c/td>\n\u003ctd>Light monogram with a green match dot: \u003ca href=\"attachments/werk-design/icon.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72fc4de3816f5e817ec9fc9af4e7e5d44a4321413e97d6e527843678de4d57ec\">reference\u003c/a>, source \u003ccode>design/werk/icon.svg\u003c/code>. Differs (the dark monogram was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-license\u003c/td>\n\u003ctd>MIT.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"repository-and-working-agreement\">Repository and working agreement\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Round\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>REB-repo\u003c/td>\n\u003ctd>Same repository. The old app is archived on the \u003ccode>legacy\u003c/code> branch at \u003ccode>e493246\u003c/code>, and the wiki restarted for werk.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-rename\u003c/td>\n\u003ctd>Rename the GitHub repository to \u003ccode>werk\u003c/code> at the first release. Differs (renaming now was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-retire\u003c/td>\n\u003ctd>The old app, its data folder and the checkout's old outputs and private files were deleted on 1 November after the user confirmed each path.\u003c/td>\n\u003ctd>2, 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-restructure\u003c/td>\n\u003ctd>Restructured in the planning session, before handoff.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-branch\u003c/td>\n\u003ctd>Work directly on \u003ccode>main\u003c/code>. Differs (a \u003ccode>werk\u003c/code> branch with pull requests was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-github\u003c/td>\n\u003ctd>The agent may push \u003ccode>main\u003c/code> and \u003ccode>legacy\u003c/code> without asking. Tags, releases, pull requests and other GitHub actions need the user.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-autonomy\u003c/td>\n\u003ctd>Continue through all milestones; stop only for consequential unsettled decisions.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-live-checks\u003c/td>\n\u003ctd>Small live checks are allowed: real inference and bounded read-only scans, with a fictional profile.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-windows-testing\u003c/td>\n\u003ctd>The user tests Windows builds on their PC only before releases. Differs (after each milestone was recommended).\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-docs\u003c/td>\n\u003ctd>No Slopchan. The jstack wiki holds all project documentation.\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REB-start\u003c/td>\n\u003ctd>Implementation starts with milestone 1, proving Windows installation and startup first.\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","backlinks":["index","discussions/open-questions","features/desktop","features/profile","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"]},{"id":"discussions/open-questions","title":"Open questions","section":"Discussions","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Open questions\nsection: Discussions\nupdated: 2026-11-01\n---\n# Open questions\n\nNothing blocks milestone 1. These items wait for a later point.\n\n| Item | When | State |\n| --- | --- | --- |\n| Rename the repository to `werk` | First release (M5) | Decided ([REB-rename](../decisions/index.md#repository-and-working-agreement)). The user approves the rename; the agent then updates the remote and the release-check constant. |\n| Old ununemploy install on the user's Windows PC | Any time | The user removes it through Settings → Apps. |\n","toc":[],"titleAnchor":"open-questions","links":["decisions/index"],"attachments":[],"html":"\u003cp>Nothing blocks milestone 1. These items wait for a later point.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth>When\u003c/th>\n\u003cth>State\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Rename the repository to \u003ccode>werk\u003c/code>\u003c/td>\n\u003ctd>First release (M5)\u003c/td>\n\u003ctd>Decided (\u003ca href=\"#/decisions/index~repository-and-working-agreement\">REB-rename\u003c/a>). The user approves the rename; the agent then updates the remote and the release-check constant.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Old ununemploy install on the user's Windows PC\u003c/td>\n\u003ctd>Any time\u003c/td>\n\u003ctd>The user removes it through Settings → Apps.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","backlinks":["index","journal/2026-11-01-rebuild","journal/2026-11-01-werk-handoff"]},{"id":"features/assistant","title":"Assistant and ChatGPT connection","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Assistant and ChatGPT connection\nsection: Features\nupdated: 2026-11-01\n---\n# Assistant and ChatGPT connection\n\n**FEAT-assistant** implements the [bounded assistant and AI runtime](../journal/2026-11-01-werk-handoff.md#screens), with the canonical [profile](profile.md). The assistant cannot submit applications, contact anyone, run a shell, or access arbitrary files.\n\n## Entry points and outcomes\n\nOpen assistant in any page header opens a fixed 520 px panel over the page. Navigation keeps the conversation, scroll and unsent composer text. Escape and Close assistant return focus to the header control. Enter sends; Shift+Enter inserts a newline. Stop cancels pending or running work. New chat clears the conversation and its attachments.\n\nAttach files accepts PDF, text and images; pasted images use the same route. Each file is limited to 10 MB, five files and 20 MB per message. PDF text extraction runs in a bounded worker with an 80-page, 100,000-character and 15-second limit. Attachments are stored only under the app's data folder.\n\nM2 actions are read_profile, read_reference and edit_profile. Public references are limited to user-supplied URLs, bounded related links and GitHub README/contribution pages. Private network addresses, credentials in URLs and non-web schemes are rejected, including at connection-time DNS resolution. Reads share an eight-request budget. Fetched text is untrusted evidence, never instructions.\n\nProfile edits must cite exact source quotes, use permitted small field paths and pass the canonical schema. Unsupported actions, prototype paths, source mismatches and stale revisions save nothing. Edits are staged and committed together; the UI displays receipts from actual writes. The runtime profile skill is `src/backend/profile/build-user-profile/SKILL.md`.\n\nSettings → AI starts SDK-owned ChatGPT OAuth, offers the verified OpenAI browser URL and manual callback fallback, and supports cancellation and sign-out. Credentials live in `pi-auth` with private Unix permissions or restricted Windows ACLs. SDK credential modifications serialize; SDK code owns refresh. There is no API-key or billing fallback. Only `gpt-5.6-sol` with high reasoning is requested. No telemetry exporter is configured.\n\nAll inference goes through one persistent queue. Authentication, model-access or allowance failures pause work without deleting messages or pending tasks. Retry resumes a failed/paused task. Restart pauses interrupted running work rather than submitting it twice.\n\n## Verification recipe\n\nUse [shared setup](../verification/setup.md). `npm test` verifies credentials, evidence paths, public-network guards and queue serialization/pause. `tests/profile-smoke.ts` drives PDF attachment, save receipt, navigation persistence, 520 px geometry, Escape/focus return and simulated allowance failure through the packaged UI. `tests/auth-smoke.ts` starts the real bundled SDK sign-in flow up to browser handoff, validates its destination/PKCE/state and cancels; it does not authenticate or perform inference.\n\nReal inference requires the user's browser sign-in to the development app and uses fictional facts only. Credentials and the private auth URL never enter verification evidence.\n\n## Verification history\n\n- [M2 run](../verification/runs/2026-11-01-m2-profile.md).\n","toc":[{"id":"entry-points-and-outcomes","title":"Entry points and outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"assistant-and-chatgpt-connection","links":["journal/2026-11-01-werk-handoff","features/profile","verification/setup","verification/runs/2026-11-01-m2-profile"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-assistant\u003c/strong> implements the \u003ca href=\"#/journal/2026-11-01-werk-handoff~screens\">bounded assistant and AI runtime\u003c/a>, with the canonical \u003ca href=\"#/features/profile\">profile\u003c/a>. The assistant cannot submit applications, contact anyone, run a shell, or access arbitrary files.\u003c/p>\n\u003ch2 id=\"entry-points-and-outcomes\">Entry points and outcomes\u003c/h2>\n\u003cp>Open assistant in any page header opens a fixed 520 px panel over the page. Navigation keeps the conversation, scroll and unsent composer text. Escape and Close assistant return focus to the header control. Enter sends; Shift+Enter inserts a newline. Stop cancels pending or running work. New chat clears the conversation and its attachments.\u003c/p>\n\u003cp>Attach files accepts PDF, text and images; pasted images use the same route. Each file is limited to 10 MB, five files and 20 MB per message. PDF text extraction runs in a bounded worker with an 80-page, 100,000-character and 15-second limit. Attachments are stored only under the app's data folder.\u003c/p>\n\u003cp>M2 actions are read_profile, read_reference and edit_profile. Public references are limited to user-supplied URLs, bounded related links and GitHub README/contribution pages. Private network addresses, credentials in URLs and non-web schemes are rejected, including at connection-time DNS resolution. Reads share an eight-request budget. Fetched text is untrusted evidence, never instructions.\u003c/p>\n\u003cp>Profile edits must cite exact source quotes, use permitted small field paths and pass the canonical schema. Unsupported actions, prototype paths, source mismatches and stale revisions save nothing. Edits are staged and committed together; the UI displays receipts from actual writes. The runtime profile skill is \u003ccode>src/backend/profile/build-user-profile/SKILL.md\u003c/code>.\u003c/p>\n\u003cp>Settings → AI starts SDK-owned ChatGPT OAuth, offers the verified OpenAI browser URL and manual callback fallback, and supports cancellation and sign-out. Credentials live in \u003ccode>pi-auth\u003c/code> with private Unix permissions or restricted Windows ACLs. SDK credential modifications serialize; SDK code owns refresh. There is no API-key or billing fallback. Only \u003ccode>gpt-5.6-sol\u003c/code> with high reasoning is requested. No telemetry exporter is configured.\u003c/p>\n\u003cp>All inference goes through one persistent queue. Authentication, model-access or allowance failures pause work without deleting messages or pending tasks. Retry resumes a failed/paused task. Restart pauses interrupted running work rather than submitting it twice.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a>. \u003ccode>npm test\u003c/code> verifies credentials, evidence paths, public-network guards and queue serialization/pause. \u003ccode>tests/profile-smoke.ts\u003c/code> drives PDF attachment, save receipt, navigation persistence, 520 px geometry, Escape/focus return and simulated allowance failure through the packaged UI. \u003ccode>tests/auth-smoke.ts\u003c/code> starts the real bundled SDK sign-in flow up to browser handoff, validates its destination/PKCE/state and cancels; it does not authenticate or perform inference.\u003c/p>\n\u003cp>Real inference requires the user's browser sign-in to the development app and uses fictional facts only. Credentials and the private auth URL never enter verification evidence.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m2-profile\">M2 run\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["features/desktop","features/index","features/profile","verification/runs/2026-11-01-m2-profile"]},{"id":"features/desktop","title":"Desktop shell and local backend","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Desktop shell and local backend\nsection: Features\nupdated: 2026-11-01\n---\n# Desktop shell and local backend\n\n**FEAT-desktop** implements the [M1 shell](../journal/2026-11-01-werk-handoff.md#milestones), [runtime, process and tray decisions](../decisions/index.md#platform-and-delivery). Inbox now shows the setup checklist; [Profile](profile.md) and the [assistant](assistant.md) are functional. Saved and CV remain empty states until their milestones. Settings contains General, AI and Diagnostics.\n\n## Entry points and expected outcomes\n\nLaunch werk from its installed application. A fresh data folder creates schema 1 in SQLite with WAL and FTS5. Only the utility process owns the database. The sandboxed React renderer uses a typed, validated MessagePort API; it has no Node access or HTTP API server.\n\nAppearance defaults to System. Settings → General → Appearance offers System, Light and Dark; the selection persists and controls native chrome. Settings → Diagnostics shows runtime versions, SQLite and FTS5, database size, backend start/restart state, update status and the last 20 sanitized warnings/errors. Copy diagnostics excludes candidate facts, jobs and credentials.\n\nClosing the window hides it while the backend continues. Opening werk again focuses that window. macOS keeps its Dock presence; Windows has an Open werk / Quit werk tray menu. Quit shuts down the backend and exits. A second instance cannot own the same data folder.\n\nAn unexpected backend exit rejects pending calls, restarts after one second and reconnects the renderer. More than three crashes in one minute stops automatic recovery and shows Copy diagnostics / Restart. Restart explicitly retries. Persisted data survives.\n\nA release check runs after 30 seconds and every 12 hours. Only newer stable releases at the configured GitHub repository produce a Download link. There is no auto-update. The repository still has its old name, so a 404 is treated as no releases. A fake endpoint is compiled in only when building with `--test`.\n\n## Verification recipe\n\nUse the [shared setup](../verification/setup.md). `npm run check`, `npm test`, `npm run package`, then `WERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" npm run smoke` exercises launch, diagnostics, themes, crash recovery, crash-loop stopping, window close/reopen, single instance and persistence. The driver uses native Electron and accessible controls; fixtures are empty, isolated user-data directories.\n\nFor the fake release notice: `npm run package -- --test`, then the same smoke command with `WERK_SMOKE_TEST_BUILD=1`. Rebuild normally before distributing. Windows CI installs the NSIS installer silently, launches the installed executable with the same driver, and verifies uninstall preserves the isolated database.\n\n## Coverage and limits\n\nThe smoke driver verifies close/reopen through Electron and a second OS process. Native Dock click and Windows tray menu click require a separate desktop check; the driver does not claim those clicks. The temporary tray artwork is replaced in M5. The first release remains subject to the user's Windows check and explicit release authorization.\n\n## Verification history\n\n- [M1 verification](../verification/runs/2026-11-01-m1-shell.md).\n","toc":[{"id":"entry-points-and-expected-outcomes","title":"Entry points and expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limits","title":"Coverage and limits","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"desktop-shell-and-local-backend","links":["journal/2026-11-01-werk-handoff","decisions/index","features/profile","features/assistant","verification/setup","verification/runs/2026-11-01-m1-shell"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-desktop\u003c/strong> implements the \u003ca href=\"#/journal/2026-11-01-werk-handoff~milestones\">M1 shell\u003c/a>, \u003ca href=\"#/decisions/index~platform-and-delivery\">runtime, process and tray decisions\u003c/a>. Inbox now shows the setup checklist; \u003ca href=\"#/features/profile\">Profile\u003c/a> and the \u003ca href=\"#/features/assistant\">assistant\u003c/a> are functional. Saved and CV remain empty states until their milestones. Settings contains General, AI and Diagnostics.\u003c/p>\n\u003ch2 id=\"entry-points-and-expected-outcomes\">Entry points and expected outcomes\u003c/h2>\n\u003cp>Launch werk from its installed application. A fresh data folder creates schema 1 in SQLite with WAL and FTS5. Only the utility process owns the database. The sandboxed React renderer uses a typed, validated MessagePort API; it has no Node access or HTTP API server.\u003c/p>\n\u003cp>Appearance defaults to System. Settings → General → Appearance offers System, Light and Dark; the selection persists and controls native chrome. Settings → Diagnostics shows runtime versions, SQLite and FTS5, database size, backend start/restart state, update status and the last 20 sanitized warnings/errors. Copy diagnostics excludes candidate facts, jobs and credentials.\u003c/p>\n\u003cp>Closing the window hides it while the backend continues. Opening werk again focuses that window. macOS keeps its Dock presence; Windows has an Open werk / Quit werk tray menu. Quit shuts down the backend and exits. A second instance cannot own the same data folder.\u003c/p>\n\u003cp>An unexpected backend exit rejects pending calls, restarts after one second and reconnects the renderer. More than three crashes in one minute stops automatic recovery and shows Copy diagnostics / Restart. Restart explicitly retries. Persisted data survives.\u003c/p>\n\u003cp>A release check runs after 30 seconds and every 12 hours. Only newer stable releases at the configured GitHub repository produce a Download link. There is no auto-update. The repository still has its old name, so a 404 is treated as no releases. A fake endpoint is compiled in only when building with \u003ccode>--test\u003c/code>.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use the \u003ca href=\"#/verification/setup\">shared setup\u003c/a>. \u003ccode>npm run check\u003c/code>, \u003ccode>npm test\u003c/code>, \u003ccode>npm run package\u003c/code>, then \u003ccode>WERK_EXE=\"$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" npm run smoke\u003c/code> exercises launch, diagnostics, themes, crash recovery, crash-loop stopping, window close/reopen, single instance and persistence. The driver uses native Electron and accessible controls; fixtures are empty, isolated user-data directories.\u003c/p>\n\u003cp>For the fake release notice: \u003ccode>npm run package -- --test\u003c/code>, then the same smoke command with \u003ccode>WERK_SMOKE_TEST_BUILD=1\u003c/code>. Rebuild normally before distributing. Windows CI installs the NSIS installer silently, launches the installed executable with the same driver, and verifies uninstall preserves the isolated database.\u003c/p>\n\u003ch2 id=\"coverage-and-limits\">Coverage and limits\u003c/h2>\n\u003cp>The smoke driver verifies close/reopen through Electron and a second OS process. Native Dock click and Windows tray menu click require a separate desktop check; the driver does not claim those clicks. The temporary tray artwork is replaced in M5. The first release remains subject to the user's Windows check and explicit release authorization.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m1-shell\">M1 verification\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","verification/runs/2026-11-01-m1-shell"]},{"id":"features/index","title":"Features","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Features\nsection: Features\nupdated: 2026-11-01\n---\n# Features\n\n- [Desktop shell and local backend](desktop.md) — FEAT-desktop\n- [Profile and search criteria](profile.md) — FEAT-profile\n- [Assistant and ChatGPT connection](assistant.md) — FEAT-assistant\n\nThe remaining rebuild scope is in the [handoff milestones](../journal/2026-11-01-werk-handoff.md#milestones).\n","toc":[],"titleAnchor":"features","links":["features/desktop","features/profile","features/assistant","journal/2026-11-01-werk-handoff"],"attachments":[],"html":"\u003cul>\n\u003cli>\u003ca href=\"#/features/desktop\">Desktop shell and local backend\u003c/a> — FEAT-desktop\u003c/li>\n\u003cli>\u003ca href=\"#/features/profile\">Profile and search criteria\u003c/a> — FEAT-profile\u003c/li>\n\u003cli>\u003ca href=\"#/features/assistant\">Assistant and ChatGPT connection\u003c/a> — FEAT-assistant\u003c/li>\n\u003c/ul>\n\u003cp>The remaining rebuild scope is in the \u003ca href=\"#/journal/2026-11-01-werk-handoff~milestones\">handoff milestones\u003c/a>.\u003c/p>\n","backlinks":["index"]},{"id":"features/profile","title":"Profile and search criteria","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Profile and search criteria\nsection: Features\nupdated: 2026-11-01\n---\n# Profile and search criteria\n\n**FEAT-profile** implements [REB-profile and REB-criteria](../decisions/index.md#product). The latest SQLite `profile_versions` document is canonical. New installations have no saved revision and no candidate facts. The initial working-hours preference uses the computer's timezone and 09:00–18:00 hours.\n\n## Entry points and outcomes\n\nProfile has inline Save/Cancel forms for basics, eligibility preferences, experience, projects, education, additional facts and missing questions. Facts retain Confirmed, Preference or Inferred status and source references. User edits add an attributed revision. Previous versions → Restore appends a new revision. Concurrent edits against an old revision are rejected. Unsaved forms guard navigation and quit.\n\nSearch criteria stores target roles, location choices, work arrangements, timezone, work hours, minimum overlap and hidden companies. Its overlap preview calls the same backend function used by discovery: compare the user's local work hours with each country's 09:00–18:00 day and keep its best-overlapping IANA zone. [Geography attribution](../journal/2026-11-01-geography-attribution.md).\n\nReadiness requires name, current location, target roles, useful background and work arrangements. Education or projects can supply background. Unknown citizenship and authorization answers do not block readiness. Setup links to profile/criteria and the [assistant](assistant.md); source selection and scanning arrive in M3.\n\n## Verification recipe\n\nUse [shared setup](../verification/setup.md). `npm test` exercises empty installation, evidence validation, revision conflict, restore, readiness and timezone overlap. Against a packaged test build, `WERK_EXE=\"\u003cexecutable>\" node --experimental-strip-types tests/profile-smoke.ts` builds a fictional profile through the assistant from an attached PDF, edits its name in the form, restores revision 1 as revision 3, opens the overlap preview and dismisses a dirty-navigation confirmation. Cleanup removes only the driver's temporary data.\n\n## Coverage and history\n\nTests cover unknown eligibility, revisions and dirty navigation; full keyboard/accessibility audit and unsaved quit are revisited in M5. Awards can be preserved and added by the assistant; a dedicated awards form is not part of the specified profile sections.\n\n- [M2 run](../verification/runs/2026-11-01-m2-profile.md).\n","toc":[{"id":"entry-points-and-outcomes","title":"Entry points and outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-history","title":"Coverage and history","depth":2}],"titleAnchor":"profile-and-search-criteria","links":["decisions/index","journal/2026-11-01-geography-attribution","features/assistant","verification/setup","verification/runs/2026-11-01-m2-profile"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-profile\u003c/strong> implements \u003ca href=\"#/decisions/index~product\">REB-profile and REB-criteria\u003c/a>. The latest SQLite \u003ccode>profile_versions\u003c/code> document is canonical. New installations have no saved revision and no candidate facts. The initial working-hours preference uses the computer's timezone and 09:00–18:00 hours.\u003c/p>\n\u003ch2 id=\"entry-points-and-outcomes\">Entry points and outcomes\u003c/h2>\n\u003cp>Profile has inline Save/Cancel forms for basics, eligibility preferences, experience, projects, education, additional facts and missing questions. Facts retain Confirmed, Preference or Inferred status and source references. User edits add an attributed revision. Previous versions → Restore appends a new revision. Concurrent edits against an old revision are rejected. Unsaved forms guard navigation and quit.\u003c/p>\n\u003cp>Search criteria stores target roles, location choices, work arrangements, timezone, work hours, minimum overlap and hidden companies. Its overlap preview calls the same backend function used by discovery: compare the user's local work hours with each country's 09:00–18:00 day and keep its best-overlapping IANA zone. \u003ca href=\"#/journal/2026-11-01-geography-attribution\">Geography attribution\u003c/a>.\u003c/p>\n\u003cp>Readiness requires name, current location, target roles, useful background and work arrangements. Education or projects can supply background. Unknown citizenship and authorization answers do not block readiness. Setup links to profile/criteria and the \u003ca href=\"#/features/assistant\">assistant\u003c/a>; source selection and scanning arrive in M3.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">shared setup\u003c/a>. \u003ccode>npm test\u003c/code> exercises empty installation, evidence validation, revision conflict, restore, readiness and timezone overlap. Against a packaged test build, \u003ccode>WERK_EXE=\"&lt;executable&gt;\" node --experimental-strip-types tests/profile-smoke.ts\u003c/code> builds a fictional profile through the assistant from an attached PDF, edits its name in the form, restores revision 1 as revision 3, opens the overlap preview and dismisses a dirty-navigation confirmation. Cleanup removes only the driver's temporary data.\u003c/p>\n\u003ch2 id=\"coverage-and-history\">Coverage and history\u003c/h2>\n\u003cp>Tests cover unknown eligibility, revisions and dirty navigation; full keyboard/accessibility audit and unsaved quit are revisited in M5. Awards can be preserved and added by the assistant; a dedicated awards form is not part of the specified profile sections.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-01-m2-profile\">M2 run\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["features/assistant","features/desktop","features/index","verification/runs/2026-11-01-m2-profile"]},{"id":"journal/2026-11-01-geography-attribution","title":"Geography data attribution","section":"Journal","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Geography data attribution\nsection: Journal\nupdated: 2026-11-01\n---\n# Geography data attribution\n\n`geonames.json` is derived from [GeoNames](https://www.geonames.org/) and licensed under [Creative Commons Attribution 4.0](https://creativecommons.org/licenses/by/4.0/). The source data was downloaded on 17 September 2026. Data is supplied without warranties of accuracy, timeliness or completeness.\n\nThe retained offline dataset comes from the archived app. Country and place names resolve discovery locations without sending the profile to a geocoding service. `resources/geography/zone1970.tab` maps country codes to IANA timezones; `tzdb-LICENSE` and `tzdb-version.txt` retain its license and source version. Current daylight-saving offsets come from the runtime's Intl data. Unknown locations do not exclude a posting.\n","toc":[],"titleAnchor":"geography-data-attribution","links":[],"attachments":[],"html":"\u003cp>\u003ccode>geonames.json\u003c/code> is derived from \u003ca href=\"https://www.geonames.org/\" rel=\"noreferrer\">GeoNames\u003c/a> and licensed under \u003ca href=\"https://creativecommons.org/licenses/by/4.0/\" rel=\"noreferrer\">Creative Commons Attribution 4.0\u003c/a>. The source data was downloaded on 17 September 2026. Data is supplied without warranties of accuracy, timeliness or completeness.\u003c/p>\n\u003cp>The retained offline dataset comes from the archived app. Country and place names resolve discovery locations without sending the profile to a geocoding service. \u003ccode>resources/geography/zone1970.tab\u003c/code> maps country codes to IANA timezones; \u003ccode>tzdb-LICENSE\u003c/code> and \u003ccode>tzdb-version.txt\u003c/code> retain its license and source version. Current daylight-saving offsets come from the runtime's Intl data. Unknown locations do not exclude a posting.\u003c/p>\n","backlinks":["features/profile"]},{"id":"journal/2026-11-01-grill-2429f43a2dda41cdf1aaa20116f739b4","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-11-01\u003c/span>","updated":"2026-11-01","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-11-01\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan in the [clean rebuild plan](2026-11-01-rebuild.md).\n\nSession: `2429f43a2dda41cdf1aaa20116f739b4`\n\nPreviews were HTML mockups with fictional data. Descriptions marked *local* contained usage figures from the private database (opened, saved and applied counts, saves per source); the complete round is retained outside the wiki.\n\n## Question 1\n\n```text\nRound: Rebuild from first principles\nQuestion: Does this diagnosis match your experience of the app?\nDescription: local\nSelection: single\nOptions: Matches / Partly — see notes / Does not match\nSelected: Matches\nNotes: \n```\n\n## Question 2\n\n```text\nRound: Rebuild from first principles\nQuestion: Who will install the app?\nDescription (Markdown source):\nThis decides how much signing, first-run setup and Windows support are worth. Your 18 October note says you want a downloadable Windows release on GitHub.\nRecommendation: A public GitHub release. That matches your stated goal and justifies signing and a setup checklist.\nSelection: single\nOptions: Only me / Me and a few people I give it to / Anyone, through a public GitHub release\nSelected: Anyone, through a public GitHub release\nNotes: \n```\n\n## Question 3\n\n```text\nRound: Rebuild from first principles\nQuestion: Which platforms should the rebuild support?\nDescription (Markdown source):\nUnraid has never been deployed; its Docker image, XML template and supervisord exist but are unverified. Dropping a target removes its packaging code; it can be added back later because the backend stays a plain Node module.\nRecommendation: macOS (Apple Silicon) and Windows 11 x64. Defer Unraid and Linux until you will actually run them.\nSelection: multiple\nOptions: macOS (Apple Silicon) / Windows 11 x64 / Unraid / Docker server / Linux desktop\nSelected: macOS (Apple Silicon) / Windows 11 x64\nNotes: \n```\n\n## Question 4\n\n```text\nRound: Rebuild from first principles\nQuestion: What makes the current Windows build unusable?\nDescription (Markdown source):\nPick everything you have seen. This checks whether the proposed runtime change addresses the real failures.\nSelection: multiple\nOptions: Installation fails or is confusing / Blank window or will not start / Slow or freezes / Crashes or stops in the background / ChatGPT sign-in fails / Scans fail / CV or letter PDFs fail / Layout or text looks wrong / Have not used it recently\nSelected: Installation fails or is confusing / Blank window or will not start / Slow or freezes / Crashes or stops in the background\nNotes: \n```\n\n## Question 5\n\n```text\nRound: Rebuild from first principles\nQuestion: Which desktop runtime should the rebuild use?\nDescription (Markdown source):\nCurrent architecture:\n\n```mermaid\nflowchart LR\n  shell[\"Go launcher: Cocoa or Win32\"] --> api[\"Node API\"]\n  shell --> worker[\"Node worker\"]\n  ui[\"Web UI\"] -->|\"polls every 8 s\"| api\n  api \u003c-->|\"leases, revision triggers\"| db[(\"SQLite 2.0 GB\")]\n  worker \u003c-->|\"leases, heartbeat\"| db\n  worker --> chromium[\"Headless Chromium: letter PDFs\"]\n  api --> tectonic[\"Tectonic: CV\"]\n```\n\n| | Electron | Tauri + Node sidecar | Keep Go shells, trimmed |\n| --- | --- | --- | --- |\n| Languages | TypeScript | TypeScript + Rust | TypeScript + Go + Objective-C + PowerShell |\n| Bundled runtimes | Electron (Node + Chromium), Tectonic | Node, Tectonic; system webview | Node, Tectonic; system webview |\n| Rendering | Chromium on both | WebKit on Mac, WebView2 on Windows | WebKit on Mac, WebView2 on Windows |\n| Installers, signing, auto-update | electron-builder + electron-updater | Tauri bundler + updater plugin | Hand-written |\n| Unpacked size (estimate) | ~300 MB | ~180 MB | ~170 MB |\n| Download (estimate) | ~120 MB | ~70 MB | ~70 MB |\n\nEstimates are unmeasured: typical runtime sizes plus Tectonic (48 MB) and its package cache (20 MB). All three drop headless Chromium and the shipped `node_modules`, which is most of today’s size. Risk to check early with Electron: whether its Node build includes `node:sqlite`; otherwise use `better-sqlite3`.\nRecommendation: Electron. It has the fewest moving parts: one language, no separate Node binary or Chromium download, and maintained installers and updates on both platforms. It removes the custom Windows host, process supervision and installer, where the Windows-only code lives. It costs roughly 120 MB more on disk than Tauri.\nSelection: single\nOptions: Electron / Tauri + Node sidecar / Keep Go shells, trimmed\nSelected: Electron\nNotes: \n```\n\n## Question 6\n\n```text\nRound: Rebuild from first principles\nQuestion: How should releases be signed and updated?\nDescription (Markdown source):\nWithout signing, macOS blocks the first open until you allow it in System Settings, and macOS auto-update requires a signed app. Windows shows a SmartScreen warning. Signing costs the Apple Developer Program (US$99/year) and a paid Windows certificate or signing service. Releases would be published as GitHub Releases in every option.\nRecommendation: Sign and notarize both, with automatic updates, if anyone besides you will install it. If it is only for you, choose unsigned with an update notice.\nSelection: single\nOptions: Sign both; automatic updates / Sign macOS only; Windows unsigned with an update notice / Unsigned on both; in-app notice links to the new release\nSelected: Unsigned on both; in-app notice links to the new release\nNotes: \n```\n\n## Question 7\n\n```text\nRound: Rebuild from first principles\nQuestion: How should the rebuild happen?\nDescription (Markdown source):\n**Port largely unchanged** (about 8,500 lines that already work): source adapters and parsers, matching, eligibility, deduplication, location and timezone data, pi-ai runtime and credentials, assistant actions and validation, LaTeX compilation, the ZIP backup format.\n\n**Rewrite:** desktop shell and packaging, process model, database schema and queries, API, UI.\n\n**Data moves through the existing ZIP export.** The new app imports a backup and applies the new storage rules from the question on stored jobs. The old app stays usable until the new one reaches parity.\nRecommendation: Rebuild alongside in this repo and port the proven modules. Rewriting the shell, storage and UI in place would leave both versions half-working for weeks.\nSelection: single\nOptions: Rebuild alongside; port proven modules; import via ZIP / Refactor the current app in place, one step at a time / Start clean; import only profile, CV and letters\nSelected: Start clean; import only profile, CV and letters\nNotes: dont import profile or CV. start completely clean. but keep a backup of my data, and put it on ~/Desktop/ununemploy-backup\n```\n\n## Question 8\n\n```text\nRound: Rebuild from first principles\nQuestion: Should the backend run as one process?\nDescription (Markdown source):\nProposed architecture:\n\n```mermaid\nflowchart LR\n  main[\"Electron main: window, menus, updates\"] --> backend[\"Backend process: API, scheduler, model queue\"]\n  ui[\"UI\"] \u003c-->|\"requests and push events\"| backend\n  backend --> db[(\"SQLite: typed columns, full-text search\")]\n  backend --> tectonic[\"Tectonic: CV and letters\"]\n  backend --> pi[\"pi-ai: ChatGPT subscription\"]\n```\n\nOne backend process owns the API, the scan scheduler and the serialized model queue. The UI receives push events when data changes. This removes worker leases, heartbeats, the `data_revisions` triggers, revision-hint headers, 8-second polling and the 15-second request timeout. Serialized model work is an in-process queue instead of a polled table; queued work still persists in SQLite so it survives restarts.\nRecommendation: One process. Most stale-state and timeout bugs come from two processes coordinating through the database.\nSelection: single\nOptions: One backend process with push updates / Keep separate API and worker processes\nSelected: One backend process with push updates\nNotes: \n```\n\n## Question 9\n\n```text\nRound: Rebuild from first principles\nQuestion: Which jobs should the app keep?\nDescription: local\nRecommendation: Keep Strong and Adjacent unless Incompatible (about 14,400 today), keep a fingerprint for the rest, and delete unsaved jobs 30 days after they close. Drop the HTTP body cache and description history for unsaved jobs. The database should fall from 2 GB to tens of MB.\nSelection: single\nOptions: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs / Keep every job; drop only the HTTP body cache and history / Keep everything (current)\nSelected: Keep Strong and Adjacent; fingerprint the rest; expire closed unsaved jobs\nNotes: \n```\n\n## Question 10\n\n```text\nRound: Rebuild from first principles\nQuestion: How should cover-letter PDFs be produced?\nDescription (Markdown source):\nHeadless Chromium (198 MB macOS, 274 MB Windows) exists only for letter PDFs and legacy resume exports. `docx` and Handlebars serve only legacy resumes. A LaTeX letter template would use the same fields as today (company, role, greeting, plain-text paragraphs, signature), with text escaped for LaTeX. Existing legacy resumes would be exported once as files and kept in appdata.\nRecommendation: Render letters with the same Tectonic engine as the CV. One document engine, letters that match the CV’s typography, and no browser dependency.\nSelection: single\nOptions: LaTeX for CV and letters / Electron's built-in print-to-PDF with the current HTML layout / Keep headless Chromium\nSelected: Something else\nNotes: just generate CVs in plain text.\n```\n\n## Question 11\n\n```text\nRound: Rebuild from first principles\nQuestion: Do you accept these implementation choices?\nDescription (Markdown source):\n| Area | Current | Rebuild |\n| --- | --- | --- |\n| Packaging | `tsx` at runtime; full `node_modules` shipped | Backend bundled with esbuild into one file |\n| Database | JSON documents + in-memory snapshot index | Typed columns for filters and sort, SQL indexes, FTS5 search; JSON only for raw source evidence |\n| UI server state | Custom `useRemote`, ETag polling, revision hints | TanStack Query, invalidated by push events |\n| Routing | Hash routes inside a 1,448-line `App.tsx` | One module per page; the router keeps unsaved-edit guards |\n| Assistant UI | assistant-ui runtime (295 KB chunk) | Plain message list and composer |\n| LaTeX editor | react-codemirror wrapper (964 KB chunk + 273 KB CSS) | CodeMirror 6 with only the needed extensions |\n| PDF preview | pdf.js (1.1 MB worker) | Built-in Chromium PDF viewer |\n| Tests | 27 `verify-*` scripts + node tests | Ported unit tests + one Playwright suite against the packaged app on both platforms |\n| Diagnostics | Logs in appdata | Settings → Diagnostics: versions and recent errors, copyable, no personal data |\nRecommendation: Accept. Each change removes code or a dependency; TanStack Query is the only new library, and it replaces hand-written caching and polling.\nSelection: single\nOptions: Accept / Accept with changes in notes / Discuss alternatives first\nSelected: Accept\nNotes: \n```\n\n## Question 12\n\n```text\nRound: Rebuild from first principles\nQuestion: What should the opening screen be?\nDescription: local\nRecommendation: Triage inbox. It turns the collection into a short daily queue you can clear.\nSelection: single\nOptions: Triage inbox (proposed) / Current browse-all inbox\nSelected: Triage inbox (proposed)\nNotes: \n```\n\n## Question 13\n\n```text\nRound: Rebuild from first principles\nQuestion: Where should your job criteria live?\nDescription (Markdown source):\nToday, location, timezone, arrangement, eligibility and match level are inbox filters restored per browser tab, while the profile separately stores preferences used for matching. Two places describe what you want. In the proposal, Profile → Search criteria decides what is collected and what appears in New. Filters only narrow a view temporarily. See the Profile question for a preview.\nRecommendation: In Profile as search criteria. Set them once; they also stop irrelevant jobs from being stored.\nSelection: single\nOptions: Profile → Search criteria; filters narrow temporarily / Keep everything as inbox filters (current)\nSelected: Profile → Search criteria; filters narrow temporarily\nNotes: \n```\n\n## Question 14\n\n```text\nRound: Rebuild from first principles\nQuestion: How should timezone fit be expressed?\nDescription (Markdown source):\nThe current picker selects a UTC range on a map with a separate rotating offset; it took four iterations on 18 October to handle the date-line seam. An overlap rule asks the question directly and wraps around midnight without a seam. Example: US Pacific gives 1 h of overlap with Kuala Lumpur. Matching stays country-level as today, so the United States matches 3 h through Hawaii. Try the slider.\nRecommendation: Minimum working-hours overlap with your timezone, stored in search criteria.\nSelection: single\nOptions: Minimum overlap with my working hours / Current UTC range, map and offset / No timezone filtering\nSelected: Minimum overlap with my working hours\nNotes: \n```\n\n## Question 15\n\n```text\nRound: Rebuild from first principles\nQuestion: How should a job's fit be shown?\nDescription (Markdown source):\nToday: a six-field metadata grid (several reading “Not listed” or “Unconfirmed”), then Description, Match, Notes and Cover letter tabs. Match evidence sits in its own tab, away from the text it refers to. The proposal leads with a summary of the deciding facts, then highlights matched and missing requirements inside the description.\nRecommendation: Decision summary and highlighted description. You read the reasons where they appear.\nSelection: single\nOptions: Decision summary + highlighted description / Current grid and Match tab\nSelected: Decision summary + highlighted description\nNotes: \n```\n\n## Question 16\n\n```text\nRound: Rebuild from first principles\nQuestion: How should a saved job be worked on?\nDescription (Markdown source):\nToday the letter is a tab in the half-width detail pane, below the metadata grid, edited as separate form fields. In the proposal, a saved job opens a workspace: the posting and notes on the left, the letter as a document on the right, with review notes and status visible. Contact fields stay in the letter's settings.\nRecommendation: Posting and letter side by side. Checking the letter against the posting is the main task here.\nSelection: single\nOptions: Posting and letter side by side / Current letter tab\nSelected: Posting and letter side by side\nNotes: \n```\n\n## Question 17\n\n```text\nRound: Rebuild from first principles\nQuestion: What should the app record after you save a job?\nDescription: local\nRecommendation: Saved and Applied only, with the status selector in the job header and the date in the list. Add interview stages later if you find you need them.\nSelection: single\nOptions: Saved and Applied, shown in the header and list / Add stages: Applied, Interviewing, Offer, Closed, with dates / Saved only; remove Applied\nSelected: Saved and Applied, shown in the header and list\nNotes: \n```\n\n## Question 18\n\n```text\nRound: Rebuild from first principles\nQuestion: How should the profile be shown and edited?\nDescription (Markdown source):\nThe current view renders the stored JSON as Markdown, including internal fields such as Id and Year/Month/Display “Not provided”. The proposal is a fact sheet: search criteria, eligibility, experience, projects and missing facts, each with its status and source. Direct editing would revise the 8 October read-only decision; direct edits are recorded as yours with a date, and the assistant remains available for imports and bulk changes.\nRecommendation: Fact sheet with direct editing as well as the assistant. Changing a phone number through chat is the clunkiest path.\nSelection: single\nOptions: Fact sheet; edit directly or with the assistant / Fact sheet; assistant-only edits / Current Markdown view\nSelected: Fact sheet; edit directly or with the assistant\nNotes: \n```\n\n## Question 19\n\n```text\nRound: Rebuild from first principles\nQuestion: What should the main navigation contain?\nDescription (Markdown source):\nSources are set up once and checked occasionally, but today they take a top-level page. The proposal puts them in Settings with per-source job and save counts. A failing source puts a dot on Settings, and Saved counts letters ready to review. The counts shown are your current collection; the statuses are illustrative.\nRecommendation: Inbox, Saved, Profile and CV, with Sources inside Settings.\nSelection: single\nOptions: Inbox, Saved, Profile, CV; Sources in Settings / Keep Sources as a top-level page\nSelected: Inbox, Saved, Profile, CV; Sources in Settings\nNotes: \n```\n\n## Question 20\n\n```text\nRound: Rebuild from first principles\nQuestion: Which sources should the rebuilt app keep?\nDescription: local\nRecommendation: Keep the first three groups. Drop scraped boards without saves, X and the boards that never returned a job. Scraped boards break when sites change, and X needs paid credits and budget code. Hacker News is optional.\nSelection: multiple\nOptions: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves / Hacker News / X search / Boards that never returned a job\nSelected: Sources with saves / Company boards (Greenhouse, Ashby, Lever) / Structured feeds and APIs without saves / Scraped boards without saves\nNotes: \n```\n\n## Question 21\n\n```text\nRound: Rebuild from first principles\nQuestion: Which additions should the rebuild include?\nDescription (Markdown source):\n| Addition | What it does |\n| --- | --- |\n| Keyboard triage | J/K move, S save, X skip, O open posting, / search |\n| Setup checklist | First run: connect ChatGPT → build profile from your CV PDF → choose sources → first scan |\n| Hide company | One action on a job hides that employer's future postings |\n| Track company | From a job on Greenhouse, Ashby or Lever, add that employer's board as a source |\n| Status counts | Saved shows letters ready to review; Settings shows failing sources or a needed sign-in |\n| Record versions when applying | Marking Applied records which letter and CV versions were current |\n| Saved views | Named filter combinations in the sidebar |\nRecommendation: Everything except saved views. Search criteria cover the main need for saved views.\nSelection: multiple\nOptions: Keyboard triage / Setup checklist / Hide company / Track company / Status counts / Record versions when applying / Saved views\nSelected: Keyboard triage / Setup checklist / Hide company\nNotes: \n```\n\n## Question 22\n\n```text\nRound: Rebuild from first principles\nQuestion: Which removals should the rebuild make?\nDescription (Markdown source):\nSources, timezone, the Match tab and platforms are covered by earlier questions.\n\n| Removal | Why |\n| --- | --- |\n| Seen state and filter | Replaced by New/All and bold unopened titles; 73 opens recorded |\n| Duplicate grouping control | Always group; the detail lists other listings |\n| Legacy resume code (`docx`, Handlebars, export routes) | Export existing resumes once to files |\n| Retired Jev code, migration and archive compatibility | Export stored Jev data once to a file |\n| HTTP body cache | 979 MB; keep only ETag/Last-Modified validators |\n| Description history for unsaved jobs | 380 MB; saving still snapshots the description |\n| VueJobs detail enrichment | Special six-per-day lookup path for one feed |\n| Custom installer and checksum inventory | Replaced by the packaging tool |\nRecommendation: All of them. Each removes code or stored data with no current use.\nSelection: multiple\nOptions: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nSelected: Seen state and filter / Duplicate grouping control / Legacy resume code / Retired Jev code / HTTP body cache / Description history for unsaved jobs / VueJobs detail enrichment / Custom installer and checksum inventory\nNotes: \n```\n\n## Question 23\n\n```text\nRound: Rebuild from first principles\nQuestion: What else feels clunky or breaks in daily use?\nDescription (Markdown source):\nAnything not covered above: specific screens, waits, errors or steps you avoid. Paste screenshots if useful.\nSelected: (none)\nNotes: \n```\n","toc":[{"id":"question-1","title":"Question 1","depth":2},{"id":"question-2","title":"Question 2","depth":2},{"id":"question-3","title":"Question 3","depth":2},{"id":"question-4","title":"Question 4","depth":2},{"id":"question-5","title":"Question 5","depth":2},{"id":"question-7","title":"Question 7","depth":2},{"id":"question-8","title":"Question 8","depth":2},{"id":"question-10","title":"Question 10","depth":2},{"id":"question-11","title":"Question 11","depth":2},{"id":"question-12","title":"Question 12","depth":2},{"id":"question-13","title":"Question 13","depth":2},{"id":"question-14","title":"Question 14","depth":2},{"id":"question-15","title":"Question 15","depth":2},{"id":"question-16","title":"Question 16","depth":2},{"id":"question-17","title":"Question 17","depth":2},{"id":"questi
