x.ts`, `desktop/cmd/texsandbox`, `desktop/internal/texsandbox` | `src/backend/cv/`, `scripts/setup-latex.mjs` | Tectonic binary and offline package cache shipped as `extraResources`. Write a new TypeScript template that renders the profile into `starter.tex` macros with LaTeX escaping (generate from profile). |\n| `core/backup/*` | `src/backend/backup/` (M5) | Rework for the new schema; keep scope and overwrite rules from the legacy `docs/wiki/features/backups.md`. |\n| `src/ui.css` tokens; behaviors of `src/AssistantPane.tsx`, `src/LatexCvPage.tsx`, `src/LocationFilter.tsx` | `src/renderer/` | Reuse tokens (below) and interaction contracts; rewrite components. |\n| **Drop** | — | `core/x.ts`, `core/x-auth.ts`, `core/web3*.ts`, `core/vuejobs.ts`, Jev, `core/cv/*` (Handlebars/docx/Playwright exports), `core/cover-letter/template.ts` layout, `core/timezone-range.ts`, `server/`, `worker/`, `desktop/` (except texsandbox), `deploy/`, the Seen feature, all `scripts/verify-*` drivers. |\n\n## Screens\n\nMockups use fictional data and the current tokens. Sources: `design/werk/*.html` (open in a browser; dark mode follows the OS). PNGs: `docs/wiki/attachments/werk-design/`. Copy rules (Decided, `rule-plain-ui`): no ornamental labels, captions or subtitles. Every string identifies content, explains a necessary state or supports an action. Use literal action labels.\n\n### Shell\n\n220 px sidebar: macOS traffic lights inset (the window uses `titleBarStyle: \"hiddenInset\"`, lights at about x 14, y 15), then **werk**, then Inbox (new count), Saved (count), Profile, CV. At the bottom: the update notice when present, then Settings (with a dot when a source fails or ChatGPT needs sign-in). 44 px headers are drag regions; controls inside are `no-drag`. Windows uses the standard frame with `autoHideMenuBar: true`. Right side of every header: **Open assistant**.\n\n### Inbox (opening screen)\n\n![Inbox](../attachments/werk-design/inbox.png)\n\n![Inbox, dark](../attachments/werk-design/inbox-dark.png)\n\n- **New**: `status = 'new'`, open, not a duplicate, best match first (`match_score`, then newest). **All matches**: every stored job except duplicates, searchable, any status.\n- Row: title (bold until opened), company · location summary, match level, age. Opening a row sets `opened_at`.\n- Detail: company, title, chips (match, remote eligibility, overlap, posted age, salary or \"Salary not listed\"), actions **Save** (S), **Skip** (X), **Open posting ↗** (O), **Hide company**. Then the decision summary (role, level, eligibility clause, gaps), **Description** / **Notes** tabs, highlight legend and highlighted description, then provenance (source, checked time, other listings).\n- Save: status `saved`, snapshot description, queue a cover letter (idempotent), select the next New job. Skip: status `skipped`, select the next job. Both are undoable from the job (**Move back to New**).\n- Hide company: add to `criteria.hiddenCompanies` (new profile revision); its New jobs become fingerprints; saved jobs stay.\n- Search (`/`): FTS5 over title, company, location and description, within the current tab. **Filters** (temporary, not persisted beyond the session): match level, arrangement, country, posted within.\n- Keyboard: J/K move, S save, X skip, O open posting, / search, Esc clears search or closes the assistant. Shortcuts are inactive while typing in a field.\n- Empty New: \"No new jobs.\" with the last scan time and **Scan now**. When a schedule is on (off by default, REB-schedule), show the next scan time instead.\n\n![Inbox empty](../attachments/werk-design/inbox-empty.png)\n\n### Setup checklist\n\n![Setup](../attachments/werk-design/setup.png)\n\nShown in place of the Inbox until the first scan has completed. Steps: Connect ChatGPT → Build your profile (opens the assistant; attachments accepted) → Set search criteria → Choose sources (17 of 37 on by default, REB-default-sources) → Run the first scan (enabled when the profile is ready). Completed steps show their state.\n\n### Job detail\n\n![Job detail](../attachments/werk-design/job-detail.png)\n\nHighlights come from the matcher's spans; unmatched text has no highlight. If spans are unavailable (excerpt-only descriptions), show the summary and plain description, with **Add full description** (manual paste) for incomplete postings.\n\n### Saved workspace\n\n![Saved](../attachments/werk-design/saved.png)\n\n- List rows show the letter or task state: Writing letter…, Letter ready, Needs full description, Paused: reason (sign-in, allowance, error), Applied date.\n- Header: company, title, status selector (Saved / Applied; Applied records `applied_at`), **Open posting ↗**.\n- Left: posting (the saved snapshot) and Notes (autosave after typing pauses, with a \"Saved\" state).\n- Right: letter toolbar (version selector, **Regenerate**, **Copy text**, **Save**), a plain-text editor, word count and generation provenance, and review notes. Saving appends a version; restoring appends a restored version. No PDF.\n\n### Profile\n\n![Profile](../attachments/werk-design/profile.png)\n\n![Editing search criteria](../attachments/werk-design/profile-criteria-edit.png)\n\nSections: Search criteria, Basics, Eligibility, Experience, Projects, Education, Skills, Missing. Each section has **Edit** (inline form, Save/Cancel) and shows status chips (Confirmed / Preference / Inferred) and source names. **Previous versions** lists revisions with summaries and **Restore**. **Missing** lists `openItems` with **Ask assistant**. The criteria editor includes the timezone overlap control and shows which countries match, using the same function the backend uses.\n\n### CV\n\n![CV](../attachments/werk-design/cv.png)\n\nToolbar: version selector, **Generate from profile** (new version, never overwrites unsaved edits; warn when the profile is newer than the version's `profile_revision`), **Recompile**, **Save**. Left: CodeMirror 6 with a minimal LaTeX mode, **Download .tex**. Bottom: compile status and parsed diagnostics (port `parseLatexDiagnostics`). Right: built-in PDF viewer, **Download PDF**. Dirty-edit guard on navigation and quit.\n\n### Assistant overlay\n\n![Assistant](../attachments/werk-design/assistant.png)\n\nUnchanged contract: 520 px panel fixed to the right, over the page without resizing it; opened from the header; Escape or the close button hides it and returns focus; conversation, scroll position and unsent text survive navigation; **New chat** clears the chat and its attachments. The line under the header names the context the assistant receives (current page, selected job or document). Messages show save receipts (record, version, compile result). Composer: Enter sends, Shift+Enter adds a newline, **Stop** while running, **Attach files** and pasted screenshots.\n\n### Settings\n\n![Sources](../attachments/werk-design/settings-sources.png)\n\n![AI](../attachments/werk-design/settings-ai.png)\n\n![Diagnostics with update notice](../attachments/werk-design/settings-diagnostics.png)\n\nSections: General (appearance System/Light/Dark; scan schedule: Manual (default), Every 4 hours, Every 12 hours), Sources (table with jobs kept, saved, last scan, next scan, on/off, failure with **Retry**; **Add source** accepts a Greenhouse, Ashby or Lever board URL, an RSS/Atom URL, or a catalog entry), AI (connection, model, allowance state, queue; sign-in flow with browser and manual-code fallback; **Sign out**), Backup (export/import ZIP), Diagnostics.\n\n### Design tokens\n\n| Token | Light | Dark |\n| --- | --- | --- |\n| `--bg` canvas | `#fcfcfc` | `#181818` |\n| `--panel` sidebar, secondary | `#f3f3f3` | `#222222` |\n| `--field` | `#ffffff` | `#181818` |\n| `--raised` | `#ffffff` | `#232323` |\n| `--text` | `#242424` | `#e7e7e7` |\n| `--muted` | `#636363` | `#a0a0a0` |\n| `--line` | `#14141412` | `#ffffff0f` |\n| `--line-strong` | `#14141425` | `#ffffff20` |\n| `--focus` | `#506f80` | `#adbec8` |\n| `--selected` | `#14141418` | `#ffffff14` |\n| `--ok` | `#36734c` | `#94bda2` |\n| `--warn` (new) | `#8a5a00` | `#e0b25c` |\n| `--bad` | `#a33632` | `#f49c92` |\n\nTypography: system font; 13 px base, 12 px controls and navigation, 11 px metadata, 14 px chat with 1.65 line height, 20 px document titles. Radii: 5 px controls, 6 px menus, dialogs and panels. Heights: 44 px headers, 36 px tabs, 28 px navigation rows, 26 px buttons. Shadows only on menus, dialogs and the assistant overlay. Visible focus rings. Respect reduced motion. System theme by default: CSS uses `prefers-color-scheme` plus `data-mode` for explicit choices; main sets `nativeTheme.themeSource` to match so native chrome follows.\n\n## Milestones\n\nEach milestone ends with a verification run in the new wiki (`docs/wiki/verification/runs/\u003crun-id>.md`, checked with `node ../jstack/skills/verify-change/scripts/check-reports.mjs docs/wiki`).\n\n### M1 — shell, backend, packaging, CI\n\nScope: Electron app named werk; main, preload, backend utility process and RPC; migrations with `settings` and `events`; renderer shell with the four pages (empty states only: \"No jobs yet.\", \"No saved jobs.\", \"No profile yet.\", \"No CV yet.\") and Settings → General (appearance) and Diagnostics; update notice; unsigned installers; CI.\n\nAcceptance:\n\n- `npm run check`, `npm test`, `npm run package` pass on macOS and Windows runners.\n- The packaged app starts on both platforms with a fresh `WERK_DATA_DIR`, shows the shell within 3 s, and Diagnostics reports SQLite with FTS5, schema 1 and a running backend (Playwright `_electron` smoke test).\n- Windows: the NSIS installer installs silently per user (`/S`), the installed `werk.exe` passes the same smoke test, and uninstall removes the app but not the data folder.\n- Killing the backend process restarts it and the UI reconnects; Diagnostics shows the restart count.\n- Second launch focuses the existing window; Quit exits all processes.\n- Closing the window leaves werk running (Dock on macOS, tray on Windows); reopening shows the same window and backend; **Quit werk** from the tray exits all processes.\n- The release check finds a newer fake release when pointed at a test URL (inject the URL with `WERK_RELEASES_URL` in tests only).\n- Installer sizes recorded in the verification run. Expected roughly 100–130 MB download (estimate, unmeasured).\n\n### M2 — AI, profile, assistant, setup\n\nChatGPT sign-in and status; profile versions, fact sheet with inline editing, readiness, restore; criteria editor with overlap; assistant overlay with attachments and bounded profile actions; setup checklist (steps 1–3 functional, 4–5 shown disabled until M3). Accept: profile built entirely through the assistant from an attached CV PDF (with simulated inference in tests), direct edits versioned, restore works, sign-in errors and allowance limits shown without losing queued work.\n\n### M3 — sources, collection, inbox\n\nDefault catalog (17 on, 20 scraped boards off), Add source, scheduler (manual by default; optional 4 or 12 hour schedule) with limits and backoff, pipeline with gating and fingerprints, reassessment on profile change, retention job, inbox triage with keyboard, job detail with highlights, Hide company, search and filters, Settings → Sources with failure states. Accept: fixture-based adapter tests; a scan with fixture HTTP responses stores only qualifying jobs; profile change moves jobs between stored and fingerprinted; New triage by keyboard only; database stays small (record its size after a live bounded scan with a fictional profile).\n\n### M4 — saved workspace, letters, CV\n\nSave queues a letter; serialized generation with pause/retry; plain-text editor with versions, review notes, Copy text; Applied status; CV generation from the profile, LaTeX editor, sandboxed Tectonic compilation, PDF preview and downloads; assistant actions for letters and the CV. Accept: simulated generation end to end; a few real generations with a fictional profile; compile failure keeps the previous PDF and shows diagnostics; every attempt in [Tectonic file access](#tectonic-file-access) fails inside the isolation on both platforms (an automated test per platform).\n\n### M5 — backups, polish, first release\n\nZIP export/import for werk data; Diagnostics complete; keyboard and focus audit; accessibility pass; app icon ([below](#app-icon)); README install instructions ([below](#install-instructions-for-the-readme)). Then, in order, each with the user's go-ahead: rename the repository (`gh repo rename werk`, then `git remote set-url origin https://github.com/rengwu/werk.git`); the user tests the Windows installer from CI on their PC; push the first tag. CI drafts the release and the user publishes it.\n\n## Build, packaging and release\n\n### Versions (Verified available; pinned at least two weeks old on 1 November 2026)\n\n`electron` 44.9.0, `electron-builder` 26.17.0, `vite` 8.3.4, `@vitejs/plugin-react` 6.1.2, `react`/`react-dom` 19.3.1, `@tanstack/react-query` 5.104.4, `typescript` 5.9.3 (avoid the 7.x native compiler for now), `esbuild` 0.28.2, `playwright-core` 1.64.1, `@types/node` 24.x (Electron 44 runs Node 24), `@types/react`/`@types/react-dom` 19.3.0, `@earendil-works/pi-ai` 1.3.0, `zod` 4.x, `pdfjs-dist` (backend PDF text), CodeMirror 6 packages, `@base-ui/react` 1.8.0 and `@phosphor-icons/react` 2.1.10 if needed. GitHub Actions: `actions/checkout@v7`, `actions/setup-node@v7`, `actions/upload-artifact@v7`, `actions/download-artifact@v8`, `actions/setup-go@v7` (v7.0.0, July 2026). Go 1.24 for the helper, as in legacy `desktop/go.mod`.\n\nLocal Node 22.19 runs `.ts` tests directly (type stripping, Verified) with SQLite 3.50.4 and FTS5. Use only erasable TypeScript syntax (`erasableSyntaxOnly`), `.ts` import extensions and `verbatimModuleSyntax`.\n\nPut **every** package in `devDependencies`: main, preload, backend and renderer are all bundled, so electron-builder ships no `node_modules`.\n\n### Layout\n\n```text\npackage.json            tsconfig.json          vite.config.ts (root: src/renderer, base: \"./\", outDir: ../../out/renderer)\nscripts/build.mjs       esbuild main/preload/backend → out/*.cjs (format cjs, platform node, target node24, external electron), then vite build\nscripts/dev.mjs         vite dev server + esbuild watch + Electron restart; sets WERK_RENDERER_URL\nscripts/setup-latex.mjs downloads Tectonic for the target platform and prepares the offline cache into resources/\ntools/texsandbox/       Windows sandbox helper: one Go `package main` (go.mod with golang.org/x/sys), built to resources/runtime/win/\nsrc/main/  src/preload/  src/backend/  src/renderer/  src/shared/\ntests/*.test.ts         node --test\ntests/smoke.ts          Playwright _electron against a packaged executable (WERK_EXE)\nresources/              icons, geography data, Tectonic and cache (extraResources)\ndesign/werk/            HTML mockups\n.github/workflows/build.yml\n```\n\n### package.json (sketch, Unverified)\n\n```json\n{\n  \"name\": \"werk\",\n  \"productName\": \"werk\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"description\": \"Local job discovery, fit assessment, cover letters and CV management.\",\n  \"author\": \"John Goh\",\n  \"license\": \"MIT\",\n  \"type\": \"module\",\n  \"main\": \"out/main.cjs\",\n  \"scripts\": {\n    \"dev\": \"node scripts/dev.mjs\",\n    \"build\": \"node scripts/build.mjs\",\n    \"check\": \"tsc --noEmit\",\n    \"test\": \"node --test tests/*.test.ts\",\n    \"package\": \"npm run build && electron-builder --publish never\",\n    \"smoke\": \"node tests/smoke.ts\"\n  },\n  \"build\": {\n    \"appId\": \"io.github.rengwu.werk\",\n    \"productName\": \"werk\",\n    \"directories\": { \"output\": \"release\", \"buildResources\": \"resources\" },\n    \"files\": [\"out/**/*\"],\n    \"extraResources\": [{ \"from\": \"resources/runtime/${os}\", \"to\": \"runtime\" }, { \"from\": \"resources/geography\", \"to\": \"geography\" }],\n    \"mac\": { \"target\": [{ \"target\": \"dmg\", \"arch\": [\"arm64\"] }], \"category\": \"public.app-category.productivity\", \"identity\": \"-\" },\n    \"win\": { \"target\": [{ \"target\": \"nsis\", \"arch\": [\"x64\"] }] },\n    \"nsis\": { \"oneClick\": true, \"perMachine\": false, \"artifactName\": \"werk-${version}-setup.${ext}\" },\n    \"dmg\": { \"artifactName\": \"werk-${version}-arm64.${ext}\" }\n  }\n}\n```\n\n`identity: \"-\"` asks for ad-hoc signing, which Apple Silicon requires to run at all; check with `codesign -dv` after packaging. Do not set `CSC_LINK`.\n\n### App icon\n\nDecided (REB-icon): the light monogram with a green match dot. Reference: `design/werk/icon.svg` and the [preview](../attachments/werk-design/icon.png).\n\n![Icon at Dock, 32 px and 16 px sizes](../attachments/werk-design/icon.png)\n\nUntil M5 the default Electron icon is fine. For M5:\n\n- Redraw the \"w\" as outlines from an OFL font such as Inter SemiBold, or draw it by hand. Do not rasterize the system font: SF Pro's license does not allow use in an app icon, and Segoe UI may not be redistributed.\n- Save the final vector as `resources/icon.svg` and export `resources/icon.png` at 1024 × 1024. electron-builder generates the `.icns` and `.ico` from it. Check the 16 px Windows rendering.\n- Windows tray: `resources/tray.png` and `tray@2x.png` (16 and 32 px) from the same drawing, shipped with an `extraResources` entry.\n\n### CI workflow (sketch, Unverified)\n\n```yaml\nname: Build\non:\n  push:\n    branches: [main]\n    tags: [\"v*\"]\npermissions:\n  contents: read\njobs:\n  build:\n    strategy:\n      fail-fast: false\n      matrix:\n        os: [macos-latest, windows-latest]\n    runs-on: ${{ matrix.os }}\n    env:\n      CSC_IDENTITY_AUTO_DISCOVERY: \"false\"\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-node@v7\n        with: { node-version: 24, cache: npm }\n      - run: npm ci\n      - run: npm run check\n      - run: npm test\n      - uses: actions/setup-go@v7\n        if: runner.os == 'Windows'\n        with: { go-version-file: tools/texsandbox/go.mod, cache-dependency-path: tools/texsandbox/go.sum }\n      - name: Build and test the LaTeX sandbox helper\n        if: runner.os == 'Windows'\n        working-directory: tools/texsandbox\n        run: |\n          go test ./...\n          go build -trimpath -o ../../resources/runtime/win/texsandbox.exe .\n      - run: node scripts/setup-latex.mjs\n      - run: npm run package\n      - name: Install on Windows\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          $setup = Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1\n          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait\n          \"WERK_EXE=$env:LOCALAPPDATA\\Programs\\werk\\werk.exe\" | Out-File -Append $env:GITHUB_ENV\n      - name: Locate app on macOS\n        if: runner.os == 'macOS'\n        run: echo \"WERK_EXE=$PWD/release/mac-arm64/werk.app/Contents/MacOS/werk\" >> \"$GITHUB_ENV\"\n      - run: npm run smoke\n      - uses: actions/upload-artifact@v7\n        if: always()\n        with:\n          name: werk-${{ runner.os }}\n          path: |\n            release/*.dmg\n            release/*-setup.exe\n            smoke-output/\n          retention-days: 7\n  release:\n    if: startsWith(github.ref, 'refs/tags/v')\n    needs: build\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/download-artifact@v8\n        with: { path: dist }\n      - env: { GH_TOKEN: \"${{ github.token }}\" }\n        run: |\n          gh release create \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\" --draft --title \"werk $GITHUB_REF_NAME\" --notes \"\" dist/*/*.dmg dist/*/*-setup.exe\n```\n\nRelease process: bump `version` in `package.json`, commit, tag `vX.Y.Z`, push the tag (only when the user asks). CI drafts the release; the user reviews and publishes it, which makes the in-app notice appear for older versions.\n\n### Install instructions for the README\n\n- **macOS:** open the `.dmg`, drag werk to Applications. The first open is blocked because the app is unsigned: open System Settings → Privacy & Security and click **Open Anyway** for werk. If macOS says the app is damaged, run `xattr -dr com.apple.quarantine /Applications/werk.app`.\n- **Windows:** run `werk-X.Y.Z-setup.exe`. If SmartScreen shows \"Windows protected your PC\", click **More info → Run anyway**. werk installs for the current user and opens.\n- **Updates:** werk shows a notice when a newer release exists; download and install it the same way. Your data stays in the data folder.\n\n### Code sketches (Unverified)\n\nMain process essentials:\n\n```ts\nimport { app, BrowserWindow, Menu, MessageChannelMain, Tray, ipcMain, nativeTheme, shell, utilityProcess, type UtilityProcess } from \"electron\";\nimport { join } from \"node:path\";\n\nif (process.env.WERK_DATA_DIR) app.setPath(\"userData\", process.env.WERK_DATA_DIR);\nelse if (!app.isPackaged) app.setPath(\"userData\", join(app.getPath(\"appData\"), \"werk-dev\"));\nif (!app.requestSingleInstanceLock()) app.exit(0);\n\nlet backend: UtilityProcess | null = null;\nlet win: BrowserWindow | null = null;\nlet quitting = false;\nconst restarts: number[] = [];\n\nfunction startBackend(previousExit?: string) {\n  const child = utilityProcess.fork(join(__dirname, \"backend.cjs\"), [], { serviceName: \"werk-backend\" });\n  child.once(\"spawn\", () => {\n    child.postMessage({ type: \"init\", dataDir: app.getPath(\"userData\"), version: app.getVersion(),\n      system: `${process.platform} ${process.getSystemVersion()} ${process.arch}`, previousExit });\n    if (win) connect();\n  });\n  child.once(\"exit\", (code) => {\n    backend = null;\n    if (quitting) return app.quit();\n    const now = Date.now();\n    restarts.push(now);\n    if (restarts.filter((t) => now - t \u003c 60_000).length > 3) return win?.webContents.send(\"werk:backend-failed\");\n    setTimeout(() => startBackend(`Backend exited with code ${code}`), 1000);\n  });\n  backend = child;\n}\n\nfunction connect() {\n  if (!backend || !win) return;\n  const { port1, port2 } = new MessageChannelMain();\n  backend.postMessage({ type: \"connect\" }, [port1]);\n  win.webContents.postMessage(\"werk:backend-port\", null, [port2]);\n}\n\nfunction openExternal(url: string) {\n  if (/^https?:\\/\\//i.test(url)) void shell.openExternal(url);\n}\n\nfunction createWindow() {\n  win = new BrowserWindow({\n    width: 1280, height: 820, minWidth: 900, minHeight: 600, show: false, title: \"werk\",\n    backgroundColor: nativeTheme.shouldUseDarkColors ? \"#181818\" : \"#fcfcfc\",\n    titleBarStyle: process.platform === \"darwin\" ? \"hiddenInset\" : \"default\",\n    trafficLightPosition: { x: 14, y: 15 }, autoHideMenuBar: true,\n    webPreferences: { preload: join(__dirname, \"preload.cjs\"), sandbox: true, contextIsolation: true, plugins: true },\n  });\n  win.once(\"ready-to-show\", () => win?.show());\n  win.webContents.setWindowOpenHandler(({ url }) => (openExternal(url), { action: \"deny\" }));\n  win.webContents.on(\"will-navigate\", (event, url) => { event.preventDefault(); openExternal(url); });\n  win.on(\"closed\", () => (win = null));\n  const dev = process.env.WERK_RENDERER_URL;\n  void (dev ? win.loadURL(dev) : win.loadFile(join(__dirname, \"renderer/index.html\")));\n}\n\nipcMain.on(\"werk:connect\", connect);\nipcMain.on(\"werk:theme\", (_e, mode: \"system\" | \"light\" | \"dark\") => (nativeTheme.themeSource = mode));\napp.on(\"second-instance\", () => { if (win) { if (win.isMinimized()) win.restore(); win.focus(); } else createWindow(); });\napp.on(\"activate\", () => { if (!win) createWindow(); });\napp.on(\"window-all-closed\", () => {});    // keep running until Quit (REB-tray)\nlet tray: Tray | null = null;\nfunction createTray() {                    // Windows only\n  tray = new Tray(join(process.resourcesPath, \"tray.png\"));\n  tray.setToolTip(\"werk\");\n  tray.on(\"click\", () => (win ? win.show() : createWindow()));\n  tray.setContextMenu(Menu.buildFromTemplate([\n    { label: \"Open werk\", click: () => (win ? win.show() : createWindow()) },\n    { label: \"Quit werk\", click: () => app.quit() },\n  ]));\n}\napp.on(\"before-quit\", (event) => {\n  if (!backend || quitting) return;\n  quitting = true;\n  event.preventDefault();\n  backend.postMessage({ type: \"shutdown\" });\n  setTimeout(() => backend?.kill(), 3000);\n});\nvoid app.whenReady().then(() => { startBackend(); createWindow(); if (process.platform === \"win32\") createTray(); });\n```\n\nNote: in `will-navigate`, allow the dev server's hot reload if it navigates; otherwise all navigation is blocked.\n\nPreload:\n\n```ts\nimport { contextBridge, ipcRenderer } from \"electron\";\nipcRenderer.on(\"werk:backend-port\", (event) => window.postMessage(\"werk:backend-port\", \"*\", event.ports));\ncontextBridge.exposeInMainWorld(\"werk\", {\n  platform: process.platform,\n  connect: () => ipcRenderer.send(\"werk:connect\"),\n  setTheme: (mode: string) => ipcRenderer.send(\"werk:theme\", mode),\n});\n```\n\nBackend entry:\n\n```ts\nimport type { MessagePortMain } from \"electron\";\nlet ports = new Set\u003cMessagePortMain>();\nprocess.parentPort.on(\"message\", ({ data, ports: transferred }) => {\n  if (data.type === \"init\") init(data);                 // open DB, migrate, log previousExit, start scheduler\n  else if (data.type === \"connect\") attach(transferred[0]);\n  else if (data.type === \"shutdown\") { db.close(); process.exit(0); }\n});\nfunction attach(port: MessagePortMain) {\n  ports.add(port);\n  port.on(\"message\", async ({ data: { id, method, params } }) => {\n    try { port.postMessage({ id, result: await handlers[method](params) }); }\n    catch (error) { log(\"error\", \"rpc\", `${method}: ${String(error)}`); port.postMessage({ id, error: { message: \"Request failed.\" } }); }\n  });\n  port.on(\"close\", () => ports.delete(port));\n  port.start();\n}\nexport const emit = (event: string, data?: unknown) => { for (const port of ports) port.postMessage({ event, data }); };\n```\n\nRenderer client: keep one `MessagePort`; queue calls until connected; on a new port, reject pending calls and invalidate all queries; `call()` returns a promise keyed by `id`; `on(event, fn)` subscribes to pushes.\n\n## Verification\n\n- Unit tests (`node --test`): migrations on a temp database; FTS5 sync triggers; pipeline gating, fingerprints and reassessment with fixtures; matching, eligibility, deduplication, locations and overlap (port legacy tests); update version comparison; diagnostics redaction; letter validation.\n- Smoke test (`tests/smoke.ts`): launch `WERK_EXE` with a temp `WERK_DATA_DIR`; wait for the shell; open Settings → Diagnostics; assert FTS5, schema version and backend running; screenshot to `smoke-output/`; quit; relaunch to check persistence. Later milestones extend it with simulated inference (`WERK_FAKE_AI=1`, test builds only).\n- Never use the user's real data folder or profile in tests. Live checks are allowed (REB-live-checks) and kept small: a few real generations per milestone in the development build, and bounded read-only scans within each source's limits. Use a fictional profile. Record each live check in the verification run. Real inference needs a ChatGPT sign-in in the development data folder, which only the user can complete: start the sign-in in M2 and ask the user to finish it in the browser.\n- Evidence in the wiki uses fictional data only.\n\n## Wiki structure\n\nThe wiki restarted on 1 November with the home page, decision register, open questions, journal and design attachments. Add the rest when a milestone needs it:\n\n```text\ndocs/wiki/\n  _build.mjs                     copied from ../jstack/skills/wiki/assets\n  index.md                       werk wiki home (exists)\n  decisions/index.md             decision register (exists)\n  discussions/open-questions.md  (exists)\n  journal/2026-11-01-*.md        rebuild plan, transcripts, this handoff (exist)\n  attachments/werk-design/       design PNGs (exist)\n  features/index.md, features/\u003cfeature>.md   FEAT-* records per milestone (feature-map skill)\n  verification/setup.md, verification/index.md, verification/runs/\u003crun-id>.md\n  evidence/\u003crun-id>/             fictional screenshots and result JSON\n```\n\nAs features are built, move their specification from this handoff into feature pages and link back; this page then stays as the dated record.\n\nBuild and check after every documentation change: `node docs/wiki/_build.mjs && node docs/wiki/_build.mjs --check`. Never edit the generated `index.html`.\n\n## Questions resolved before handoff\n\nThe nine open questions from the first draft of this page were answered in [round 3](2026-11-01-grill-28a582f50b30795a161c06d0221e222e.md), [round 4](2026-11-01-grill-79bc64157692f581ef75d39f3c59308f.md) and [round 5](2026-11-01-grill-9472293cf4bb700313881eac8d7833b7.md). Later questions are in [Open questions](../discussions/open-questions.md).\n\n| Question | Answer |\n| --- | --- |\n| Old app removal | Deleted on 1 November (REB-retire). |\n| Pushing | Push `main` and `legacy` without asking (REB-github). Work directly on `main` (REB-branch). |\n| Windows close behavior | System tray (REB-tray). |\n| LaTeX isolation on Windows | OS sandbox on both platforms; the legacy Go AppContainer helper on Windows (REB-latex-isolation). |\n| Repository name | Rename to `werk` at the first release (REB-rename). |\n| App icon | Light monogram with match dot (REB-icon). |\n| Default sources | 17 APIs and feeds on; 20 scraped boards off (REB-default-sources). |\n| Scan schedule default | Manual (REB-schedule). |\n| Slopchan discussion | Dropped; the wiki holds all documentation (REB-docs). |\n\nThe draft `AGENTS.md` that was Appendix A is now the repository's `AGENTS.md`.\n\n## Default source catalog\n\nDecided groups: keep sources that produced saves, company boards, structured feeds/APIs and scraped public boards; drop Hacker News, X and boards that never returned a job. Decided defaults for new users (REB-default-sources): the 8 aggregator APIs and 9 RSS feeds on; the 20 public boards available but off; company boards added by the user (the old catalog's company entries were the previous user's choices).\n\n| Group | Sources (legacy adapter) |\n| --- | --- |\n| Aggregator APIs (on) | Himalayas (`himalayas`), Remote OK (`remoteok`), Remotive (`remotive`), 4 Day Week (`fourdayweek`), Arbeitnow Germany and UK (`arbeitnow`), Jobicy (`jobicy`), Working Nomads (`workingnomads`) |\n| RSS feeds (on) | VueJobs, RemoteJobs.com, We Work Remotely Programming/Design/Product, GolangProjects, LaraJobs, ClojureJobboard, WordPress Jobs (`rss`) |\n| Public boards (off; `core/boards/catalog.ts` parsers) | Japan Dev, TokyoDev, TryRemote, Dynamite Jobs, Hiredly, LinkedIn public jobs, Wellfound, Built In, Y Combinator jobs, Cake, Arc, Get on Board, Remote.com Jobs, No Fluff Jobs, Remote Game Jobs, Jobspresso, Wantedly, Relocate.me, JobStreet / SEEK, Glints |\n| Company boards (user-added) | Greenhouse, Ashby and Lever boards by URL or slug. The previous catalog included Anthropic, Cognition, LangChain, Supabase, Figma, Notion, Cursor, Replit, Vercel, Linear and Sourcegraph; offer them as suggestions only if the user wants. |\n| Dropped | Hacker News Who's Hiring, Hacker News YC jobs, X search, Indeed, Careerjet, Jooble, Adzuna, Tech in Asia, Welcome to the Jungle / Otta, NodeFlair, Tech Jobs for Good, Foorilla, Web3.career |\n\nKeep the legacy per-source limits: at most six scans per source per day, per-scan request caps, conditional requests, rate-limit backoff, resumable pagination, provider cooldowns (Himalayas daily, Remotive four per day). Scraped boards break when sites change: a parser failure marks the source failed with the HTTP status or parse error and never deletes jobs.\n","toc":[{"id":"current-state","title":"Current state","depth":2},{"id":"product","title":"Product","depth":2},{"id":"boundaries-decided-carried-over-verbatim-in-spirit","title":"Boundaries (Decided, carried over verbatim in spirit)","depth":3},{"id":"first-steps","title":"First steps","depth":2},{"id":"architecture","title":"Architecture","depth":2},{"id":"processes","title":"Processes","depth":3},{"id":"rpc-protocol-proposed","title":"RPC protocol (Proposed)","depth":3},{"id":"data-folder","title":"Data folder","depth":3},{"id":"lifecycle","title":"Lifecycle","depth":3},{"id":"security-proposed","title":"Security (Proposed)","depth":3},{"id":"tectonic-file-access","title":"Tectonic file access","depth":3},{"id":"update-notice","title":"Update notice","depth":3},{"id":"diagnostics","title":"Diagnostics","depth":3},{"id":"data-model","title":"Data model","depth":2},{"id":"collection-pipeline-proposed","title":"Collection pipeline (Proposed)","depth":3},{"id":"profile-document-proposed","title":"Profile document (Proposed)","depth":3},{"id":"legacy-code-to-port","title":"Legacy code to port","depth":2},{"id":"screens","title":"Screens","depth":2},{"id":"shell","title":"Shell","depth":3},{"id":"inbox-opening-screen","title":"Inbox (opening screen)","depth":3},{"id":"setup-checklist","title":"Setup checklist","depth":3},{"id":"job-detail","title":"Job detail","depth":3},{"id":"saved-workspace","title":"Saved workspace","depth":3},{"id":"profile","title":"Profile","depth":3},{"id":"cv","title":"CV","depth":3},{"id":"assistant-overlay","title":"Assistant overlay","depth":3},{"id":"settings","title":"Settings","depth":3},{"id":"design-tokens","title":"Design tokens","depth":3},{"id":"milestones","title":"Milestones","depth":2},{"id":"m1-shell-backend-packaging-ci","title":"M1 — shell, backend, packaging, CI","depth":3},{"id":"m2-ai-profile-assistant-setup","title":"M2 — AI, profile, assistant, setup","depth":3},{"id":"m3-sources-collection-inbox","title":"M3 — sources, collection, inbox","depth":3},{"id":"m4-saved-workspace-letters-cv","title":"M4 — saved workspace, letters, CV","depth":3},{"id":"m5-backups-polish-first-release","title":"M5 — backups, polish, first release","depth":3},{"id":"build-packaging-and-release","title":"Build, packaging and release","depth":2},{"id":"versions-verified-available-pinned-at-least-two-weeks-old-on-1-november-2026","title":"Versions (Verified available; pinned at least two weeks old on 1 November 2026)","depth":3},{"id":"layout","title":"Layout","depth":3},{"id":"package-json-sketch-unverified","title":"package.json (sketch, Unverified)","depth":3},{"id":"app-icon","title":"App icon","depth":3},{"id":"ci-workflow-sketch-unverified","title":"CI workflow (sketch, Unverified)","depth":3},{"id":"install-instructions-for-the-readme","title":"Install instructions for the README","depth":3},{"id":"code-sketches-unverified","title":"Code sketches (Unverified)","depth":3},{"id":"verification","title":"Verification","depth":2},{"id":"wiki-structure","title":"Wiki structure","depth":2},{"id":"questions-resolved-before-handoff","title":"Questions resolved before handoff","depth":2},{"id":"default-source-catalog","title":"Default source catalog","depth":2}],"titleAnchor":"werk-implementation-handoff-1-november-2026","links":["decisions/index","features/assistant","decisions/index","journal/2026-11-01-rebuild","decisions/index","decisions/index","journal/2026-11-01-werk-handoff","journal/2026-11-01-werk-handoff","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7","journal/2026-11-01-werk-handoff","journal/2026-11-01-werk-handoff","journal/2026-11-01-werk-handoff","journal/2026-11-01-grill-28a582f50b30795a161c06d0221e222e","journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f","journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7","discussions/open-questions"],"attachments":[{"path":"attachments/werk-design/inbox.png","sha256":"74861ab0c25d6216a77a426dde94d5869e2a23c039c36b3bb3fc66b0bc2d683d"},{"path":"attachments/werk-design/inbox-dark.png","sha256":"a760c2966cfeebd9eacb394fd669bd9165296d2d43a8f0453371dc7e2661db25"},{"path":"attachments/werk-design/inbox-empty.png","sha256":"b1dd545c34f3020ed1821d4164906a095fc206db5a89790818a2f35fec30491c"},{"path":"attachments/werk-design/setup.png","sha256":"bd162e2a7de29df69fd1b9cd843d0f21169725b18f2c70153a6a808a4f35fa07"},{"path":"attachments/werk-design/job-detail.png","sha256":"76bfcf883fe5bf5678e955be461057617e94e1be949f72dbbb49653fbbb52619"},{"path":"attachments/werk-design/saved.png","sha256":"5c36e9cf0ec930b8c78b13e0a967eae0aa0062fdb70fccd535f443920aec74e1"},{"path":"attachments/werk-design/profile.png","sha256":"a8c9ba32a62b13182eae12f0c131b16385306e040126c0e5737abd2f04c27f96"},{"path":"attachments/werk-design/profile-criteria-edit.png","sha256":"17d97268f3fc6f6d159da934c6f5dc357587620c0ca93edc4b9284322d7be15c"},{"path":"attachments/werk-design/cv.png","sha256":"7ffc68c1bc00d64955906f25292872ef951aa202a15fdecbd825ddb216d49cfe"},{"path":"attachments/werk-design/assistant.png","sha256":"f3348215451af74efd1198e9be045d346749c16f0f234374b228412818122c79"},{"path":"attachments/werk-design/settings-sources.png","sha256":"5ac7fc40bc74452566f4c15ef12108cc529e3b5f8da3ad8036fe4962d88d6212"},{"path":"attachments/werk-design/settings-ai.png","sha256":"8dd06da9c657139988e51ade274f73f42e627fd40c5dab06275daeadf3be8603"},{"path":"attachments/werk-design/settings-diagnostics.png","sha256":"c7d305e22fe4050dd89c896ad4ffff984804714686822e2693440ff5ab8a71dc"},{"path":"attachments/werk-design/icon.png","sha256":"72fc4de3816f5e817ec9fc9af4e7e5d44a4321413e97d6e527843678de4d57ec"}],"html":"\u003cp>Implementation update: \u003ca href=\"#/decisions/index~assistant-revision-after-implementation-feedback\">REB-pi-session\u003c/a> supersedes this handoff's bounded assistant and supplied-URL restrictions. The assistant now embeds pi with full local file, shell and network permissions. Current behavior is in \u003ca href=\"#/features/assistant\">Assistant and ChatGPT connection\u003c/a>. The earlier restrictions below remain historical specification, not current assistant permissions.\u003c/p>\n\u003cp>This is the specification for the next implementing agent. \u003cstrong>werk\u003c/strong> is a clean rebuild of ununemploy. The user's decisions are in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>, which links the four answer transcripts; the \u003ca href=\"#/journal/2026-11-01-rebuild\">rebuild plan\u003c/a> has the findings behind them. This page turns them into an implementation plan. The user answered every question that blocked implementation before this handoff, so it is ready to work from.\u003c/p>\n\u003cp>Labels used below:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Decided:\u003c/strong> the user chose it. Do not reopen it without a new reason.\u003c/li>\n\u003cli>\u003cstrong>Proposed:\u003c/strong> my recommendation, not confirmed by the user. Proceed with it. Raise only a consequential change, through jstack \u003ccode>grill-form\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Verified:\u003c/strong> I checked it on 1 November 2026.\u003c/li>\n\u003cli>\u003cstrong>Unverified:\u003c/strong> a design or sketch that has not been run.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"current-state\">Current state\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth>State\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Repository\u003c/td>\n\u003ctd>Restructured on \u003ccode>main\u003c/code>: the old tree is removed and the new \u003ccode>AGENTS.md\u003c/code>, \u003ccode>README.md\u003c/code>, \u003ccode>LICENSE\u003c/code> (MIT), \u003ccode>.gitignore\u003c/code>, this wiki and \u003ccode>design/werk/\u003c/code> are committed. The \u003ccode>legacy\u003c/code> branch holds the old app at \u003ccode>e493246\u003c/code>. Neither branch is pushed yet. No werk code exists. The repo is public as \u003ccode>github.com/rengwu/ununemploy\u003c/code>; it is renamed to \u003ccode>werk\u003c/code> at the first release.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Authorization\u003c/td>\n\u003ctd>Implement all milestones without waiting for review. Commit to \u003ccode>main\u003c/code>, and push \u003ccode>main\u003c/code> and \u003ccode>legacy\u003c/code>, without asking. Ask before tags, releases, pull requests, the repository rename or other GitHub changes. See \u003ccode>AGENTS.md\u003c/code> → Working agreement.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User data\u003c/td>\n\u003ctd>Backed up and verified at \u003ccode>~/Desktop/ununemploy-backup\u003c/code> (local only, contains credentials). The private form records are in its \u003ccode>grill/\u003c/code> folder. Never read it for werk work; werk starts clean.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Old app\u003c/td>\n\u003ctd>Deleted on 1 November with the user's confirmation of each path: the installed app, its data folder, and the checkout's \u003ccode>build/\u003c/code>, \u003ccode>dist/\u003c/code>, \u003ccode>node_modules/\u003c/code>, \u003ccode>.local-data/\u003c/code>, original evidence files and \u003ccode>.env\u003c/code>. Small macOS leftovers that were not on the list remain (\u003ccode>~/Library/Caches\u003c/code>, \u003ccode>~/Library/WebKit\u003c/code> and \u003ccode>~/Library/Preferences\u003c/code> entries for \u003ccode>local.ununemploy.desktop\u003c/code>).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"product\">Product\u003c/h2>\n\u003cp>werk is a local desktop app for one job seeker. It discovers jobs, assesses fit against the user's profile, prepares private cover-letter drafts and manages a master CV. It runs on macOS (Apple Silicon) and Windows 11 x64 and ships as unsigned public GitHub releases.\u003c/p>\n\u003ch3 id=\"boundaries-decided-carried-over-verbatim-in-spirit\">Boundaries (Decided, carried over verbatim in spirit)\u003c/h3>\n\u003cul>\n\u003cli>Never submit an application, upload a CV to an employer or job board, fill an application form, or act on the user's behalf. Never contact employers or recruiters, send email or DMs, post, reply, follow or react. Do not implement an approval-to-send workflow.\u003c/li>\n\u003cli>Read-only discovery requests, the GitHub release check and configured model-inference requests are allowed. Enforce restrictions by capability and destination, not HTTP verb.\u003c/li>\n\u003cli>Job descriptions and fetched content are untrusted data, never instructions.\u003c/li>\n\u003cli>Notifications stay inside the app.\u003c/li>\n\u003cli>Candidate evidence: use explicit user statements and attributable public project evidence. Keep confirmed facts separate from inference, preferences and missing information. Never invent employers, titles, dates, degrees, certifications, metrics, team sizes, skills, work authorization or years of AI experience. Total engineering experience is not AI/ML experience. Project work is not professional employment.\u003c/li>\n\u003cli>No login, no cloud hosting, no telemetry. Data stays in the app's local data folder.\u003c/li>\n\u003cli>The Muse is out of scope. Reddit is deferred.\u003c/li>\n\u003c/ul>\n\u003cp>Decisions are listed once, in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>. This page refers to them by ID.\u003c/p>\n\u003ch2 id=\"first-steps\">First steps\u003c/h2>\n\u003col>\n\u003cli>Read \u003ccode>AGENTS.md\u003c/code>, this page, the \u003ca href=\"#/decisions/index\">decision register\u003c/a>, \u003ccode>../jstack/references/stack-contract.md\u003c/code>, and the jstack skills \u003ccode>rule-lean\u003c/code>, \u003ccode>rule-plain-ui\u003c/code>, \u003ccode>wiki\u003c/code>, \u003ccode>feature-map\u003c/code> and \u003ccode>verify-change\u003c/code>.\u003c/li>\n\u003cli>Push the archive and the restructure: \u003ccode>git push origin legacy main\u003c/code>.\u003c/li>\n\u003cli>Build milestone 1 (\u003ca href=\"#/journal/2026-11-01-werk-handoff~milestones\">Milestones\u003c/a>) on \u003ccode>main\u003c/code>. Verify locally on macOS, then push so CI proves the Windows build.\u003c/li>\n\u003cli>Record a verification run in the wiki and continue to the next milestone.\u003c/li>\n\u003c/ol>\n\u003cp>Port legacy files on demand, for example \u003ccode>git show legacy:core/matching.ts &gt; src/backend/matching/matching.ts\u003c/code>. The old wiki is on \u003ccode>legacy\u003c/code> under \u003ccode>docs/wiki/\u003c/code> for reference.\u003c/p>\n\u003ch2 id=\"architecture\">Architecture\u003c/h2>\n\u003cpre>\u003ccode class=\"language-mermaid\">flowchart LR\n  main[\"Electron main: window, menu, lifecycle, external links\"] --&gt;|\"spawns, restarts\"| backend[\"Backend utility process: SQLite, RPC, scheduler, model queue\"]\n  ui[\"Renderer: React UI\"] &lt;--&gt;|\"MessagePort RPC and push events\"| backend\n  main --&gt;|\"brokers a MessagePort\"| ui\n  backend --&gt; db[(\"werk.db: typed columns, FTS5\")]\n  backend --&gt; sources[\"Job sources: read-only GET\"]\n  backend --&gt; pi[\"pi-ai: ChatGPT subscription\"]\n  backend --&gt; tectonic[\"Tectonic in a sandbox: CV PDF\"]\n  backend --&gt; gh[\"GitHub releases API: update check\"]\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"processes\">Processes\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Process\u003c/th>\n\u003cth>Owns\u003c/th>\n\u003cth>Must not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Main (\u003ccode>src/main/\u003c/code>)\u003c/td>\n\u003ctd>Window creation, single-instance lock, menus, app lifecycle, starting and restarting the backend, brokering MessagePorts, opening external links with \u003ccode>shell.openExternal\u003c/code> (http/https only), native theme, file save dialogs, \u003ccode>Show in Finder/Explorer\u003c/code>\u003c/td>\n\u003ctd>Touch the database or do slow work; it must stay responsive\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Backend (\u003ccode>src/backend/\u003c/code>, Electron \u003ccode>utilityProcess\u003c/code>)\u003c/td>\n\u003ctd>SQLite, all domain logic, RPC handlers, push events, scan scheduler, serialized model queue, LaTeX compilation, update check, diagnostics\u003c/td>\n\u003ctd>Import \u003ccode>electron\u003c/code> APIs other than \u003ccode>process.parentPort\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Renderer (\u003ccode>src/renderer/\u003c/code>)\u003c/td>\n\u003ctd>React UI, TanStack Query cache, keyboard handling\u003c/td>\n\u003ctd>Use Node APIs (sandboxed, \u003ccode>contextIsolation: true\u003c/code>, \u003ccode>nodeIntegration: false\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Preload (\u003ccode>src/preload/\u003c/code>)\u003c/td>\n\u003ctd>Exposes \u003ccode>window.werk\u003c/code> with \u003ccode>connect()\u003c/code>, \u003ccode>platform\u003c/code>, \u003ccode>setTheme(mode)\u003c/code>, \u003ccode>saveFile()\u003c/code> and forwards the backend port to the page\u003c/td>\n\u003ctd>Anything else\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Verified: Electron 44.9.0 runs Node 24.22.0 with SQLite 3.53.4, and \u003ccode>node:sqlite\u003c/code> with FTS5 works there (\u003ccode>ELECTRON_RUN_AS_NODE=1\u003c/code>). No native modules are needed. Unverified: the same inside \u003ccode>utilityProcess\u003c/code> and in a packaged app on Windows; the M1 smoke test must check both.\u003c/p>\n\u003ch3 id=\"rpc-protocol-proposed\">RPC protocol (Proposed)\u003c/h3>\n\u003cp>The renderer talks to the backend over a MessagePort; there is no HTTP server and no open port.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Handshake.\u003c/strong> On load, the page calls \u003ccode>window.werk.connect()\u003c/code>. The preload sends IPC \u003ccode>werk:connect\u003c/code>. Main creates a \u003ccode>MessageChannelMain\u003c/code>, posts \u003ccode>port1\u003c/code> to the backend (\u003ccode>{type: \"connect\"}\u003c/code>) and \u003ccode>port2\u003c/code> to the page via \u003ccode>webContents.postMessage(\"werk:backend-port\", null, [port2])\u003c/code>. The preload forwards it to the page with \u003ccode>window.postMessage(\"werk:backend-port\", \"*\", ports)\u003c/code>; the page accepts only messages whose \u003ccode>source === window\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Request:\u003c/strong> \u003ccode>{id: number, method: string, params: unknown}\u003c/code>. \u003cstrong>Response:\u003c/strong> \u003ccode>{id, result}\u003c/code> or \u003ccode>{id, error: {message, code}}\u003c/code>. \u003cstrong>Push event:\u003c/strong> \u003ccode>{event: string, data: unknown}\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Types:\u003c/strong> \u003ccode>src/shared/api.ts\u003c/code> declares \u003ccode>interface Api { method(params): Result }\u003c/code> and \u003ccode>interface Events\u003c/code>. The renderer's \u003ccode>call&lt;K extends keyof Api&gt;()\u003c/code> and the backend's handler map both use it. Validate params in the backend with zod (handlers are a trust boundary for content, even though the renderer is local).\u003c/li>\n\u003cli>\u003cstrong>Restart.\u003c/strong> If the backend exits unexpectedly, main records the exit code, restarts it after 1 s, sends \u003ccode>{type: \"init\", previousExit}\u003c/code> and brokers a new port. More than three restarts in 60 s stops restarting and shows a blocking error with \u003cstrong>Copy diagnostics\u003c/strong> and \u003cstrong>Restart\u003c/strong>. The renderer rejects in-flight calls with \"The backend restarted. Try again.\" and invalidates all queries on reconnect.\u003c/li>\n\u003cli>\u003cstrong>Push invalidation.\u003c/strong> The backend emits coarse events after commits: \u003ccode>jobs\u003c/code>, \u003ccode>saved\u003c/code>, \u003ccode>profile\u003c/code>, \u003ccode>sources\u003c/code>, \u003ccode>tasks\u003c/code>, \u003ccode>cv\u003c/code>, \u003ccode>assistant\u003c/code>, \u003ccode>ai\u003c/code>, \u003ccode>update\u003c/code>. The renderer maps each to TanStack Query keys and invalidates them. No polling.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"data-folder\">Data folder\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Build\u003c/th>\n\u003cth>Folder\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Packaged\u003c/td>\n\u003ctd>Electron \u003ccode>userData\u003c/code>: \u003ccode>~/Library/Application Support/werk\u003c/code>, \u003ccode>%APPDATA%\\werk\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Development (\u003ccode>!app.isPackaged\u003c/code>)\u003c/td>\n\u003ctd>\u003ccode>werk-dev\u003c/code> beside it\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tests\u003c/td>\n\u003ctd>\u003ccode>WERK_DATA_DIR\u003c/code> environment variable (set before \u003ccode>app.ready\u003c/code>, before the single-instance lock)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Contents: \u003ccode>werk.db\u003c/code> (+ WAL), \u003ccode>pi-auth/\u003c/code> (pi-ai credentials, app-owned), \u003ccode>cv/&lt;version&gt;.pdf\u003c/code>, \u003ccode>attachments/\u003c/code> (assistant attachments for the current chat), \u003ccode>logs/main.log\u003c/code> (main-process crashes only; rotate at 1 MB).\u003c/p>\n\u003ch3 id=\"lifecycle\">Lifecycle\u003c/h3>\n\u003cul>\n\u003cli>Single instance per data folder (\u003ccode>app.requestSingleInstanceLock()\u003c/code>); a second launch focuses the window.\u003c/li>\n\u003cli>Closing the window keeps werk running so queued letters and any scan schedule continue (Decided, REB-tray). \u003cstrong>Quit\u003c/strong> stops everything.\u003cul>\n\u003cli>macOS: werk stays in the Dock; clicking the Dock icon reopens the window.\u003c/li>\n\u003cli>Windows: werk stays in the system tray (\u003ccode>Tray\u003c/code> with the app icon, tooltip \"werk\"). Clicking the icon opens the window; the menu has \u003cstrong>Open werk\u003c/strong> and \u003cstrong>Quit werk\u003c/strong>. Create the tray once at startup and keep it, as other background apps on Windows do.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Quit: main asks the backend to shut down (\u003ccode>{type: \"shutdown\"}\u003c/code>), waits up to 3 s for it to close SQLite, then exits. Unsaved edits in the renderer prompt before quit (\u003ccode>beforeunload\u003c/code> guard plus a \u003ccode>before-quit\u003c/code> check via IPC).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"security-proposed\">Security (Proposed)\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>sandbox: true\u003c/code>, \u003ccode>contextIsolation: true\u003c/code>, \u003ccode>nodeIntegration: false\u003c/code>, \u003ccode>webSecurity: true\u003c/code>. CSP in \u003ccode>index.html\u003c/code>: \u003ccode>default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'self' blob:; frame-src blob:\u003c/code> (PDF preview uses a blob URL; verify the built-in viewer with \u003ccode>plugins: true\u003c/code>).\u003c/li>\n\u003cli>Deny \u003ccode>window.open\u003c/code> and in-page navigation; route http(s) URLs to \u003ccode>shell.openExternal\u003c/code>, ignore all other schemes.\u003c/li>\n\u003cli>Render job descriptions as sanitized text or Markdown without raw HTML or remote images.\u003c/li>\n\u003cli>Outbound requests only from the backend: configured sources (GET), \u003ccode>api.github.com\u003c/code> release check, pi-ai inference/auth, public URLs the user explicitly gives the assistant. Keep the legacy SSRF guard in \u003ccode>core/http.ts\u003c/code> (it uses \u003ccode>ipaddr.js\u003c/code> to block private addresses) for assistant URL reads.\u003c/li>\n\u003cli>LaTeX: treat CV source as untrusted. The assistant edits it and reads untrusted job descriptions, so a crafted posting could steer it. Compile only inside the isolation in \u003ca href=\"#/journal/2026-11-01-werk-handoff~tectonic-file-access\">Tectonic file access\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"tectonic-file-access\">Tectonic file access\u003c/h3>\n\u003cp>Verified on 1 November 2026 with Tectonic 0.15.0 on macOS, using the legacy app's flags (\u003ccode>--untrusted --only-cached\u003c/code>, \u003ccode>TECTONIC_UNTRUSTED_MODE=1\u003c/code>) and no OS sandbox. The source was read from stdin in an empty working directory.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Attempt in the CV source\u003c/th>\n\u003cth>Result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>\\input{/absolute/path}\u003c/code>, \u003ccode>\\input{../file}\u003c/code>, \u003ccode>\\openin\u003c/code> with \u003ccode>\\read\u003c/code>\u003c/td>\n\u003ctd>The file is read and typeset into the PDF.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The same through \u003ccode>\\csname @@input\\endcsname\u003c/code> with \u003ccode>\\string\u003c/code>-built paths\u003c/td>\n\u003ctd>Read. Source-level filtering cannot stop it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>\\XeTeXpicfile\u003c/code> (an image) and \u003ccode>\\XeTeXpdffile\u003c/code> (a page of a PDF), absolute path\u003c/td>\n\u003ctd>Embedded in the PDF.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>\\immediate\\openout\u003c/code> to an absolute path and to \u003ccode>../\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>The file is written outside the output folder.\u003c/strong> A crafted source could plant a script that runs at login.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>\\font\\x=\"[/absolute/path]\"\u003c/code>\u003c/td>\n\u003ctd>Opened; fails because the file is not a font.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Tectonic's \u003ccode>--untrusted\u003c/code> only disables shell escape and extra search paths. Its main file I/O is created with absolute paths allowed (\u003ccode>FilesystemIo::new(root, false, true, …)\u003c/code> in \u003ccode>src/driver.rs\u003c/code>), and its comments say \u003ccode>../\u003c/code> is not restricted. \u003ccode>--makefile-rules\u003c/code> lists every file read or written, but only after the run, when a write has already happened. So werk needs a boundary below the TeX engine.\u003c/p>\n\u003cp>Decided (REB-latex-isolation, rounds \u003ca href=\"#/journal/2026-11-01-grill-79bc64157692f581ef75d39f3c59308f\">4\u003c/a> and \u003ca href=\"#/journal/2026-11-01-grill-9472293cf4bb700313881eac8d7833b7\">5\u003c/a>): an OS sandbox on both platforms, and the assistant keeps editing LaTeX directly. Port both from \u003ccode>legacy\u003c/code> unchanged in behavior:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>macOS:\u003c/strong> \u003ccode>/usr/bin/sandbox-exec\u003c/code> with the profile built by \u003ccode>macSandbox()\u003c/code> in legacy \u003ccode>core/latex/compile.ts\u003c/code>: no network, no process execution except Tectonic, reads denied in the home folder, data folder and temporary folders except the work directory and package cache, writes only in the work directory.\u003c/li>\n\u003cli>\u003cstrong>Windows:\u003c/strong> the Go helper \u003ccode>texsandbox.exe &lt;work&gt; &lt;cache&gt; &lt;compiler&gt; &lt;args…&gt;\u003c/code> from legacy \u003ccode>desktop/cmd/texsandbox\u003c/code> and \u003ccode>desktop/internal/texsandbox\u003c/code>. It runs Tectonic in an AppContainer without network capabilities, on private copies of the compiler and cache, inside a one-process Job Object. Keep its known-folder redirection and minimal Fontconfig file; both were needed on 17 October (legacy \u003ccode>docs/wiki/journal/2026-10-17-windows-port.md\u003c/code>). This is werk's only non-TypeScript component.\u003c/li>\n\u003cli>Both: \u003ccode>--untrusted --only-cached\u003c/code>, \u003ccode>TECTONIC_UNTRUSTED_MODE=1\u003c/code>, source in a fresh temporary work directory, the legacy 30-second timeout and output limits. If the sandbox cannot start, fail the compile and keep the saved source; never fall back to running Tectonic unsandboxed.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"update-notice\">Update notice\u003c/h3>\n\u003cp>The backend checks \u003ccode>GET https://api.github.com/repos/rengwu/werk/releases/latest\u003c/code> (headers \u003ccode>Accept: application/vnd.github+json\u003c/code>, \u003ccode>User-Agent: werk/&lt;version&gt;\u003c/code>) 30 s after start and every 12 h. Compare the \u003ccode>tag_name\u003c/code> (\u003ccode>vX.Y.Z\u003c/code>) to the app version numerically; ignore prereleases and drafts, which that endpoint already excludes. A 404 means no releases. When newer, emit \u003ccode>update\u003c/code> and show the sidebar notice (design below) whose \u003cstrong>Download\u003c/strong> opens \u003ccode>html_url\u003c/code>. Record the last check time and result for Diagnostics. Keep the repo slug in one constant. It already uses the final name: the repository is renamed to \u003ccode>werk\u003c/code> just before the first release (REB-rename), so until then the check gets 404, which correctly means no releases.\u003c/p>\n\u003ch3 id=\"diagnostics\">Diagnostics\u003c/h3>\n\u003cp>Settings → Diagnostics shows and copies: werk version and update state; Electron, Chromium and Node versions; SQLite version, FTS5 availability, schema version and database size; OS and architecture; data folder (home directory replaced by \u003ccode>~\u003c/code>); backend start time and restart count; last update check; last 20 \u003ccode>warn\u003c/code>/\u003ccode>error\u003c/code> events. \u003cstrong>Copy diagnostics\u003c/strong> puts the same as plain text on the clipboard. No personal data: no profile content, job titles, letters or credentials.\u003c/p>\n\u003ch2 id=\"data-model\">Data model\u003c/h2>\n\u003cp>Plain SQL migrations in \u003ccode>src/backend/db/migrations.ts\u003c/code>, applied with \u003ccode>PRAGMA user_version\u003c/code> inside a transaction. Pragmas: \u003ccode>journal_mode=WAL\u003c/code>, \u003ccode>synchronous=NORMAL\u003c/code>, \u003ccode>foreign_keys=ON\u003c/code>, \u003ccode>busy_timeout=5000\u003c/code>. Use \u003ccode>STRICT\u003c/code> tables. Add each table in the milestone that first uses it. Until the first public release, editing an existing migration is acceptable because no user data exists yet.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- M1\nCREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT NOT NULL CHECK (json_valid(value))) STRICT;\nCREATE TABLE events (\n  id INTEGER PRIMARY KEY,\n  at TEXT NOT NULL,\n  level TEXT NOT NULL CHECK (level IN ('info', 'warn', 'error')),\n  scope TEXT NOT NULL,              -- backend, scan, ai, cv, update, ...\n  message TEXT NOT NULL             -- no personal data\n) STRICT;                           -- keep the newest 500 rows\n\n-- M2\nCREATE TABLE profile_versions (\n  revision INTEGER PRIMARY KEY,\n  document TEXT NOT NULL CHECK (json_valid(document)),\n  changed_by TEXT NOT NULL CHECK (changed_by IN ('user', 'assistant', 'restore')),\n  summary TEXT NOT NULL,\n  evidence TEXT NOT NULL DEFAULT '[]' CHECK (json_valid(evidence)),  -- quoted statements, attachment names\n  created_at TEXT NOT NULL\n) STRICT;\nCREATE TABLE assistant_messages (\n  id INTEGER PRIMARY KEY,\n  chat_id TEXT NOT NULL,\n  role TEXT NOT NULL CHECK (role IN ('user', 'assistant')),\n  content TEXT NOT NULL CHECK (json_valid(content)),   -- text, attachments, receipts\n  created_at TEXT NOT NULL\n) STRICT;\nCREATE TABLE tasks (                                     -- serialized model work\n  id INTEGER PRIMARY KEY,\n  kind TEXT NOT NULL CHECK (kind IN ('assistant_turn', 'cover_letter', 'cv_generate')),\n  subject TEXT,                                          -- job id or chat id\n  state TEXT NOT NULL CHECK (state IN ('queued', 'running', 'done', 'failed', 'paused')),\n  input TEXT NOT NULL CHECK (json_valid(input)),\n  error TEXT,\n  idempotency_key TEXT UNIQUE,\n  created_at TEXT NOT NULL,\n  updated_at TEXT NOT NULL\n) STRICT;\nCREATE INDEX tasks_next ON tasks(state, id);\n\n-- M3\nCREATE TABLE sources (\n  id INTEGER PRIMARY KEY,\n  kind TEXT NOT NULL,           -- greenhouse, ashby, lever, rss, himalayas, remoteok, remotive, fourdayweek, arbeitnow, jobicy, workingnomads, board\n  identifier TEXT NOT NULL,     -- board slug, feed URL or catalog key\n  name TEXT NOT NULL,\n  enabled INTEGER NOT NULL DEFAULT 1 CHECK (enabled IN (0, 1)),\n  config TEXT NOT NULL DEFAULT '{}' CHECK (json_valid(config)),\n  checkpoint TEXT NOT NULL DEFAULT '{}' CHECK (json_valid(checkpoint)),   -- pagination, backoff, daily counters\n  last_scan_at TEXT, last_result TEXT, last_error TEXT, next_scan_at TEXT,\n  UNIQUE (kind, identifier)\n) STRICT;\nCREATE TABLE jobs (\n  id INTEGER PRIMARY KEY,\n  url TEXT NOT NULL UNIQUE,                  -- canonical posting URL\n  company TEXT NOT NULL,\n  company_key TEXT NOT NULL,                 -- normalized; Hide company and dedupe\n  title TEXT NOT NULL,\n  location TEXT NOT NULL DEFAULT '',         -- original text\n  countries TEXT NOT NULL DEFAULT '[]' CHECK (json_valid(countries)),   -- resolved ISO 3166 codes\n  arrangement TEXT CHECK (arrangement IN ('remote', 'hybrid', 'onsite')),\n  salary TEXT,\n  description TEXT NOT NULL,\n  description_complete INTEGER NOT NULL CHECK (description_complete IN (0, 1)),\n  posted_at TEXT,\n  first_seen_at TEXT NOT NULL,\n  last_seen_at TEXT NOT NULL,\n  closed_at TEXT,\n  match_level TEXT NOT NULL CHECK (match_level IN ('strong', 'adjacent')),\n  match_score INTEGER NOT NULL,\n  eligibility TEXT NOT NULL CHECK (eligibility IN ('possible', 'review')),\n  overlap_hours REAL,                        -- null when countries are unknown\n  assessment TEXT NOT NULL CHECK (json_valid(assessment)),   -- reasons, gaps, highlight spans, eligibility clauses\n  profile_revision INTEGER NOT NULL,\n  status TEXT NOT NULL DEFAULT 'new' CHECK (status IN ('new', 'skipped', 'saved', 'applied')),\n  opened_at TEXT,\n  saved_at TEXT,\n  applied_at TEXT,\n  notes TEXT NOT NULL DEFAULT '',\n  saved_description TEXT,                    -- snapshot when saved\n  duplicate_of INTEGER REFERENCES jobs(id) ON DELETE SET NULL\n) STRICT;\nCREATE INDEX jobs_new ON jobs(match_score DESC, id) WHERE status = 'new' AND closed_at IS NULL AND duplicate_of IS NULL;\nCREATE INDEX jobs_saved ON jobs(status, saved_at DESC) WHERE status IN ('saved', 'applied');\nCREATE INDEX jobs_company ON jobs(company_key);\nCREATE INDEX jobs_expiry ON jobs(closed_at) WHERE status IN ('new', 'skipped');\nCREATE TABLE job_listings (                  -- every source copy of a job\n  source_id INTEGER NOT NULL REFERENCES sources(id) ON DELETE CASCADE,\n  source_item_id TEXT NOT NULL,\n  job_id INTEGER NOT NULL REFERENCES jobs(id) ON DELETE CASCADE,\n  url TEXT NOT NULL,\n  fields TEXT NOT NULL CHECK (json_valid(fields)),   -- latest normalized source fields (evidence)\n  last_seen_at TEXT NOT NULL,\n  PRIMARY KEY (source_id, source_item_id)\n) STRICT;\nCREATE INDEX job_listings_job ON job_listings(job_id);\nCREATE TABLE fingerprints (                  -- postings deliberately not stored\n  url TEXT PRIMARY KEY,\n  content_hash TEXT NOT NULL,\n  profile_revision INTEGER NOT NULL,\n  reason TEXT NOT NULL CHECK (reason IN ('stretch', 'other', 'incompatible', 'criteria', 'hidden', 'expired')),\n  last_seen_at TEXT NOT NULL\n) STRICT;\nCREATE TABLE http_validators (url TEXT PRIMARY KEY, etag TEXT, last_modified TEXT, checked_at TEXT NOT NULL) STRICT;\nCREATE VIRTUAL TABLE jobs_fts USING fts5(title, company, location, description, content = 'jobs', content_rowid = 'id', tokenize = 'unicode61 remove_diacritics 2');\n-- plus AFTER INSERT/UPDATE/DELETE triggers on jobs that keep jobs_fts in sync (standard external-content pattern)\n\n-- M4\nCREATE TABLE cover_letter_versions (\n  job_id INTEGER NOT NULL REFERENCES jobs(id) ON DELETE CASCADE,\n  version INTEGER NOT NULL,\n  body TEXT NOT NULL,                        -- plain text: greeting, paragraphs, sign-off\n  review_notes TEXT NOT NULL DEFAULT '[]' CHECK (json_valid(review_notes)),\n  created_by TEXT NOT NULL CHECK (created_by IN ('generated', 'user', 'assistant', 'restore')),\n  profile_revision INTEGER,\n  created_at TEXT NOT NULL,\n  PRIMARY KEY (job_id, version)\n) STRICT;\nCREATE TABLE cv_versions (\n  version INTEGER PRIMARY KEY,\n  source TEXT NOT NULL,                      -- LaTeX\n  created_by TEXT NOT NULL CHECK (created_by IN ('generated', 'user', 'assistant', 'restore')),\n  profile_revision INTEGER,\n  compile_status TEXT CHECK (compile_status IN ('ok', 'failed')),\n  compile_log TEXT,\n  created_at TEXT NOT NULL\n) STRICT;                                    -- PDF at &lt;data&gt;/cv/&lt;version&gt;.pdf\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"collection-pipeline-proposed\">Collection pipeline (Proposed)\u003c/h3>\n\u003cp>For each incoming posting from an adapter:\u003c/p>\n\u003col>\n\u003cli>Canonicalize the URL (port \u003ccode>canonicalUrl\u003c/code> from legacy \u003ccode>core/db/index.ts\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Known job:\u003c/strong> update \u003ccode>last_seen_at\u003c/code> and the \u003ccode>job_listings\u003c/code> row. If the description became complete or changed, update it, set \u003ccode>description_complete\u003c/code>, and reassess. Never overwrite a complete description with an excerpt; manual description edits win.\u003c/li>\n\u003cli>\u003cstrong>Known fingerprint\u003c/strong> with the same content hash and current profile revision: update \u003ccode>last_seen_at\u003c/code> and stop.\u003c/li>\n\u003cli>\u003cstrong>Assess:\u003c/strong> hidden company → fingerprint \u003ccode>hidden\u003c/code>. Matching (\u003ccode>assessJob\u003c/code>) → Stretch/Other → fingerprint. Eligibility (\u003ccode>assessEligibility\u003c/code>) → Incompatible → fingerprint. Criteria → explicit conflict with arrangement, location or overlap → fingerprint \u003ccode>criteria\u003c/code>. \u003cstrong>Unknown data never excludes a job\u003c/strong>: unresolved location, missing arrangement and unknown overlap pass.\u003c/li>\n\u003cli>\u003cstrong>Insert\u003c/strong> as \u003ccode>status = 'new'\u003c/code>, then run duplicate detection against jobs with the same \u003ccode>company_key\u003c/code> (port \u003ccode>duplicateReason\u003c/code>); set \u003ccode>duplicate_of\u003c/code> on the newer copy. Saved jobs are always the representative.\u003c/li>\n\u003c/ol>\n\u003cp>On every profile revision: reassess all \u003ccode>new\u003c/code> and \u003ccode>skipped\u003c/code> jobs in one transaction. Jobs that no longer qualify become fingerprints and are deleted. Saved and applied jobs are reassessed but never deleted.\u003c/p>\n\u003cp>Daily retention: delete \u003ccode>new\u003c/code>/\u003ccode>skipped\u003c/code> jobs whose \u003ccode>closed_at\u003c/code> is more than 30 days ago, and turn them into \u003ccode>expired\u003c/code> fingerprints. Delete fingerprints not seen for 180 days (Proposed). Run \u003ccode>PRAGMA optimize\u003c/code> afterwards.\u003c/p>\n\u003cp>Closure: a complete company-board (ATS) snapshot marks missing listings closed. Truncated discovery feeds never close jobs. Port the age-based staleness rules from legacy \u003ccode>core/listing-visibility.ts\u003c/code> and \u003ccode>core/job-quality.ts\u003c/code>.\u003c/p>\n\u003ch3 id=\"profile-document-proposed\">Profile document (Proposed)\u003c/h3>\n\u003cp>Port the legacy zod schema from \u003ccode>core/types.ts\u003c/code> (\u003ccode>profileSchema\u003c/code>: basics, experience with sourced bullets, projects, education, awards, sources, openItems, facts with \u003ccode>confirmed | preference | inferred\u003c/code> status and source IDs). Remove \u003ccode>presentation\u003c/code>. Add:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">criteria: {\n  targetRoles: string[];                 // free text, matched by the role-family rules\n  locations: Array&lt;{ kind: \"remote-from\" | \"country\" | \"city\"; value: string; relocation?: boolean }&gt;;\n  arrangements: Array&lt;\"remote\" | \"hybrid\" | \"onsite\"&gt;;\n  timezone: string;                      // IANA, e.g. \"Asia/Kuala_Lumpur\"\n  workingHours: { start: \"09:00\"; end: \"18:00\" };\n  minOverlapHours: number;               // 0–9\n  hiddenCompanies: string[];             // display names; matched by company_key\n}\n\u003c/code>\u003c/pre>\n\u003cp>Readiness (port \u003ccode>profileReadiness\u003c/code>): name, current location, target roles, useful background, and arrangement preference. Unknown citizenship or visa answers do not block. Discovery (manual and scheduled) requires readiness.\u003c/p>\n\u003cp>Every save writes a new \u003ccode>profile_versions\u003c/code> row. Direct edits use \u003ccode>changed_by = 'user'\u003c/code> and the summary names the edited section. Restore writes a new revision.\u003c/p>\n\u003cp>Overlap: for each resolved country, take its IANA zones (legacy \u003ccode>data/geography/zone1970.tab\u003c/code>) and their current offsets; overlap is \u003ccode>max(0, 9 − d)\u003c/code> hours for a 09:00–18:00 day, where \u003ccode>d\u003c/code> is the circular distance between the two offsets (\u003ccode>min(|a − b|, 24 − |a − b|)\u003c/code>). Generalize this for custom working hours. A country uses its best-overlapping zone. Store \u003ccode>overlap_hours\u003c/code> per job; recompute when the user's timezone or hours change, and once a day for daylight saving.\u003c/p>\n\u003ch2 id=\"legacy-code-to-port\">Legacy code to port\u003c/h2>\n\u003cp>Fetch files with \u003ccode>git show legacy:&lt;path&gt;\u003c/code>. Port with their tests (legacy \u003ccode>tests/\u003c/code>), keep behavior, adapt types to the new schema, and remove anything listed under Drop.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Legacy path\u003c/th>\n\u003cth>werk destination\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>core/matching.ts\u003c/code>, \u003ccode>core/eligibility.ts\u003c/code>, \u003ccode>core/job-quality.ts\u003c/code>, \u003ccode>core/listing-visibility.ts\u003c/code>, \u003ccode>core/deduplication.ts\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/matching/\u003c/code>\u003c/td>\n\u003ctd>Deterministic rules; keep \u003ccode>MATCH_VERSION\u003c/code>. Extend the matcher output with highlight spans (character ranges of matched and missing requirement clauses in the description) for the job detail.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/locations.ts\u003c/code>, \u003ccode>core/location-index.ts\u003c/code>, \u003ccode>core/location-regions.ts\u003c/code>, \u003ccode>core/timezones.ts\u003c/code>, \u003ccode>data/geography/*\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/geo/\u003c/code>, \u003ccode>resources/geography/\u003c/code>\u003c/td>\n\u003ctd>Country resolution and timezone data. Drop \u003ccode>core/timezone-range.ts\u003c/code> and the map. Keep the GeoNames and tzdb licenses.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/discovery.ts\u003c/code>, \u003ccode>core/connectors.ts\u003c/code>, \u003ccode>core/http.ts\u003c/code>, \u003ccode>core/source-catalog.ts\u003c/code>, \u003ccode>core/scan.ts\u003c/code>, \u003ccode>core/boards/*\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/sources/\u003c/code>\u003c/td>\n\u003ctd>Adapters, public-board parsers, detail queue, scheduler and limits. Drop the HTTP body cache (keep ETag/Last-Modified), X, HN, Web3.career and the VueJobs enrichment path.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/ai/pi.ts\u003c/code>, \u003ccode>core/ai/pi-sdk.ts\u003c/code>, \u003ccode>core/ai/pi-credentials.ts\u003c/code>, \u003ccode>server/ai-auth.ts\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/ai/\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>@earendil-works/pi-ai\u003c/code> 1.3.0: \u003ccode>models.login(\"openai\", \"oauth\", …)\u003c/code> with the \u003ccode>auth.openai.com\u003c/code> URL check and manual-code fallback; credentials under \u003ccode>&lt;data&gt;/pi-auth\u003c/code> with the auth lock; exact model \u003ccode>gpt-5.6-sol\u003c/code>, high reasoning. Keep the selective provider import so esbuild bundles only OpenAI.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/ai/generate.ts\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/letters/\u003c/code>\u003c/td>\n\u003ctd>Prompt, schema and validation (evidence IDs, numeric claims, 250–350 word target, 600-word ceiling). Change output to plain text: the greeting from the posting or \"Dear hiring team,\", 3–5 paragraphs, sign-off with the profile name.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/assistant/*\u003c/code> (actions, prompt, references, attachments, \u003ccode>extract-pdf.worker.mjs\u003c/code>)\u003c/td>\n\u003ctd>\u003ccode>src/backend/assistant/\u003c/code>\u003c/td>\n\u003ctd>Bounded actions only: search jobs, read supplied public URLs/README files, edit profile, edit the CV LaTeX, rewrite saved letters. Stage, validate and commit atomically with version checks; report actual saves and compile results. \u003ccode>pdfjs-dist\u003c/code> stays in the backend for PDF attachment text only.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/profile/facts.ts\u003c/code>, \u003ccode>core/profile/chat.ts\u003c/code> (readiness and welcome only), \u003ccode>core/profile/skills/build-user-profile/SKILL.md\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/profile/\u003c/code>\u003c/td>\n\u003ctd>The skill is the runtime prompt for profile conversations.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/latex/*\u003c/code> (compile, runtime, setup, store, \u003ccode>starter.tex\u003c/code>, \u003ccode>LICENSE-sb2nov.txt\u003c/code>), \u003ccode>scripts/setup-latex.ts\u003c/code>, \u003ccode>desktop/cmd/texsandbox\u003c/code>, \u003ccode>desktop/internal/texsandbox\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/cv/\u003c/code>, \u003ccode>scripts/setup-latex.mjs\u003c/code>\u003c/td>\n\u003ctd>Tectonic binary and offline package cache shipped as \u003ccode>extraResources\u003c/code>. Write a new TypeScript template that renders the profile into \u003ccode>starter.tex\u003c/code> macros with LaTeX escaping (generate from profile).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>core/backup/*\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/backend/backup/\u003c/code> (M5)\u003c/td>\n\u003ctd>Rework for the new schema; keep scope and overwrite rules from the legacy \u003ccode>docs/wiki/features/backups.md\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>src/ui.css\u003c/code> tokens; behaviors of \u003ccode>src/AssistantPane.tsx\u003c/code>, \u003ccode>src/LatexCvPage.tsx\u003c/code>, \u003ccode>src/LocationFilter.tsx\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>src/renderer/\u003c/code>\u003c/td>\n\u003ctd>Reuse tokens (below) and interaction contracts; rewrite components.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Drop\u003c/strong>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>\u003ccode>core/x.ts\u003c/code>, \u003ccode>core/x-auth.ts\u003c/code>, \u003ccode>core/web3*.ts\u003c/code>, \u003ccode>core/vuejobs.ts\u003c/code>, Jev, \u003ccode>core/cv/*\u003c/code> (Handlebars/docx/Playwright exports), \u003ccode>core/cover-letter/template.ts\u003c/code> layout, \u003ccode>core/timezone-range.ts\u003c/code>, \u003ccode>server/\u003c/code>, \u003ccode>worker/\u003c/code>, \u003ccode>desktop/\u003c/code> (except texsandbox), \u003ccode>deploy/\u003c/code>, the Seen feature, all \u003ccode>scripts/verify-*\u003c/code> drivers.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"screens\">Screens\u003c/h2>\n\u003cp>Mockups use fictional data and the current tokens. Sources: \u003ccode>design/werk/*.html\u003c/code> (open in a browser; dark mode follows the OS). PNGs: \u003ccode>docs/wiki/attachments/werk-design/\u003c/code>. Copy rules (Decided, \u003ccode>rule-plain-ui\u003c/code>): no ornamental labels, captions or subtitles. Every string identifies content, explains a necessary state or supports an action. Use literal action labels.\u003c/p>\n\u003ch3 id=\"shell\">Shell\u003c/h3>\n\u003cp>220 px sidebar: macOS traffic lights inset (the window uses \u003ccode>titleBarStyle: \"hiddenInset\"\u003c/code>, lights at about x 14, y 15), then \u003cstrong>werk\u003c/strong>, then Inbox (new count), Saved (count), Profile, CV. At the bottom: the update notice when present, then Settings (with a dot when a source fails or ChatGPT needs sign-in). 44 px headers are drag regions; controls inside are \u003ccode>no-drag\u003c/code>. Windows uses the standard frame with \u003ccode>autoHideMenuBar: true\u003c/code>. Right side of every header: \u003cstrong>Open assistant\u003c/strong>.\u003c/p>\n\u003ch3 id=\"inbox-opening-screen\">Inbox (opening screen)\u003c/h3>\n\u003cp>\u003cimg src=\"attachments/werk-design/inbox.png\" alt=\"Inbox\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/werk-design/inbox-dark.png\" alt=\"Inbox, dark\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>New\u003c/strong>: \u003ccode>status = 'new'\u003c/code>, open, not a duplicate, best match first (\u003ccode>match_score\u003c/code>, then newest). \u003cstrong>All matches\u003c/strong>: every stored job except duplicates, searchable, any status.\u003c/li>\n\u003cli>Row: title (bold until opened), company · location summary, match level, age. Opening a row sets \u003ccode>opened_at\u003c/code>.\u003c/li>\n\u003cli>Detail: company, title, chips (match, remote eligibility, overlap, posted age, salary or \"Salary not listed\"), actions \u003cstrong>Save\u003c/strong> (S), \u003cstrong>Skip\u003c/strong> (X), \u003cstrong>Open posting ↗\u003c/strong> (O), \u003cstrong>Hide company\u003c/strong>. Then the decision summary (role, level, eligibility clause, gaps), \u003cstrong>Description\u003c/strong> / \u003cstrong>Notes\u003c/strong> tabs, highlight legend and highlighted description, then provenance (source, checked time, other listings).\u003c/li>\n\u003cli>Save
